<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070a1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🎬 Trooper Demo</title>
<link rel="icon" href="icon.svg?v=7" type="image/svg+xml">
<link rel="stylesheet" href="css/demo.css?v=8">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js?v=6" } }
</script>
</head>
<body>
<div id="wrap">
  <div id="view">
    <div id="app"></div>
    <a id="backBtn" class="chip" href="./" title="Back to the customizer" aria-label="Back to the customizer">⬅️</a>
    <div id="who" class="chip"><canvas id="whoFlag" width="32" height="32"></canvas><span id="whoIco"></span><b id="whoName"></b><span id="whoTag"></span></div>
    <div id="statline" class="chip" aria-label="Battle stats"></div>
    <div id="cambar" class="chip">
      <button data-cam="front" title="📷 Front" aria-label="Front camera"></button>
      <button data-cam="side" title="📷 Side" aria-label="Side camera"></button>
      <button data-cam="top" title="📷 Top" aria-label="Top camera">🗺️</button>
      <button data-cam="follow" title="🎥 Follow" aria-label="Follow camera">🎥</button>
    </div>
    <div id="nowbar" class="chip"><span id="nowIco"></span><span class="nowtxt"><b id="nowName"></b><i id="nowInfo"></i></span><div class="prog"><div id="nowProg"></div></div></div>
    <div id="playbar" class="chip">
      <button id="playBtn" title="Play / pause" aria-label="Play or pause">⏸️</button>
      <button id="modeBtn" title="Loop this action" aria-label="Loop or play all">🔁</button>
      <button id="speedBtn" title="Speed" aria-label="Speed"><span>🐇</span><i>1x</i></button>
      <button id="squadBtn" title="Squad of 4" aria-label="Squad of 4">👥</button>
    </div>
    <div id="scope" class="hidden"><div class="cross"></div></div>
  </div>
  <div id="panel">
    <div id="units" role="listbox" aria-label="Saved looks"></div>
    <div class="lab">🎬 Actions <small>· green = 🎒 your gear · gold = class move · tap one to play it</small></div>
    <div id="acts" class="grid"></div>
    <div class="lab" id="traitLab">🧠 Battle traits <small>(how it acts in Conquest)</small></div>
    <div id="traits" class="grid"></div>
  </div>
</div>
<script type="module" src="js/demo.js?v=8"></script>
</body>
</html>
