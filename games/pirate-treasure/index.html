<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pirate Treasure</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#3ec8c0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:system-ui,sans-serif;color:#5a3020}
  #wrap{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#5fd0c0}
  #hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));display:flex;align-items:center;gap:8px;z-index:5;pointer-events:none}
  #gold-box,#compass-box{display:flex;align-items:center;gap:4px;background:rgba(246,214,160,.92);border:3px solid #5a3020;border-radius:10px;padding:4px 8px;min-height:36px}
  #gold{font-weight:700;font-size:22px;line-height:1;min-width:1.5ch}
  #compass{width:32px;height:32px;image-rendering:pixelated;transform-origin:50% 50%;transition:filter .2s}
  #compass-box[data-warm="hot"]{background:rgba(255,211,90,.95)}
  #compass-box[data-warm="warm"]{background:rgba(245,154,58,.9)}
  #hint{width:32px;height:32px;image-rendering:pixelated;display:none}
  #hint.show{display:block}
  #prompt{position:fixed;top:max(56px,calc(env(safe-area-inset-top) + 48px));left:50%;transform:translateX(-50%);background:rgba(246,214,160,.95);border:3px solid #5a3020;border-radius:10px;padding:6px 12px;font-weight:700;font-size:18px;z-index:5;pointer-events:none;white-space:nowrap}
  #prompt.hide{opacity:0;transition:opacity .4s}
  #touch{display:none;position:fixed;inset:0;z-index:6;pointer-events:none}
  body.touch-on #touch{display:block}
  #joy{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:rgba(90,48,32,.28);border:3px solid rgba(90,48,32,.55);pointer-events:auto;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(246,214,160,.95);border:3px solid #5a3020;pointer-events:none}
  #dig{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;border:3px solid #5a3020;background:#f6d6a0;pointer-events:auto;touch-action:none;padding:0;display:flex;align-items:center;justify-content:center}
  #dig img{width:40px;height:40px;image-rendering:pixelated;pointer-events:none}
  #dig.ready{background:#ffd35a;box-shadow:0 0 0 4px rgba(255,211,90,.6)}
  #dig.pressed{background:#f59a3a;transform:scale(.96)}
  #win{position:fixed;inset:0;background:rgba(62,200,192,.72);display:none;align-items:center;justify-content:center;z-index:8}
  #win.show{display:flex}
  #win .panel{background:#fff3c4;border:4px solid #5a3020;border-radius:16px;padding:20px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
  #win .chests{display:flex;gap:6px}
  #win .chests img{width:48px;height:48px;image-rendering:pixelated}
  #win p{margin:0;font-weight:700;font-size:22px}
  #restart{width:80px;height:80px;border-radius:50%;border:4px solid #5a3020;background:#ffd35a;font-size:42px;line-height:1;color:#5a3020;touch-action:none}
  #restart:active{background:#f59a3a}
  @media (prefers-reduced-motion:reduce){
    #prompt.hide{transition:none}
    #compass{transition:none}
  }
</style>
</head>
<body>
  <div id="wrap"><canvas id="c" width="320" height="180" aria-label="Pirate Treasure"></canvas></div>
  <div id="hud">
    <div id="gold-box"><img id="coin-icon" alt="" width="24" height="24"><span id="gold">0</span></div>
    <div id="compass-box" data-warm="cold" data-deg="0"><img id="compass" alt=""></div>
    <img id="hint" alt="">
  </div>
  <div id="prompt">Find the chests</div>
  <div id="touch">
    <div id="joy" role="slider" aria-label="move"><div id="knob"></div></div>
    <button id="dig" type="button" aria-label="dig"><img alt=""></button>
  </div>
  <div id="win" aria-live="polite">
    <div class="panel">
      <div class="chests" id="win-chests"></div>
      <p>All found!</p>
      <button id="restart" type="button" aria-label="restart">↻</button>
    </div>
  </div>

  const DIG_TIME = DIG_DUR.reduce((a, b) => a + b, 0);
  const DIG_BUF = 0.12;
  const WALK_PLANTED = { 0: 1, 2: 1 };
  const STEP = 1 / 60;
  const CRAB_SPEED = 28;
  const CRAB_DUR = [0.10, 0.08, 0.10, 0.08];
  const LID_DUR = [0.08, 0.08, 0.10];
  const INVULN = 0.7;

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });
  const elGold = document.getElementById("gold");
  const elCompass = document.getElementById("compass");
  const elCompassBox = document.getElementById("compass-box");
  const elHint = document.getElementById("hint");
  const elPrompt = document.getElementById("prompt");
  const elJoy = document.getElementById("joy");
  const elKnob = document.getElementById("knob");
  const elDig = document.getElementById("dig");
  const elWin = document.getElementById("win");
  const elRestart = document.getElementById("restart");
  const elWinChests = document.getElementById("win-chests");
  const elCoinIcon = document.getElementById("coin-icon");

  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TEST = new URLSearchParams(location.search).get("test") === "1";

  let viewW = 320, viewH = 180, scale = 1;

  const IM = {};
  const actions = {
    down: new Set(),
    pressed: new Set(),
    joy: { x: 0, y: 0, on: false, id: null },
    digBuf: 0,
  };

  const audio = createAudio();
  let S = null;
  let acc = 0, lastT = 0, running = false;

  function tileAtCell(cx, cy) {
    if (cy < 0 || cy >= ROWS || cx < 0 || cx >= COLS) return "~";
    return MAP[cy][cx];
  }
  function tileAt(x, y) {
    return tileAtCell(Math.floor(x / TILE), Math.floor(y / TILE));
  }
  function isWater(t) { return t === "~"; }
  function isSolidCell(cx, cy) {
    const t = tileAtCell(cx, cy);
    return isWater(t);
  }
  function blocked(x, y) {
    // feet box 8x6
    const pts = [[x - 4, y - 2], [x + 3, y - 2], [x - 4, y + 3], [x + 3, y + 3], [x, y]];
    for (const [px, py] of pts) {
      const cx = Math.floor(px / TILE), cy = Math.floor(py / TILE);
      if (isSolidCell(cx, cy)) return true;
      // rocks: solid
      for (const r of S.rocks) {
        if (Math.abs(px - r.x) < 7 && Math.abs(py - r.y) < 6) return true;
      }
      // palm trunks
      for (const p of S.palms) {
        if (Math.abs(px - p.x) < 5 && py > p.y - 8 && py < p.y + 4) return true;
      }
    }
    return false;
  }
  function moveBody(b, dx, dy) {
    const nx = b.x + dx;
    if (!blocked(nx, b.y)) b.x = nx;
    const ny = b.y + dy;
    if (!blocked(b.x, ny)) b.y = ny;
  }

  function findCells(ch) {
    const out = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (MAP[y][x] === ch) out.push({ x: x * TILE + 8, y: y * TILE + 8, cx: x, cy: y });
      }
    }
    return out;
  }

  function freshState() {
    const spawn = findCells("@")[0];
    const spots = findCells("X").map((p, i) => ({
      x: p.x, y: p.y, dug: false, treasure: true, gold: GOLD_EACH, id: i, lidFrame: 0, lidT: 0,
    }));
    return {
      player: {
        x: spawn.x, y: spawn.y, vx: 0, vy: 0, facing: "down",
        pose: "idle", walkFrame: 0, walkT: 0, idleT: 0,
        digging: 0, digFrame: 0, digT: 0, invuln: 0, knock: 0, kx: 0, ky: 0, flash: 0,
      },
      spots,
      palms: findCells("P"),
      rocks: findCells("R"),
      crabs: [
        { x: 352, y: 112, ax: 320, ay: 112, bx: 392, by: 112, t: 0, dir: 1, frame: 0, animT: 0, face: 1 },
        { x: 136, y: 232, ax: 136, ay: 200, bx: 136, by: 280, t: 0, dir: 1, frame: 0, animT: 0, face: 1 },
      ],
      gold: 0,
      found: 0,
      won: false,
      winT: 0,
      cam: { x: spawn.x, y: spawn.y, fx: spawn.x, fy: spawn.y, lx: 0, ly: 0 },
      trauma: 0, shakeT: 0, sx: 0, sy: 0,
      parts: [],
      waterT: 0,
      promptT: 3,
      ready: false,
    };
  }

  function addTrauma(n) {
    if (reducedMotion) return;
    S.trauma = Math.min(1, S.trauma + n);
  }

  function burst(x, y, kind, n) {
    const count = reducedMotion ? Math.ceil(n / 3) : n;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = kind === "spark" ? 20 + Math.random() * 40 : 15 + Math.random() * 35;
      S.parts.push({
        x, y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (kind === "spark" ? 20 : 8),
        life: kind === "spark" ? 0.5 + Math.random() * 0.3 : 0.3 + Math.random() * 0.25,
        max: 0.7,
        kind,
        s: kind === "spark" ? 1 : 1 + Math.random(),
      });
    }
  }

  function nearestTreasure() {
    let best = null, bd = Infinity;
    for (const s of S.spots) {
      if (s.dug || !s.treasure) continue;
      const d = Math.hypot(s.x - S.player.x, s.y - S.player.y);
      if (d < bd) { bd = d; best = s; }
    }
    return { spot: best, dist: bd };
  }

  function nearSpot() {
    let best = null, bd = DIG_RANGE;
    for (const s of S.spots) {
      if (s.dug) continue;
      const d = Math.hypot(s.x - S.player.x, s.y - S.player.y);
      if (d <= bd) { bd = d; best = s; }
    }
    return best;
  }

  // ----- input (named actions) -----
  const KEY = {
    ArrowLeft: "left", a: "left", A: "left",
    ArrowRight: "right", d: "right", D: "right",
    ArrowUp: "up", w: "up", W: "up",
    ArrowDown: "down", s: "down", S: "down",
    " ": "dig", e: "dig", E: "dig",
    Enter: "restart", r: "restart", R: "restart",
  };

  function setAction(act, on) {
    if (!act) return;
    if (on) {
      if (!actions.down.has(act)) actions.pressed.add(act);
      actions.down.add(act);
      if (act === "dig") actions.digBuf = DIG_BUF;
    } else {
      actions.down.delete(act);
    }
  }

  window.addEventListener("keydown", (e) => {
    const act = KEY[e.key];
    if (!act) return;
    e.preventDefault();
    if (e.repeat && act !== "left" && act !== "right" && act !== "up" && act !== "down") return;
    audio.unlock();
    setAction(act, true);
  });
  window.addEventListener("keyup", (e) => {
    const act = KEY[e.key];
    if (act) setAction(act, false);
  });

  function showTouch() { document.body.classList.add("touch-on"); }
  if (navigator.maxTouchPoints > 0 || "ontouchstart" in window || matchMedia("(pointer: coarse)").matches) {
    showTouch();
  }
  window.addEventListener("pointerdown", (e) => {
    audio.unlock();
    if (e.pointerType === "touch") showTouch();
  });

  // joystick with pointer capture, radial deadzone
  const JOY_DEAD = 0.2;
  function joyFromEvent(e) {
    const r = elJoy.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const radius = r.width / 2 - 8;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const mag = Math.hypot(dx, dy);
    const max = radius;
    const nx = mag > 0 ? dx / mag : 0, ny = mag > 0 ? dy / mag : 0;
    const clamped = Math.min(mag, max);
    elKnob.style.transform = `translate(${nx * clamped}px, ${ny * clamped}px)`;
    const t = mag / max;
    if (t < JOY_DEAD) {
      actions.joy.x = 0; actions.joy.y = 0;
      return;
    }
    const scaled = Math.min((t - JOY_DEAD) / (1 - JOY_DEAD), 1);
    actions.joy.x = nx * scaled;
    actions.joy.y = ny * scaled;
  }
  function joyEnd() {
    actions.joy.on = false; actions.joy.id = null; actions.joy.x = 0; actions.joy.y = 0;
    elKnob.style.transform = "translate(0,0)";
  }
  elJoy.addEventListener("pointerdown", (e) => {
    e.preventDefault(); audio.unlock(); showTouch();
    elJoy.setPointerCapture(e.pointerId);
    actions.joy.on = true; actions.joy.id = e.pointerId;
    joyFromEvent(e);
  });
  elJoy.addEventListener("pointermove", (e) => {
    if (actions.joy.id !== e.pointerId) return;
    e.preventDefault();
    joyFromEvent(e);
  });
  elJoy.addEventListener("pointerup", (e) => { if (actions.joy.id === e.pointerId) joyEnd(); });
  elJoy.addEventListener("pointercancel", (e) => { if (actions.joy.id === e.pointerId) joyEnd(); });

  elDig.addEventListener("pointerdown", (e) => {
    e.preventDefault(); audio.unlock(); showTouch();
    elDig.classList.add("pressed");
    setAction("dig", true);
  });
  const digUp = (e) => { e && e.preventDefault(); elDig.classList.remove("pressed"); setAction("dig", false); };
  elDig.addEventListener("pointerup", digUp);
  elDig.addEventListener("pointerleave", digUp);
  elDig.addEventListener("pointercancel", digUp);

  elRestart.addEventListener("pointerdown", (e) => {
    e.preventDefault(); audio.unlock();
    setAction("restart", true);
  });
  elRestart.addEventListener("click", (e) => { e.preventDefault(); tryRestart(); });

  function moveAxis() {
    let x = 0, y = 0;
    if (actions.joy.on) {
      x = actions.joy.x; y = actions.joy.y;
    } else {
      if (actions.down.has("left")) x -= 1;
      if (actions.down.has("right")) x += 1;
      if (actions.down.has("up")) y -= 1;
      if (actions.down.has("down")) y += 1;
      const len = Math.hypot(x, y);
      if (len > 1) { x /= len; y /= len; }
    }
    return { x, y };
  }

  function tryRestart() {
    if (!S || !S.won) return false;
    S = freshState();
    elWin.classList.remove("show");
    elPrompt.classList.remove("hide");
    syncHud();
    return true;
  }

  function spawnCoins(x, y) {
    const n = reducedMotion ? 2 : 6;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
      const sp = 70 + Math.random() * 50;
      S.parts.push({
        kind: "coin", x, y: y - 4,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.75 + Math.random() * 0.25, max: 1,
      });
    }
    burst(x, y - 6, "spark", reducedMotion ? 4 : 12);
  }

  function advanceWalk(p, dt, speed01) {
    const scale = Math.max(speed01, 0.35);
    p.walkT += dt;
    let guard = 0;
    while (guard++ < 8) {
      const dur = WALK_DUR[p.walkFrame] / scale;
      if (p.walkT < dur) break;
      p.walkT -= dur;
      p.walkFrame = (p.walkFrame + 1) % 4;
    }
  }

  function tryDig() {
    const p = S.player;
    if (p.digging > 0 || S.won) return;
    const spot = nearSpot();
    if (!spot) return;
    p.digging = DIG_TIME;
    p.digFrame = 0;
    p.digT = 0;
    p.pose = "dig";
    p.vx = p.vy = 0;
    actions.digBuf = 0;
    p._digSpot = spot;
    p._digResolved = false;
    audio.sfx("dig");
  }

  function finishDig(spot) {
    if (!spot || spot.dug) return;
    spot.dug = true;
    spot.lidFrame = reducedMotion ? 3 : 0;
    spot.lidT = 0;
    if (spot.treasure) {
      S.gold += spot.gold;
      S.found += 1;
      spawnCoins(spot.x, spot.y);
      addTrauma(0.35);
      audio.sfx("coin");
      if (S.found >= S.spots.filter((s) => s.treasure).length) {
        S.winT = 0.45;
        audio.sfx("win");
      }
    } else {
      audio.sfx("thud");
    }
    syncHud();
  }

  function update(dt) {
    const p = S.player;
    actions.digBuf = Math.max(0, actions.digBuf - dt);
    S.waterT += dt;
    if (S.promptT > 0) {
      S.promptT -= dt;
      if (S.promptT <= 0) elPrompt.classList.add("hide");
    }

    if (actions.pressed.has("restart") || actions.down.has("restart")) {
      if (tryRestart()) {
        actions.pressed.clear();
        return;
      }
    }

    if (S.winT > 0) {
      S.winT -= dt;
      if (S.winT <= 0 && !S.won) {
        S.won = true;
        elWin.classList.add("show");
      }
    }

    if (!S.won) {
      if (p.knock > 0) {
        p.knock -= dt;
        const k = Math.max(p.knock / 0.25, 0);
        moveBody(p, p.kx * k * dt, p.ky * k * dt);
        p.pose = "hurt";
      }

      if (p.digging > 0) {
        p.pose = "dig";
        p.digging -= dt;
        p.digT += dt;
        let guard = 0;
        while (p.digFrame < 3 && p.digT >= DIG_DUR[p.digFrame] && guard++ < 8) {
          p.digT -= DIG_DUR[p.digFrame];
          p.digFrame++;
          if (p._digSpot && p.digFrame === 1) {
            burst(p._digSpot.x, p._digSpot.y, "dust", 10);
            addTrauma(0.2);
            audio.sfx("thud");
          }
          if (p._digSpot && p.digFrame === 2) burst(p._digSpot.x, p._digSpot.y - 8, "dust", 8);
        }
        if (p._digSpot && !p._digResolved && p.digFrame >= 1) {
          finishDig(p._digSpot);
          p._digResolved = true;
        }
        if (p.digging <= 0) {
          p.digging = 0;
          p.digFrame = 0;
          p.digT = 0;
          p.pose = "idle";
          p.idleT = 0;
        }
      } else if (p.knock <= 0) {
        const m = moveAxis();
        p.vx = m.x * SPEED;
        p.vy = m.y * SPEED;
        const spd = Math.hypot(m.x, m.y);
        if (spd > 0.12) {
          if (Math.abs(m.x) > Math.abs(m.y)) p.facing = m.x > 0 ? "right" : "left";
          else p.facing = m.y > 0 ? "down" : "up";
          if (p.pose !== "walk") {
            if (p.pose === "idle") { p.walkFrame = 0; p.walkT = 0; }
            p.pose = "walk";
          }
          advanceWalk(p, dt, spd);
          moveBody(p, p.vx * dt, p.vy * dt);
        } else {
          p.vx = p.vy = 0;
          if (p.pose === "walk") {
            if (WALK_PLANTED[p.walkFrame]) {
              p.pose = "idle";
              p.idleT = 0;
            } else {
              advanceWalk(p, dt, 1);
              if (WALK_PLANTED[p.walkFrame]) {
                p.pose = "idle";
                p.idleT = 0;
              }
            }
          } else {
            p.pose = "idle";
            p.idleT += dt;
          }
        }
        if (actions.digBuf > 0) tryDig();
      }

      if (p.invuln > 0) p.invuln -= dt;
      p.flash += dt;

      // crabs: scuttle + claw snap, face travel direction
      for (const c of S.crabs) {
        const dx = c.bx - c.ax, dy = c.by - c.ay;
        const span = Math.hypot(dx, dy) || 1;
        c.t += (CRAB_SPEED * c.dir * dt) / span;
        if (c.t > 1) { c.t = 1; c.dir = -1; }
        if (c.t < 0) { c.t = 0; c.dir = 1; }
        const ox = c.x, oy = c.y;
        c.x = c.ax + dx * c.t;
        c.y = c.ay + dy * c.t;
        const vx = c.x - ox, vy = c.y - oy;
        if (Math.abs(vx) > 0.01) c.face = vx > 0 ? 1 : -1;
        else if (Math.abs(vy) > 0.01 && Math.abs(dx) > 0.01) {
          // keep last face on a vertical leg
        }
        c.animT += dt;
        let guard = 0;
        while (c.animT >= CRAB_DUR[c.frame] && guard++ < 8) {
          c.animT -= CRAB_DUR[c.frame];
          c.frame = (c.frame + 1) % 4;
        }
        if (!S.won && p.digging <= 0 && p.invuln <= 0 && Math.hypot(c.x - p.x, c.y - p.y) < 12) {
          const ang = Math.atan2(p.y - c.y, p.x - c.x);
          p.kx = Math.cos(ang) * 160;
          p.ky = Math.sin(ang) * 160;
          p.knock = 0.28;
          p.invuln = INVULN;
          p.vx = p.vy = 0;
          p.pose = "hurt";
          addTrauma(0.4);
          burst(p.x, p.y, "dust", 8);
          audio.sfx("hit");
        }
      }
    }

    // chest lid opens over a few frames (integer frames, no sub-pixel scale)
    for (const s of S.spots) {
      if (s.dug && s.treasure && s.lidFrame < 3) {
        if (reducedMotion) s.lidFrame = 3;
        else {
          s.lidT += dt;
          const dur = LID_DUR[s.lidFrame];
          if (s.lidT >= dur) { s.lidT = 0; s.lidFrame++; }
        }
      }
    }

    // particles — coins arc with gravity; dust/spark settle
    for (let i = S.parts.length - 1; i >= 0; i--) {
      const q = S.parts[i];
      q.life -= dt;
      q.x += q.vx * dt;
      q.y += q.vy * dt;
      if (q.kind === "coin") q.vy += 280 * dt;
      else if (q.kind === "dust") q.vy += 40 * dt;
      else q.vy += -10 * dt;
      if (q.life <= 0) S.parts.splice(i, 1);
    }

    // camera: after movement. deadzone + look-ahead + exp smooth + clamp. shake is visual only.
    const m = moveAxis();
    const dzX = 26, dzY = 16;
    const toX = p.x - S.cam.fx, toY = p.y - S.cam.fy;
    if (Math.abs(toX) > dzX) S.cam.fx += (Math.abs(toX) - dzX) * Math.sign(toX);
    if (Math.abs(toY) > dzY) S.cam.fy += (Math.abs(toY) - dzY) * Math.sign(toY);
    const lead = reducedMotion ? 0 : 16;
    const lt = 1 - Math.exp(-6 * dt);
    S.cam.lx += (m.x * lead - S.cam.lx) * lt;
    S.cam.ly += (m.y * lead - S.cam.ly) * lt;
    const tx = S.cam.fx + S.cam.lx, ty = S.cam.fy + S.cam.ly;
    const ct = 1 - Math.exp(-8 * dt);
    S.cam.x += (tx - S.cam.x) * ct;
    S.cam.y += (ty - S.cam.y) * ct;
    const hw = viewW / 2, hh = viewH / 2;
    if (MAP_W <= viewW) S.cam.x = MAP_W / 2;
    else S.cam.x = Math.max(hw, Math.min(MAP_W - hw, S.cam.x));
    if (MAP_H <= viewH) S.cam.y = MAP_H / 2;
    else S.cam.y = Math.max(hh, Math.min(MAP_H - hh, S.cam.y));

    // trauma shake (additive offset, not on the body)
    if (!reducedMotion && S.trauma > 0) {
      S.trauma = Math.max(0, S.trauma - 1.4 * dt);
      const sh = S.trauma * S.trauma;
      S.shakeT += dt * 30;
      S.sx = 5 * sh * Math.sin(S.shakeT * 1.7);
      S.sy = 4 * sh * Math.sin(S.shakeT * 2.3);
    } else {
      S.sx = 0; S.sy = 0;
    }

    syncHud();
    actions.pressed.clear();
  }

  function syncHud() {
    elGold.textContent = String(S.gold);
    const { spot, dist } = nearestTreasure();
    if (spot) {
      const deg = Math.atan2(spot.x - S.player.x, -(spot.y - S.player.y)) * 180 / Math.PI;
      elCompass.style.transform = `rotate(${deg}deg)`;
      elCompassBox.dataset.deg = String(Math.round(deg));
      const warm = dist < 36 ? "hot" : dist < 90 ? "warm" : "cold";
      elCompassBox.dataset.warm = warm;
      elCompassBox.style.display = "";
    } else {
      elCompassBox.style.display = "none";
    }
    const near = nearSpot();
    S.ready = !!near;
    elHint.classList.toggle("show", !!near && !S.won);
    elDig.classList.toggle("ready", !!near && !S.won);
    elHint.dataset.ready = near ? "1" : "0";
  }

  function snap(v) { return Math.floor(v); }

  function drawImg(img, x, y, flip, sc) {
    const s = sc || 1;
    const w = img.width * s, h = img.height * s;
    ctx.save();
    ctx.translate(snap(x), snap(y));
    if (flip) { ctx.translate(w, 0); ctx.scale(-1, 1); }
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, 0, 0, w, h);
    ctx.restore();
  }

  function drawFrame(sheet, col, row, fw, fh, pad, x, y, flip) {
    const sx = pad + col * (fw + pad);
    const sy = pad + row * (fh + pad);
    ctx.save();
    ctx.translate(snap(x), snap(y));
    if (flip) { ctx.translate(fw, 0); ctx.scale(-1, 1); }
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(sheet, sx, sy, fw, fh, 0, 0, fw, fh);
    ctx.restore();
  }

  const FACE_ROW = { down: 0, right: 1, up: 2, left: 3 };
  const SAND_CH = { ".": true, "@": true, X: true, x: true, P: true, R: true };

  function draw() {
    ctx.imageSmoothingEnabled = false;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.imageSmoothingEnabled = false;
    const viewX = snap(S.cam.x - viewW / 2 + S.sx);
    const viewY = snap(S.cam.y - viewH / 2 + S.sy);

    // ground
    const x0 = Math.max(0, Math.floor(viewX / TILE));
    const y0 = Math.max(0, Math.floor(viewY / TILE));
    const x1 = Math.min(COLS, Math.ceil((viewX + viewW) / TILE) + 1);
    const y1 = Math.min(ROWS, Math.ceil((viewY + viewH) / TILE) + 1);
    const waterFrame = reducedMotion ? 0 : ((S.waterT / 0.55) | 0) % 4;
    for (let cy = y0; cy < y1; cy++) {
      for (let cx = x0; cx < x1; cx++) {
        const t = tileAtCell(cx, cy);
        const dx = cx * TILE - viewX, dy = cy * TILE - viewY;
        if (t === "~") {
          drawFrame(IM.tiles, 4 + waterFrame, 0, 16, 16, 1, dx, dy, false);
        } else if (t === ",") {
          drawFrame(IM.tiles, 3, 0, 16, 16, 1, dx, dy, false);
        } else {
          const variant = (cx * 3 + cy * 7) % 3;
          drawFrame(IM.tiles, variant, 0, 16, 16, 1, dx, dy, false);
        }
        // tufts on some sand
        if ((t === "." || t === "@") && ((cx * 13 + cy * 29) % 11 === 0)) {
          drawImg(IM.tuft, dx, dy, false, 1);
        }
      }
    }
    // dig marks / holes
    for (const s of S.spots) {
      const dx = s.x - 8 - viewX, dy = s.y - 8 - viewY;
      drawFrame(IM.tiles, s.dug ? 9 : 8, 0, 16, 16, 1, dx, dy, false);
    }

    // y-sorted sprites
    const sprites = [];
    for (const p of S.palms) sprites.push({ y: p.y, kind: "palm", o: p });
    for (const r of S.rocks) sprites.push({ y: r.y, kind: "rock", o: r });
    for (const s of S.spots) if (s.dug && s.treasure) sprites.push({ y: s.y, kind: "chest", o: s });
    for (const c of S.crabs) sprites.push({ y: c.y, kind: "crab", o: c });
    sprites.push({ y: S.player.y, kind: "player", o: S.player });
    sprites.sort((a, b) => a.y - b.y || (a.kind === "player" ? 1 : 0));

    for (const sp of sprites) {
      if (sp.kind === "palm") {
        let pf = 0;
        if (!reducedMotion) {
          const phase = (sp.o.x * 3 + sp.o.y * 7) * 0.01;
          const sv = Math.sin(S.waterT * (Math.PI * 2) / 2.4 + phase);
          pf = sv < -0.33 ? 1 : sv > 0.33 ? 2 : 0;
        }
        drawImg(IM["palm" + pf], sp.o.x - 12 - viewX, sp.o.y - 36 - viewY);
      } else if (sp.kind === "rock") {
        drawImg(IM.rock, sp.o.x - 8 - viewX, sp.o.y - 10 - viewY);
      } else if (sp.kind === "chest") {
        const img = IM["chest" + (sp.o.lidFrame | 0)] || IM.chest3;
        drawImg(img, sp.o.x - 8 - viewX, sp.o.y - 12 - viewY);
      } else if (sp.kind === "crab") {
        const img = IM["crab" + (sp.o.frame % 4)];
        const flip = sp.o.face < 0;
        drawImg(img, sp.o.x - 8 - viewX, sp.o.y - 12 - viewY, flip);
      } else if (sp.kind === "player") {
        const p = S.player;
        // Show the hurt pose solid during knockback; flash only after that, during invuln.
        if (p.knock <= 0 && p.invuln > 0 && ((p.flash * 12) | 0) % 2 === 0) continue;
        const row = FACE_ROW[p.facing];
        let col;
        if (p.pose === "hurt" || p.knock > 0) col = 10;
        else if (p.pose === "dig" || p.digging > 0) col = 6 + Math.max(0, Math.min(3, p.digFrame));
        else if (p.pose === "walk") col = p.walkFrame;
        else col = 4 + (((p.idleT / 0.7) | 0) % 2);
        drawFrame(IM.pirate, col, row, 32, 32, 1, p.x - 16 - viewX, p.y - 28 - viewY, false);
      }
    }

    // particles
    for (const q of S.parts) {
      const a = Math.max(0, q.life / 0.6);
      ctx.globalAlpha = Math.min(1, a);
      if (q.kind === "coin") {
        drawImg(IM.coin, q.x - 4 - viewX, q.y - 4 - viewY);
      } else if (q.kind === "spark") {
        drawImg(IM.sparkle, q.x - 4 - viewX, q.y - 4 - viewY);
      } else {
        ctx.fillStyle = q.s > 1.4 ? "#f6d6a0" : "#8a5a3a";
        ctx.fillRect(snap(q.x - viewX), snap(q.y - viewY), 2, 2);
      }
      ctx.globalAlpha = 1;
    }
  }

  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    let sc = Math.max(1, Math.floor(Math.min(vw / 320, vh / 180)));
    let w = 320, h = 180;
    // Grow or shrink the logical view in 16px steps so we keep integer scale and fill the screen.
    if (sc === 1 && vw >= 368 && vh >= 256) {
      sc = Math.min(Math.floor(vw / 184), Math.floor(vh / 128));
      sc = Math.max(2, sc);
    }
    w = Math.floor(vw / sc / 16) * 16;
    h = Math.floor(vh / sc / 16) * 16;
    w = Math.max(192, Math.min(w, MAP_W));
    h = Math.max(128, Math.min(h, MAP_H));
    // If that dropped us back to needing a smaller scale, recompute
    if (w * sc > vw + 0.5 || h * sc > vh + 0.5) {
      sc = Math.max(1, Math.floor(Math.min(vw / w, vh / h)));
    }
    viewW = w; viewH = h; scale = sc;
    canvas.width = viewW * scale;
    canvas.height = viewH * scale;
    canvas.style.width = canvas.width + "px";
    canvas.style.height = canvas.height + "px";
    ctx.imageSmoothingEnabled = false;
    if (S) {
      const hw = viewW / 2, hh = viewH / 2;
      if (MAP_W <= viewW) S.cam.x = MAP_W / 2;
      else S.cam.x = Math.max(hw, Math.min(MAP_W - hw, S.cam.x));
      if (MAP_H <= viewH) S.cam.y = MAP_H / 2;
      else S.cam.y = Math.max(hh, Math.min(MAP_H - hh, S.cam.y));
    }
  }

  function loop(t) {
    if (!running) return;
    const now = t * 0.001;
    let dt = now - lastT;
    lastT = now;
    if (dt > 0.25) dt = 0.25;
    acc += dt;
    let steps = 0;
    while (acc >= STEP && steps < 8) { update(STEP); acc -= STEP; steps++; }
    draw();
    requestAnimationFrame(loop);
  }

  function snapshot() {
    return {
      p: { x: S.player.x, y: S.player.y, facing: S.player.facing, pose: S.player.pose, walkFrame: S.player.walkFrame, digFrame: S.player.digFrame, idleT: S.player.idleT, digging: S.player.digging, invuln: S.player.invuln },
      gold: S.gold,
      found: S.found,
      won: S.won,
      ready: S.ready,
      treasures: S.spots.map((s) => ({ x: s.x, y: s.y, dug: s.dug })),
      crabs: S.crabs.map((c) => ({ x: c.x, y: c.y })),
      cam: { x: S.cam.x, y: S.cam.y },
      view: { w: viewW, h: viewH, scale },
      reducedMotion,
    };
  }

  function createAudio() {
    let ctx = null, sfxG = null, unlocked = false, soundOn = true;
    function ensure() {
      if (ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      const master = ctx.createGain();
      master.gain.value = 0.7;
      master.connect(ctx.destination);
      sfxG = ctx.createGain();
      sfxG.gain.value = 0.45;
      sfxG.connect(master);
    }
    async function unlock() {
      if (unlocked && ctx && ctx.state === "running") return;
      try {
        ensure();
        if (ctx && ctx.state === "suspended") await ctx.resume();
        unlocked = true;
      } catch (_) {}
    }
    function beep(freq, dur, type, vol, when) {
      if (!soundOn || !ctx || !unlocked) return;
      const t = ctx.currentTime + (when || 0);
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol || 0.25, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(sfxG);
      o.start(t); o.stop(t + dur + 0.02);
    }
    function noise(dur, vol) {
      if (!soundOn || !ctx || !unlocked) return;
      const n = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, n, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const g = ctx.createGain();
      g.gain.value = vol || 0.2;
      src.connect(g); g.connect(sfxG);
      src.start();
    }
    const sfx = (name) => {
      if (name === "dig") { noise(0.08, 0.18); beep(180, 0.06, "triangle", 0.15); }
      else if (name === "coin") { beep(880, 0.05); beep(1175, 0.08, "square", 0.22, 0.05); }
      else if (name === "hit") { beep(160, 0.1, "sawtooth", 0.28); noise(0.07, 0.18); }
      else if (name === "thud") { noise(0.07, 0.16); beep(120, 0.08, "triangle", 0.15); }
      else if (name === "win") { beep(523, 0.08); beep(659, 0.08, "square", 0.22, 0.08); beep(784, 0.14, "square", 0.22, 0.16); }
    };
    return { unlock, sfx };
  }

  function loadImg(src) {
    return new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error("img"));
      i.src = src;
    });
  }

  async function boot() {
    const names = Object.keys(ASSETS);
    const imgs = await Promise.all(names.map((k) => loadImg(ASSETS[k])));
    names.forEach((k, i) => { IM[k] = imgs[i]; });
    elCoinIcon.src = ASSETS.coin;
    elCompass.src = ASSETS.arrow;
    elHint.src = ASSETS.shovel;
    elDig.querySelector("img").src = ASSETS.shovel;
    for (let i = 0; i < 5; i++) {
      const im = document.createElement("img");
      im.src = ASSETS.chest_open;
      im.alt = "";
      elWinChests.appendChild(im);
    }
    S = freshState();
    layout();
    window.addEventListener("resize", () => { layout(); if (S) draw(); });
    window.addEventListener("orientationchange", () => setTimeout(() => { layout(); if (S) draw(); }, 120));
    syncHud();
    if (TEST) {
      window.__game = { state: () => JSON.parse(JSON.stringify(snapshot())) };
    }
    running = true;
    lastT = performance.now() * 0.001;
    requestAnimationFrame(loop);
  }

  boot().catch((e) => { console.error(e); });
})();
</script>
</body>
</html>
