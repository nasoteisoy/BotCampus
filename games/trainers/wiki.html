<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e3521">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Wiki · Trainers</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root { --bg: #1f2416; --panel: rgba(25,29,18,.97); --card: #262c1b; --line: #55603a; --hi: #e9c55a; --txt: #eef0e2; --dim: #b7bca4; --ok: #9fd36a; --bad: #ef6a5a; --safeT: env(safe-area-inset-top, 0px); --safeB: env(safe-area-inset-bottom, 0px); --safeL: env(safe-area-inset-left, 0px); --safeR: env(safe-area-inset-right, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--txt); font: 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { padding: calc(60px + var(--safeT)) calc(10px + var(--safeR)) calc(24px + var(--safeB)) calc(10px + var(--safeL)); }
main { max-width: 900px; margin: 0 auto; }
a { color: var(--txt); text-decoration: none; }
button { font: inherit; color: var(--txt); background: #3a4229; border: 2px solid var(--line); border-radius: 12px; min-width: 44px; min-height: 44px; cursor: pointer; padding: 0 10px; touch-action: manipulation; }
button.on { border-color: var(--hi); background: #5b5a2b; }
button:active, a:active { transform: scale(.97); }
[hidden] { display: none !important; }
#top { position: fixed; top: 0; left: 0; right: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: calc(4px + var(--safeT)) calc(8px + var(--safeR)) 4px calc(8px + var(--safeL)); display: flex; align-items: center; gap: 8px; min-height: 54px; }
#top h1 { flex: 1; font-size: 18px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#top a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; padding: 0 10px; border: 2px solid var(--line); border-radius: 12px; background: #3a4229; font-weight: 700; }
#bBack { font-weight: 800; font-size: 18px; }
body.embed .full { display: none !important; }
h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 18px 2px 8px; }
.hint { font-size: 12px; color: var(--dim); line-height: 1.4; }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 10px 2px 5px; }
.list { display: flex; flex-direction: column; gap: 6px; }
.row, .trow2, .mr { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 6px 10px; border: 2px solid var(--line); border-radius: 12px; background: #2c3320; }
.row .ic, .ti.big { font-size: 26px; width: 34px; text-align: center; flex: none; }
.t { flex: 1; min-width: 0; } .t b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .t small { display: block; color: var(--dim); font-size: 12px; line-height: 1.35; }
.chev { color: var(--dim); font-size: 22px; }
.mr { border-color: color-mix(in srgb, var(--tc) 55%, #2c3320); min-height: 52px; padding: 4px 8px; }
.mr .ti { font-size: 20px; width: 26px; text-align: center; } .mr .num { font-size: 12px; font-weight: 700; min-width: 46px; text-align: right; white-space: nowrap; }
.trow2 .tm { display: flex; gap: 1px; margin: 2px 0; } .trow2 .tm img { width: 30px; height: 30px; }
input[type=search] { width: 100%; min-height: 48px; background: #171b10; color: var(--txt); border: 2px solid var(--line); border-radius: 12px; padding: 0 12px; font: inherit; font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tf { margin: 8px 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; } .tf::-webkit-scrollbar { display: none; }
.tfb { flex: none; font-size: 20px; border-color: color-mix(in srgb, var(--tc) 70%, #222); } .tfb:first-child { font-size: 14px; font-weight: 700; } .tfb.on { background: color-mix(in srgb, var(--tc) 45%, #222); border-color: #fff; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.mc { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px 8px; border-radius: 14px; border: 2px solid color-mix(in srgb, var(--tc) 60%, #222); background: linear-gradient(color-mix(in srgb, var(--tc) 28%, #262c1b), #262c1b); min-height: 44px; text-align: center; }
.mc img { width: 76px; height: 76px; } .mc b { font-size: 13px; } .mc small { font-size: 11px; color: var(--dim); }
.mc.sm { flex-direction: row; gap: 6px; padding: 4px 8px; } .mc.sm img { width: 44px; height: 44px; }
.hero { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: linear-gradient(120deg, color-mix(in srgb, var(--tc, #55603a) 40%, #262c1b), #262c1b); border: 2px solid color-mix(in srgb, var(--tc, #55603a) 70%, #222); }
.hero img { width: min(40vw, 170px); height: auto; } .bigic { font-size: 56px; width: 80px; text-align: center; }
.tb2 { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 12px; border-radius: 22px; background: color-mix(in srgb, var(--tc) 55%, #222); border: 2px solid var(--tc); font-weight: 800; margin: 4px 4px 0 0; }
.tchip { display: inline-flex; align-items: center; gap: 3px; min-height: 44px; padding: 0 10px; border-radius: 22px; background: color-mix(in srgb, var(--tc, #555) 40%, #222); border: 2px solid var(--tc, #666); font-size: 14px; font-weight: 700; }
.tchip.bad { box-shadow: inset 0 -3px 0 var(--bad); } .tchip.good { box-shadow: inset 0 -3px 0 var(--ok); }
.mm { display: grid; grid-template-columns: 110px 1fr; gap: 6px; align-items: center; margin: 6px 0; } .ml { font-size: 13px; color: var(--dim); font-weight: 700; }
.stats { display: flex; flex-direction: column; gap: 5px; } .sr { display: grid; grid-template-columns: 40px 34px 1fr 36px; gap: 6px; align-items: center; font-size: 13px; }
.sl { color: var(--dim); font-weight: 700; } .sv { font-weight: 800; text-align: right; } .st { height: 14px; background: #171b10; border-radius: 7px; overflow: hidden; border: 1px solid #000; } .st i { display: block; height: 100%; } .s5 { font-size: 11px; color: var(--dim); text-align: right; }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; } .facts div { background: #2c3320; border-radius: 12px; padding: 8px 4px; text-align: center; border: 1px solid var(--line); } .facts span { font-size: 20px; display: block; } .facts b { font-size: 17px; display: block; } .facts small { color: var(--dim); font-size: 11px; }
.fx { padding: 10px; border-radius: 12px; background: #2c3320; border: 1px solid var(--line); font-size: 14px; line-height: 1.45; margin: 4px 0; } .fx .si { font-size: 20px; margin-right: 6px; }
.formula { font: 15px ui-monospace, Menlo, monospace; background: #171b10; border: 2px solid var(--hi); border-radius: 12px; padding: 10px; line-height: 1.7; overflow-x: auto; margin-bottom: 6px; }
.rs { border-bottom: 1px solid rgba(255,255,255,.08); padding-bottom: 6px; }
.tbl { display: flex; gap: 4px; overflow-x: auto; margin: 6px 0; } .tbl div { flex: 1; min-width: 52px; background: #2c3320; border-radius: 10px; padding: 6px 4px; text-align: center; border: 1px solid var(--line); } .tbl small { display: block; color: var(--dim); font-size: 11px; } .tbl b { display: block; font-size: 13px; }
.chartw { overflow-x: auto; margin: 8px 0; }
table.chart { border-collapse: separate; border-spacing: 2px; margin: 0 auto; }
.chart th, .chart td { width: 44px; height: 44px; text-align: center; font-weight: 800; font-size: 15px; border-radius: 8px; }
.chart td { background: #2c3320; } .chart td.g { background: #3f8f2f; } .chart td.r { background: #8a2d24; } .chart td.z { background: #050505; color: #ef6a5a; }
.chart th a { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 10px; background: color-mix(in srgb, var(--tc) 50%, #222); border: 2px solid var(--tc); font-size: 20px; }
.chart .corner { font-size: 10px; color: var(--dim); }
.chart tbody th, .chart .corner { position: sticky; left: 0; z-index: 1; background: var(--bg); }
.itbl { border-collapse: collapse; width: 100%; font-size: 13px; } .itbl th, .itbl td { padding: 6px 5px; border-bottom: 1px solid rgba(255,255,255,.1); text-align: left; white-space: nowrap; } .itbl a { display: inline-flex; min-height: 44px; align-items: center; font-weight: 700; }
.seg { display: flex; margin: 4px 0; } .seg button { flex: 1; border-radius: 0; padding: 0 4px; } .seg button:first-child { border-radius: 12px 0 0 12px; } .seg button:last-child { border-radius: 0 12px 12px 0; }
.sorts button { font-size: 13px; font-weight: 700; }
.bars { display: flex; flex-direction: column; gap: 3px; padding: 2px 8px 8px 52px; } .bar { display: grid; grid-template-columns: 22px 84px 1fr 40px; gap: 4px; align-items: center; font-size: 12px; }
.bi { font-size: 15px; } .bl { color: var(--dim); } .bt { height: 10px; background: #171b10; border-radius: 5px; overflow: hidden; } .bt i { display: block; height: 100%; background: var(--hi); } .bv { text-align: right; font-weight: 700; }
.slot2 { display: flex; flex-direction: column; gap: 4px; padding: 6px; border-radius: 12px; background: #2c3320; border: 1px solid var(--line); }
.mvl { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; } .mvc { display: flex; align-items: center; min-height: 44px; padding: 0 8px; border-radius: 10px; border: 2px solid color-mix(in srgb, var(--tc) 60%, #222); font-size: 13px; font-weight: 700; }
.kv { display: flex; flex-direction: column; gap: 4px; } .kv div { display: flex; justify-content: space-between; gap: 8px; padding: 9px 10px; border-radius: 10px; background: #2c3320; font-size: 14px; } .kv span { color: var(--dim); } .kv b { text-align: right; }
.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border: 2px solid var(--line); border-radius: 12px; background: #3a4229; font-weight: 800; margin-top: 4px; }
body.land .grid { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
body.land .hero img { width: min(22vw, 160px); }
@media (min-width: 700px) { .mvl { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>

</html>
