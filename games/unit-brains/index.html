<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Conquest Commander — Unit Brains</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<header id="top">
  <a id="navBack" class="navback" href="../army/" title="⬅️ Back to Army HQ" aria-label="Back">⬅️<small>Back</small></a>
  <nav class="crumbs" aria-label="You are here"><a href="../army/">🏠 Army HQ</a><span>›</span><b>🧠 Brains</b></nav>
  <span id="savedChip" class="saved" role="status" aria-live="polite">✓ Saved</span>
  <div id="score" aria-label="posts held" title="Posts held in the test battle"><span class="b">🔵 <i id="sb">1</i></span><span class="r">🔴 <i id="sr">1</i></span><small>posts</small></div>
  <div class="ctrl">
    <button id="btnPause" class="ib lbl" title="Pause / play the test battle" aria-label="pause">⏸️<small>Pause</small></button>
    <button id="btnSpeed" class="ib lbl" title="Test battle speed" aria-label="speed">⏩<small><b id="spd">1</b>× Speed</small></button>
    <button id="btnReset" class="ib lbl" title="Restart the test battle" aria-label="reset">🔄<small>Restart</small></button>
  </div>
</header>
<main id="layout">
  <section id="arenaWrap">
    <canvas id="arena"></canvas>
    <div id="selChip" class="chip hide" aria-live="polite"></div>
    <div id="hint" class="hint">👆 Tap a 🔵 blue trooper to see which row it runs</div>
  </section>
  <section id="panel">
    <nav id="tabs" role="tablist">
      <button class="tab hide" id="tabArmy" data-tab="army" role="tab" title="Pick one of your troopers">🪖<span>Troopers</span></button>
    <button class="tab on" data-tab="unit" role="tab" title="The picked trooper's brain rows">🧠<span>Brain</span></button>
    </nav>
    <div id="tab-army" class="pane">
      <div id="armyHead" class="armyhead"></div>
      <div id="armyUnits" class="ulist" aria-label="army units"></div>
      <div class="grp sqgrp2 hide"><div class="gl" title="Squads">👥</div><div id="armySquads" class="opts"></div></div>
      <div id="armyMsg" class="msg"></div>
    </div>
    <div id="tab-unit" class="pane on">
      <div id="unitBar" class="abar hide"><span id="unitBarName" class="aname"></span><button id="btnClearBrain" class="ib lbl" title="Remove this brain: the trooper uses its battle trait instead" aria-label="no brain">∅<small>No brain</small></button></div>
      <p id="howto" class="howto">Rows run top ➜ bottom. The first row whose <b>IF</b> is true runs its <b>THEN</b>. Tap an icon to change it. Changes save by themselves.</p>
      <div id="rows" class="rows"></div>
      <div class="rowbar">
        <button id="btnAdd" class="ib wide lbl" title="Add a row">➕<small>Add row</small></button>
        <span id="rowCount" class="muted"></span>
      </div>
    </div>
    <div id="tab-squad" class="pane hide" hidden>
      <div id="squadBar" class="abar hide"><span id="squadBarName" class="aname"></span></div>
      <div class="grp"><div class="gl">🎯</div><div id="plans" class="opts"></div></div>
      <div class="grp"><div class="gl">🔷</div><div id="forms" class="opts"></div></div>
      <div class="grp"><div class="gl">🧭</div><div class="opts"><button id="btnFollow" class="opt" aria-pressed="true">🧭<span>Follow ★</span></button></div></div>
      <div class="grp"><div class="gl">↔️</div><div id="spaces" class="opts"></div></div>
      <div id="goalLine" class="goal"></div>
    </div>
  </section>
</main>
<button id="doneBtn" class="done" type="button" title="✅ Done: saved, back to Army HQ" aria-label="Done">✅ <b>Done</b></button>
<div id="sheet" class="sheet hide" role="dialog" aria-modal="true">
  <div class="sheetIn"><div id="sheetGrid" class="sgrid"></div><button id="sheetX" class="ib" aria-label="close">✖️</button></div>
</div>
<script src="js/brain.js?v=2"></script>
<script src="js/arena.js?v=2"></script>
<script src="js/ui.js?v=2"></script>
<!-- 🪖 army picker: ES module (shared schema.js), skipped on file: pages (browsers block modules there) -->
<script>if (location.protocol !== 'file:') { const s = document.createElement('script'); s.type = 'module'; s.src = 'js/army-picker.js?v=3'; document.body.appendChild(s); }</script>
</body>
</html>
