<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1626">
<title>Island Front: Week by Week</title>
<link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>
<div id="app">
  <canvas id="map" aria-label="Island map"></canvas>

  <div id="banner" aria-live="polite"><div class="wk">WEEK <b id="wkn">1</b></div></div>

  <div id="tl" class="hud">
    <button class="btn ico" id="b-restart" aria-label="Restart" title="Restart"></button>
    <button class="btn ico" id="b-menu" aria-label="Menu" title="Menu"></button>
    <button class="btn ico" id="b-sound" aria-label="Sound" title="Sound"></button>
  </div>
  <div id="tr" class="hud">
    <button class="chip sup" id="c-sup" aria-label="Supply" title="Supply"><span class="si"></span><b>0</b><small>+0</small></button>
    <button class="chip" id="c-blue" aria-label="Blue islands" title="Blue islands"><canvas width="36" height="24"></canvas><b>0</b><span class="hold-ico"></span></button>
    <button class="chip" id="c-red" aria-label="Red islands" title="Red islands"><canvas width="36" height="24"></canvas><b>0</b><span class="hold-ico"></span></button>
  </div>
  <div id="zoom" class="hud">
    <button class="btn ico" id="z-in" aria-label="Zoom in" title="Zoom in"></button>
    <button class="btn ico" id="z-out" aria-label="Zoom out" title="Zoom out"></button>
    <button class="btn ico" id="z-fit" aria-label="Whole map" title="Whole map"></button>
  </div>
  <div id="br" class="hud">
    <button class="btn primary" id="b-end" aria-label="End week"><span class="i"></span><span class="lb">END WEEK</span><span class="badge" id="ordn" hidden>0</span></button>
  </div>

  <div id="hold" hidden></div>

  <div id="sel" class="panel" hidden>
    <div class="sel-head">
      <canvas id="sel-portrait" width="112" height="112"></canvas>
      <div class="sel-body">
        <div class="sel-row"><canvas id="sel-flag" width="42" height="28"></canvas><canvas id="sel-kind" width="44" height="30"></canvas></div>
        <div class="sel-str" id="sel-str"></div>
      </div>
      <button class="btn ico" id="sel-z" aria-label="Zoom to island" title="Zoom to island"></button>
      <button class="btn ico" id="sel-x" aria-label="Clear order" title="Clear order"></button>
    </div>
    <div class="oob" id="sel-oob"></div>
  </div>

  <div id="hint" hidden><span id="hint-t"></span></div>
  <div id="air" hidden></div>
  <div id="strip" hidden></div>
  <div id="warn" hidden role="alertdialog" aria-label="Landing under fire"></div>
  <div id="toast" hidden></div>
  <div id="report" hidden></div>

  <div id="naval" hidden>
    <canvas id="navalc"></canvas>
    <div class="nv-head"><canvas class="nv-flag" id="nv-fb" width="48" height="32"></canvas><canvas id="nv-sec" width="64" height="64" hidden></canvas><span id="nv-title">NAVAL COMBAT</span><span id="nv-amb" hidden></span><canvas class="nv-flag" id="nv-fr" width="48" height="32"></canvas></div>
    <button class="btn" id="b-retreat" aria-label="Retreat" title="Retreat" hidden><span class="i"></span><span class="lb">RETREAT</span></button>
  </div>

  <div id="help" class="overlay" hidden>
    <div class="card">
      <div class="legend" id="legend"></div>
      <button class="btn primary" id="help-ok" aria-label="Close help"><span class="i"></span><span class="lb">OK</span></button>
    </div>
  </div>

  <div id="menu" class="overlay" hidden>
    <div class="card sheet" id="menu-card"></div>
  </div>

  <div id="title" class="overlay">
    <div class="card title-card">
      <div class="logo"><span class="l1">ISLAND FRONT</span><span class="l2">WEEK BY WEEK</span></div>
      <div class="vs"><canvas id="t-fb" width="72" height="48"></canvas><span class="vs-x">VS</span><canvas id="t-fr" width="72" height="48"></canvas></div>
      <button class="btn primary big" id="b-play" aria-label="Play"><span class="i"></span><span class="lb">PLAY</span></button>
      <div class="loading" id="loading">MAP</div>
    </div>
  </div>

  <div id="end" class="overlay" hidden>
    <div class="card" id="endcard"></div>
  </div>
</div>
<script type="module" src="js/main.js?v=9"></script>
</body>
</html>
