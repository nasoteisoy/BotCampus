<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f9e6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Jump & Duck · Move & Play</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/common.css?v=4">
<link rel="stylesheet" href="css/game.css?v=4">
</head>
<body data-mode="title" style="--c1:#9be36b;--c2:#1f9e6e">
<canvas id="cv" aria-label="Jump & Duck"></canvas>
<video id="vid" playsinline muted autoplay></video>

<div id="top">
  <a id="home" class="rb btn" href="../move-play/" aria-label="Home" title="Home">🏠</a>
  <div id="scores" aria-label="Scores"></div>
  <div id="timer" aria-label="Time left">⏱️</div>
  <button id="bFinish" class="rb" aria-label="Finish" title="Finish">🏁</button>
  <span id="camSt" aria-label="Camera"></span>
  <button id="zoom" class="rb" aria-label="Camera zoom" title="Zoom (Z)">🔍<sup></sup></button>
  <button id="mute" class="rb" aria-label="Sound" title="Sound (M)">🔊</button>
</div>

<div id="title" class="ov">
  <div class="logo" aria-hidden="true">🐰</div>
  <h1>Jump & Duck</h1>
  <div class="icons" aria-label="Moves and players"><span>🦵🤸</span><span>👤×1–4</span></div>
  <div class="howto" aria-label="How to play"><span class="mv"><canvas data-demo="jump" aria-hidden="true"></canvas><b>⬆️🪵</b></span><span class="mv"><canvas data-demo="squat" aria-hidden="true"></canvas><b>⬇️🚧</b></span><span class="mv"><canvas data-demo="lean" aria-hidden="true"></canvas><b>⬅️🪨➡️</b></span></div>
  <div id="camPrompt" aria-label="Camera"><span class="pcam">📷</span><canvas class="phand" data-demo="point" aria-hidden="true"></canvas><b id="camMsg">⏳</b></div>
  <div class="btns modes" aria-label="Mode">
    <button id="bRelax" class="sm mode on" aria-pressed="true" aria-label="Relaxed: no timer, no losing">🧸<small>♾️</small></button>
    <button id="bCam" class="big cam" aria-label="Play">▶️<small>🐰</small></button>
    <button id="bTimed" class="sm mode" aria-pressed="false" aria-label="Challenge: with timer">⏱️<small>🏆</small></button>
  </div>
  <div class="lockbtns" aria-label="Players">
    <button id="bPlayers" class="sm" aria-label="Players: change">👤<b>2</b></button>
    <button id="bRoll" class="sm" aria-label="Roll call again: who is who">📣🙋</button>
  </div>
  <div class="tips"><span>✋⏳👉</span><span>📏 🧍↔️</span><span>💡</span><span>👥 ≤4</span></div>
  <p class="priv">📷 stays on this device: video is processed in the browser and never uploaded.</p>
  <div class="fallback" aria-label="No camera? Play with tap or keys">
    <button id="bTap" class="sm" aria-label="Play with tap or keys">⌨️<small>👤</small></button>
    <button id="bTap2" class="sm" aria-label="Two players with keys">⌨️<small>👥</small></button>
  </div>
</div>

<div id="practice" class="ov hidden" aria-label="Practice">
  <div class="pbig"><canvas id="pDemo" data-demo="reach" aria-hidden="true"></canvas><b id="pIcon"></b></div>
  <div id="pSteps"></div>
  <button id="pSkip" class="big" aria-label="Skip practice">⏭</button>
</div>

<div id="count" class="ov hidden"><b id="countN">3</b><span id="countMsg"></span></div>

<div id="end" class="ov hidden">
  <div class="logo" aria-hidden="true" style="font-size:64px">🏆</div>
  <div id="endRows"></div>
  <div class="btns">
    <button id="bAgain" class="big" aria-label="Play again">🔄</button>
    <button id="bMenu" class="big" aria-label="Back to start">⏮️</button>
    <a class="big btn" href="../move-play/" aria-label="All games">🏠</a>
  </div>
</div>
<div id="toast" role="status"></div>
<div id="stepBack" role="status" aria-label="Step back so your whole body fits">📏<span>🔙🧍</span></div>

<script type="module" src="js/main.js?v=5"></script>
</body>
</html>
