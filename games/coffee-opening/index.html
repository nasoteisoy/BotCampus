.row { display: flex; align-items: center; gap: 8px; }

    <button id="menuBtn" class="ibtn" aria-label="Menu">⚙</button>
  </header>
  <main id="stage">
    <canvas id="scene"></canvas>
    <div id="labels"></div>
    <div id="side">
      <button id="mapBtn" class="ibtn" aria-label="District map">🗺</button>
      <button id="demoBtn" class="ibtn" aria-label="Auto tour">🎬</button>
      <button id="themeBtn" class="ibtn" aria-label="Day or night">🌙</button>
      <button id="dragBtn" class="ibtn" aria-label="Drag to move the camera">✋</button>
      <button id="listBtn" class="ibtn" aria-label="Stage list">📋</button>
    </div>
    <div id="zoom">
      <button id="zIn" class="ibtn" aria-label="Zoom in">➕</button>
      <button id="zOut" class="ibtn" aria-label="Zoom out">➖</button>
      <button id="rot" class="ibtn" aria-label="Rotate">⟳</button>
      <button id="home" class="ibtn" aria-label="Whole lot">⌂</button>
    </div>
    <div id="demoBar" hidden>🎬 <b class="dt">Dutch Bros</b> <span class="bar"><i id="demoFill"></i></span><span id="demoPct">0%</span><button id="demoStop" class="ibtn" aria-label="Stop tour">⏹</button></div>
    <div id="toast" hidden></div>
    <section id="sheet" hidden><div class="grab"></div><div class="hd" id="sheetHd"></div><div class="bd" id="sheetBd"></div></section>
  </main>
  <nav id="tl" aria-label="Stages"></nav>
  <nav id="ops" aria-label="Store dashboard" hidden></nav>
  <nav id="dbar" aria-label="District filters" hidden></nav>
</div>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<script src="data.js"></script>
<script type="module" src="app.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol !== 'file:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
