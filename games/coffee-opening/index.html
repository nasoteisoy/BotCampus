}
.row { display: flex; align-items: center; gap: 8px; }

<script>
/* v4 update path: the service worker is network-first and bypasses the HTTP cache. When a new version takes over (controllerchange)
   or the live sw.js names a newer cache than this page, reload ONCE and show a small '⬆ Updated' toast. */
(function () {
  const APPV = 'coffee-opening-v6';
  try { if (sessionStorage.getItem('co-updated')) { sessionStorage.removeItem('co-updated'); const t = document.getElementById('updToast'); t.hidden = false; setTimeout(() => { t.style.opacity = 0; }, 2600); setTimeout(() => { t.hidden = true; }, 3100); } } catch (e) { /* private mode */ }
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  const sw = navigator.serviceWorker, had = !!sw.controller;
  function reloadOnce(why, v) {
    try { const k = JSON.parse(sessionStorage.getItem('co-reloaded') || '{}'); if (Date.now() - (k.t || 0) < 20000 || (v && k.v === v)) return false;
      sessionStorage.setItem('co-reloaded', JSON.stringify({ t: Date.now(), v: v || '', why })); sessionStorage.setItem('co-updated', why); } catch (e) { return false; }
    try { window.COG && window.COG.saveNow(); } catch (e) { /* keep going */ }
    location.reload(); return true;
  }
  window.coUpdate = { APPV, reloadOnce, get had() { return had; } };
  sw.addEventListener('controllerchange', () => { if (had) reloadOnce('sw'); });
  sw.onmessage = (e) => { if (e.data && e.data.t === 'co-ver?' && e.ports && e.ports[0]) e.ports[0].postMessage({ v: APPV }); };   // v5 sw: 'this page updates itself'
  addEventListener('load', () => sw.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
    const check = () => reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { check(); probe(); } });
    function probe() { fetch('sw.js', { cache: 'no-store' }).then((r) => (r.ok ? r.text() : '')).then((t) => { const m = /const CACHE = '([^']+)'/.exec(t);
      if (m && m[1] !== APPV) { check(); setTimeout(() => reloadOnce('version', m[1]), 3000); } }).catch(() => {}); }
    probe();
  }).catch(() => {}));
})();
</script>
