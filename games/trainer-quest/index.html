<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1f2416">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Trainer Quest</title>
<style>
:root { --bg: #1f2416; --card: #262c1b; --line: #55603a; --btn: #3a4229; --hi: #f2c933; --tx: #eef0e2; --dim: #a9b08f; --top: 48px; --cards: 52px; --nav: 50px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tx); font: 15px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: var(--tx); background: var(--btn); border: 2px solid var(--line); border-radius: 12px; min-width: 44px; min-height: 44px; padding: 0 8px; cursor: pointer; touch-action: manipulation; }
button:active { transform: scale(.96); }
button.on { background: var(--hi); color: #1b1b1b; border-color: #fff3; }
button:disabled { opacity: .45; }
/* portrait: one slim control row, the map, a slim trainer strip, the tab bar */
#app { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr; grid-template-rows: calc(var(--top) + env(safe-area-inset-top, 0px)) 1fr var(--cards) calc(var(--nav) + env(safe-area-inset-bottom, 0px)); grid-template-areas: "top" "map" "cards" "nav"; }
#top { grid-area: top; display: flex; align-items: center; gap: 4px; padding: env(safe-area-inset-top, 0px) 4px 0; background: var(--card); border-bottom: 2px solid var(--line); min-width: 0; }
#top button { padding: 0 4px; font-size: 17px; flex: none; }
#areaChip { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 3px; font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; }
#areaChip small { color: var(--dim); font-weight: 700; font-size: 12px; }
#flagBar { display: flex; gap: 4px; flex: none; }
#flagT { min-width: 54px; }
#spd { min-width: 44px; font-weight: 800; font-size: 15px !important; }
#mapWrap { grid-area: map; position: relative; overflow: hidden; touch-action: none; background: #141a0e; }
#map { position: absolute; left: 0; top: 0; }
body.dragon #mapWrap { box-shadow: inset 0 0 0 3px var(--hi); }
#cards { grid-area: cards; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 3px 4px; background: var(--card); border-top: 2px solid var(--line); min-width: 0; }
.tcard { display: flex; align-items: center; gap: 4px; height: 44px; min-height: 44px; padding: 0 5px; border: 2px solid var(--line); border-radius: 12px; background: var(--btn); cursor: pointer; overflow: hidden; min-width: 0; }
.tcard.fight { border-color: #ef6a3a; background: #3a2a1f; }
.tcard .ic { font-size: 18px; flex: none; }
.tcard .tp { color: var(--hi); font-size: 12px; font-weight: 800; flex: none; }
.tcard .minis { display: flex; gap: 2px; min-width: 0; overflow: hidden; flex: 1; }
.mini { width: 24px; flex: none; display: flex; flex-direction: column; align-items: center; }
.mini img { width: 24px; height: 24px; }
.mini .hp { height: 4px; width: 22px; min-width: 0; flex: none; }
.tcard .vs { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; }
.tcard .vs .mini { width: 32px; } .tcard .vs .mini img { width: 30px; height: 30px; } .tcard .vs .mini .hp { width: 30px; }
.tcard .vs .me img { transform: scaleX(-1); }
.hp { height: 7px; border-radius: 4px; background: #0006; overflow: hidden; flex: 1; min-width: 30px; }
.hp i { display: block; height: 100%; background: #5fd35f; border-radius: 4px; }
.hp i.mid { background: #f2c933; } .hp i.low { background: #ef5a3a; }
.xp { height: 4px; border-radius: 3px; background: #0006; overflow: hidden; } .xp i { display: block; height: 100%; background: #4fc3f7; }
#side { display: contents; }
#panel { display: none; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); }
body.sheet #panel { display: block; position: fixed; left: 0; right: 0; top: calc(var(--top) + env(safe-area-inset-top, 0px)); bottom: calc(var(--nav) + env(safe-area-inset-bottom, 0px)); z-index: 5; padding: 6px 8px 20px; }
/* Feed and Why are half sheets: the map stays visible above them */
body.sheet.half #panel { top: auto; height: 44vh; border-top: 3px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -6px 18px #0008; }
.pclose { float: right; margin: 0 0 4px 6px; position: sticky; top: 0; z-index: 2; }
#nav { grid-area: nav; display: flex; justify-content: space-around; align-items: flex-start; gap: 2px; padding: 2px 4px env(safe-area-inset-bottom, 0px); background: var(--card); border-top: 2px solid var(--line); z-index: 6; }
#nav button { flex: 1; min-width: 40px; max-width: 64px; height: 44px; font-size: 20px; padding: 0; border-radius: 12px; position: relative; }
#nav button .dot { position: absolute; right: 3px; top: 2px; font-size: 10px; background: var(--hi); color: #111; border-radius: 8px; padding: 0 4px; font-weight: 800; }
h2 { font-size: 18px; margin: 4px 2px 8px; display: flex; align-items: center; gap: 8px; }
h3 { font-size: 15px; margin: 12px 2px 6px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
.row { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 4px 8px; margin-bottom: 6px; background: var(--card); border: 2px solid var(--line); border-radius: 14px; }
.row .grow { flex: 1; min-width: 0; }
.row .sub { font-size: 12px; color: var(--dim); }
.row img.sp { width: 48px; height: 48px; flex: none; }
.row.own { border-color: #5fd35f; } .row.lock { opacity: .55; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.chip { min-height: 44px; min-width: 44px; padding: 0 8px; font-size: 13px; border-radius: 10px; }
.seg { display: flex; gap: 6px; margin-bottom: 8px; } .seg button { flex: 1; font-weight: 700; }
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); gap: 6px; }
.dex button { height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; font-size: 12px; }
.dex img { width: 56px; height: 56px; } .dex .unseen img { filter: brightness(0) opacity(.5); } .dex .none { font-size: 30px; opacity: .4; }
.feedRow { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 2px 8px; border-bottom: 1px solid #ffffff14; }
.feedRow .tm { color: var(--dim); font-size: 12px; width: 44px; } .feedRow .ic { font-size: 20px; width: 28px; text-align: center; } .feedRow img { width: 32px; height: 32px; }
.why { padding: 6px 8px; margin-bottom: 6px; background: var(--card); border: 2px solid var(--line); border-radius: 12px; font-size: 13px; }
.why b { font-size: 14px; } .why .opt { display: inline-block; margin: 2px 4px 0 0; padding: 2px 6px; border-radius: 8px; background: #0003; }
.why .opt.pk { background: var(--hi); color: #111; font-weight: 700; }
.why button.wk { min-height: 44px; font-size: 13px; padding: 0 6px; margin: 2px 4px 0 0; }
.bars { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 8px; } .bars span { font-size: 12px; padding: 3px 7px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); }
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.65); display: flex; align-items: center; justify-content: center; padding: 12px; }
.modal[hidden] { display: none; }
.modal .box { width: min(440px, 100%); max-height: 100%; overflow-y: auto; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 12px; }
.modal .box h2 { justify-content: center; font-size: 20px; }
.big { width: 100%; min-height: 54px; font-size: 18px; font-weight: 800; margin-top: 8px; background: var(--hi); color: #111; }
.starters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 8px; }
.starters button { height: 70px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; }
.starters img { width: 46px; height: 46px; }
.sum { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } .sum div { padding: 8px; background: var(--btn); border-radius: 12px; font-size: 18px; font-weight: 700; text-align: center; }
/* offline summary: a corner card along the bottom edge of the map, never over its centre */
#away { position: absolute; left: 6px; right: 6px; bottom: 6px; z-index: 4; display: flex; align-items: center; gap: 6px; padding: 4px 6px; background: rgba(20,24,14,.93); border: 2px solid var(--hi); border-radius: 14px; }
#away[hidden] { display: none; }
#awayBox { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 2px 8px; font-weight: 800; font-size: 13px; }
#awayBox b { width: 100%; font-size: 14px; }
#bv .box { padding: 8px; }
#bvArena { position: relative; height: min(52vh, 330px); border-radius: 14px; background: linear-gradient(#8fc6e8 0 45%, #6aa84f 45%); overflow: hidden; }
#bvArena .mon { position: absolute; width: min(36vw, 26vh, 170px); }
#bvArena .mon img { width: 100%; display: block; transition: opacity .3s; }
#bvArena .foe { right: 6%; top: 4%; } #bvArena .me { left: 6%; bottom: 2%; } #bvArena .me img { transform: scaleX(-1); }
#bvArena .tag { position: absolute; min-width: 150px; padding: 4px 8px; background: rgba(20,24,14,.88); border-radius: 10px; font-size: 13px; }
#bvArena .tag.f { left: 4%; top: 6%; } #bvArena .tag.m { right: 4%; bottom: 8%; }
#bvArena .ball { position: absolute; right: 18%; top: 22%; font-size: 40px; display: none; }
#bvArena .ball.on { display: block; animation: shake .45s ease-in-out infinite; }
@keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-20deg); } 75% { transform: rotate(20deg); } }
#bvCap { min-height: 48px; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 700; font-size: 16px; padding: 4px; }
#wiki { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6); display: flex; flex-direction: column; padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
#wiki[hidden] { display: none; }
#wiki .wb { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--card); border: 2px solid var(--line); border-bottom: none; border-radius: 16px 16px 0 0; }
#wiki .wb b { flex: 1; } #wiki .wb a { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; background: var(--btn); color: var(--tx); text-decoration: none; }
#wiki iframe { flex: 1; width: 100%; border: 2px solid var(--line); border-top: none; background: var(--bg); }
/* toasts: a small pill in the map's top-right corner */
#toast { position: absolute; right: 6px; top: 6px; z-index: 3; max-width: 62%; padding: 5px 10px; background: rgba(242,201,51,.95); color: #111; border-radius: 12px; font-weight: 800; font-size: 14px; pointer-events: none; opacity: 0; transition: opacity .3s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#toast.on { opacity: 1; }
/* landscape: the map takes the full height on the left; controls, trainers, panel and tabs on the right */
@media (orientation: landscape) and (min-width: 600px) {
  #app { grid-template-columns: 1fr min(380px, 45vw); grid-template-rows: calc(var(--top) + env(safe-area-inset-top, 0px)) var(--cards) 1fr calc(var(--nav) + env(safe-area-inset-bottom, 0px)); grid-template-areas: "map top" "map cards" "map panel" "map nav"; }
  #top, #cards, #nav { border-left: 2px solid var(--line); }
  #cards { border-top: none; border-bottom: 2px solid var(--line); }
  #panel, body.sheet #panel, body.sheet.half #panel { grid-area: panel; display: block; position: static; height: auto; border-radius: 0; box-shadow: none; border-top: none; border-left: 2px solid var(--line); padding: 6px 8px 12px; min-height: 0; }
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="areaChip">🌲</div>
    <div id="flagBar"><button id="flagT" data-f="0" aria-label="Flag for Kai (tap to switch)">🚩🧢</button><button id="flagX" aria-label="Clear flags">✕</button><button id="drag" aria-label="Drag: pan, zoom and move flags">✋</button></div>
    <button id="pause" aria-label="Pause">⏸</button><button id="spd" aria-label="Speed">×1</button>
  </header>
  <main id="mapWrap">
    <canvas id="map"></canvas>
    <div id="toast"></div>
    <div id="away" hidden><div id="awayBox"></div><button id="awayOk" aria-label="Dismiss">✕</button></div>
  </main>
  <div id="cards"></div>
  <section id="side"><div id="panel"></div></section>
  <nav id="nav">
    <button data-tab="map" class="on" aria-label="Map">🗺</button><button data-tab="traits" aria-label="Traits">🧬</button><button data-tab="party" aria-label="Party and box">🐾</button><button data-tab="bag" aria-label="Bag">🎒</button><button data-tab="dex" aria-label="Dex">📕</button><button data-tab="feed" aria-label="Feed">📜</button><button data-tab="why" aria-label="Why log">🧠</button><button data-tab="menu" aria-label="Menu">⚙</button>
  </nav>
</div>
<div class="modal" id="start" hidden><div class="box" id="startBox"></div></div>
<div class="modal" id="bv" hidden><div class="box">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><b id="bvTitle" style="flex:1"></b><button id="bvX" aria-label="Close battle">✕</button></div>
  <div id="bvArena"><div class="tag f" id="bvFT"></div><div class="mon foe"><img id="bvF" alt=""></div><div class="ball" id="bvBall">⚪</div><div class="mon me"><img id="bvM" alt=""></div><div class="tag m" id="bvMT"></div></div>
  <div id="bvCap"></div>
</div></div>
<div id="wiki" hidden><div class="wb"><button id="wkX" aria-label="Close wiki">✕</button><b>📖 Wiki</b><a id="wkFull" href="../trainers/wiki.html" aria-label="Open the full wiki">↗</a></div><iframe id="wkF" title="Wiki"></iframe></div>
<script src="../trainers/doctrine.js"></script>
<script src="../trainers/game.js"></script>
<script src="core.js"></script>
<script src="ui.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
