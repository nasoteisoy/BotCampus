<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14111c">
<title>Harmony Hands</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%96%90%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button id="btnPower" class="btn" aria-label="Start"><span class="ic">▶</span><span class="lb">Start</span></button>
    <button id="btnKey" class="btn" aria-label="Key"><span class="ic">🎼</span><span class="lb">Key <b id="keyName">F#</b></span></button>
    <h1 id="title"><span>🖐</span> Harmony Hands</h1>
    <button id="btnTip" class="btn" aria-label="Lag tip"><span class="ic">⏱</span><span class="lb" id="latLbl">Lag</span></button>
    <div id="phones" class="badge" role="note" aria-label="Use headphones"><span class="ic">🎧</span><span class="lb">Use 🎧</span></div>
  </header>

  <main id="stage" data-quad="-1">
    <video id="cam" playsinline muted autoplay></video>
    <div id="grid">
      <div class="q" data-q="0"><button class="chord" data-q="0">D#m</button></div>
      <div class="q" data-q="1"><button class="chord" data-q="1">F#</button></div>
      <div class="q" data-q="2"><button class="chord" data-q="2">C#</button></div>
      <div class="q" data-q="3"><button class="chord" data-q="3">B</button></div>
      <div id="hold" aria-label="Hold zone"></div>
      <div id="dot" hidden></div>
    </div>
    <div id="camStatus" class="pill" hidden></div>
    <div id="startOv">
      <button id="btnStart" aria-label="Start"><span>▶</span></button>
      <div class="ovLbl"><b>Start</b></div>
      <div class="ovHint"><span>🎧 Headphones on</span><span>📷 🎤 Allow</span></div>
    </div>
  </main>

  <section id="panel">
    <div class="ctl note" aria-label="Your note">
      <div class="cap">🎤 You</div>
      <div id="noteName">–</div>
      <div class="meter"><div id="centsBar"></div></div>
      <div class="cap">🎶 <span id="harmNotes">–</span></div>
    </div>
    <label class="ctl mix">
      <span class="cap">🎚 Mix</span>
      <span class="mixrow"><span aria-hidden="true">🗣</span><input id="mix" type="range" min="0" max="100" value="55" aria-label="Mix: me to harmony"><span aria-hidden="true">👥</span></span>
      <span class="ends"><span>Me</span><span>Harmony</span></span>
    </label>
    <div class="ctl voices" role="group" aria-label="Harmony voices">
      <span class="cap">👥 Voices</span>
      <div class="seg" id="voices">
        <button data-v="1">1</button><button data-v="2" class="on">2</button><button data-v="3">3</button>
      </div>
    </div>
    <button id="btnPad" class="ctl tog" aria-pressed="false"><span class="ic">🎹</span><span class="lb">Pad <b>Off</b></span></button>
    <button id="btnPoint" class="ctl tog" aria-label="Tracking point"><span class="ic">☝️</span><span class="lb">Finger</span></button>
    <label id="midiBox" class="ctl midi" hidden>
      <span class="cap">🎛 MIDI out</span>
      <select id="midiSel" aria-label="MIDI output"></select>
    </label>
  </section>

  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true">
    <div class="card">
      <div class="sheetTop"><b id="sheetTitle"></b><button id="sheetDone" class="btn"><span class="ic">✓</span><span class="lb">Done</span></button></div>
      <div id="sheetBody"></div>
    </div>
  </div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
