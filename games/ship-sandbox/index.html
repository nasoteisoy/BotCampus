<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ship Sandbox">
<title>Ship Sandbox</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css?v=3d">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
</head>
<body>
<canvas id="cv"></canvas>
<div id="tags" class="hidden"></div>
<div id="crewTags" class="hidden"></div>
<div id="boardFx"></div>
<div id="floats"></div>
<div id="tip" class="hidden" role="tooltip"></div>
<div id="top">
  <button class="tb" id="bPause" title="Pause"><span class="ic" id="pauseIc"></span><small id="pauseL">Pause</small></button>
  <button class="tb" id="bSlow" title="Slow-mo"><span class="ic">🐢<i id="slowV">×1</i></span><small>Speed</small></button>
  <button class="tb" id="bReset" title="Reset ship"><span class="ic" id="resetIc"></span><small>Reset</small></button>
  <button class="tb on" id="bShield" title="Shield on/off"><span class="ic">🫧<i id="shieldV">ON</i></span><small>Shield</small></button>
  <button class="tb" id="bBack" title="Ship fires back"><span class="ic"><span id="backIc"></span><i id="backV">OFF</i></span><small>Guns</small></button>
  <button class="tb" id="bLabels" title="Show part names on the ship"><span class="ic">🏷<i id="labelsV">OFF</i></span><small>Names</small></button>
  <button class="tb" id="bCount" title="Attackers per tap"><b id="countV">×1</b><small>Per tap</small></button>
</div>
<div id="stats">
  <div id="army" title="Your army (from Trooper Customizer)"><canvas id="flagC" width="36" height="24"></canvas><span class="an"><b id="plName">Player</b><small id="natName">Home Fleet</small></span>
    <button id="bCrew" title="Show crew on the ship">👥</button><a id="bTroop" class="lk" href="../trooper-custom/?from=ship-sandbox" title="Troopers">🪖<small>Troopers</small></a><a id="bHome" class="lk hidden" href="../trooper-custom/" title="Back to Trooper Customizer">↩</a></div>
  <button id="tgt" title="Target (tap to aim at whole ship)"><span>🎯</span><b id="tgtIc">🚢</b><span id="tgtName">Whole ship</span></button>
  <span class="st" title="Shield"><i>🫧</i><span class="bar"><i id="shBar"></i></span></span>
  <span class="st" title="Speed"><i>🚀</i><b id="spdV">14</b></span>
  <span class="st" title="Power"><i>⚡</i><b id="pwrV">ON</b></span>
  <span class="st" title="Aim"><i>🎯</i><b id="aimV">100%</b></span>
  <span class="st" title="Fighters out"><i>🛬</i><b id="fgtV">0</b></span>
</div>
<div id="dock">
  <div id="sheet" class="hidden"><div id="sheetBody"></div></div>
  <div id="tabs">
    <button class="tab" data-tab="parts" title="Parts">🧩<small>Parts</small></button>
    <button class="tab" data-tab="log" title="Log">📜<small>Log</small></button>
    <button class="tab" data-tab="matrix" title="Damage matrix">🔢<small>Damage</small></button>
  </div>
  <div id="palette"></div>
</div>
<div id="banner" class="hidden"><div class="card"><div class="big">💀</div><div id="bannerTxt">Ship lost</div><button id="bAgain">↺</button></div></div>
<div id="updToast" class="hidden">⬆️ New version <button id="updGo">↻</button></div>
<script type="module" src="js/main.js?v=3d"></script>
<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      window.__swReg = reg;
      const show = () => document.getElementById('updToast').classList.remove('hidden');
      if (reg.waiting && navigator.serviceWorker.controller) show();
      reg.addEventListener('updatefound', () => {
        const w = reg.installing; if (!w) return;
        w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) show(); });
      });
      setInterval(() => reg.update().catch(() => {}), 60000);
    }).catch(() => {});
    document.getElementById('updGo').onclick = () => location.reload();
  });
}
</script>
</body>
</html>
