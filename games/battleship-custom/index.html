<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070a1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🚀 BattleShip Editor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=1">
<script type="importmap">
{ "imports": { "three": "../trooper-custom/vendor/three.module.min.js?v=6" } }
</script>
</head>
<body>
<header id="top">
  <button id="back" class="ob" type="button" aria-label="Back"><span class="ic">⬅️</span><span class="lb">Back</span></button>
  <div id="hqslot" aria-hidden="true"></div>
  <div id="titles">
    <div id="crumbrow"><nav id="crumb" aria-label="You are here"></nav><div id="saved" role="status" aria-live="polite">✓ Saved</div></div>
    <div id="title"><span class="ic">🚀</span> Editing: <b id="hName">BattleShip 1</b></div>
  </div>
</header>

<div id="view">
  <div id="app"></div>
  <div id="viewbtns">
    <button id="demoBtn" class="ob" type="button"><span class="ic">🎬</span><span class="lb">Demo</span></button>
    <button id="spinBtn" class="ob on" type="button" aria-pressed="true"><span class="ic">🔄</span><span class="lb">Spin</span></button>
  </div>
  <div id="dhud" hidden>
    <div class="hb"><span>🔵 Shield</span><i><u id="dSh"></u></i></div>
    <div class="hb"><span>❤️ Hull</span><i><u id="dHp"></u></i></div>
  </div>
  <div id="drag" aria-hidden="true">👆 drag to turn</div>
</div>

<section id="stats" aria-label="Ship stats"></section>

<div id="nav">
  <ol id="steps" aria-label="Steps">
    <li data-step="1"><b>1</b>Ship</li>
    <li data-step="2"><b>2</b>Parts</li>
    <li data-step="3"><b>3</b>Done</li>
  </ol>
  <div id="tabs" role="tablist" aria-label="Parts"></div>
</div>

<main id="body"></main>

<button id="done" type="button"><span class="ic">✅</span><span class="lb">Done</span></button>
<div id="pop" role="tooltip" hidden></div>
<div id="hint" role="dialog" aria-label="Tip" hidden><span id="hintTxt"></span><button id="hintX" type="button" aria-label="Close tip">✕</button></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/main.js?v=1"></script>
</body>
</html>
