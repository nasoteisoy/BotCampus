<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Officer Cards</title>
<style>
:root {
  --ink: #2a2924;
  --ink-soft: #5a564c;
  --cream: #fff8e6;
  --paper: #fffdf6;
  --sky: #c5e6f8;
  --sky-deep: #8ec8ea;
  --grass: #c8e59a;
  --grass-deep: #8fbf55;
  --sand: #f3e2b8;
  --yellow: #ffd23f;
  --yellow-ink: #3a2e00;
  --you: #1f7a3d;
  --you-soft: #d7f0de;
  --ai: #c04a32;
  --ai-soft: #f8d9d2;
  --gold: #e4b01a;
  --supply: #d89212;
  --line: #c9b98a;
  --shadow: 0 4px 0 rgba(42,41,36,.12);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; height: 100dvh;
  overflow: hidden;
  font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color: var(--ink);
  background: linear-gradient(180deg, var(--sky) 0%, #e8f4c8 55%, var(--sand) 100%);
  user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
#app { height: 100%; position: relative; }
.screen {
  display: none;
  position: absolute; inset: 0;
  padding: calc(12px + var(--safe-t)) calc(12px + var(--safe-r)) calc(12px + var(--safe-b)) calc(12px + var(--safe-l));
}
.screen.show { display: flex; flex-direction: column; align-items: center; }
.ico { display: inline-block; vertical-align: middle; flex: 0 0 auto; }
.ico svg { display: block; }

/* ----- Start / End ----- */
#screen-start, #screen-end { justify-content: center; gap: 16px; text-align: center; }
.brand {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.brand h1 {
  margin: 0; font-size: clamp(28px, 6vw, 42px); letter-spacing: .02em; line-height: 1.1;
}
.brand p { margin: 0; font-size: 16px; color: var(--ink-soft); }
.title-art {
  display: flex; gap: 16px; justify-content: center; align-items: stretch;
  height: min(24vh, 176px);
  padding-top: 12px;
  margin-top: 6px;
  flex: 0 0 auto;
}
.title-art .preview-card {
  height: 100%;
  filter: drop-shadow(0 8px 0 rgba(42,41,36,.1));
}
.title-art .card {
  height: 100%;
  width: auto;
  aspect-ratio: 92 / 124;
  --cw: unset;
  --ch: unset;
}
.legend {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
  max-width: 520px; margin: 0; padding: 0; list-style: none;
}
.legend li, .chip {
  display: flex; align-items: center; gap: 6px;
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: 999px;
  padding: 6px 10px;
  min-height: 44px;
  font-size: 14px;
  box-shadow: var(--shadow);
}
.how { margin: 0; font-size: 16px; color: var(--ink); }
.btn-primary {
  appearance: none; border: 3px solid #3a2e00;
  background: var(--yellow);
  color: var(--yellow-ink);
  font-weight: 800;
  font-size: 22px;
  min-height: 56px; min-width: 180px;
  padding: 10px 28px;
  border-radius: 16px;
  box-shadow: 0 5px 0 #8a6a00;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a6a00; }
.btn-secondary {
  appearance: none;
  background: var(--paper);
  border: 3px solid var(--ink);
  min-height: 52px;
  min-width: 52px;
  padding: 8px 14px;
  border-radius: 14px;
  font-weight: 800;
  font-size: 16px;
  box-shadow: var(--shadow);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.end-banner { font-size: clamp(32px, 8vw, 52px); font-weight: 900; margin: 0; }
.end-banner.win { color: #166534; }
.end-banner.lose { color: #9a2b1c; }
.end-banner.draw { color: #5a4a1a; }
.end-fronts { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.end-front {
  background: var(--paper); border: 3px solid var(--line); border-radius: 16px;
  padding: 10px 16px; min-width: 140px; box-shadow: var(--shadow);
}
.end-front .lbl { display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 800; }
.end-front .nums { font-size: 22px; font-weight: 800; margin-top: 4px; }

/* ----- Play layout ----- */
#screen-play { align-items: stretch; gap: 6px; padding-bottom: calc(8px + var(--safe-b)); }
#hud {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
  min-height: 48px;
  min-width: 0;
}
.hud-side {
  display: flex; align-items: center; gap: 6px;
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 0 8px;
  min-height: 48px;
  min-width: 0;
  flex: 1 1 0;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.hud-side.ai { justify-content: flex-start; border-color: #e0a090; }
.hud-side.you { justify-content: flex-end; border-color: #8fca9d; }
.who {
  display: flex; align-items: center; gap: 4px;
  font-weight: 800; font-size: 14px;
}
.who.ai { color: var(--ai); }
.who.you { color: var(--you); }
.supply-pips { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
#you-supply, #ai-supply {
  min-height: 44px;
  min-width: 44px;
  padding: 0 4px;
  box-sizing: border-box;
  cursor: pointer;
}
.pip {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid #8a5a08; background: #f3d9a0;
}
.pip.on { background: var(--supply); box-shadow: inset 0 -2px 0 #8a5a08; }
.pip.extra { background: #f0c040; border-color: #6a4a08; }
.hud-mid {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  flex: 0 0 auto;
  min-width: 72px; min-height: 48px;
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: 14px;
  font-weight: 800; font-size: 14px;
  box-shadow: var(--shadow);
  padding: 4px 8px;
  white-space: nowrap;
}
.hud-mid .turn-tag { font-size: 12px; color: var(--ink-soft); font-weight: 700; }

#board {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.front {
  position: relative;
  display: grid;
  grid-template-rows: 1fr auto 1fr;
  min-height: 0;
  min-width: 0;
  border: 3px solid rgba(42,41,36,.2);
  border-radius: 18px;
  overflow: hidden;
  transition: box-shadow .15s, border-color .15s, transform .15s;
}
.front.drop-ok {
  border-color: #1f7a3d;
  box-shadow: 0 0 0 4px rgba(31,122,61,.35), inset 0 0 0 3px rgba(255,210,63,.7);
}
.front.space { background: linear-gradient(180deg, #9fd4f4 0%, #d7eefc 55%, #f2f7e4 100%); }
.front.land { background: linear-gradient(180deg, #d7eef0 0%, #d2ec9a 50%, #c3d86a 100%); }
.front-sky {
  position: absolute; inset: 0; pointer-events: none;
}
.lane {
  position: relative;
  z-index: 1;
  display: flex; justify-content: center; align-items: center;
  gap: 4px; padding: 6px; min-height: 0; min-width: 0;
  overflow: hidden;
}
.lane.enemy { align-items: flex-start; }
.lane.player { align-items: flex-end; }
.lane.empty-hint {
  color: var(--ink-soft); font-size: 13px; font-weight: 700;
}
.front-mid {
  position: relative; z-index: 2;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 2px 8px;
  min-height: 36px;
}
.front-title {
  display: flex; align-items: center; gap: 4px;
  font-weight: 800; font-size: 14px;
  background: rgba(255,253,246,.86);
  border: 2px solid var(--line);
  border-radius: 999px;
  padding: 2px 8px;
}
.power-row {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,253,246,.92);
  border: 2px solid var(--line);
  border-radius: 999px;
  padding: 2px 8px;
  font-weight: 800; font-size: 16px;
  min-height: 36px;
}
.power-row .ai-n { color: var(--ai); }
.power-row .you-n { color: var(--you); }
.tug {
  width: 72px; height: 10px; border-radius: 99px;
  background: #e8dcc0; overflow: hidden; border: 2px solid var(--ink);
  display: flex;
}
.tug > i { display: block; height: 100%; }
.tug .you { background: var(--you); }
.tug .ai { background: var(--ai); }
.holder-flag { display: flex; align-items: center; }

#dock {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: stretch;
  min-height: 96px;
  min-width: 0;
}
#hand {
  display: flex; align-items: flex-end; gap: 8px;
  overflow-x: auto; overflow-y: hidden;
  padding: 16px 8px 6px;
  background: rgba(255,253,246,.72);
  border: 2px solid var(--line);
  border-radius: 16px;
  min-height: 96px;
  min-width: 0;
  scrollbar-width: thin;
}
.actions {
  display: flex; flex-direction: column; justify-content: flex-end; gap: 8px;
  min-width: 120px;
  flex: 0 0 auto;
}
#btn-end { min-width: 120px; }
#btn-promote { display: none; }
#btn-promote.show { display: inline-flex; }

/* Cards */
.card {
  position: relative;
  flex: 0 0 auto;
  width: var(--cw, 92px);
  height: var(--ch, 124px);
  background: var(--cream);
  border: 3px solid #5a4a28;
  border-radius: 12px;
  box-shadow: 0 4px 0 rgba(42,41,36,.18);
  display: flex; flex-direction: column;
  padding: 28px 3px 0;
  overflow: visible;
  cursor: pointer;
  transition: transform .12s ease, box-shadow .12s;
  touch-action: manipulation;
}
.card.yours { border-color: #2a6a3c; }
.card.theirs { border-color: #9a3a28; }
.card.selected {
  transform: translateY(-10px) scale(1.05);
  box-shadow: 0 0 0 3px var(--yellow), 0 8px 0 rgba(42,41,36,.18);
  z-index: 3;
}
.card.cant { opacity: .72; }
.card.command { border-color: #c49210; background: linear-gradient(180deg, #fff4c8, var(--cream)); }
.card.deal { animation: deal .28s ease-out; }
@keyframes deal {
  from { transform: translateY(16px); opacity: 0; }
  to { transform: none; opacity: 1; }
}
.card .cost {
  position: absolute; top: -2px; left: -2px;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--supply); border: 2px solid #6a4a08; color: #3a2e00;
  font-weight: 900; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  z-index: 2;
}
.bonus-chip {
  position: absolute; top: 3px; left: 28px;
  z-index: 2;
  font-size: 14px; font-weight: 800; line-height: 1;
  color: #1f5f9a;
  background: #fff8e6;
  border: 2px solid #5a4a28;
  border-radius: 8px;
  padding: 2px 5px;
  height: 22px;
  display: flex; align-items: center;
  box-sizing: border-box;
  white-space: nowrap;
}
.bonus-chip.land { color: #1f7a3d; }
.card .stats { display: contents; }
.card .art {
  position: relative;
  flex: 1 1 auto;
  min-height: 48px;
  width: 100%;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; border-radius: 6px; z-index: 0;
  order: 2;
}
.cmd-badge {
  position: absolute; top: 3px; right: 3px;
  width: 24px; height: 24px; z-index: 2;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.card .art svg { width: 100%; height: 100%; object-fit: contain; }
.card .meta {
  position: static;
  z-index: 1;
  display: flex; flex-wrap: nowrap; align-items: center; justify-content: space-between;
  gap: 2px;
  background: #fff8e6;
  border-top: 2px solid rgba(90,74,40,.35);
  border-radius: 0 0 9px 9px;
  padding: 2px 4px;
  font-size: 14px; font-weight: 800; line-height: 1;
  flex: 0 0 28px;
  height: 28px;
  overflow: hidden;
  min-width: 0;
  box-sizing: border-box;
  margin: 0 -3px;
  order: 3;
}
.card .type {
  display: flex; align-items: center; justify-content: center;
  flex: 0 0 24px; width: 24px; height: 24px;
  overflow: hidden;
}
.card .units {
  display: flex; align-items: center; justify-content: flex-end;
  flex: 1 1 auto; gap: 2px;
  overflow: hidden; min-width: 0;
}
.bonus, .unit-n, .bonus-chip { font-size: 14px; line-height: 1; white-space: nowrap; flex: 0 0 auto; }
.ico-svg, .type svg, .units svg, .front-title svg, .power-row svg,
.who svg, .supply-pips > svg, .btn-primary svg, .btn-secondary svg,
.legend svg, .end-front svg, .holder-flag svg {
  width: 24px !important; height: 24px !important;
  min-width: 24px; min-height: 24px;
  flex: 0 0 24px;
}
.card .type { display: flex; align-items: center; gap: 2px; }
.card .units { display: flex; align-items: center; gap: 2px; }
.bonus { color: #1f5f9a; }
.bonus.land { color: #1f7a3d; }
.card-back {
  width: 28px; height: 38px; border-radius: 5px;
  background: repeating-linear-gradient(45deg, #c04a32, #c04a32 6px, #e8a090 6px, #e8a090 12px);
  border: 2px solid #7a2818;
  box-shadow: var(--shadow);
}
.hand-backs { display: flex; gap: 2px; align-items: center; flex: 0 1 auto; min-width: 0; overflow: hidden; }
.supply-pips { flex: 0 0 auto; }
.lane .card {
  --cw: unset;
  --ch: unset;
  width: var(--lw, auto);
  height: var(--lh, auto);
  max-width: calc((100% - 12px) / 4);
  max-height: 100%;
  flex: 0 0 auto;
  min-width: 0;
  min-height: 0;
  overflow: visible;
}
.lane .card.selected { transform: none; }
#hand .card {
  --cw: clamp(86px, 14vh, 110px);
  --ch: clamp(116px, 19vh, 148px);
}

#hint {
  display: none;
  position: absolute;
  z-index: 8;
  background: var(--ink);
  color: var(--cream);
  font-weight: 800;
  font-size: 15px;
  padding: 8px 12px;
  border-radius: 12px;
  white-space: nowrap;
  pointer-events: none;
  box-shadow: 0 6px 0 rgba(0,0,0,.2);
}
#hint.show { display: block; }
@media (hover: none), (pointer: coarse) {
  #hint, #hint.show { display: none !important; }
}
#hint::after {
  content: "";
  position: absolute; left: var(--hint-arrow, 24px); bottom: -8px;
  border: 8px solid transparent; border-top-color: var(--ink); border-bottom: 0;
}
#toast {
  display: none;
  position: absolute;
  left: 50%; top: 6px; bottom: auto;
  transform: translateX(-50%);
  z-index: 12;
  background: var(--paper);
  border: 3px solid var(--ink);
  border-radius: 14px;
  padding: 6px 12px;
  font-weight: 800;
  font-size: 15px;
  box-shadow: 0 4px 0 rgba(42,41,36,.15);
  pointer-events: none;
  white-space: nowrap;
}
#toast.show { display: block; animation: pop .2s ease-out; }
@keyframes pop { from { transform: translateX(-50%) scale(.9); opacity: 0; } }

.sun, .cloud, .hill { position: absolute; pointer-events: none; }
.sun { width: 36px; height: 36px; border-radius: 50%; background: #ffe566; box-shadow: 0 0 0 6px rgba(255,229,102,.35); top: 8px; right: 10px; }
.cloud { background: #fff; border-radius: 20px; opacity: .85; }
.hill { background: #7daf3e; border-radius: 40px 40px 0 0; }

@media (max-width: 700px) and (orientation: portrait) {
  #board { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .title-art { height: min(22vh, 160px); }
  #dock {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    min-height: 0;
  }
  .actions {
    order: 0;
    flex-direction: row;
    justify-content: flex-end;
    align-items: stretch;
    min-width: 0;
    width: 100%;
    gap: 8px;
  }
  #hand { order: 1; width: 100%; min-width: 0; }
  #hand .card { --cw: clamp(86px, 22vw, 110px); --ch: clamp(120px, 32vw, 150px); }
  #btn-end { min-width: 140px; }
  .who-lab { display: none; }
  .card-back { width: 16px; height: 22px; }
  #hud-mid { min-width: 58px; min-height: 44px; font-size: 12px; padding: 2px 6px; }
  .hud-side { padding: 0 4px; gap: 4px; min-height: 44px; }
  .pip { width: 11px; height: 11px; }
  #screen-play { padding: 8px; gap: 4px; }
  #hud { min-height: 44px; }
  .front-mid { min-height: 28px; padding: 0 6px; }
  .power-row { min-height: 26px; }
  .lane { padding: 4px; }
  #dock { gap: 4px; }
  #btn-end, #btn-promote { min-height: 44px; }
  #hand { padding: 6px 8px 4px; }
}
@media (orientation: landscape) and (max-height: 500px) {
  #screen-start {
    flex-direction: row;
    flex-wrap: nowrap;
    justify-content: center;
    align-items: center;
    gap: 16px 24px;
    padding: calc(8px + var(--safe-t)) calc(20px + var(--safe-r)) calc(8px + var(--safe-b)) calc(20px + var(--safe-l));
  }
  #screen-start .brand { order: 1; }
  #screen-start .title-art { order: 0; height: min(70vh, 200px); }
  #screen-start .legend { order: 2; max-width: 260px; }
  #screen-start .how { display: none; }
  #screen-start .btn-primary { order: 3; }
  #screen-end { gap: 8px; padding-top: calc(6px + var(--safe-t)); }
  .brand h1 { font-size: 26px; }
  .legend li { min-height: 36px; padding: 4px 8px; font-size: 13px; }
  .btn-primary { min-height: 48px; font-size: 18px; }
  #screen-play {
    padding: 4px calc(8px + var(--safe-r)) calc(4px + var(--safe-b)) calc(8px + var(--safe-l));
    gap: 4px;
  }
  #hud, .hud-side, .hud-mid { min-height: 44px; height: 44px; overflow: hidden; }
  .hud-side, .hud-mid { padding: 0 8px; }
  .front-mid { min-height: 24px; padding: 0 6px; }
  .power-row { min-height: 24px; }
  #dock { min-height: 0; grid-template-columns: minmax(0, 1fr) auto; }
  #hand { min-height: 0; padding: 4px 8px 4px; min-width: 0; }
  .actions {
    flex-direction: row;
    align-items: stretch;
    gap: 4px;
    min-width: 0;
    flex: 0 0 auto;
  }
  #btn-end, #btn-promote, #screen-play .btn-primary, #screen-play .btn-secondary {
    min-height: 44px;
    min-width: 96px;
    font-size: 15px;
    padding: 6px 10px;
  }
  .lane { padding: 4px; }
  .who-lab { display: none; }
  #screen-play .card {
    display: grid;
    grid-template-columns: minmax(48px, 1fr) 34px;
    grid-template-rows: minmax(48px, 1fr) 28px;
    grid-template-areas:
      "art stats"
      "meta meta";
    padding: 2px;
    border-width: 2px;
    gap: 2px 4px;
    min-height: 80px;
    align-items: stretch;
  }
  #screen-play .card .stats {
    display: flex;
    grid-area: stats;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 2px;
    min-width: 32px;
    min-height: 0;
  }
  #screen-play .card .art {
    grid-area: art;
    position: relative;
    inset: auto;
    flex: unset;
    width: auto;
    height: auto;
    min-width: 48px;
    min-height: 48px;
    margin: 0;
    align-self: stretch;
    order: 0;
  }
  #screen-play .card .cost,
  #screen-play .card .bonus-chip {
    position: relative;
    top: auto; left: auto; right: auto;
    margin: 0 auto;
    flex: 0 0 auto;
  }
  #screen-play .card .cost { width: 28px; height: 28px; flex: 0 0 28px; }
  #screen-play .card .bonus-chip {
    height: 18px;
    padding: 0 3px;
    flex: 0 0 18px;
  }
  #screen-play .card .cmd-badge {
    position: relative;
    top: auto; right: auto;
    flex: 0 0 24px;
  }
  #screen-play .card .meta {
    grid-area: meta;
    position: relative;
    inset: auto;
    flex: 0 0 28px;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    width: auto;
    height: 28px;
    min-height: 28px;
    margin: 0;
    padding: 2px 4px;
    background: #fff8e6;
    border-top: 2px solid rgba(90,74,40,.35);
    border-radius: 0 0 8px 8px;
    gap: 4px;
    order: 0;
    overflow: hidden;
  }
  #screen-play .card .units { justify-content: flex-end; }
  #screen-play .card.command .meta { gap: 2px; padding: 2px 0; }
  #hand .card { --cw: 110px; --ch: 88px; }
}
@media (max-width: 420px) {
  .actions { min-width: 100px; }
  #btn-end, .btn-primary { min-width: 100px; font-size: 16px; padding: 8px 12px; }
  .hud-side { padding: 0 4px; }
}
</style>
</head>
<body data-screen="start">
<div id="app">
  <section id="screen-start" class="screen show" aria-label="Start">
    <div class="brand">
      <h1>Officer Cards</h1>
      <p>Space and land. Lead both fronts.</p>
    </div>
    <div class="title-art" id="title-art" aria-hidden="true"></div>
    <ul class="legend" id="start-legend"></ul>
    <p class="how">Five rounds. Lead both fronts to win.</p>
    <button type="button" class="btn-primary" id="btn-play"><span class="ico" data-ico="play"></span> Play</button>
  </section>

  <section id="screen-play" class="screen" aria-label="Play" data-turn="you" data-busy="0" data-round="1">
    <header id="hud">
      <div class="hud-side ai" id="hud-ai">
        <div class="who ai"><span class="ico" data-ico="user"></span> <span class="who-lab">Rival</span></div>
        <div class="hand-backs" id="ai-backs" title="Rival hand"></div>
        <div class="supply-pips" id="ai-supply" data-tip="Supply"></div>
      </div>
      <div class="hud-mid" id="hud-mid">
        <div id="round-lab">Round 1 / 5</div>
        <div class="turn-tag" id="turn-lab">Your turn</div>
      </div>
      <div class="hud-side you" id="hud-you">
        <div class="supply-pips" id="you-supply" data-tip="Supply"></div>
        <div class="who you"><span class="who-lab">You</span> <span class="ico" data-ico="user"></span></div>
      </div>
    </header>

    <div id="board">
      <div class="front space" id="front-space" data-front="space">
        <div class="front-sky" aria-hidden="true"><div class="sun"></div></div>
        <div class="lane enemy" id="space-ai"></div>
        <div class="front-mid">
          <div class="front-title"><span class="ico" data-ico="rocket"></span> Space</div>
          <div class="power-row" id="space-power"></div>
        </div>
        <div class="lane player" id="space-you"></div>
      </div>
      <div class="front land" id="front-land" data-front="land">
        <div class="front-sky" aria-hidden="true"></div>
        <div class="lane enemy" id="land-ai"></div>
        <div class="front-mid">
          <div class="front-title"><span class="ico" data-ico="flag"></span> Land</div>
          <div class="power-row" id="land-power"></div>
        </div>
        <div class="lane player" id="land-you"></div>
      </div>
    </div>

    <div id="dock">
      <div id="hand" aria-label="Your hand"></div>
      <div class="actions">
        <button type="button" class="btn-secondary" id="btn-promote"><span class="ico" data-ico="star"></span> Promote</button>
        <button type="button" class="btn-primary" id="btn-end"><span class="ico" data-ico="skip"></span> End turn</button>
      </div>
    </div>
    <div id="hint"></div>
    <div id="toast" role="status"></div>
  </section>

  <section id="screen-end" class="screen" aria-label="Result">

    <div class="end-fronts">
      <div class="end-front" id="end-space"></div>
      <div class="end-front" id="end-land"></div>
    </div>
    <p class="how" id="end-sub"></p>
    <button type="button" class="btn-primary" id="btn-restart"><span class="ico" data-ico="refresh"></span> Restart</button>
  </section>
</div>
<script>
(function () {
  "use strict";

  const PATHS = {
    play: '<polygon points="6 3 20 12 6 21 6 3"/>',
    skip: '<polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/>',
    refresh: '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/>',
    flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>',
    rocket: '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>',
    coins: '<circle cx="8" cy="8" r="6"/><path d="M18.1 14.1A6 6 0 1 1 11.9 5.9"/><path d="M8 6v4l2 1"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    sword: '<polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/>',
    sparkles: '<path d="M9.9 2.1 11 6.5 15.4 7.6 11 8.7 9.9 13.1 8.8 8.7 4.4 7.6 8.8 6.5Z"/><path d="M19 12v4"/><path d="M17 14h4"/><path d="M5 18v3"/><path d="M3.5 19.5h3"/>',
    package: '<line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>',
    star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
    crown: '<path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7z"/><line x1="3" y1="20" x2="21" y2="20"/>',
    radio: '<circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49M7.76 16.24a6 6 0 0 1 0-8.49"/><path d="M20 4a10 10 0 0 1 0 16M4 20a10 10 0 0 1 0-16"/>',
    helmet: '<path d="M4 14a8 8 0 0 1 16 0"/><path d="M4 14h16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M9 14v4M15 14v4"/>'
  };

  function ico(name, size, stroke) {
    const d = PATHS[name] || PATHS.sparkles;
    const s = size || 24;
    return '<svg class="ico-svg" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(stroke||2.2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
  }

  document.querySelectorAll("[data-ico]").forEach((el) => {
    el.innerHTML = ico(el.getAttribute("data-ico"), 24);
  });

  const TYPES = {
    signal:   { label: "Signal",   icon: "radio",   tip: "Signal: draw a card",     bonus: "draw" },
    upkeep:   { label: "Upkeep",   icon: "package", tip: "Upkeep: extra supply",    bonus: "supply" },
    infantry: { label: "Infantry", icon: "helmet",  tip: "Infantry: bonus on land", bonus: "land" },
    fleet:    { label: "Fleet",    icon: "rocket",  tip: "Fleet: bonus in space",   bonus: "space" },
    pilot:    { label: "Pilot",    icon: "rocket",  tip: "Pilot: bonus in space",   bonus: "space" }
  };

  const PAL = {
    infantry: { c:"#2e7a40", d:"#1e4d28", a:"#d7b056", skin:"#f0c9a0" },
    fleet:    { c:"#2e6ea8", d:"#1a446c", a:"#e8f3ff", skin:"#f0c9a0" },
    pilot:    { c:"#215e86", d:"#133950", a:"#ef9a2e", skin:"#f0c9a0" },
    signal:   { c:"#d9a116", d:"#8a6410", a:"#c4362c", skin:"#f0c9a0" },
    upkeep:   { c:"#c36e22", d:"#7a4214", a:"#f0d9a0", skin:"#f0c9a0" }
  };

  function officerArt(type, command) {
    const p = PAL[type] || PAL.infantry;
    let gear = "";
    if (type === "infantry") {
      gear = '<rect x="54" y="42" width="4" height="36" rx="1" fill="#4a4030" stroke="#2a2418" stroke-width="1"/>'+
             '<rect x="52" y="38" width="8" height="6" rx="1" fill="#3a3428"/>'+
             '<ellipse cx="40" cy="22" rx="16" ry="10" fill="'+p.d+'" stroke="#1a2a18" stroke-width="1.5"/>'+
             '<rect x="24" y="22" width="32" height="6" fill="'+p.d+'"/>';
    } else if (type === "fleet") {
      gear = '<ellipse cx="40" cy="22" rx="14" ry="13" fill="'+p.d+'" stroke="#102030" stroke-width="1.5"/>'+
             '<path d="M26 22h28" stroke="'+p.a+'" stroke-width="3"/>'+
             '<path d="M58 48c8-4 14-2 16 4-8 2-12 0-16-4z" fill="'+p.c+'" stroke="#102030" stroke-width="1.2"/>'+
             '<circle cx="62" cy="50" r="2" fill="#cfe8ff"/>';
    } else if (type === "pilot") {
      gear = '<ellipse cx="40" cy="22" rx="14" ry="13" fill="'+p.d+'" stroke="#102030" stroke-width="1.5"/>'+
             '<path d="M26 22h28" stroke="'+p.a+'" stroke-width="3.5"/>'+
             '<path d="M28 48c-8 10-4 22 8 18 2-8 4-14-8-18z" fill="'+p.a+'" stroke="#7a4a10" stroke-width="1"/>';
    } else if (type === "signal") {
      gear = '<path d="M18 28l-10-16 2 18z" fill="'+p.a+'" stroke="#5a1810" stroke-width="1"/>'+
             '<path d="M62 28l12-14-1 18z" fill="#2e6ea8" stroke="#102030" stroke-width="1"/>'+
             '<path d="M16 30v36M64 30v36" stroke="#5a4030" stroke-width="2"/>'+
             '<ellipse cx="40" cy="18" rx="13" ry="7" fill="'+p.d+'" stroke="#5a4010" stroke-width="1.5"/>'+
             '<rect x="27" y="18" width="26" height="5" fill="'+p.d+'"/>';
    } else {
      gear = '<rect x="50" y="52" width="18" height="14" rx="2" fill="'+p.a+'" stroke="#5a3a10" stroke-width="1.4"/>'+
             '<path d="M50 56h18M59 52v14" stroke="#5a3a10" stroke-width="1.2"/>'+
             '<ellipse cx="40" cy="18" rx="12" ry="6" fill="'+p.d+'" stroke="#4a2a10" stroke-width="1.5"/>';
    }
    const cape = command
      ? '<path d="M24 44c-10 10-12 30-6 36 16-6 28-6 44 0 6-6 4-26-6-36" fill="#c49210" stroke="#6a4a08" stroke-width="1.2"/>'
      : "";
    const star = command
      ? '<polygon points="40,46 42.2,50.8 47.5,51.2 43.4,54.6 44.6,59.8 40,56.8 35.4,59.8 36.6,54.6 32.5,51.2 37.8,50.8" fill="#ffe566" stroke="#6a4a08" stroke-width="1"/>'
      : "";
    return '<svg viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" preserveAspectRatio="xMidYMid meet">'+
      '<ellipse cx="40" cy="94" rx="18" ry="4" fill="rgba(42,41,36,.18)"/>'+
      cape+
      '<path d="M28 88c0 4 3 6 6 6h12c3 0 6-2 6-6l-2-14H30z" fill="#3a342c"/>'+
      '<rect x="26" y="44" width="28" height="32" rx="8" fill="'+p.c+'" stroke="'+p.d+'" stroke-width="1.6"/>'+
      '<rect x="26" y="62" width="28" height="6" fill="'+p.d+'"/>'+
      '<circle cx="18" cy="58" r="6" fill="'+p.c+'" stroke="'+p.d+'" stroke-width="1.3"/>'+
      '<circle cx="62" cy="58" r="6" fill="'+p.c+'" stroke="'+p.d+'" stroke-width="1.3"/>'+
      '<circle cx="40" cy="30" r="12" fill="'+p.skin+'" stroke="#b88960" stroke-width="1.3"/>'+
      '<circle cx="36" cy="29" r="1.6" fill="#2a2924"/>'+
      '<circle cx="44" cy="29" r="1.6" fill="#2a2924"/>'+
      '<path d="M36 35c2 2 6 2 8 0" stroke="#b88960" stroke-width="1.2" fill="none"/>'+
      star+gear+
    '</svg>';
  }

  const MAX_ROUNDS = 5;
  const MAX_HAND = 6;
  const MAX_FRONT = 4;
  const MAX_CAP = 6;
  const PROMOTE_COST = 3;

  const $ = (id) => document.getElementById(id);
  const playScreen = $("screen-play");
  const startScreen = $("screen-start");
  const endScreen = $("screen-end");

  let uid = 1;
  let aiToken = 0;
  let toastTimer = 0;
  let G = null;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function shuffle(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = (rng() * (i + 1)) | 0;
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function makeDeck(rng) {
    const list = [];
    const add = (n, def) => { for (let i = 0; i < n; i++) list.push(Object.assign({}, def)); };
    add(4, { type: "signal",   cost: 1, units: 1 });
    add(4, { type: "upkeep",   cost: 2, units: 1 });
    add(4, { type: "infantry", cost: 2, units: 2 });
    add(4, { type: "fleet",    cost: 2, units: 2 });
    add(2, { type: "infantry", cost: 3, units: 3 });
    add(2, { type: "pilot",    cost: 3, units: 3 });
    return shuffle(list, rng).map((c) => Object.assign(c, { id: uid++, command: false }));
  }

  function makePlayer(rng) {
    return {
      deck: makeDeck(rng),
      hand: [],
      space: [],
      land: [],
      supply: 0,
      supplyCap: 1,
      catchup: false
    };
  }

  function cardPower(card, front) {
    let p = card.units;
    const t = TYPES[card.type];
    if (t && t.bonus === front) p += 2;
    if (card.command) p += 1;
    return p;
  }

  function frontPower(pl, front) {
    const cards = pl[front];
    const aura = cards.some((c) => c.command) ? 1 : 0;
    let sum = 0;
    for (const c of cards) sum += cardPower(c, front) + aura;
    return sum;
  }

  function upkeepCount(pl) {
    let n = 0;
    for (const f of ["space", "land"]) for (const c of pl[f]) if (c.type === "upkeep") n++;
    return n;
  }

  function drawCards(pl, n, markDeal) {
    const got = [];
    for (let i = 0; i < n; i++) {
      if (pl.hand.length >= MAX_HAND) break;
      if (!pl.deck.length) break;
      const c = pl.deck.pop();
      if (markDeal) c._deal = true;
      pl.hand.push(c);
      got.push(c);
    }
    return got;
  }

  function startTurn(who) {
    const pl = G[who];
    G.turn = who;
    G.busy = who === "ai";
    if (pl.supplyCap < MAX_CAP) pl.supplyCap += 1;
    pl.supply = pl.supplyCap + upkeepCount(pl) + (pl.catchup ? 1 : 0);
    pl.catchup = false;
    drawCards(pl, 1, who === "you");
  }

  function holders() {
    const out = {};
    for (const f of ["space", "land"]) {
      const y = frontPower(G.you, f);
      const a = frontPower(G.ai, f);
      out[f] = y > a ? "you" : a > y ? "ai" : "tie";
    }
    return out;
  }

  function resolveAndMaybeEnd() {
    const h = holders();
    G.held = h;
    if (h.space === "you" && h.land === "you") { endMatch("win"); return true; }
    if (h.space === "ai" && h.land === "ai") { endMatch("lose"); return true; }
    if (G.round >= MAX_ROUNDS) {
      const ys = frontPower(G.you, "space") + frontPower(G.you, "land");
      const as = frontPower(G.ai, "space") + frontPower(G.ai, "land");
      const yf = (h.space === "you" ? 1 : 0) + (h.land === "you" ? 1 : 0);
      const af = (h.space === "ai" ? 1 : 0) + (h.land === "ai" ? 1 : 0);
      if (yf > af || (yf === af && ys > as)) endMatch("win");
      else if (af > yf || (yf === af && as > ys)) endMatch("lose");
      else endMatch("draw");
      return true;
    }
    const yt = frontPower(G.you, "space") + frontPower(G.you, "land");
    const at = frontPower(G.ai, "space") + frontPower(G.ai, "land");
    if (yt < at) G.you.catchup = true;
    if (at < yt) G.ai.catchup = true;
    return false;
  }

  function endMatch(kind) {
    aiToken++;
    G.over = kind;
    G.busy = false;
    G.sel = null;
    audio[kind === "win" ? "win" : kind === "lose" ? "lose" : "draw"]();
    showScreen("end");
    renderEnd();
  }

  function showScreen(name) {
    document.body.dataset.screen = name;
    startScreen.classList.toggle("show", name === "start");
    playScreen.classList.toggle("show", name === "play");
    endScreen.classList.toggle("show", name === "end");
  }

  function newGame() {
    aiToken++;
    uid = 1;
    const rng = mulberry32((Math.random() * 0xffffffff) | 0);
    G = {
      you: makePlayer(rng),
      ai: makePlayer(rng),
      turn: "you",
      round: 1,
      busy: false,
      sel: null,
      held: { space: "tie", land: "tie" },
      over: null,
      hintStep: 0,
      playedOnce: false
    };
    drawCards(G.you, 4, true);
    drawCards(G.ai, 4, false);
    startTurn("you");
    showScreen("play");
    render();
    placeHint("Tap a card");
  }

  function canPromote(pl, card, front) {
    if (!card || card.command) return false;
    if (pl[front].some((c) => c.command)) return false;
    if (pl.supply < PROMOTE_COST) return false;
    return pl[front].includes(card);
  }

  function canMerge(pl, a, b, front) {
    if (!a || !b || a === b) return false;
    if (a.command || b.command) return false;
    if (a.type !== b.type) return false;
    if (pl[front].some((c) => c.command)) return false;
    return pl[front].includes(a) && pl[front].includes(b);
  }

  function playCard(who, card, front) {
    const pl = G[who];
    const ix = pl.hand.indexOf(card);
    if (ix < 0) return false;
    if (pl.supply < card.cost) return false;
    if (pl[front].length >= MAX_FRONT) return false;
    pl.hand.splice(ix, 1);
    pl.supply -= card.cost;
    pl[front].push(card);
    if (card.type === "signal") drawCards(pl, 1, who === "you");
    if (card.type === "upkeep" && who === "you") { /* tip only */ }
    audio.play();
    return true;
  }

  function doPromote(who, card, front) {
    const pl = G[who];
    if (!canPromote(pl, card, front)) return false;
    pl.supply -= PROMOTE_COST;
    card.command = true;
    audio.promote();
    return true;
  }

  function doMerge(who, keep, eat, front) {
    const pl = G[who];
    if (!canMerge(pl, keep, eat, front)) return false;
    const ix = pl[front].indexOf(eat);
    if (ix < 0) return false;
    pl[front].splice(ix, 1);
    keep.command = true;
    keep.units += eat.units >= 3 ? 1 : 0;
    audio.promote();
    return true;
  }

  /* ----- AI ----- */
  function aiScore(card, front) {
    let s = cardPower(card, front) * 10;
    const t = TYPES[card.type];
    if (t.bonus === front) s += 12;
    if (t.bonus && t.bonus !== front) s -= 8;
    if (card.type === "signal" && G.ai.hand.length <= 3) s += 8;
    if (card.type === "upkeep" && G.round <= 3) s += 10;
    const y = frontPower(G.you, front);
    const a = frontPower(G.ai, front);
    if (a + cardPower(card, front) > y && a <= y) s += 15;
    if (G.ai[front].length >= MAX_FRONT) s = -999;
    return s;
  }

  function chooseAI() {
    const pl = G.ai;
    const options = [];
    if (pl.supply >= PROMOTE_COST) {
      for (const f of ["space", "land"]) {
        for (const c of pl[f]) {
          if (canPromote(pl, c, f)) {
            const y = frontPower(G.you, f);
            const a = frontPower(pl, f);
            let s = 6;
            if (a <= y && a + 3 > y) s += 20;
            options.push({ kind: "promote", card: c, front: f, score: s });
          }
        }
      }
    }
    for (const c of pl.hand) {
      if (c.cost > pl.supply) continue;
      for (const f of ["space", "land"]) {
        if (pl[f].length >= MAX_FRONT) continue;
        options.push({ kind: "play", card: c, front: f, score: aiScore(c, f) });
      }
    }
    for (const f of ["space", "land"]) {
      const list = pl[f];
      for (let i = 0; i < list.length; i++) {
        for (let j = i + 1; j < list.length; j++) {
          if (canMerge(pl, list[i], list[j], f)) {
            options.push({ kind: "merge", card: list[i], other: list[j], front: f, score: 12 });
          }
        }
      }
    }
    options.sort((a, b) => b.score - a.score);
    return options[0] && options[0].score > -50 ? options[0] : null;
  }

  function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

  async function runAI() {
    const token = ++aiToken;
    G.busy = true;
    G.sel = null;
    render();
    await sleep(380);
    if (token !== aiToken) return;
    while (token === aiToken) {
      const mv = chooseAI();
      if (!mv) break;
      if (mv.kind === "play") playCard("ai", mv.card, mv.front);
      else if (mv.kind === "promote") doPromote("ai", mv.card, mv.front);
      else if (mv.kind === "merge") doMerge("ai", mv.card, mv.other, mv.front);
      render();
      await sleep(420);
    }
    if (token !== aiToken) return;
    await sleep(220);
    if (token !== aiToken) return;
    finishTurn("ai");
  }

  function finishTurn(who) {
    if (G.over) return;
    if (who === "you") {
      startTurn("ai");
      render();
      runAI();
    } else {
      if (resolveAndMaybeEnd()) { render(); return; }
      G.round += 1;
      startTurn("you");
      render();
    }
  }

  /* ----- Render ----- */
  function fitLanes() {
    document.querySelectorAll(".lane").forEach((lane) => {
      const cards = lane.querySelectorAll(".card");
      if (!cards.length) {
        lane.style.removeProperty("--lw");
        lane.style.removeProperty("--lh");
        return;
      }
      const cs = getComputedStyle(lane);
      const padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
      const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
      const gap = parseFloat(cs.columnGap || cs.gap) || 4;
      const n = cards.length;
      const innerW = Math.max(0, lane.clientWidth - padX);
      const innerH = Math.max(0, lane.clientHeight - padY);
      const maxW = (innerW - gap * (n - 1)) / n;
      const maxH = innerH;
      const landscape = window.matchMedia("(orientation: landscape) and (max-height: 500px)").matches;
      const MIN_W = landscape ? 96 : 86;
      const MIN_H = landscape ? 80 : 116;
      let w, h;
      if (landscape) {
        h = maxH;
        w = maxW;
        if (h < MIN_H && maxH >= MIN_H) h = MIN_H;
        if (w < MIN_W && maxW >= MIN_W) w = MIN_W;
      } else {
        w = Math.min(92, maxW);
        h = w * 124 / 92;
        if (h > maxH) {
          h = maxH;
          w = h * 92 / 124;
          if (w < MIN_W && maxW >= MIN_W) w = MIN_W;
          else if (w < MIN_W) w = Math.min(MIN_W, maxW);
        }
        if (h < MIN_H && maxH >= MIN_H) h = Math.min(maxH, MIN_H);
      }
      if (w > maxW) w = maxW;
      if (h > maxH) h = maxH;
      w = Math.max(landscape ? 90 : 64, Math.floor(w * 10) / 10);
      h = Math.max(landscape ? 80 : 116, Math.floor(h * 10) / 10);
      if (w > maxW) w = maxW;
      if (h > maxH) h = maxH;
      lane.style.setProperty("--lw", w + "px");
      lane.style.setProperty("--lh", h + "px");
    });
  }

  function pipsHtml(pl) {
    const extra = Math.max(0, pl.supply - pl.supplyCap);
    const filled = Math.min(pl.supply, pl.supplyCap);
    let h = ico("coins", 24);
    for (let i = 0; i < pl.supplyCap; i++) {
      h += '<i class="pip'+(i < filled ? " on" : "")+'"></i>';
    }
    for (let i = 0; i < extra; i++) h += '<i class="pip extra"></i>';
    h += '<span style="font-weight:800;font-size:14px;margin-left:2px">'+pl.supply+'</span>';
    return h;
  }

  function cardHtml(card, loc, who) {
    const t = TYPES[card.type];
    const sel = G.sel && G.sel.id === card.id ? " selected" : "";
    const cmd = card.command ? " command" : "";
    const owner = who === "you" ? " yours" : who === "ai" ? " theirs" : "";
    const afford = (loc === "hand" && who === "you" && card.cost > G.you.supply) ? " cant" : "";
    const deal = card._deal ? " deal" : "";
    const bonus = t.bonus === "land" ? '<span class="bonus-chip land"><span class="bonus land">+L</span></span>'
               : t.bonus === "space" ? '<span class="bonus-chip"><span class="bonus">+S</span></span>'
               : '';
    return '<button type="button" class="card'+owner+sel+cmd+afford+deal+'" data-id="'+card.id+'" data-loc="'+loc+'" data-type="'+card.type+'" data-cost="'+card.cost+'" data-front="'+(loc==="space"||loc==="land"?loc:"")+'" aria-label="'+t.label+'">'+
      '<div class="art">'+officerArt(card.type, card.command)+'</div>'+
      '<div class="stats">'+
        '<span class="cost">'+card.cost+'</span>'+
        bonus+
      '</div>'+
      '<div class="meta">'+
        (card.command ? '<span class="cmd-badge">'+ico("crown", 24)+'</span>' : '')+
        '<span class="type">'+ico(t.icon, 24)+'</span>'+
        '<span class="units">'+ico("users", 24)+'<span class="unit-n">'+card.units+'</span></span>'+
      '</div>'+
    '</button>';
  }

  function laneHtml(pl, front, who) {
    const cards = pl[front];
    if (!cards.length) return "";
    return cards.map((c) => cardHtml(c, front, who)).join("");
  }

  function powerHtml(front) {
    const y = frontPower(G.you, front);
    const a = frontPower(G.ai, front);
    const tot = y + a;
    const yw = tot ? Math.round((y / tot) * 100) : 50;
    const h = G.held[front];
    const flag = h === "you" ? '<span class="holder-flag" style="color:var(--you)">'+ico("flag", 24)+'</span>'
               : h === "ai" ? '<span class="holder-flag" style="color:var(--ai)">'+ico("flag", 24)+'</span>'
               : "";
    return flag+
      '<span class="ai-n">'+a+'</span>'+
      '<span class="tug" aria-hidden="true"><i class="ai" style="width:'+(100-yw)+'%"></i><i class="you" style="width:'+yw+'%"></i></span>'+
      '<span class="you-n">'+y+'</span>';
  }

  function render() {
    if (!G || G.over) {
      if (G && G.over) renderEnd();
      return;
    }
    playScreen.dataset.turn = G.turn;
    playScreen.dataset.busy = G.busy ? "1" : "0";
    playScreen.dataset.round = String(G.round);
    $("round-lab").textContent = "Round "+G.round+" / "+MAX_ROUNDS;
    $("turn-lab").textContent = G.busy ? "Rival turn" : "Your turn";
    $("ai-supply").innerHTML = pipsHtml(G.ai);
    $("you-supply").innerHTML = pipsHtml(G.you);
    $("ai-backs").innerHTML = G.ai.hand.map(() => '<i class="card-back"></i>').join("");

    $("space-ai").innerHTML = laneHtml(G.ai, "space", "ai");
    $("space-you").innerHTML = laneHtml(G.you, "space", "you");
    $("land-ai").innerHTML = laneHtml(G.ai, "land", "ai");
    $("land-you").innerHTML = laneHtml(G.you, "land", "you");
    $("space-power").innerHTML = powerHtml("space");
    $("land-power").innerHTML = powerHtml("land");

    $("hand").innerHTML = G.you.hand.map((c) => cardHtml(c, "hand", "you")).join("");
    G.you.hand.forEach((c) => { c._deal = false; });

    const sel = selectedCard();
    let showP = false;
    if (sel && G.sel && (G.sel.loc === "space" || G.sel.loc === "land") && G.turn === "you" && !G.busy) {
      showP = canPromote(G.you, sel, G.sel.loc);
    }
    $("btn-promote").classList.toggle("show", showP);
    $("btn-promote").disabled = !showP;
    $("btn-end").disabled = G.busy || G.turn !== "you";

    const canDrop = !!(sel && G.sel && G.sel.loc === "hand" && G.turn === "you" && !G.busy && G.you.supply >= sel.cost);
    $("front-space").classList.toggle("drop-ok", canDrop && G.you.space.length < MAX_FRONT);
    $("front-land").classList.toggle("drop-ok", canDrop && G.you.land.length < MAX_FRONT);

    updateHint();
    fitLanes();
    requestAnimationFrame(() => { fitLanes(); requestAnimationFrame(fitLanes); });
  }

  function renderEnd() {
    const kind = G.over;
    const banner = $("end-banner");
    banner.textContent = kind === "win" ? "You win" : kind === "lose" ? "Rival wins" : "Draw";
    banner.className = "end-banner "+kind;
    const fill = (id, front, label, icon) => {
      const y = frontPower(G.you, front);
      const a = frontPower(G.ai, front);
      const h = holders()[front];
      const who = h === "you" ? "You lead" : h === "ai" ? "Rival leads" : "Tied";
      $(id).innerHTML = '<div class="lbl">'+ico(icon, 24)+' '+label+'</div>'+
        '<div class="nums"><span style="color:var(--ai)">'+a+'</span> – <span style="color:var(--you)">'+y+'</span></div>'+
        '<div class="how">'+who+'</div>';
    };
    fill("end-space", "space", "Space", "rocket");
    fill("end-land", "land", "Land", "flag");
    const yf = (holders().space === "you" ? 1 : 0) + (holders().land === "you" ? 1 : 0);
    const af = (holders().space === "ai" ? 1 : 0) + (holders().land === "ai" ? 1 : 0);
    $("end-sub").textContent = "Fronts  You "+yf+"  Rival "+af+"  ·  Round "+G.round;
  }

  function selectedCard() {
    if (!G || !G.sel) return null;
    const loc = G.sel.loc;
    if (loc === "hand") return G.you.hand.find((c) => c.id === G.sel.id) || null;
    return G.you[loc] ? G.you[loc].find((c) => c.id === G.sel.id) || null : null;
  }

  function findCard(id) {
    for (const c of G.you.hand) if (c.id === id) return { card: c, loc: "hand" };
    for (const f of ["space", "land"]) {
      for (const c of G.you[f]) if (c.id === id) return { card: c, loc: f };
    }
    return null;
  }

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 800);
  }

  function isTouchUi() {
    return window.matchMedia("(pointer: coarse)").matches ||
      window.matchMedia("(hover: none)").matches ||
      (navigator.maxTouchPoints > 0 && window.matchMedia("(pointer: fine)").matches === false);
  }

  function placeHint(text, anchor) {
    if (isTouchUi()) { hideHint(); return; }
    const el = $("hint");
    el.textContent = text;
    let target = (anchor && $(anchor)) || $("hand");
    let mode = "above";
    if (anchor === "board" && G) {
      target = !G.you.land.length ? $("front-land") : !G.you.space.length ? $("front-space") : $("board");
      mode = "in";
    }
    const r = target.getBoundingClientRect();
    const app = $("app").getBoundingClientRect();
    const left = Math.max(8, Math.min(app.width - 180, r.left - app.left + r.width / 2 - 70));
    el.style.left = left + "px";
    if (mode === "in") {
      el.style.top = Math.max(56, r.top - app.top + r.height * 0.55) + "px";
    } else {
      el.style.top = Math.max(8, r.top - app.top - 48) + "px";
    }
    const arrowAt = Math.max(12, Math.min(80, (r.left - app.left + r.width / 2) - left));
    el.style.setProperty("--hint-arrow", arrowAt + "px");
    el.classList.add("show");
  }

  function hideHint() { $("hint").classList.remove("show"); }

  function canPlayAnything() {
    return G.you.hand.some((c) => c.cost <= G.you.supply && (G.you.space.length < MAX_FRONT || G.you.land.length < MAX_FRONT));
  }

  function updateHint() {
    if (isTouchUi()) { hideHint(); return; }
    if (!G || G.over || G.busy) { hideHint(); return; }
    if (G.hintStep === 0) placeHint("Tap a card", "hand");
    else if (G.hintStep === 1) placeHint("Tap a front", "board");
    else if (G.hintStep === 2 && G.playedOnce) {
      const empty = !G.you.space.length || !G.you.land.length;
      if (empty && canPlayAnything()) placeHint("Cover both fronts", "board");
      else if (!canPlayAnything()) placeHint("End turn", "btn-end");
      else hideHint();
    } else hideHint();
  }

  /* ----- Input ----- */
  function onCardTap(el) {
    if (G.busy || G.turn !== "you") return;
    const id = +el.getAttribute("data-id");
    const found = findCard(id);
    if (!found) return;
    const { card, loc } = found;

    if (G.sel && (G.sel.loc === "space" || G.sel.loc === "land") && (loc === "space" || loc === "land")) {
      const keep = selectedCard();
      if (keep && loc === G.sel.loc && canMerge(G.you, keep, card, loc)) {
        doMerge("you", keep, card, loc);
        G.sel = { id: keep.id, loc };
        if (G.hintStep < 3) G.hintStep = 2;
        render();
        toast("High Command");
        return;
      }
    }

    if (G.sel && G.sel.id === id) { G.sel = null; render(); return; }
    G.sel = { id, loc };
    audio.click();
    if (loc === "hand" && G.hintStep === 0) G.hintStep = 1;
    if (loc === "space" || loc === "land") {
      if (canPromote(G.you, card, loc)) toast("Promote or tap a twin");
    }
    render();
  }

  function onFrontTap(front) {
    if (G.busy || G.turn !== "you") return;
    const sel = selectedCard();
    if (!sel || !G.sel || G.sel.loc !== "hand") {
      if (!G.sel) toast("Tap a card first");
      return;
    }
    if (sel.cost > G.you.supply) { toast("Need more supply"); audio.deny(); return; }
    if (G.you[front].length >= MAX_FRONT) { toast("Front is full"); audio.deny(); return; }
    if (!playCard("you", sel, front)) return;
    G.sel = null;
    G.playedOnce = true;
    if (G.hintStep < 3) G.hintStep = 2;
    if (sel.type === "signal") toast("Draw");
    if (sel.type === "upkeep") toast("Upkeep ready");
    render();
  }

  function onPromote() {
    if (G.busy || G.turn !== "you") return;
    const sel = selectedCard();
    if (!sel || !G.sel || (G.sel.loc !== "space" && G.sel.loc !== "land")) return;
    if (!doPromote("you", sel, G.sel.loc)) { toast("Need 3 supply"); audio.deny(); return; }
    toast("High Command");
    render();
  }

  function onEnd() {
    if (G.busy || G.turn !== "you") return;
    G.sel = null;
    G.hintStep = 3;
    hideHint();
    audio.end();
    finishTurn("you");
  }

  playScreen.addEventListener("click", (e) => {
    const typeEl = e.target.closest(".type");
    const card = e.target.closest(".card");
    if (typeEl && card) {
      const t = TYPES[card.getAttribute("data-type")];
      if (t) toast(t.tip);
    }
    if (card && (card.closest("#hand") || card.closest(".lane.player"))) {
      e.stopPropagation();
      onCardTap(card);
      return;
    }
    if (e.target.closest("#btn-promote")) { onPromote(); return; }
    if (e.target.closest("#btn-end")) { onEnd(); return; }
    const front = e.target.closest(".front");
    if (front) onFrontTap(front.getAttribute("data-front"));
  });

  $("you-supply").addEventListener("click", (e) => { e.stopPropagation(); toast("Supply: play cost"); });
  $("ai-supply").addEventListener("click", (e) => { e.stopPropagation(); toast("Rival supply"); });

  $("btn-play").addEventListener("click", () => { audio.unlock(); audio.play(); newGame(); });
  $("btn-restart").addEventListener("click", () => {
    audio.unlock();
    audio.click();
    G = null;
    showScreen("start");
  });

  document.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    const scr = document.body.dataset.screen;
    if (e.key === "Enter" && scr === "start") { $("btn-play").click(); return; }
    if (e.key === "Enter" && scr === "end") { $("btn-restart").click(); return; }
    if (scr !== "play" || !G || G.busy) return;
    if (e.key === "e" || e.key === "E" || e.key === "Enter") { onEnd(); return; }
    if (e.key === "p" || e.key === "P") { onPromote(); return; }
    if (e.key === "s" || e.key === "S") { onFrontTap("space"); return; }
    if (e.key === "l" || e.key === "L") { onFrontTap("land"); return; }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 9 && G.you.hand[n - 1]) {
      const c = G.you.hand[n - 1];
      const el = $("hand").querySelector('[data-id="'+c.id+'"]');
      if (el) onCardTap(el);
    }
  });

  /* ----- Audio (unlock-after-gesture pattern from parts library space-sfx) ----- */
  const audio = (() => {
    let ctx = null, master = null, unlocked = false;
    function ensure() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.28;
        master.connect(ctx.destination);
      }
      return ctx;
    }
    async function unlock() {
      const c = ensure();
      if (!c) return;
      try { if (c.state === "suspended") await c.resume(); unlocked = true; } catch (e) {}
    }
    function beep(freq, dur, type, vol, slide) {
      if (!unlocked) return;
      const c = ensure();
      if (!c || !master) return;
      try {
        const t0 = c.currentTime;
        const o = c.createOscillator();
        const g = c.createGain();
        o.type = type || "square";
        o.frequency.setValueAtTime(freq, t0);
        if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(master);
        o.start(t0); o.stop(t0 + dur + 0.02);
      } catch (e) {}
    }
    return {
      unlock,
      click() { beep(520, 0.05, "square", 0.08); },
      play() { beep(440, 0.08, "triangle", 0.14, 880); },
      promote() { beep(392, 0.1, "triangle", 0.16, 784); setTimeout(() => beep(784, 0.14, "triangle", 0.14), 90); },
      deny() { beep(180, 0.1, "sawtooth", 0.1, 90); },
      end() { beep(330, 0.08, "square", 0.1, 220); },
      win() { beep(523, 0.12, "triangle", 0.16); setTimeout(() => beep(659, 0.12, "triangle", 0.16), 120); setTimeout(() => beep(784, 0.2, "triangle", 0.18), 240); },
      lose() { beep(330, 0.16, "sine", 0.14, 196); },
      draw() { beep(392, 0.12, "triangle", 0.12); setTimeout(() => beep(392, 0.16, "triangle", 0.1), 140); }
    };
  })();

  /* ----- Start screen chrome ----- */
  function setupStart() {
    $("title-art").innerHTML =
      '<div class="preview-card">'+cardStatic("fleet", false)+'</div>'+
      '<div class="preview-card">'+cardStatic("infantry", true)+'</div>';
    $("start-legend").innerHTML = [
      ["radio", "Signal +card"],
      ["package", "Upkeep +supply"],
      ["helmet", "Infantry +Land"],
      ["rocket", "Fleet +Space"],
      ["crown", "Promote buffs front"]
    ].map(([ic, lab]) => '<li>'+ico(ic, 24)+' '+lab+'</li>').join("");
  }

  function cardStatic(type, command) {
    const t = TYPES[type];
    return '<div class="card'+(command?" command":"")+' yours">'+
      '<div class="art">'+officerArt(type, command)+'</div>'+
      '<div class="stats">'+
        '<span class="cost">2</span>'+
        (type === "fleet" || type === "pilot" ? '<span class="bonus-chip"><span class="bonus">+S</span></span>' : '')+
        (type === "infantry" ? '<span class="bonus-chip land"><span class="bonus land">+L</span></span>' : '')+
      '</div>'+
      '<div class="meta">'+
      (command ? '<span class="cmd-badge">'+ico("crown", 24)+'</span>' : '')+
      '<span class="type">'+ico(t.icon, 24)+'</span>'+
      '<span class="units">'+ico("users", 24)+'<span class="unit-n">2</span></span></div></div>';
  }

  setupStart();
  window.addEventListener("resize", () => fitLanes());

  const params = new URLSearchParams(location.search);
  if (params.get("test") === "1") {
    window.__game = {
      state() { return G ? JSON.parse(JSON.stringify({
        turn: G.turn, round: G.round, busy: G.busy, over: G.over,
        you: slim(G.you), ai: slim(G.ai), sel: G.sel, held: G.held
      })) : null; },
      endTurn() { if (G && !G.busy && G.turn === "you") onEnd(); },
      forceWin() {
        const rng = mulberry32(1);
        if (!G) {
          G = {
            you: makePlayer(rng), ai: makePlayer(rng),
            turn: "you", round: 4, busy: false, sel: null,
            held: { space: "tie", land: "tie" }, over: null,
            hintStep: 3, playedOnce: true
          };
        }
        const off = (type, units, command) => ({ id: uid++, type: type, cost: 2, units: units, command: !!command });
        G.you.space = [off("fleet", 3, true), off("pilot", 3), off("fleet", 2)];
        G.you.land = [off("infantry", 3, true), off("infantry", 2), off("upkeep", 1)];
        G.ai.space = [off("fleet", 2), off("signal", 1)];
        G.ai.land = [off("infantry", 2)];
        G.round = 4;
        endMatch("win");
      }
    };
  }
  function slim(pl) {
    const brief = (c) => ({ id: c.id, type: c.type, cost: c.cost, units: c.units, command: !!c.command });
    return {
      supply: pl.supply, cap: pl.supplyCap,
      hand: pl.hand.map(brief),
      space: pl.space.map(brief),
      land: pl.land.map(brief),
      deck: pl.deck.length
    };
  }
})();
</script>
</body>
