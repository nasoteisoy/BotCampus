<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6efdc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Flap Flyer</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/style.css?v=1">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
} }
</script>
</head>
<body>
<div id="app"></div>

<div id="hud" class="hidden">
  <div id="count" aria-label="Apples"><span class="ap">🍎</span><b id="cn">0</b><i id="ct">/16</i></div>
  <div id="tr">
    <button id="muteBtn" class="rb" aria-label="Sound" title="Sound (M)">🔊</button>
  </div>
  <div id="modes" role="group" aria-label="Controls">
    <button class="mb" id="mCam" data-mode="cam" aria-label="Camera arms" title="Camera: flap your arms">📷</button>
    <button class="mb on" id="mKeys" data-mode="keys" aria-label="Keys or touch" title="Keys / tap">⌨️</button>
    <button class="mb hidden" id="mTilt" data-mode="tilt" aria-label="Tilt phone" title="Tilt to steer">📱</button>
  </div>
  <div id="hint" class="hidden"><span id="hFlap" class="key">␣</span><span class="arr">⬆️</span><span class="gap"></span><span id="hBank">⬅️➡️</span></div>
  <div id="edge" class="hidden">↩️</div>
  <div id="camBox" class="hidden">
    <div class="mir"><video id="camVid" playsinline muted autoplay></video><canvas id="camCv" width="320" height="240"></canvas></div>
    <span id="camSt">⏳</span>
  </div>
</div>

<div id="title">
  <img class="logo" src="icon.svg" alt="">
  <h1>Flap Flyer</h1>
  <button id="playBtn" aria-label="Play">▶️</button>
  <div class="how"><span>🍎 ×16</span><span id="howFlap"><b class="key">␣</b> 🖱️ = 🪽</span><span id="howBank"><b class="key">A</b><b class="key">D</b> = ↩️↪️</span><span>📷 = 🙆</span></div>
</div>

<div id="win" class="hidden">
  <div class="big"><span class="wa">🍎</span><span class="ws">⭐</span></div>
  <div class="wn">16/16</div>
  <div class="wt" id="wTime">⏱️ 0:00</div>
  <button id="replayBtn" aria-label="Play again">🔄</button>
</div>

<script type="module" src="js/main.js?v=1"></script>
</body>
</html>
