<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3d6b38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Seraphina Forest</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" width="640" height="360"></canvas>
    <div id="touch" aria-hidden="true">
      <div id="joy" class="joy" aria-label="move">
        <div id="joyKnob" class="joy-knob"></div>
      </div>
      <button type="button" class="tb fire" data-act="fire" aria-label="fire"></button>
    </div>
    <button type="button" id="btnPause" aria-label="pause"></button>
    <button type="button" id="btnFs" aria-label="fullscreen"></button>
  </div>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
