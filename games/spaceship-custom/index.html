<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070a1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SpaceShip Editor</title>
<link rel="icon" href="icon.svg?v=1" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="stylesheet" href="css/style.css?v=1">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js?v=1" } }
</script>
</head>
<body>
<header id="top">
  <div id="corner"><a id="backBtn" class="ob" href="../army/" title="Back" aria-label="Back"><span class="ic">⬅️</span><span class="lb">Back</span></a><span id="homeSpot" aria-hidden="true"></span></div>
  <div id="titles">
    <h1 id="title"><span id="tIc">🛸</span><span id="tVerb">Editing:</span> <b id="tName">SpaceShip 1</b></h1>
    <nav id="crumb" aria-label="You are here"><canvas id="whoFlag" width="40" height="40"></canvas><span id="crumbTxt"></span></nav>
  </div>
  <div id="hsteps"></div>
  <div id="saved" role="status" aria-live="polite">✓ Saved</div>
</header>
<div id="wrap">
  <div id="left">
    <div id="view">
      <div id="app"></div>
      <div id="viewbar">
        <button id="demoBtn" type="button" title="Demo" aria-label="Demo"><span class="vi">🎬</span><span class="vl">Demo</span></button>
        <button id="spinBtn" type="button" title="Spin" aria-label="Spin"><span class="vi">🔄</span><span class="vl">Spin</span></button>
        <button id="bgBtn" type="button" title="Ground / Space" aria-label="Ground or space"><span class="vi">🌌</span><span class="vl">Space</span></button>
      </div>
      <div id="modes" title="Works in ground battles and space battles"><span>🌍 Ground</span><span>+</span><span>🌌 Space</span><span class="drag">· 👆 drag to turn</span></div>
      <div id="dhud" class="hidden" aria-live="polite"></div>
    </div>
  </div>
  <div id="panel">
    <div id="pscroll">
      <div id="ships" role="tablist" aria-label="Your ships"></div>
      <div id="statbox" aria-label="Ship stats"></div>
      <div id="nav">
        <ol id="steps" aria-label="Steps"><li data-step="1"><i>1</i>Pick ship</li><li data-step="2"><i>2</i>Change parts</li><li data-step="3"><i>3</i>Done</li></ol>
        <div id="tabs" role="tablist" aria-label="Parts"></div>
      </div>
      <div id="pbody"></div>
    </div>
  </div>
</div>
<button id="doneBtn" type="button" title="Save and done" aria-label="Done">✅ <span>Done</span></button>
<div id="toast"></div>
<div id="tip" role="tooltip"></div>
<div id="hint" class="hidden" role="status"><span id="hintIc">👇</span> <b id="hintTxt">Tap a part tab</b></div>
<div id="renameSheet" class="hidden" role="dialog" aria-label="Rename ship"><div class="rs"><b>✏️</b><input id="renameIn" maxlength="16" autocomplete="off" enterkeyhint="done" aria-label="Ship name"><button id="renameOk" class="btn go" type="button">✅</button><button id="renameNo" class="btn" type="button">✖️</button></div></div>
<script type="module" src="js/main.js?v=1"></script>
</body>
</html>
