<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Character gallery</title>
<style>
  html, body { margin: 0; height: 100%; background: #1c2420; color: #f4f1ea; font: 18px/1.35 system-ui, Segoe UI, sans-serif; }
  #home { min-height: 100%; padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); box-sizing: border-box; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.note { margin: 0 0 16px; color: #c9d2c4; font-size: 15px; }
  button.card {
    display: block; width: 100%; text-align: left; margin: 0 0 12px; padding: 16px 16px 14px;
    border: 0; border-radius: 14px; background: #2c3a30; color: inherit; font: inherit; cursor: pointer;
  }
  button.card strong { display: block; font-size: 18px; margin-bottom: 4px; }
  button.card span { display: block; color: #c9d2c4; font-size: 15px; }
  #stage { display: none; height: 100%; }
  #stage.on { display: block; }
  #c { display: block; width: 100%; height: 100%; }
  #bar {
    position: fixed; left: 12px; right: 12px; top: calc(10px + env(safe-area-inset-top));
    display: flex; gap: 10px; align-items: center; z-index: 2;
  }
  #back {
    border: 0; border-radius: 999px; padding: 10px 14px; background: #1c1d1f; color: #fff;
    font: 600 15px/1 system-ui, Segoe UI, sans-serif;
  }
  #title {
    color: #1c2420; font-weight: 700; text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }
  #err {
    display: none; position: fixed; left: 12px; right: 12px; bottom: 12px; padding: 14px;
    background: #3a1212; color: #fff; border-radius: 12px; z-index: 3; white-space: pre-wrap;
  }
  body.viewing #home { display: none; }
  body.viewing #stage { display: block; }
</style>
</head>
<body>
<div id="home">
  <h1>Characters so far</h1>
  <p class="note">Tap one. The walk keeps looping.</p>
  <button class="card" data-view="crest"><strong>Roman soldier</strong><span>Tall crest, short sword</span></button>
  <button class="card" data-view="rank"><strong>Lower-rank Roman</strong><span>Plain helmet, short sword</span></button>
  <button class="card" data-view="germanic"><strong>Germanic fighter</strong><span>Spear and round shield</span></button>
  <button class="card" data-view="battle"><strong>Grass field battle</strong><span>Four Romans and four Germanic fighters</span></button>
</div>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="bar"><button id="back" type="button">Back</button><div id="title"></div></div>
  <div id="err" role="alert"></div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";

const VIEWS = {
  crest: {
    title: "Roman soldier",
    kind: "one",
    url: "./roman_meshy.glb",
    clip: "Armature|Casual_Walk|baselayer",
    team: "roman",
    bg: 0x9a9c9f
  },
  rank: {
    title: "Lower-rank Roman",
    kind: "one",
    url: "./roman_rank.glb",
    clip: "Armature|walking_man|baselayer",
    team: "roman",
    bg: 0x9a9c9f
  },
  germanic: {
    title: "Germanic fighter",
    kind: "one",
    url: "./germanic.glb",
    clip: "Armature|walking_man|baselayer",
    team: "germanic",
    bg: 0x9a9c9f
  },
  battle: {
    title: "Grass field",
    kind: "battle"
  }
};

const errEl = document.getElementById("err");
const titleEl = document.getElementById("title");
function showError(msg) {
  errEl.style.display = "block";
  errEl.textContent = String(msg == null ? "Unknown error" : msg);
}
window.addEventListener("error", (ev) => showError(ev.message || "Script error"));
window.addEventListener("unhandledrejection", (ev) => {
  const reason = ev.reason;
  showError(reason && reason.message ? reason.message : reason || "Load failed");
});

const canvas = document.getElementById("c");
let renderer = null;
let scene = null;
let camera = null;
let clock = null;
let raf = 0;
let running = false;
const mixers = [];
const marchers = [];

const matSilver = new THREE.MeshLambertMaterial({ color: 0xd7dde4 });
const matBronze = new THREE.MeshLambertMaterial({ color: 0xb08d4a });
const matGrip = new THREE.MeshLambertMaterial({ color: 0x5c3b22 });
const matWood = new THREE.MeshLambertMaterial({ color: 0x9a6233 });
const matRim = new THREE.MeshLambertMaterial({ color: 0x5a3418 });
const matShaft = new THREE.MeshLambertMaterial({ color: 0x6e4b2c });
const geoBlade = new THREE.BoxGeometry(8, 56, 2.2);
const geoGuard = new THREE.BoxGeometry(14, 2.4, 4.2);
const geoGrip = new THREE.BoxGeometry(3.4, 12, 3.4);
const geoPommel = new THREE.BoxGeometry(5.2, 3.4, 5.2);
const geoShaft = new THREE.CylinderGeometry(2.05, 2.25, 168, 6);
const geoTip = new THREE.ConeGeometry(3.8, 30, 6);
const geoShield = new THREE.CylinderGeometry(34, 34, 5.5, 12);
const geoRim = new THREE.CylinderGeometry(37.4, 37.4, 2.4, 12);
const geoBoss = new THREE.CylinderGeometry(8, 8, 7, 8);
const RIGHT_HANDS = ["RightHand", "mixamorigRightHand", "mixamorig:RightHand"];
const LEFT_HANDS = ["LeftHand", "mixamorigLeftHand", "mixamorig:LeftHand"];
const RIGHT_ARMS = ["RightArm", "mixamorigRightArm", "mixamorig:RightArm"];
const LEFT_ARMS = ["LeftArm", "mixamorigLeftArm", "mixamorig:LeftArm"];
const LEFT_FOREARMS = ["LeftForeArm", "mixamorigLeftForeArm", "mixamorig:LeftForeArm"];

function indexBones(root) {
  const byName = Object.create(null);
  root.traverse((obj) => {
    if (obj.name && byName[obj.name] == null) byName[obj.name] = obj;
  });
  return byName;
}
function pickBone(byName, names) {
  for (let i = 0; i < names.length; i++) if (byName[names[i]]) return byName[names[i]];
  return null;
}
function shadeWeapon(mesh) { mesh.castShadow = true; }
function makeGladius() {
  const g = new THREE.Group();
  const blade = new THREE.Mesh(geoBlade, matSilver); blade.position.y = 39;
  const guard = new THREE.Mesh(geoGuard, matBronze); guard.position.y = 9.6;
  const grip = new THREE.Mesh(geoGrip, matGrip); grip.position.y = 2;
  const pommel = new THREE.Mesh(geoPommel, matBronze); pommel.position.y = -6.4;
  g.add(pommel, grip, guard, blade);
  g.traverse((obj) => { if (obj.isMesh) shadeWeapon(obj); });
  return g;
}
function makeSpear() {
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(geoShaft, matShaft); shaft.position.y = 52;
  const tip = new THREE.Mesh(geoTip, matSilver); tip.position.y = 52 + 84 + 15;
  g.add(shaft, tip);
  g.quaternion.set(0.5468, 0, -0.5268, 0.6508);
  g.traverse((obj) => { if (obj.isMesh) shadeWeapon(obj); });
  return g;
}
function makeShield() {
  const g = new THREE.Group();
  const rim = new THREE.Mesh(geoRim, matRim);
  const disc = new THREE.Mesh(geoShield, matWood);
  const boss = new THREE.Mesh(geoBoss, matSilver); boss.position.y = 6.2;
  g.add(rim, disc, boss);
  g.quaternion.set(-0.0719, 0, 0.6406, 0.7645);
  g.position.set(-8.8, 16.5, -1);
  g.traverse((obj) => { if (obj.isMesh) shadeWeapon(obj); });
  return g;
}
function attachWeapons(model, team) {
  const byName = indexBones(model);
  const right = pickBone(byName, RIGHT_HANDS) || pickBone(byName, RIGHT_ARMS);
  if (right) {
    const weapon = team === "roman" ? makeGladius() : makeSpear();
    if (!pickBone(byName, RIGHT_HANDS)) weapon.position.y += 24;
    right.add(weapon);
  }
  if (team === "germanic") {
    const fore = pickBone(byName, LEFT_FOREARMS);
    const left = fore || pickBone(byName, LEFT_HANDS) || pickBone(byName, LEFT_ARMS);
    if (left) {
      const shield = makeShield();
      if (!fore && pickBone(byName, LEFT_HANDS)) shield.position.set(-8.8, -12, -1);
      else if (!fore) shield.position.set(-8.8, 24, -1);
      left.add(shield);
    }
  }
}

function loadGltf(url) {
  return new Promise((resolve, reject) => {
    new GLTFLoader().load(url, resolve, undefined, (err) => {
      reject(new Error("Failed to load " + url + (err && err.message ? "\n" + err.message : "")));
    });
  });
}

function fitHeight(root, target) {
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const height = Math.max(box.getSize(new THREE.Vector3()).y, 0.001);
  root.scale.multiplyScalar(target / height);
  root.updateMatrixWorld(true);
  const box2 = new THREE.Box3().setFromObject(root);
  root.position.y -= box2.min.y;
}

function playLoop(model, clips, preferred) {
  const clip = THREE.AnimationClip.findByName(clips, preferred) || clips[0] || null;
  if (!clip) {
    showError("No animation clip on this model.");
    return;
  }
  const mixer = new THREE.AnimationMixer(model);
  const action = mixer.clipAction(clip);
  action.setLoop(THREE.LoopRepeat, Infinity);
  action.clampWhenFinished = false;
  action.play();
  mixers.push(mixer);
}

function stopView() {
  running = false;
  if (raf) cancelAnimationFrame(raf);
  raf = 0;
  mixers.length = 0;
  marchers.length = 0;
  if (renderer) {
    renderer.dispose();
    renderer = null;
  }
  scene = null;
  camera = null;
}

function startRenderer(bg) {
  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setClearColor(bg, 1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  scene = new THREE.Scene();
  scene.background = new THREE.Color(bg);
  camera = new THREE.PerspectiveCamera(40, 1, 0.05, 80);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x5e6063, 1.15));
  const key = new THREE.DirectionalLight(0xffffff, 1.5);
  key.position.set(2.4, 5, 3.4);
  scene.add(key);
  clock = new THREE.Clock();
  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(h, 1);
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener("resize", resize);
  renderer._galleryResize = resize;
  renderer.render(scene, camera);
}

function frameOne(model) {
  model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const radius = 0.5 * Math.hypot(size.x, size.y, size.z);
  camera.position.set(center.x + radius * 0.9, center.y + size.y * 0.05, center.z + radius * 1.6);
  camera.lookAt(center.x, center.y, center.z);
}

async function openOne(spec) {
  startRenderer(spec.bg);
  const grid = new THREE.GridHelper(20, 20, 0x6e7073, 0x8a8c8f);
  scene.add(grid);
  const gltf = await loadGltf(spec.url);
  const model = gltf.scene;
  fitHeight(model, 1.75);
  attachWeapons(model, spec.team);
  scene.add(model);
  playLoop(model, gltf.animations || [], spec.clip);
  frameOne(model);
  console.log('GALLERY_READY one');
  const base = camera.position.clone();
  const look = new THREE.Vector3(0, 0.9, 0);
  running = true;
  let yaw = 0;
  function tick() {
    if (!running) return;
    raf = requestAnimationFrame(tick);
    const dt = Math.min(clock.getDelta(), 0.05);
    for (const m of mixers) m.update(dt);
    yaw += dt * 0.35;
    camera.position.set(Math.sin(yaw) * base.z, base.y, Math.cos(yaw) * base.z);
    camera.lookAt(look);
    renderer.render(scene, camera);
  }
  tick();
}

function grassTexture() {
  const c = document.createElement("canvas");
  c.width = 128; c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = "#3e7a34";
  g.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 700; i++) {
    g.fillStyle = Math.random() < 0.5 ? "#4c8c3c" : "#34682c";
    g.fillRect(Math.random() * 128, Math.random() * 128, 2, 4);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(18, 18);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function spawnMarcher(template, x, z, yaw, team, minX, maxX) {
  const model = SkeletonUtils.clone(template.root);
  model.position.set(x, template.root.position.y, z);
  model.rotation.y = yaw;
  attachWeapons(model, team);
  scene.add(model);
  const mixer = new THREE.AnimationMixer(model);
  const action = mixer.clipAction(template.clip);
  action.setLoop(THREE.LoopRepeat, Infinity);
  action.clampWhenFinished = false;
  action.play();
  mixers.push(mixer);
  marchers.push({ model: model, dir: team === "roman" ? 1 : -1, minX: minX, maxX: maxX, team: team });
}

async function openBattle() {
  startRenderer(0x8b97a3);
  scene.fog = new THREE.Fog(0x8b97a3, 16, 42);
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(80, 80),
    new THREE.MeshLambertMaterial({ map: grassTexture() })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
  const [romanGltf, germGltf] = await Promise.all([
    loadGltf("./roman_rank.glb"),
    loadGltf("./germanic.glb")
  ]);
  function prep(gltf, name) {
    const root = gltf.scene;
    fitHeight(root, 1.75);
    const clip = THREE.AnimationClip.findByName(gltf.animations || [], "Armature|walking_man|baselayer") || (gltf.animations || [])[0];
    if (!clip) throw new Error(name + " has no walk clip");
    return { root: root, clip: clip };
  }
  const roman = prep(romanGltf, "roman");
  const germ = prep(germGltf, "germanic");
  const lanes = [-2.55, -0.85, 0.85, 2.55];
  for (let i = 0; i < 4; i++) {
    spawnMarcher(roman, -6.2, lanes[i], Math.PI / 2, "roman", -6.2, -1.5);
    spawnMarcher(germ, 6.2, lanes[i], -Math.PI / 2, "germanic", 1.5, 6.2);
  }
  const look = new THREE.Vector3(0, 0.9, 0);
  let yaw = 0.15;
  running = true;
  console.log('GALLERY_READY battle');
  function tick() {
    if (!running) return;
    raf = requestAnimationFrame(tick);
    const dt = Math.min(clock.getDelta(), 0.05);
    for (const m of mixers) m.update(dt);
    for (const f of marchers) {
      f.model.position.x += f.dir * 1.05 * dt;
      if (f.model.position.x > f.maxX || f.model.position.x < f.minX) {
        f.dir *= -1;
        f.model.rotation.y += Math.PI;
        f.model.position.x = Math.min(f.maxX, Math.max(f.minX, f.model.position.x));
      }
    }
    yaw += dt * 0.12;
    const dist = 13.5;
    camera.position.set(Math.sin(yaw) * dist, 6.2, Math.cos(yaw) * dist);
    camera.lookAt(look);
    renderer.render(scene, camera);
  }
  tick();
}

async function openView(id) {
  const spec = VIEWS[id];
  if (!spec) return;
  errEl.style.display = "none";
  document.body.classList.add("viewing");
  titleEl.textContent = spec.title;
  stopView();
  try {
    if (spec.kind === "battle") await openBattle();
    else await openOne(spec);
  } catch (err) {
    showError(err && err.message ? err.message : err);
  }
}

function goHome() {
  stopView();
  document.body.classList.remove("viewing");
  if (location.hash) history.pushState("", document.title, location.pathname + location.search);
}

document.getElementById("back").addEventListener("click", goHome);
document.querySelectorAll("button.card").forEach((btn) => {
  btn.addEventListener("click", () => {
    const id = btn.getAttribute("data-view");
    location.hash = id;
  });
});
window.addEventListener("hashchange", () => {
  const id = location.hash.replace("#", "");
  if (VIEWS[id]) openView(id);
  else goHome();
});
if (location.hash && VIEWS[location.hash.replace("#", "")]) {
  openView(location.hash.replace("#", ""));
}
</script>
</body>
</html>
