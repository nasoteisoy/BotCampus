<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rankers vs Germanic</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #8b97a3;
    overflow: hidden;
    touch-action: manipulation;
  }
  #c { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed;
    left: 12px;
    top: calc(10px + env(safe-area-inset-top));
    color: #1c2420;
    font: 600 15px/1.3 system-ui, Segoe UI, sans-serif;
    text-shadow: 0 1px 0 rgba(255,255,255,0.35);
    pointer-events: none;
    z-index: 2;
  }
  #joystick {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    width: 148px;
    height: 148px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: rgba(28, 29, 31, 0.42);
    border: 3px solid rgba(255, 255, 255, 0.72);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    z-index: 2;
  }
  #knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 62px;
    height: 62px;
    margin-left: -31px;
    margin-top: -31px;
    border-radius: 50%;
    background: #1c1d1f;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    transform: translate(0px, 0px);
    pointer-events: none;
  }
  #err {
    display: none;
    position: fixed;
    left: 12px;
    right: 12px;
    top: calc(12px + env(safe-area-inset-top));
    padding: 16px;
    background: #3a1212;
    color: #fff;
    font: 20px/1.35 system-ui, Segoe UI, sans-serif;
    border-radius: 12px;
    z-index: 3;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">Loading fighters…</div>
<div id="joystick" role="slider" aria-label="Camera joystick" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0">
  <div id="knob"></div>
</div>
<div id="err" role="alert"></div>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";

const WALK_CLIP = "Armature|walking_man|baselayer";
const DEADZONE = 0.12;
const WALK_SPEED = 1.15;
const MEET = 1.35;
const LANES = [-2.55, -0.85, 0.85, 2.55];

const errEl = document.getElementById("err");
const hudEl = document.getElementById("hud");
function showError(msg) {
  errEl.style.display = "block";
  errEl.textContent = String(msg == null ? "Unknown error" : msg);
}
window.addEventListener("error", (ev) => showError(ev.message || "Script error"));
window.addEventListener("unhandledrejection", (ev) => {
  const reason = ev.reason;
  showError(reason && reason.message ? reason.message : reason || "Load failed");
});

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x8b97a3, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8b97a3);
scene.fog = new THREE.Fog(0x8b97a3, 16, 42);

const camera = new THREE.PerspectiveCamera(42, 1, 0.08, 80);
let camYaw = 0.15;
let camPitch = 0.92;
let camDist = 13.5;
const lookAt = new THREE.Vector3(0, 0.9, 0);

scene.add(new THREE.HemisphereLight(0xd5dde6, 0x3d6a32, 0.95));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.35);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 40;
sun.shadow.camera.left = -14;
sun.shadow.camera.right = 14;
sun.shadow.camera.top = 14;
sun.shadow.camera.bottom = -14;
scene.add(sun);

function grassTexture() {
  const c = document.createElement("canvas");
  c.width = 256;
  c.height = 256;
  const g = c.getContext("2d");
  g.fillStyle = "#3e7a34";
  g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2200; i++) {
    const n = Math.random();
    g.fillStyle = n < 0.45 ? "#4c8c3c" : n < 0.8 ? "#34682c" : "#6ea356";
    const x = Math.random() * 256;
    const y = Math.random() * 256;
    g.fillRect(x, y, 2, 4 + Math.random() * 3);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(28, 28);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshLambertMaterial({ map: grassTexture() })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const joy = document.getElementById("joystick");
const knob = document.getElementById("knob");
let activePointer = null;
let stickX = 0;
let stickY = 0;

function knobLimit() {
  const size = joy.getBoundingClientRect().width;
  return Math.max(24, size * 0.5 - 31);
}
function placeKnob(px, py) {
  knob.style.transform = "translate(" + px.toFixed(2) + "px, " + py.toFixed(2) + "px)";
}
function setStickFromClient(clientX, clientY) {
  const rect = joy.getBoundingClientRect();
  const cx = rect.left + rect.width * 0.5;
  const cy = rect.top + rect.height * 0.5;
  let dx = clientX - cx;
  let dy = clientY - cy;
  const maxR = knobLimit();
  const len = Math.hypot(dx, dy);
  if (len > maxR && len > 0) {
    dx *= maxR / len;
    dy *= maxR / len;
  }
  placeKnob(dx, dy);
  stickX = dx / maxR;
  stickY = -dy / maxR;
  const mag = Math.min(1, Math.hypot(stickX, stickY));
  joy.setAttribute("aria-valuenow", mag.toFixed(2));
}
function releaseStick() {
  activePointer = null;
  stickX = 0;
  stickY = 0;
  placeKnob(0, 0);
  joy.setAttribute("aria-valuenow", "0");
}
function onPointerDown(ev) {
  if (activePointer !== null) return;
  if (ev.pointerType === "mouse" && ev.button !== 0) return;
  activePointer = ev.pointerId;
  joy.setPointerCapture(ev.pointerId);
  setStickFromClient(ev.clientX, ev.clientY);
  ev.preventDefault();
}
function onPointerMove(ev) {
  if (ev.pointerId !== activePointer) return;
  setStickFromClient(ev.clientX, ev.clientY);
  ev.preventDefault();
}
function onPointerUp(ev) {
  if (ev.pointerId !== activePointer) return;
  releaseStick();
}
joy.addEventListener("pointerdown", onPointerDown);
joy.addEventListener("pointermove", onPointerMove);
joy.addEventListener("pointerup", onPointerUp);
joy.addEventListener("pointercancel", onPointerUp);
joy.addEventListener("contextmenu", (ev) => ev.preventDefault());

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();

function placeCamera() {
  const cp = Math.cos(camPitch);
  camera.position.set(
    lookAt.x + Math.sin(camYaw) * camDist * cp,
    lookAt.y + Math.sin(camPitch) * camDist,
    lookAt.z + Math.cos(camYaw) * camDist * cp
  );
  camera.lookAt(lookAt);
}

function loadGltf(url) {
  return new Promise((resolve, reject) => {
    new GLTFLoader().load(url, resolve, undefined, (err) => {
      let detail = "Failed to load " + url;
      if (err) {
        if (err.message) detail += "\n" + err.message;
        else if (err.type) detail += "\n" + err.type;
        else detail += "\n" + err;
      }
      reject(new Error(detail));
    });
  });
}

function prepTemplate(gltf, url) {
  const root = gltf.scene;
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const height = Math.max(size.y, 0.001);
  const target = 1.75;
  const s = target / height;
  root.scale.multiplyScalar(s);
  root.updateMatrixWorld(true);
  const box2 = new THREE.Box3().setFromObject(root);
  root.position.y -= box2.min.y;
  const clips = gltf.animations || [];
  const clip = THREE.AnimationClip.findByName(clips, WALK_CLIP) || clips[0] || null;
  if (!clip) {
    showError(url + " loaded but has no walk clip.\nClips: " + (clips.map((c) => c.name).join(", ") || "(none)") + "\nUsing a bob instead.");
  }
  return { root: root, clip: clip };
}

const fighters = [];
const _extra = new THREE.Quaternion();
const _axis = new THREE.Vector3(1, 0, 0);

// Rig units are centimeters (armature scale 0.01). Shared geos stay cheap on phones.
const matSilver = new THREE.MeshLambertMaterial({ color: 0xd7dde4 });
const matBronze = new THREE.MeshLambertMaterial({ color: 0xb08d4a });
const matGrip = new THREE.MeshLambertMaterial({ color: 0x5c3b22 });
const matWood = new THREE.MeshLambertMaterial({ color: 0x9a6233 });
const matRim = new THREE.MeshLambertMaterial({ color: 0x5a3418 });
const matShaft = new THREE.MeshLambertMaterial({ color: 0x6e4b2c });

const geoBlade = new THREE.BoxGeometry(8, 56, 2.2);
const geoGuard = new THREE.BoxGeometry(14, 2.4, 4.2);
const geoGrip = new THREE.BoxGeometry(3.4, 12, 3.4);
const geoPommel = new THREE.BoxGeometry(5.2, 3.4, 5.2);
const geoShaft = new THREE.CylinderGeometry(2.05, 2.25, 168, 6);
const geoTip = new THREE.ConeGeometry(3.8, 30, 6);
const geoShield = new THREE.CylinderGeometry(34, 34, 5.5, 12);
const geoRim = new THREE.CylinderGeometry(37.4, 37.4, 2.4, 12);
const geoBoss = new THREE.CylinderGeometry(8, 8, 7, 8);

const RIGHT_HANDS = ["RightHand", "mixamorigRightHand", "mixamorig:RightHand"];
const LEFT_HANDS = ["LeftHand", "mixamorigLeftHand", "mixamorig:LeftHand"];
const RIGHT_ARMS = ["RightArm", "mixamorigRightArm", "mixamorig:RightArm"];
const LEFT_ARMS = ["LeftArm", "mixamorigLeftArm", "mixamorig:LeftArm"];
const LEFT_FOREARMS = ["LeftForeArm", "mixamorigLeftForeArm", "mixamorig:LeftForeArm"];

function indexBones(root) {
  const byName = Object.create(null);
  root.traverse((obj) => {
    if (obj.name && byName[obj.name] == null) byName[obj.name] = obj;
  });
  return byName;
}

function pickBone(byName, names) {
  for (let i = 0; i < names.length; i++) {
    if (byName[names[i]]) return byName[names[i]];
  }
  return null;
}

function shadeWeapon(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = false;
}

function makeGladius() {
  const g = new THREE.Group();
  g.name = "gladius";
  const blade = new THREE.Mesh(geoBlade, matSilver);
  blade.position.y = 39;
  const guard = new THREE.Mesh(geoGuard, matBronze);
  guard.position.y = 9.6;
  const grip = new THREE.Mesh(geoGrip, matGrip);
  grip.position.y = 2;
  const pommel = new THREE.Mesh(geoPommel, matBronze);
  pommel.position.y = -6.4;
  g.add(pommel, grip, guard, blade);
  g.traverse((obj) => { if (obj.isMesh) shadeWeapon(obj); });
  return g;
}

function makeSpear() {
  const g = new THREE.Group();
  g.name = "spear";
  const shaft = new THREE.Mesh(geoShaft, matShaft);
  shaft.position.y = 52;
  const tip = new THREE.Mesh(geoTip, matSilver);
  tip.position.y = 52 + 84 + 15;
  g.add(shaft, tip);
  // Average grip aim: forward, through the walk, still parented to the hand.
  g.quaternion.set(0.5468, 0, -0.5268, 0.6508);
  g.traverse((obj) => { if (obj.isMesh) shadeWeapon(obj); });
  return g;
}

function makeShield() {
  const g = new THREE.Group();
  g.name = "shield";
  const rim = new THREE.Mesh(geoRim, matRim);
  const disc = new THREE.Mesh(geoShield, matWood);
  const boss = new THREE.Mesh(geoBoss, matSilver);
  boss.position.y = 6.2;
  g.add(rim, disc, boss);
  // Face normal (local +Y) sits across the forearm, toward the enemy on average.
  g.quaternion.set(-0.0719, 0, 0.6406, 0.7645);
  g.position.set(-8.8, 16.5, -1);
  g.traverse((obj) => { if (obj.isMesh) shadeWeapon(obj); });
  return g;
}

function attachWeapons(model, team) {
  const byName = indexBones(model);
  const notes = [];
  const rightHand = pickBone(byName, RIGHT_HANDS);
  const rightArm = pickBone(byName, RIGHT_ARMS);
  const right = rightHand || rightArm;
  if (right) {
    const weapon = team === "roman" ? makeGladius() : makeSpear();
    if (!rightHand) weapon.position.y += 24;
    right.add(weapon);
    notes.push((team === "roman" ? "gladius" : "spear") + "->" + right.name + (rightHand ? "" : " (end)"));
  }
  if (team === "germanic") {
    const fore = pickBone(byName, LEFT_FOREARMS);
    const leftHand = pickBone(byName, LEFT_HANDS);
    const leftArm = pickBone(byName, LEFT_ARMS);
    const left = fore || leftHand || leftArm;
    if (left) {
      const shield = makeShield();
      if (!fore && leftHand) shield.position.set(-8.8, -12, -1);
      else if (!fore) shield.position.set(-8.8, 24, -1);
      left.add(shield);
      notes.push("shield->" + left.name + (fore ? "" : " (fallback)"));
    }
  }
  return notes;
}

function spawn(template, x, z, yaw, team) {
  const model = SkeletonUtils.clone(template.root);
  model.traverse((obj) => {
    if (obj.isMesh) {
      obj.castShadow = true;
      obj.receiveShadow = true;
    }
  });
  model.position.set(x, template.root.position.y, z);
  model.rotation.y = yaw;
  scene.add(model);
  let mixer = null;
  let action = null;
  if (template.clip) {
    mixer = new THREE.AnimationMixer(model);
    action = mixer.clipAction(template.clip);
    action.setLoop(THREE.LoopRepeat, Infinity);
    action.play();
  }
  let rightArm = null;
  model.traverse((obj) => {
    if (obj.name === "RightArm") rightArm = obj;
  });
  const weapons = attachWeapons(model, team);
  fighters.push({
    model: model,
    mixer: mixer,
    action: action,
    team: team,
    state: "walk",
    dir: team === "roman" ? 1 : -1,
    baseYaw: yaw,
    swingT: 0,
    rightArm: rightArm,
    armBase: rightArm ? rightArm.quaternion.clone() : null,
    bob: Math.random() * Math.PI,
    weapons: weapons
  });
}

function beginSwing(f) {
  if (f.state !== "walk") return;
  f.state = "swing";
  f.swingT = 0;
  if (f.action) f.action.paused = true;
  if (f.rightArm) f.armBase = f.rightArm.quaternion.clone();
}

let started = false;
let fieldNoted = false;
Promise.all([
  loadGltf("./roman_rank.glb"),
  loadGltf("./germanic.glb")
]).then(([romanGltf, germGltf]) => {
  const roman = prepTemplate(romanGltf, "./roman_rank.glb");
  const germ = prepTemplate(germGltf, "./germanic.glb");
  // Romans face +X (model forward is +Z). Germanic face -X.
  for (let i = 0; i < 4; i++) {
    spawn(roman, -6.2, LANES[i], Math.PI / 2, "roman");
    spawn(germ, 6.2, LANES[i], -Math.PI / 2, "germanic");
  }
  started = true;
  hudEl.innerHTML = "4 Romans vs 4 Germanic<br>drag the stick to look around";
  console.log(fighters.map((f) => f.team + " " + f.weapons.join(", ")).join("\n"));
}).catch((err) => {
  showError(err && err.message ? err.message : err);
});

const clock = new THREE.Clock();
placeCamera();

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const mag = Math.min(1, Math.hypot(stickX, stickY));
  if (mag > DEADZONE) {
    const analog = (mag - DEADZONE) / (1 - DEADZONE);
    camYaw -= stickX * analog * dt * 1.6;
    camPitch += stickY * analog * dt * 0.7;
    camPitch = Math.max(0.12, Math.min(1.05, camPitch));
  }

  if (started) {
    const romans = fighters.filter((f) => f.team === "roman");
    const germs = fighters.filter((f) => f.team === "germanic");
    for (let i = 0; i < romans.length; i++) {
      const a = romans[i];
      const b = germs[i];
      if (a.state === "walk" && b.state === "walk" && Math.abs(a.model.position.x - b.model.position.x) <= MEET) {
        beginSwing(a);
        beginSwing(b);
      }
    }
    let walking = 0;
    let fighting = 0;
    for (const f of fighters) {
      if (f.state === "walk") {
        walking++;
        f.model.position.x += f.dir * WALK_SPEED * dt;
        if (f.mixer && f.action && !f.action.paused) f.mixer.update(dt);
        else {
          f.bob += dt * 8;
          f.model.position.y = Math.abs(Math.sin(f.bob)) * 0.06;
        }
      } else if (f.state === "swing") {
        fighting++;
        f.swingT += dt;
        const k = Math.sin(Math.min(f.swingT, 0.55) / 0.55 * Math.PI);
        f.model.rotation.y = f.baseYaw + k * 0.55 * f.dir;
        if (f.rightArm && f.armBase) {
          _extra.setFromAxisAngle(_axis, k * 1.15);
          f.rightArm.quaternion.copy(f.armBase).multiply(_extra);
        }
        if (f.swingT > 0.7) f.state = "done";
      }
    }
    if (fighting > 0 && walking === 0) {
      hudEl.innerHTML = "Clash. They swung and stopped.<br>drag the stick to look around";
    }
  }
  placeCamera();
  renderer.render(scene, camera);
  if (!fieldNoted) {
    fieldNoted = true;
    if (!started) hudEl.textContent = "Field is up, still loading fighters…";
  }
}
tick();
</script>
</body>
</html>
