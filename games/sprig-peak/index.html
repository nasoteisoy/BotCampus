<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a3040">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sprig Peak</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <div id="rotate">
    <img src="./assets/rotate.png" alt="" id="rotateIcon" width="48" height="48">
  </div>
  <div id="stage">
    <canvas id="game" width="420" height="240"></canvas>
    <div id="touch" aria-hidden="true">
      <div class="pad left">
        <button type="button" class="tb" data-act="left" aria-label="left"></button>
        <button type="button" class="tb" data-act="right" aria-label="right"></button>
      </div>
      <div class="pad right">
        <button type="button" class="tb big" data-act="jump" aria-label="jump"></button>
        <button type="button" class="tb act" data-act="action" aria-label="action"></button>
      </div>
    </div>
    <button type="button" id="btnPause" aria-label="pause"></button>
    <button type="button" id="btnFs" aria-label="fullscreen"></button>
  </div>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
