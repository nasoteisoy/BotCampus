  mv.arrowsRender=function(){let s='';const seen=new Set();

    IM.G.t.forEach((t,i)=>t.units.forEach(u=>{if(IM.al(u.o)!==IM.al(IM.ME)||u.ord<0||u.ord===i)return;const k=i+'>'+u.ord;if(seen.has(k))return;seen.add(k);
      const kind=IM.moveKind(u),x1=IM.D.cx[i],y1=IM.D.cy[i]+12,x2=IM.D.cx[u.ord],y2=IM.D.cy[u.ord]+12,col=kind==='attack'||kind==='strike'?'#ff6b5a':'#f2d58f';
      const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l,ex=x2-ux*26,ey=y2-uy*26,sx=x1+ux*26,sy=y1+uy*26,mx=(sx+ex)/2-uy*18,my=(sy+ey)/2+ux*18;
      s+=`<path d="M${sx} ${sy}Q${mx} ${my} ${ex} ${ey}" stroke="rgba(10,14,16,.8)" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M${sx} ${sy}Q${mx} ${my} ${ex} ${ey}" stroke="${col}" stroke-width="5" fill="none" stroke-linecap="round" ${kind==='attack'?'stroke-dasharray="14 9"':''}/>`
        +`<path d="M${ex+ux*10} ${ey+uy*10}L${ex-ux*8-uy*9} ${ey-uy*8+ux*9}L${ex-ux*8+uy*9} ${ey-uy*8-ux*9}Z" fill="${col}" stroke="rgba(10,14,16,.8)" stroke-width="2"/>`;}));
    arr.innerHTML=s;};
  mv.set=function(o){if('sel'in o)mv.sel=o.sel;if('hi'in o)mv.hi=o.hi||new Map();if('mark'in o)mv.mark=o.mark||new Set();mv.render();};
  // hit test from client coordinates

    const px=Math.min(CW-1,Math.floor(wx*K)),py=Math.min(CH-1,Math.floor(wy*K));let i=IDS[py*CW+px];
    if(i<0){let best=-1,bd=1e9;for(let j=LAND;j<L;j++){const d=Math.hypot(IM.D.cx[j]-wx,IM.D.cy[j]-wy);if(d<bd){bd=d;best=j;}}return best;}return i;};
  // gestures
  const P=new Map();let tap=null,pin=null;
  host.addEventListener('pointerdown',e=>{host.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(P.size===1)tap={x:e.clientX,y:e.clientY,t:performance.now(),moved:false,sx:mv.x,sy:mv.y,tg:e.target};else{tap&&(tap.moved=true);const [a,b]=[...P.values()];pin={d:Math.hypot(a.x-b.x,a.y-b.y),z:mv.z};}});
  host.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(P.size>=2&&pin){const [a,b]=[...P.values()],d=Math.hypot(a.x-b.x,a.y-b.y),r=host.getBoundingClientRect();mv.zoomAt(pin.z*d/pin.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);return;}
    if(tap&&P.size===1){const dx=e.clientX-tap.x,dy=e.clientY-tap.y;if(!tap.moved&&Math.hypot(dx,dy)>8)tap.moved=true;if(tap.moved){mv.x=tap.sx+dx;mv.y=tap.sy+dy;mv.apply();}}});
  const up=e=>{const was=P.has(e.pointerId);P.delete(e.pointerId);if(!was)return;if(P.size<2)pin=null;
    if(tap&&!tap.moved&&P.size===0&&performance.now()-tap.t<700){const ch=e.target.closest&&e.target.closest('.ctr');const i=ch?+ch.dataset.i:mv.at(e.clientX,e.clientY);
      if(i>=0&&opts.onTap)opts.onTap(i,ch?{side:ch.dataset.side}:{});}
    if(P.size===0)tap=null;else if(P.size===1){const [p]=[...P.values()];tap={x:p.x,y:p.y,t:0,moved:true,sx:mv.x,sy:mv.y};}};
  host.addEventListener('pointerup',up);host.addEventListener('pointercancel',up);
  host.addEventListener('wheel',e=>{e.preventDefault();const r=host.getBoundingClientRect();mv.zoomAt(mv.z*Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
  host.querySelectorAll('.zbtn');
  new ResizeObserver(()=>{if(!mv.z||mv.z<mv.minZ())mv.z=mv.minZ();mv.apply();}).observe(host);
  return mv;}

})();
</script><script>/* ===== shared UI helpers: glossary pop-ups, report text, toasts ===== */
const GLOSS={
 org:['ORG (Organization)','How together a battalion is. It drops when it takes losses. Under 34 it is shaken and rolls one die fewer. At 0 it retreats. It recovers 25 a turn when it is not fighting.'],

 dug:['Dug in (⛏)','A battalion that did not move last turn digs in: it hits better when defending, and it can use Ambush.'],
 officer:['Officer','Every battalion has a Lt. Colonel with 1 perk. Fighting earns XP, and XP earns more perks. A Colonel (2 perks, 🪙5) leads the whole territory; a General (3 perks, 🪙10) leads neighbours too.'],

 unknown:['Unknown force','You can tell something is there but not what. Attach Recon (🔭) to a battalion nearby to identify one.'],
 prod:['Production 🪙','Spend it to buy battalions and supports. Towns, cities and your capital give more each turn.'],
 metal:['Metal ⛓️','Needed for armor, transports, artillery. It comes from metal regions.'],
 tung:['Tungsten 💎','Needed for medium and heavy armor, anti-tank, and bombers. It comes from tungsten regions.'],
 tri:['The order triangle','Aggressive beats Maneuver. Maneuver beats Defensive. Defensive beats Aggressive. The winner hits harder and the loser takes more ORG damage.'],
 order:['Battle order','Both sides pick a secret order for each battle. Pick the one that beats what you think they will pick.'],
 battle:['Battle','When two sides stand in the same territory they fight every turn until one side leaves or is destroyed.'],

function gl(k,label){return `<span class="gl" role="button" tabindex="0" data-gl="${k}">${label||GLOSS[k][0]}</span>`;}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-gl]');document.querySelectorAll('.glpop').forEach(p=>p.remove());

function toast(t,ms=1800){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms);}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function natoHTML(t,o){return `<span class="nato" style="--c:${MapView.rgb(o)}">${MapView.sym(t)}</span>`;}
function chipsHTML(){const r=IM.avail();return IM.RESN.map((n,k)=>`<button class="chip${r[k]<=0&&k===0?' low':''}" data-gl="${['prod','metal','tung'][k]}"><b>${IM.RSI[k]} ${Math.max(0,r[k])}</b><span>${n}</span></button>`).join('');}
function reportHTML(rep){let h='<ul class="sent">';

  rep.battles.forEach(b=>{const me=b.me;const won=b.left.length===1&&b.left[0]===me,lost=!b.left.includes(me);

  rep.air.forEach(s=>h+=`<li>✈ ${s}</li>`);

// big, labeled resource line used in sheets

/* ===== shared kit: sentences about a battalion, destination info, battle-order picker, buy list ===== */
function xpWords(h){if(!h)return '';const nxt=IM.D&&[0,10,25,50,100][h.p.length];return nxt!=null&&h.p.length<5?` XP ${h.xp}/${nxt} to the next perk.`:' Top rank of perks.';}
function factsList(u,i){if(i==null)i=IM.whereIs(u);const T=IM.BT[u.t],P=IM.perksOf(u,i),out=[];

    out.push(`❤️ <b>${u.hp} of ${T.hp} ${gl('platoon','platoons')}</b> left = <b>${IM.plural(n,'company')}</b>${u.org<=33?' (one fewer because it is shaken)':''}.`);

    out.push(`🧠 ${gl('org','ORG')} <b class="${IM.orgCls(u.org)}">${u.org}</b> of ${IM.D?100+(P.has('ins')?33:0):100}: ${IM.orgWord(u.org)}.`);

  return out;}
function officerHTML(u,i){if(!IM.isBat(u))return '';const hs=[...(u.hq||[])];if(u.lc)hs.push(u.lc);if(!hs.length)return `<div class="off">🎖️ No officer. <button class="btn" data-hire style="min-height:40px;padding:4px 12px">Hire a Lt. Colonel ${IM.costTxt([1,0,0])}</button></div>`;
  return hs.map(h=>`<div class="off">🎖️ <b>${IM.RK[h.r].n} ${IM.RK[h.r].s}</b>${h.r!=='lc'?' ('+IM.RK[h.r].t+')':''}: ${h.p.map(p=>`${IM.PK[p][0]} <b>${IM.PK[p][1]}</b>, ${IM.PK[p][2]}`).join('; ')}.<span class="muted">${xpWords(h)}</span></div>`).join('');}
function supportsHTML(u){if(!IM.isBat(u))return '';const att=u.sp.map((k,x)=>`<button class="btn" data-detach="${x}" style="min-height:40px;padding:4px 10px;font-size:13px">${IM.SP[k].i} ${IM.SP[k].n} ✕<small>${IM.SP[k].t}</small></button>`).join('');

function bindUnit(root,u,after){root.querySelectorAll('[data-detach]').forEach(b=>b.onclick=()=>{IM.detach(u,+b.dataset.detach);after();});
  root.querySelectorAll('[data-attach]').forEach(b=>b.onclick=()=>{const k=b.dataset.attach;if(IM.attach(u,k))toast(IM.SP[k].n+' attached.');else toast('Cannot attach that.');after();});

function promoteHTML(u){const p=IM.promoteInfo(u);if(!p)return '';const to=IM.RK[p.to];

function foeWords(i){const v=IM.view(i);if(!v.foes.length)return v.seen?'No enemy battalions seen.':'Fog: you cannot see this territory.';
  const known=v.foes.filter(f=>f.known).map(f=>f.u),unk=v.foes.length-known.length,parts=[];
  if(known.length){const c={};known.forEach(u=>c[IM.BT[u.t].n]=(c[IM.BT[u.t].n]||0)+1);parts.push(Object.entries(c).map(([n,x])=>x+' '+n).join(', '));}
  if(unk)parts.push(`${IM.plural(unk,'unknown battalion')} ${gl('unknown','(?)')}`);return parts.join(' + ')+'.';}
function destInfo(u,j){const a=IM.al(u.o),t=IM.G.t[j];
  if(IM.isSea(j)){const air=IM.BT[u.t].air,sea=IM.BT[u.t].sea;return {j,att:false,ico:air?'✈':sea?'⛴':'⛴',label:sea?`Sail to ${IM.TERR[j].name}`:air?`Fly over ${IM.TERR[j].name}`:`Board the transport at ${IM.TERR[j].name}`,sub:sea?'Carries 1 battalion; it lands next turn.':air?'Bomb ships there.':'It sails next turn, then you land.'};}

// battle order picker: three family buttons, then the orders in that family
function suggestBO(i){const me=IM.al(IM.ME);let m=IM.hpOf(IM.bats(i,me));IM.G.t.forEach(t=>t.units.forEach(u=>{if(IM.al(u.o)===me&&u.ord===i&&IM.moveKind(u)==='attack')m+=u.hp+u.sp.length;}));

function bindBattle(root,i,after){root.querySelectorAll('[data-fam]').forEach(b=>b.onclick=()=>{const f=b.dataset.fam;const cur=IM.G.orders.bo[i];if(!cur||IM.BO[cur].f!==f)IM.G.orders.bo[i]=IM.PRI.find(k=>IM.BO[k].f===f&&!IM.boLock(k,i,IM.al(IM.ME)));after();});

function buyHTML(){const r=IM.avail();return `<div class="buylist">${IM.BUY.map(k=>{const T=IM.BT[k],n=IM.G.orders.buy[k]||0,can=IM.canPay(T.c);

function summaryLines(){const G=IM.G,L=[];const buys=Object.entries(G.orders.buy).map(([k,n])=>IM.plural(n,IM.BT[k].n)).join(', ');
  L.push(buys?`🏭 Buy ${buys} at ${IM.TERR[G.orders.at].name}.`:'🏭 Buy nothing.');
  const mvs=[];G.t.forEach((t,i)=>t.units.forEach(u=>{if(u.o===IM.ME&&IM.moveKind(u)!=='hold')mvs.push(`${IM.BT[u.t].n} from ${IM.TERR[i].name}: ${lcf(ordersTxt(u))}`);}));
  L.push(mvs.length?`➜ ${mvs.join('; ')}.`:'➜ Every battalion holds.');
  IM.plannedBattles().forEach(i=>L.push(`⚔️ At ${IM.TERR[i].name}: ${G.orders.bo[i]?IM.BO[G.orders.bo[i]].n:'no order chosen (the game will pick Defend)'}.`));return L;}
function submitTurn(done){const L=summaryLines();const d=dialog(`<h2>Send these orders?</h2><ul class="sent">${L.map(l=>`<li>${l}</li>`).join('')}</ul><div class="row"><button class="btn" id="cx">Not yet</button><button class="btn primary" id="go">Send ▸</button></div>`,{sticky:false});
  d.el.querySelector('#cx').onclick=d.close;d.el.querySelector('#go').onclick=()=>{d.close();IM.plannedBattles().forEach(i=>{if(!IM.G.orders.bo[i])IM.G.orders.bo[i]='df';});const rep=IM.endTurn();
    const r=dialog(`<h2>Turn ${rep.round} result</h2>${reportHTML(rep)}<button class="btn primary" style="width:100%" id="nt">Start turn ${IM.G.round} ▸</button>`,{sticky:true});r.el.querySelector('#nt').onclick=()=>{r.close();done(rep);};};}
</script><script>/* ===== UI B: Tap the map. No bottom menu. Tap a territory or counter and a sheet shows exactly what you can do there. ===== */
let mv,B={sel:-1,mode:'none',unit:null,from:-1};
const sheet=()=>$('#sheet');
function head(){$('#ttl').innerHTML=`Turn ${IM.G.round}<small>of ${IM.G.max} · Aldmark</small>`;$('#chips').innerHTML=chipsHTML();
  const n=IM.G.t.reduce((s,t)=>s+t.units.filter(u=>u.o===IM.ME&&IM.moveKind(u)!=='hold').length,0)+IM.buyCount();
  $('#endBtn').innerHTML=`End turn ▸<small>${n?n+' order'+(n>1?'s':''):'no orders yet'}</small>`;}
function tagOwner(i){const o=IM.G.t[i].owner,a=IM.al(o);return `<span class="tag" style="border-color:${MapView.rgb(o)}">${NAT_NAME(o)}${a==='C'&&o===IM.ME?' (you)':a==='C'?' (ally)':a==='P'?' (enemy)':''}</span>`;}
const NAT_NAME=o=>IM.NAT[o].name;
function terrHead(i){const T=IM.TERR[i],k=IM.kindOf(i),K=IM.KIND[k]||{};
  return `<h2>${T.cap?'★ ':''}${T.name}</h2><small>${tagOwner(i)} ${K.i?K.i+' '+K.n+': gives '+IM.costTxt(IM.inc(i))+' a turn':''}</small>`;}
function close(){mv.rsv=0;B.sel=-1;B.mode='none';B.unit=null;mv.set({sel:-1,hi:null});sheet().classList.remove('on');$('.banner').classList.remove('on');$('.pill').style.display='';head();}
function ensureVisible(i){requestAnimationFrame(()=>{const sh=sheet().offsetHeight,h=mv.host.clientHeight,y=mv.y+IM.D.cy[i]*mv.z+60,top=mv.y+IM.D.cy[i]*mv.z-40;
  if(y>h-sh-8){mv.y-=y-(h-sh-8);mv.apply(true);}else if(top<60&&top<0){mv.y+=60-top;mv.apply(true);}});}
function open(i){B.sel=i;B.mode='terr';B.unit=null;$('.pill').style.display='none';mv.set({sel:i,hi:null});renderSheet();ensureVisible(i);}
function unitRow(u,i){const k=IM.moveKind(u),can=IM.dests(u,i).size>0;
  const st=k==='hold'?'<span class="st">Holds</span>':`<span class="st ${k==='attack'?'atk':'go'}">${ordersTxt(u)}</span>`;
  return `<div class="urow" data-u="${u.id}"><div class="l1" data-detail>${natoHTML(u.t,u.o)}<div><b>${IM.BT[u.t].n}</b><small>${IM.isBat(u)?`${u.hp}/${IM.BT[u.t].hp} platoons · ORG ${u.org} <span class="${IM.orgCls(u.org)}">${IM.orgWord(u.org).split(':')[0]}</span>${u.sp.length?' · '+u.sp.map(s=>IM.SP[s].i).join(''):''}`:IM.BT[u.t].tag}</small></div>${st}</div>
    <div class="acts"><button class="btn" data-move ${can?'':'disabled'}>${can?'➜ Move or attack…':'Cannot move'}</button><button class="btn" data-hold>⛏ Hold</button><button class="btn" data-detail style="flex:.6">Details</button></div></div>`;}
function renderSheet(){const el=sheet(),i=B.sel;el.classList.add('on');
  if(B.mode==='terr')return renderTerr(el,i);if(B.mode==='unit')return renderUnit(el);if(B.mode==='dest')return renderDest(el);if(B.mode==='buy')return renderBuy(el);}
function shell(el,hd,bd,back){el.innerHTML=`<div class="grab"><i></i></div><div class="sh-hd">${back?`<button class="x" id="bk" aria-label="Back">◂</button>`:''}<div>${hd}</div><button class="x" id="xx" aria-label="Close">✕</button></div><div class="sh-bd">${bd}</div>`;$('#xx').onclick=close;if(back)$('#bk').onclick=back;head();}
function renderTerr(el,i){const t=IM.G.t[i],me=IM.al(IM.ME),v=IM.view(i),mine=v.mine.filter(u=>u.o===IM.ME),allyU=v.mine.filter(u=>u.o!==IM.ME);let bd='';
  const planned=IM.plannedBattles().includes(i);
  if(v.fog)bd+=`<div class="tip">🌫️ ${gl('recon','Fog')}: you cannot see this territory. Put a battalion next to it to see what is there.</div>`;
  if(v.foes.length)bd+=`<h3>${IM.al(t.owner)===me?'Enemy force here':'Defenders'}</h3><div class="tip" style="margin-top:0">🪖 ${foeWords(i)}</div>`;
  if(planned){bd+=`<h3>⚔️ ${gl('battle','Battle')} here this turn</h3>${battleFlat(i)}`;}
  if(mine.length){bd+=`<h3>Your battalions here (${mine.length})</h3>`+mine.map(u=>unitRow(u,i)).join('');}
  if(allyU.length)bd+=`<div class="muted">${IM.plural(allyU.length,'allied battalion')} from Sorvina or others here.</div>`;
  const inbound=[];IM.G.t.forEach((tt,j)=>tt.units.forEach(u=>{if(u.o===IM.ME&&u.ord===i&&j!==i)inbound.push(`${IM.BT[u.t].n} from ${IM.TERR[j].name}`);}));
  if(inbound.length)bd+=`<h3>Heading here</h3><div class="muted">${inbound.join(', ')}</div>`;
  if(t.owner===IM.ME&&(IM.kindOf(i)==='cap'||IM.kindOf(i)==='city'))bd+=`<h3>Production</h3><button class="btn primary" id="buyHere" style="width:100%">🏭 Buy battalions here<small>${IM.buyCount()?IM.buyCount()+' queued':'New units appear here at the end of the turn'}</small></button>`;
  if(!mine.length&&!v.foes.length&&!planned&&!(t.owner===IM.ME&&(IM.kindOf(i)==='cap'||IM.kindOf(i)==='city')))bd+=`<div class="muted">${IM.al(t.owner)===me?'Nothing of yours is stationed here.':'Nobody visible here.'} ${IM.TERR[i].name} borders ${IM.ADJ[i].filter(j=>!IM.isSea(j)).map(j=>IM.TERR[j].name).join(', ')}.</div>`;
  shell(el,terrHead(i),bd);
  el.querySelectorAll('.urow').forEach(r=>{const u=IM.units(i).find(x=>x.id===+r.dataset.u);
    r.querySelector('[data-move]').onclick=()=>startMove(u,i);r.querySelector('[data-hold]').onclick=()=>{IM.clearMove(u);toast(IM.BT[u.t].n+' will hold and dig in.');mv.render();renderSheet();};
    r.querySelectorAll('[data-detail]').forEach(d=>d.onclick=()=>{B.unit=u;B.mode='unit';renderSheet();});});
  if(planned)bindBattle(el,i,()=>{renderSheet();});
  const bh=$('#buyHere');if(bh)bh.onclick=()=>{IM.G.orders.at=i;B.mode='buy';renderSheet();};}
function renderUnit(el){const u=B.unit,i=IM.whereIs(u),k=IM.moveKind(u);
  const bd=`<div class="facts">${factsList(u,i).map(l=>`<div class="off">${l}</div>`).join('')}</div><h3>Officer</h3>${officerHTML(u,i)}${promoteHTML(u)}<h3>Support</h3>${supportsHTML(u)}
   <h3>Orders this turn</h3><div class="off">${ordersTxt(u)}.</div><div class="row"><button class="btn" id="hold">⛏ Hold and dig in</button><button class="btn primary" id="mvb" ${IM.dests(u,i).size?'':'disabled'}>➜ Move or attack…</button></div>`;
  shell(el,`<h2>${IM.BT[u.t].n}</h2><small>in ${IM.TERR[i].name} · ${IM.ALN(IM.al(u.o)).replace('The ','')}</small>`,bd,()=>{B.mode='terr';B.unit=null;renderSheet();});
  bindUnit(el,u,()=>{mv.render();renderSheet();});$('#hold').onclick=()=>{IM.clearMove(u);toast('Holding.');mv.render();renderSheet();};$('#mvb').onclick=()=>startMove(u,i);}
function startMove(u,i){B.unit=u;B.from=i;B.mode='dest';const d=IM.dests(u,i);
  mv.set({sel:i,hi:new Map([...d.keys()].map(j=>[j,destInfo(u,j).att?'attack':'move']))});
  const ids=[i,...d.keys()].filter(j=>!IM.isSea(j)||j===i);const h=mv.host.clientHeight;mv.showArea(ids,Math.min(h*0.45,300),true,1.5);
  renderSheet();}
function renderDest(el){const u=B.unit,i=B.from,d=IM.dests(u,i);
  $('.banner').classList.add('on');$('#bt').innerHTML=`Tap a glowing territory to send your <b>${IM.BT[u.t].n}</b> from ${IM.TERR[i].name}.`;
  const bd=[...d.keys()].map(j=>destInfo(u,j)).map(o=>`<button class="btn dest ${u.ord===o.j?'primary':''}" data-j="${o.j}"><span class="ico">${o.ico}</span><span><b>${o.label}</b><small>${o.sub}</small></span></button>`).join('');
  shell(el,`<h2>Where to?</h2><small>${IM.BT[u.t].n} · ${IM.moveKind(u)==='hold'?'now: holds':lcf(ordersTxt(u))}</small>`,bd);
  el.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>pickDest(+b.dataset.j));}
function pickDest(j){const u=B.unit,i=B.from;if(!IM.dests(u,i).has(j))return;IM.setMove(u,j);$('.banner').classList.remove('on');mv.set({hi:null});
  const k=IM.moveKind(u);toast(ordersTxt(u)+'.');
  if(k==='attack'){B.sel=j;B.mode='terr';B.unit=null;mv.set({sel:j,hi:null});renderSheet();requestAnimationFrame(()=>mv.focus(j,Math.max(mv.z,1),sheet().offsetHeight+6));}
  else{B.sel=i;B.mode='terr';B.unit=null;mv.set({sel:i,hi:null});renderSheet();}}
function renderBuy(el){const i=B.sel;const bd=`<div class="tip">New battalions appear at <b>${IM.TERR[IM.G.orders.at].name}</b> at the end of the turn. You have <b>${IM.costTxt(IM.avail())}</b> left.</div>${buyHTML()}<button class="btn primary" id="dn" style="width:100%;margin-top:10px">Done buying</button>`;
  shell(el,`<h2>Buy at ${IM.TERR[IM.G.orders.at].name}</h2><small>${gl('deploy','Where do new units appear?')}</small>`,bd,()=>{B.mode='terr';renderSheet();});
  bindBuy(el,()=>{renderSheet();mv.render();});$('#dn').onclick=()=>{B.mode='terr';renderSheet();};}
(async function(){await MapView.loadAssets();IM.newGame();
  document.body.insertAdjacentHTML('afterbegin',`<div class="app"><div class="top"><div class="ttl" id="ttl"></div><div class="chips" id="chips"></div><button class="btn primary endbtn col" id="endBtn"></button></div><div class="stage"><div id="map"></div><div class="banner"><span id="bt"></span><button class="btn" id="bc">Cancel</button></div><div class="pill">Tap a territory or a counter</div><div class="sheet" id="sheet"></div></div></div>`);
  mv=MapView.create($('#map'),{onTap:(i,o)=>{if(B.mode==='dest'){if(IM.dests(B.unit,B.from).has(i)){pickDest(i);return;}toast('Not reachable. Pick a glowing territory, or cancel.');return;}open(i);}});
  window.mv=mv;$('#bc').onclick=()=>{$('.banner').classList.remove('on');B.mode='terr';B.unit=null;mv.set({sel:B.sel,hi:null});renderSheet();};
  $('#endBtn').onclick=()=>submitTurn(()=>{close();mv.render();head();});
  mv.focus(15,.95,0,false);head();mv.render();
  $('#chips').addEventListener('click',()=>{});})();
</script></body></html>
