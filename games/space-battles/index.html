<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" href="data:,"><title>Space Battles 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;color:#fff;touch-action:none}
#c{position:fixed;inset:0}
#hud{position:fixed;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;font-weight:700;pointer-events:none;text-shadow:0 0 4px #000}
#hud .g{color:#4f8}#hud .r{color:#f55}
#msg{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:15px;pointer-events:none;text-shadow:0 0 4px #000}
.card{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,10,.75);z-index:5}
.card div{background:#112;border:1px solid #4f8;border-radius:14px;padding:22px;max-width:320px;text-align:center}
button{font-size:20px;padding:14px 28px;border-radius:10px;border:0;background:#2c6;color:#000;font-weight:700;margin-top:12px}
.hide{display:none!important}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<canvas id="c"></canvas>
<div id="hud"><span class="g" id="ps">You: 0</span><span id="tm">0s</span><span class="r" id="es">Enemy: 0</span></div>
<div id="msg">Tap one of your green systems</div>
<div class="card" id="how"><div><h2>Space Battles 3D</h2>
<p>Real-time! Systems build ships constantly.</p>
<p>Tap your <b style="color:#4f8">green</b> system, then tap a linked system to send half its ships.</p>
<p>Bigger fleet wins. Capture every <b style="color:#f55">red</b> system.</p>
<p>Drag to orbit, pinch to zoom.</p><button id="go">Play</button></div></div>
<div class="card hide" id="end"><div><h2 id="et"></h2><p id="ed"></p><button id="rs">Restart</button></div></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:false});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,500);
cam.position.set(0,14,30);
const ctl=new OrbitControls(cam,cv);ctl.enableDamping=true;ctl.enablePan=false;ctl.minDistance=12;ctl.maxDistance=80;
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.position.setLength(innerWidth<innerHeight?52:30);cam.updateProjectionMatrix();}
addEventListener('resize',rs);rs();
S.add(new THREE.AmbientLight(0xffffff,.5));
// starfield
{const g=new THREE.BufferGeometry(),p=[];for(let i=0;i<1500;i++){const v=new THREE.Vector3().randomDirection().multiplyScalar(120+Math.random()*80);p.push(v.x,v.y,v.z);}
g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));S.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.6})));}
const COL={p:0x44ff88,e:0xff5555,n:0x999999};
const POS=[[-10,-3,6],[-6,2,9],[-11,3,-1],[-4,-2,2],[-5,4,-6],[0,0,-1],[1,-4,6],[5,3,3],[4,-2,-6],[10,2,-3],[7,5,-9],[11,-3,4]];
const LN=[[0,1],[0,2],[0,3],[1,3],[1,6],[2,4],[3,4],[3,5],[3,6],[4,5],[4,8],[5,7],[5,8],[6,7],[6,11],[7,9],[7,11],[8,9],[8,10],[9,10],[9,11]];
const sphG=new THREE.SphereGeometry(1,16,12),haloT=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);})();
const shipG=new THREE.ConeGeometry(.25,.7,4);shipG.rotateX(Math.PI/2);
let sys=[],fleets=[],sel=null,t0,over=true,aiT=0,lines=[];
const ring=new THREE.Mesh(new THREE.TorusGeometry(1.8,.08,6,32),new THREE.MeshBasicMaterial({color:0xffff66}));ring.visible=false;S.add(ring);
function label(){const c=document.createElement('canvas');c.width=128;c.height=64;const t=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false}));s.scale.set(3,1.5,1);s.renderOrder=9;s.userData={c,t,last:-1};return s;}
function drawL(s){const n=Math.floor(s.ships),L=s.lab.userData;if(n===L.last&&L.o===s.own)return;L.last=n;L.o=s.own;const x=L.c.getContext('2d');x.clearRect(0,0,128,64);x.font='bold 40px sans-serif';x.textAlign='center';x.lineWidth=6;x.strokeStyle='#000';x.strokeText(n,64,46);x.fillStyle='#'+COL[s.own].toString(16).padStart(6,'0');x.fillText(n,64,46);L.t.needsUpdate=true;}
function setOwn(s,o){s.own=o;s.mesh.material.color.setHex(COL[o]);s.halo.material.color.setHex(COL[o]);}
function build(){sys.forEach(s=>{S.remove(s.mesh,s.halo,s.lab)});lines.forEach(l=>S.remove(l));fleets.forEach(f=>S.remove(f.m));sys=[];fleets=[];lines=[];
 POS.forEach((p,i)=>{const big=i===0||i===10;const m=new THREE.Mesh(sphG,new THREE.MeshBasicMaterial({color:0x999999}));const r=big?1.3:.9;m.scale.setScalar(r);m.position.set(...p);m.userData.i=i;
 const h=new THREE.Sprite(new THREE.SpriteMaterial({map:haloT,color:0x999999,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));h.scale.setScalar(r*5);h.position.copy(m.position);
 const lb=label();lb.position.copy(m.position).add(new THREE.Vector3(0,r+1.2,0));S.add(m,h,lb);
 const s={i,mesh:m,halo:h,lab:lb,own:'n',ships:5+Math.floor(Math.random()*8),rate:big?1.2:.6,nb:[]};sys.push(s);setOwn(s,'n');});
 LN.forEach(([a,b])=>{sys[a].nb.push(b);sys[b].nb.push(a);const g=new THREE.BufferGeometry().setFromPoints([sys[a].mesh.position,sys[b].mesh.position]);const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0x3355aa,transparent:true,opacity:.6}));lines.push(l);S.add(l);});
 setOwn(sys[0],'p');sys[0].ships=20;setOwn(sys[10],'e');sys[10].ships=20;sel=null;ring.visible=false;t0=performance.now();aiT=0;over=false;}
function launch(a,b){const n=Math.floor(a.ships/2);if(n<1)return;a.ships-=n;const m=new THREE.Group();const k=Math.min(6,1+Math.floor(n/5));const mat=new THREE.MeshBasicMaterial({color:COL[a.own]});
 for(let j=0;j<k;j++){const sm=new THREE.Mesh(shipG,mat);sm.position.set((Math.random()-.5)*.8,(Math.random()-.5)*.8,(Math.random()-.5)*.8);m.add(sm);}
 m.position.copy(a.mesh.position);m.lookAt(b.mesh.position);S.add(m);const d=a.mesh.position.distanceTo(b.mesh.position);fleets.push({m,a,b,n,own:a.own,t:0,dur:d/4});}
function arrive(f){const b=f.b;if(b.own===f.own)b.ships+=f.n;else{b.ships-=f.n;if(b.ships<0){b.ships=-b.ships;setOwn(b,f.own);if(sel===b&&f.own!=='p'){sel=null;ring.visible=false;}}}}
// input with generous radius: pick nearest system in screen space
const msg=document.getElementById('msg');let down=null;
cv.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
cv.addEventListener('pointerup',e=>{if(over||!down)return;if(Math.hypot(e.clientX-down[0],e.clientY-down[1])>10)return;
 let best=null,bd=Math.max(44,innerWidth*.09);const v=new THREE.Vector3();
 sys.forEach(s=>{v.copy(s.mesh.position).project(cam);const x=(v.x+1)/2*innerWidth,y=(1-v.y)/2*innerHeight,d=Math.hypot(x-e.clientX,y-e.clientY);if(d<bd){bd=d;best=s;}});
 if(!best){sel=null;ring.visible=false;msg.textContent='Tap one of your green systems';return;}
 if(sel&&sel!==best&&sel.nb.includes(best.i)){launch(sel,best);msg.textContent='Fleet launched!';return;}
 if(best.own==='p'){sel=best;ring.visible=true;ring.position.copy(best.mesh.position);msg.textContent='Now tap a linked system';}
 else msg.textContent=sel?'Not linked — pick a neighbor':'Select your green system first';});
function ai(){const mine=sys.filter(s=>s.own==='e');let best=null,sc=-1e9;
 mine.forEach(a=>a.nb.forEach(j=>{const b=sys[j];if(b.own==='e')return;const n=Math.floor(a.ships/2);const v=n-b.ships+(b.own==='p'?3:0);if(v>sc){sc=v;best=[a,b];}}));
 if(best&&sc>1)launch(best[0],best[1]);
 else{const a=mine.sort((x,y)=>y.ships-x.ships)[0];if(a&&a.ships>30){const fr=a.nb.map(j=>sys[j]).find(b=>b.own==='e');if(fr)launch(a,fr);}}}
function end(win){over=true;document.getElementById('et').textContent=win?'Victory!':'Defeat';document.getElementById('ed').textContent=(win?'The galaxy is yours in ':'You lasted ')+Math.round((performance.now()-t0)/1000)+'s';document.getElementById('end').classList.remove('hide');}
document.getElementById('go').onclick=()=>{document.getElementById('how').classList.add('hide');build();};
document.getElementById('rs').onclick=()=>{document.getElementById('end').classList.add('hide');build();};
build();over=true;
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.1,(now-last)/1000);last=now;
 if(!over){sys.forEach(s=>{if(s.own!=='n'&&s.ships<200)s.ships+=s.rate*dt;});
  for(let k=fleets.length-1;k>=0;k--){const f=fleets[k];f.t+=dt/f.dur;if(f.t>=1){arrive(f);S.remove(f.m);fleets.splice(k,1);}else f.m.position.lerpVectors(f.a.mesh.position,f.b.mesh.position,f.t);}
  aiT+=dt;if(aiT>2.5){aiT=0;ai();}
  const p=sys.filter(s=>s.own==='p').length,e=sys.filter(s=>s.own==='e').length;
  document.getElementById('ps').textContent='You: '+p;document.getElementById('es').textContent='Enemy: '+e;document.getElementById('tm').textContent=Math.round((now-t0)/1000)+'s';
  const pf=fleets.some(f=>f.own==='p'),ef=fleets.some(f=>f.own==='e');if(!e&&!ef)end(true);else if(!p&&!pf)end(false);}
 sys.forEach(drawL);ring.rotation.y+=dt;ring.lookAt(cam.position);ctl.update();R.render(S,cam);}
requestAnimationFrame(loop);
window.__sb={cam,get sys(){return sys},launch:(a,b)=>launch(sys[a],sys[b])};
</script></body></html>
