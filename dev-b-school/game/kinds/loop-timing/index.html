<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kind: Loop / timing — fixed timestep</title>
  <style>
    :root {
      --bg:#1a1428; --panel:#2a2140; --ink:#f5e9ff; --muted:#b9a8d4;
      --accent:#ff8bd1; --ok:#7dffb3; --warn:#ffd36e; --focus:#ffe566; --line:#4a3a66;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;padding:12px;background:radial-gradient(ellipse at top,#2b1f45,var(--bg));
      color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px}
    a{color:var(--accent);font-weight:600}
    a:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
    h1{margin:0;font-size:1.2rem;text-align:center}
    .tag{margin:0;color:var(--muted);font-size:.9rem;text-align:center;max-width:520px}
    .hud{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(100%,520px)}
    .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:.9rem;color:var(--muted)}
    .chip strong{color:var(--ok)}
    button{min-height:48px;min-width:48px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);
      background:var(--panel);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}
    button.primary{background:linear-gradient(180deg,#ff9ad8,#e45fb0);color:#2a1030;border-color:#ffc1e8}
    .world{width:min(100%,520px);border:3px solid var(--line);border-radius:16px;overflow:hidden;background:#120e1c}
    canvas{display:block;width:100%;height:auto;background:#1e1630}
    .legend{width:min(100%,520px);font-size:.85rem;color:var(--muted);line-height:1.45}
  </style>
</head>
<body>
  <a href="../index.html">← kinds hub</a>
  <h1>⏱️ Loop / timing</h1>
  <p class="tag">Fixed update (1/60) + accumulator. Tick count ≠ FPS when the tab lags. Silly blob bounces on ticks only.</p>
  <div class="hud" aria-live="polite">
    <span class="chip">Ticks <strong id="ticks">0</strong></span>
    <span class="chip">FPS <strong id="fps">—</strong></span>
    <span class="chip">Accum <strong id="accum">0</strong> ms</span>
    <button type="button" id="lag" class="primary">Fake lag spike</button>
    <button type="button" id="reset">Reset counters</button>
  </div>
  <div class="world"><canvas id="c" width="480" height="220" aria-label="Timing demo canvas"></canvas></div>
  <p class="legend">Watch: under lag, <strong style="color:var(--warn)">ticks</strong> keep a steady pace (capped catch-up) while <strong style="color:var(--accent)">FPS</strong> dips. Update ≠ render.</p>
<script>
(function () {
  const DT = 1 / 60;
  const MAX_STEPS = 5;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const elTicks = document.getElementById('ticks');
  const elFps = document.getElementById('fps');
  const elAccum = document.getElementById('accum');

  let accumulator = 0;
  let last = performance.now();
  let ticks = 0;
  let frames = 0;
  let fpsTimer = 0;
  let fps = 0;
  let fakeLagUntil = 0;
  let x = 40, vx = 120, bob = 0;

  document.getElementById('lag').addEventListener('click', () => {
    fakeLagUntil = performance.now() + 400;
  });
  document.getElementById('reset').addEventListener('click', () => {
    ticks = 0; frames = 0; fps = 0; accumulator = 0;
    elTicks.textContent = '0'; elFps.textContent = '—';
  });

  function update() {
    ticks++;
    x += vx * DT;
    if (x > canvas.width - 30 || x < 30) vx *= -1;
    bob = Math.sin(ticks * 0.25) * 8;
  }

  function render(alpha) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // grid
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    for (let i = 0; i < canvas.width; i += 32) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
    }
    const drawX = x + vx * DT * alpha;
    ctx.fillStyle = '#8ec5ff';
    ctx.beginPath();
    ctx.arc(drawX, 110 + bob, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff8bd1';
    ctx.font = '14px system-ui';
    ctx.fillText('tick-driven blob', drawX - 48, 110 + bob - 30);
  }

  function frame(now) {
    if (now < fakeLagUntil) {
      // busy-wait to simulate a spike (demo only)
      const end = performance.now() + 80;
      while (performance.now() < end) {}
    }
    let frameTime = (now - last) / 1000;
    last = now;
    if (frameTime > 0.25) frameTime = 0.25; // clamp spiral
    accumulator += frameTime;
    fpsTimer += frameTime;
    frames++;
    if (fpsTimer >= 0.5) {
      fps = Math.round(frames / fpsTimer);
      frames = 0; fpsTimer = 0;
      elFps.textContent = String(fps);
    }

    let steps = 0;
    while (accumulator >= DT && steps < MAX_STEPS) {
      update();
      accumulator -= DT;
      steps++;
    }
    // leftover discarded beyond max steps (catch-up cap)
    if (steps === MAX_STEPS) accumulator = 0;

    elTicks.textContent = String(ticks);
    elAccum.textContent = (accumulator * 1000).toFixed(1);
    render(accumulator / DT);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
