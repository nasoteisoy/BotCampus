<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fire Soldier</title>
<style>
  body{margin:0;background:#0a0c10;color:#f4f0e8;font-family:system-ui,sans-serif;padding:16px}
  h1{font-size:1.2rem;margin:0 0 8px}
  .hint{color:#8b93a7;font-size:.85rem;margin-bottom:16px}
  img.strip{width:100%;max-width:960px;border-radius:12px;background:#12161f;display:block}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;max-width:960px;margin-top:18px}
  .cell{background:#12161f;border-radius:10px;padding:8px;text-align:center}
  .cell img{width:100%;height:110px;object-fit:contain;image-rendering:auto}
  .cell span{display:block;font-size:.7rem;color:#8b93a7;margin-top:4px}
  a{color:#fb923c}
</style>
</head>
<body>
  <h1>Fire Soldier</h1>
  <p class="hint">8-way idle · Support PASS · <a href="lava-iso.html">Lava Knight Iso</a></p>
  <img class="strip" src="firesoldier/preview/preview_strip.png?v=1" alt="8-way preview strip"/>
  <div class="grid" id="g"></div>
<script>
const dirs=["n","ne","e","se","s","sw","w","nw"];
const g=document.getElementById("g");
for(const d of dirs){
  const c=document.createElement("div"); c.className="cell";
  c.innerHTML=`<img src="firesoldier/idle/idle_${d}.png?v=1" alt="idle ${d}"/><span>idle ${d}</span>`;
  g.appendChild(c);
}
</script>
</body>
</html>
