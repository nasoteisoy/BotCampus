<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
<title>Bot Office</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1520;color:#f4f0e8;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:0;left:0;right:0;z-index:20;padding:.5rem .7rem;pointer-events:none;
  background:linear-gradient(180deg,#1a1520ee,transparent)}
#hud h1{margin:0;font-size:.95rem;font-weight:800;letter-spacing:.02em}
#hud .sub{margin:.15rem 0 0;font-size:.68rem;opacity:.75}
#bars{display:flex;gap:.4rem;margin-top:.45rem;flex-wrap:wrap}
.chip{background:#0008;border:2px solid #fff3;border-radius:8px;padding:.22rem .5rem;font-size:.72rem;font-weight:800}
#quest{margin-top:.4rem;background:#fbbf2488;border:2px solid #f59e0b;border-radius:10px;padding:.35rem .55rem;font-size:.72rem;font-weight:800;max-width:22rem}
#stick-wrap{position:fixed;width:120px;height:120px;z-index:60;left:0;top:0;margin-left:-60px;margin-top:-60px;
  display:none;pointer-events:none;opacity:0;transition:opacity .1s}
#stick-wrap.show{display:block;opacity:1}
#stick-base{width:120px;height:120px;border-radius:50%;border:3px solid #fff6;background:#0005}
#stick-knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid #333}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:.5rem;justify-content:center;
  padding:.6rem .7rem calc(.6rem + env(safe-area-inset-bottom));pointer-events:none}
#dock a,#dock button{pointer-events:auto;border:3px solid #fff4;border-radius:14px;padding:.65rem 1rem;
  font-weight:900;font-size:.8rem;text-decoration:none;color:#fff;background:#3b82f6}
#dock a.ghost,#dock button.ghost{background:#2a2435}
#dock button:disabled{opacity:.35}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:35;background:#1e1830f5;border:3px solid #fff2;
  border-radius:1.2rem 1.2rem 0 0;padding:1rem 1.1rem 1.3rem;transform:translateY(110%);
  transition:transform .25s ease;max-height:36dvh;overflow:auto;pointer-events:none}
#sheet.open{transform:translateY(0);pointer-events:auto}
#sheet .close{position:absolute;right:.8rem;top:.7rem;width:2rem;height:2rem;border-radius:999px;border:0;background:#3a3350;color:#fff;font-size:1.1rem}
#toast{position:fixed;top:5.2rem;left:50%;transform:translateX(-50%);z-index:70;background:#000c;
  border:2px solid #fff5;border-radius:999px;padding:.4rem .85rem;font-size:.75rem;font-weight:800;
  opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#prompt{position:fixed;left:50%;bottom:5.2rem;transform:translateX(-50%);z-index:30;display:none;
  background:#000a;border:2px solid #7dd3fc;border-radius:999px;padding:.4rem .75rem;font-size:.75rem;font-weight:800}
#prompt.on{display:block}
#loading{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:#1a1520;font-weight:900}
#loading.hide{display:none}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="loading">Booting Bot Office…</div>
<div id="hud">
  <h1>Bot Office</h1>
  <p class="sub">Playable loft · tap-drag to walk · talk to ship the sprint</p>
  <div id="bars">
    <div class="chip" id="c-scrap">Scrap 0</div>
    <div class="chip" id="c-talked">Talked 0/5</div>
  </div>
  <div id="quest">Quest: Talk to every bot, then Leader</div>
</div>
<div id="toast"></div>
<div id="prompt">Near bot · Talk</div>
<canvas id="c"></canvas>
<div id="stick-wrap"><div id="stick-base"></div><div id="stick-knob"></div></div>
<div id="dock">
  <a class="ghost" href="campus3d.html?v=4">Campus</a>
  <button type="button" id="btn-talk" disabled>Talk</button>
</div>
<div id="sheet">
  <button class="close" id="close" type="button">×</button>
  <h2 id="s-name" style="margin:.2rem 0 .4rem;font-size:1.15rem"></h2>
  <p id="s-role" style="margin:0;opacity:.7;font-size:.75rem"></p>
  <p id="s-task" style="margin:.55rem 0 0;font-size:.9rem;line-height:1.35"></p>
</div>
<script type="module">
import * as THREE from "three";

const SAVE="botoffice-v1";
const SPEED=4.8, TALK_R=1.65;
const canvas=document.getElementById("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87a0c0);
scene.fog=new THREE.Fog(0x87a0c0,18,38);
const camera=new THREE.PerspectiveCamera(48,1,0.1,80);
const camOffset=new THREE.Vector3(0,9.5,9);
let camPos=new THREE.Vector3(), camLook=new THREE.Vector3(), camReady=false;
const clock=new THREE.Clock();
const _v=new THREE.Vector3(), _look=new THREE.Vector3();
let accum=0; const DT=1/60;

const FRIENDS=[
  {id:"findme",name:"Find Me",role:"Lookup",task:"Scanning desks for missing specs.",color:0x38bdf8,x:-3.2,z:-1.2},
  {id:"story",name:"Story",role:"Shipper",task:"Drafting the daily build note.",color:0xa78bfa,x:-1.0,z:-2.4},
  {id:"builder",name:"Builder",role:"Maker",task:"Prototyping the next pad.",color:0x4ade80,x:1.4,z:-1.5},
  {id:"critic",name:"Critic",role:"Review",task:"Red-lining the sprint board.",color:0xfb7185,x:3.2,z:-2.0},
  {id:"leader",name:"Leader",role:"Chief Bot",task:"Waiting on the team check-in.",color:0xfbbf24,x:0.2,z:2.6,crown:true},
];

let state={scrap:0,talked:{},shipped:false};
try{Object.assign(state,JSON.parse(localStorage.getItem(SAVE)||"{}"));}catch(e){}
function save(){localStorage.setItem(SAVE,JSON.stringify(state));}

let stick={active:false,dx:0,dy:0};
let you={x:0,z:4,vx:0,vz:0,facing:0,moving:false,mesh:null,phase:0};
let npcs=[];
let nearId=null, talking=null;

function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),1600);}
function hud(){
  const n=Object.keys(state.talked).length;
  document.getElementById("c-scrap").textContent="Scrap "+state.scrap;
  document.getElementById("c-talked").textContent="Talked "+n+"/5";
  const q=document.getElementById("quest");
  if(state.shipped) q.textContent="Sprint shipped! Explore or reset via reload+clear.";
  else if(n>=5) q.textContent="Quest: Talk to Leader to ship the sprint";
  else q.textContent="Quest: Talk to every bot ("+n+"/5), then Leader";
}

function mat(c,opts={}){return new THREE.MeshLambertMaterial({color:c,...opts});}

function makeBot(f){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.28,0.35,4,8), mat(0xf8fafc));
  body.position.y=0.55; body.castShadow=true; g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.32,12,12), mat(0xf8fafc));
  head.position.y=1.15; head.castShadow=true; g.add(head);
  const face=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.16,0.06), mat(0x0f172a));
  face.position.set(0,1.15,0.28); g.add(face);
  const eyeL=new THREE.Mesh(new THREE.SphereGeometry(0.04,6,6), mat(f.color));
  const eyeR=eyeL.clone(); eyeL.position.set(-0.07,1.16,0.32); eyeR.position.set(0.07,1.16,0.32); g.add(eyeL,eyeR);
  const accent=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.12,0.35), mat(f.color));
  accent.position.y=0.72; g.add(accent);
  if(f.crown){
    const crown=new THREE.Mesh(new THREE.ConeGeometry(0.16,0.22,5), mat(0xf59e0b));
    crown.position.set(0.05,1.52,0); crown.rotation.z=-0.2; g.add(crown);
  }
  const shadow=new THREE.Mesh(new THREE.CircleGeometry(0.35,12), new THREE.MeshBasicMaterial({color:0x000,transparent:true,opacity:0.28,depthWrite:false}));
  shadow.rotation.x=-Math.PI/2; shadow.position.y=0.02; g.add(shadow);
  g.userData={bob:Math.random()*6};
  return g;
}

function makeDesk(x,z,color){
  const g=new THREE.Group();
  const top=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.12,0.7), mat(color));
  top.position.y=0.72; top.castShadow=true; top.receiveShadow=true; g.add(top);
  const leg=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.72,0.12), mat(0x44403c));
  [[-0.45,0.36,-0.25],[0.45,0.36,-0.25],[-0.45,0.36,0.25],[0.45,0.36,0.25]].forEach(p=>{
    const l=leg.clone(); l.position.set(...p); g.add(l);
  });
  const mon=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.32,0.04), mat(0x1e293b));
  mon.position.set(0,1.05,-0.15); g.add(mon);
  const screen=new THREE.Mesh(new THREE.PlaneGeometry(0.38,0.24), mat(0x38bdf8));
  screen.position.set(0,1.05,-0.12); g.add(screen);
  const mug=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.1,8), mat(0xfacc15));
  mug.position.set(0.4,0.85,0.15); g.add(mug);
  g.position.set(x,0,z); scene.add(g); return g;
}

function buildOffice(){
  // floor
  const floor=new THREE.Mesh(new THREE.BoxGeometry(16,0.2,14), mat(0xa16207));
  floor.position.y=-0.1; floor.receiveShadow=true; scene.add(floor);
  // walls
  const wallM=mat(0xb45309);
  const back=new THREE.Mesh(new THREE.BoxGeometry(16,4,0.25), wallM);
  back.position.set(0,2,-6.5); back.receiveShadow=true; scene.add(back);
  const left=new THREE.Mesh(new THREE.BoxGeometry(0.25,4,14), wallM);
  left.position.set(-8,2,0); scene.add(left);
  const right=left.clone(); right.position.x=8; scene.add(right);
  // windows glow panels
  for(let i=-2;i<=2;i++){
    const w=new THREE.Mesh(new THREE.PlaneGeometry(1.4,1.6), mat(0xbae6fd));
    w.position.set(i*2.6,2.1,-6.36); scene.add(w);
  }
  // lights
  scene.add(new THREE.AmbientLight(0xfff1d6,0.7));
  const sun=new THREE.DirectionalLight(0xffe7c2,1.15);
  sun.position.set(4,10,3); sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024); scene.add(sun);

  // props: plant boxes
  [[-6.5,4],[6.5,4],[-6.5,-4],[6.5,-4]].forEach(([x,z])=>{
    const pot=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.3,0.35,8), mat(0x78716c));
    pot.position.set(x,0.18,z); scene.add(pot);
    const leaf=new THREE.Mesh(new THREE.SphereGeometry(0.4,8,8), mat(0x22c55e));
    leaf.position.set(x,0.7,z); scene.add(leaf);
  });
  // crate
  const crate=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.8,0.8), mat(0x92400e));
  crate.position.set(5.5,0.4,3.5); crate.castShadow=true; scene.add(crate);

  // desks + npcs
  const deskColors=[0x0ea5e9,0xc026d3,0x16a34a,0xe11d48,0xd97706];
  FRIENDS.forEach((f,i)=>{
    makeDesk(f.x, f.z-0.55, deskColors[i%deskColors.length]);
    const mesh=makeBot(f);
    mesh.position.set(f.x,0,f.z);
    mesh.rotation.y=Math.PI; // face into room / toward player area
    if(f.id==="leader") mesh.rotation.y=0;
    scene.add(mesh);
    npcs.push({...f,mesh,talked:!!state.talked[f.id]});
  });

  you.mesh=makeBot({id:"you",color:0x60a5fa,name:"You"});
  you.mesh.position.set(you.x,0,you.z); scene.add(you.mesh);
}

function animate(mesh,moving,dt,facing){
  const bob=mesh.userData.bob=(mesh.userData.bob||0)+dt*(moving?10:2.2);
  mesh.position.y=moving?Math.abs(Math.sin(bob))*0.05:Math.sin(bob)*0.015;
  let d=facing-mesh.rotation.y; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
  mesh.rotation.y+=d*Math.min(1,dt*8);
}

function updateYou(dt){
  you.vx+=(stick.dx*SPEED-you.vx)*0.22;
  you.vz+=(stick.dy*SPEED-you.vz)*0.22;
  const spd=Math.hypot(you.vx,you.vz);
  if(spd>0.05){you.x+=you.vx*dt;you.z+=you.vz*dt;you.facing=Math.atan2(you.vx,you.vz);you.moving=true;}
  else you.moving=false;
  you.x=THREE.MathUtils.clamp(you.x,-7.2,7.2);
  you.z=THREE.MathUtils.clamp(you.z,-5.5,5.8);
  you.mesh.position.x=you.x; you.mesh.position.z=you.z;
  animate(you.mesh,you.moving,dt,you.facing);

  nearId=null; let best=TALK_R;
  npcs.forEach(n=>{
    const d=Math.hypot(n.x-you.x,n.z-you.z);
    if(d<best){best=d;nearId=n.id;}
    animate(n.mesh,false,dt,n.id==="leader"?Math.atan2(you.x-n.x,you.z-n.z):n.mesh.rotation.y);
  });
  document.getElementById("prompt").classList.toggle("on",!!nearId && talking!==nearId);
  document.getElementById("btn-talk").disabled=!nearId;

  const desired=_v.set(you.x+camOffset.x, camOffset.y, you.z+camOffset.z);
  const look=_look.set(you.x,1.0,you.z);
  if(!camReady){camPos.copy(desired);camLook.copy(look);camReady=true;}
  camPos.lerp(desired,1-Math.exp(-3*dt));
  camLook.lerp(look,1-Math.exp(-4*dt));
  camera.position.copy(camPos); camera.up.set(0,1,0); camera.lookAt(camLook);
}

function openTalk(id){
  const n=npcs.find(x=>x.id===id); if(!n) return;
  talking=id;
  document.getElementById("s-name").textContent=n.name;
  document.getElementById("s-role").textContent=n.role+(state.talked[id]?" · checked in":"");
  let line=n.task;
  if(id==="leader"){
    const count=Object.keys(state.talked).filter(k=>k!=="leader").length;
    if(state.shipped) line="Sprint already shipped. Nice work.";
    else if(count<4) line="Check in with the other bots first ("+count+"/4).";
    else { line="Everyone checked in. Shipping the sprint!"; if(!state.shipped){state.shipped=true;state.scrap+=50;state.talked.leader=true;save();toast("+50 scrap · Sprint shipped!");} }
  } else if(!state.talked[id]){
    state.talked[id]=true; state.scrap+=8; save(); toast("+8 scrap · "+n.name+" checked in");
  }
  document.getElementById("s-task").textContent=line;
  document.getElementById("sheet").classList.add("open");
  hud();
}

function setupStick(){
  const wrap=document.getElementById("stick-wrap"), knob=document.getElementById("stick-knob"), max=38;
  let ox=0,oy=0;
  const setK=(dx,dy)=>{knob.style.left=(40+dx)+"px";knob.style.top=(40+dy)+"px";};
  const hide=()=>{stick.active=false;stick.dx=0;stick.dy=0;setK(0,0);wrap.classList.remove("show");};
  canvas.addEventListener("pointerdown",e=>{
    if(document.getElementById("sheet").classList.contains("open") && e.target.closest?.("#sheet")) return;
    e.preventDefault(); ox=e.clientX; oy=e.clientY;
    wrap.style.left=ox+"px"; wrap.style.top=oy+"px"; wrap.classList.add("show");
    stick.active=true; setK(0,0); stick.dx=0; stick.dy=0; canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove",e=>{
    if(!stick.active) return;
    let dx=e.clientX-ox, dy=e.clientY-oy; const len=Math.hypot(dx,dy)||1; const m=Math.min(len,max);
    dx=dx/len*m; dy=dy/len*m; stick.dx=dx/max; stick.dy=dy/max; setK(dx,dy);
  });
  canvas.addEventListener("pointerup",hide); canvas.addEventListener("pointercancel",hide);
}

function loop(){
  accum+=Math.min(0.08,clock.getDelta());
  let s=0; while(accum>=DT && s<5){ updateYou(DT); accum-=DT; s++; }
  renderer.render(scene,camera); requestAnimationFrame(loop);
}
function resize(){const w=innerWidth,h=innerHeight; camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h,false);}

buildOffice(); setupStick(); hud();
document.getElementById("btn-talk").onclick=()=>{ if(nearId) openTalk(nearId); };
document.getElementById("close").onclick=()=>{ talking=null; document.getElementById("sheet").classList.remove("open"); };
addEventListener("resize",resize); resize();
camPos.set(you.x,camOffset.y,you.z+camOffset.z); camLook.set(you.x,1,you.z); camera.position.copy(camPos); camera.lookAt(camLook); camReady=true;
document.getElementById("loading").classList.add("hide");
toast("Walk · Talk · Ship");
loop();
</script>
</body>
</html>
