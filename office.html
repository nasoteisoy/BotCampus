<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#140e0a;color:#fff7ed;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:0;left:0;right:0;z-index:20;pointer-events:none;
  padding:calc(.45rem + env(safe-area-inset-top)) .75rem .55rem;
  background:linear-gradient(180deg,#140e0af5,#140e0a00)}
#hud-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
#hud h1{margin:0;font-size:.95rem;font-weight:800}
#bars{display:flex;gap:.35rem}
.chip{background:#0009;border:1px solid #fff3;border-radius:999px;padding:.18rem .5rem;font-size:.68rem;font-weight:800}
#quest{margin-top:.35rem;background:#f59e0b;border-radius:10px;padding:.32rem .65rem;font-size:.7rem;font-weight:800;color:#1c1917;display:inline-block}
#stick-wrap{position:fixed;width:120px;height:120px;z-index:60;left:0;top:0;margin-left:-60px;margin-top:-60px;
  display:none;pointer-events:none;opacity:0;transition:opacity .12s}
#stick-wrap.show{display:block;opacity:1}
#stick-base{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff44,#0006);border:1px solid #fff5;box-shadow:0 10px 24px #0008}
#stick-knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cbd5e1);border:1px solid #fff8}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:center;
  padding:.55rem .75rem calc(.55rem + env(safe-area-inset-bottom));pointer-events:none;transition:opacity .15s,transform .15s}
#dock.hidden{opacity:0;transform:translateY(12px)}
#dock.hidden button{pointer-events:none}
#dock button{pointer-events:auto;border:0;border-radius:999px;min-width:8rem;padding:.7rem 1.3rem;font-weight:800;font-size:.88rem;
  color:#fff;background:linear-gradient(180deg,#fb923c,#ea580c);box-shadow:0 8px 20px #0007}
#dock button:disabled{opacity:.4}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#1c1410f5;border-top:1px solid #ffffff1a;
  border-radius:1.15rem 1.15rem 0 0;padding:1rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom));
  transform:translateY(110%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:42dvh;overflow:auto;pointer-events:none;backdrop-filter:blur(14px)}
#sheet.open{transform:translateY(0);pointer-events:auto}
#sheet .close{position:absolute;right:.8rem;top:.7rem;background:#44403c;border:0;color:#fff;width:2rem;height:2rem;border-radius:999px}
#sheet h2{margin:.1rem 2.2rem .3rem 0;font-size:1.1rem}
#sheet #s-role{margin:0;color:#fdba74;font-size:.72rem}
#sheet #s-task{margin:.5rem 0 0;font-size:.9rem;line-height:1.4;color:#ffedd5}
#toast{position:fixed;left:50%;bottom:calc(5.5rem + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:70;background:#000d;border:1px solid #ffffff33;border-radius:999px;padding:.4rem .85rem;font-size:.74rem;font-weight:800;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#loading{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:#140e0a;font-weight:800}
#loading.hide{display:none}
</style>

<script type="module">

import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

const SAVE="botoffice-v5", SPEED=4.4, TALK_R=1.8;
const canvas=document.getElementById("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xb8956e);
scene.fog=new THREE.FogExp2(0xb8956e,0.028);
const camera=new THREE.PerspectiveCamera(40,1,0.1,90);
const camOffset=new THREE.Vector3(2.2,11.2,10.5);
let camPos=new THREE.Vector3(), camLook=new THREE.Vector3(), camReady=false;
const clock=new THREE.Clock();
const _v=new THREE.Vector3(), _look=new THREE.Vector3();
let accum=0; const DT=1/60;

let composer, bloomPass;

const FRIENDS=[
  {id:"findme",name:"Find Me",role:"Lookup",task:"Scanning desks for missing specs.",color:0x22d3ee,accent:0x0284c7,x:-4.4,z:1.2},
  {id:"story",name:"Story",role:"Shipper",task:"Drafting the daily build note.",color:0xf472b6,accent:0xdb2777,x:-1.6,z:2.0},
  {id:"builder",name:"Builder",role:"Maker",task:"Prototyping the next pad.",color:0x4ade80,accent:0x16a34a,x:1.6,z:1.8},
  {id:"critic",name:"Critic",role:"Review",task:"Red-lining the sprint board.",color:0xc084fc,accent:0x7c3aed,x:4.5,z:1.3},
  {id:"leader",name:"Leader",role:"Chief Bot",task:"Waiting on the team check-in.",color:0xfbbf24,accent:0xf59e0b,x:2.8,z:-3.4,crown:true},
];
const DESK=[0x0ea5e9,0xf97316,0xef4444,0xa855f7,0xd97706];

let state={scrap:0,talked:{},shipped:false};
try{Object.assign(state,JSON.parse(localStorage.getItem(SAVE)||"{}"));}catch(e){}
function save(){localStorage.setItem(SAVE,JSON.stringify(state));}

let stick={active:false,dx:0,dy:0};
let you={x:0,z:4.8,vx:0,vz:0,facing:0,moving:false,mesh:null};
let npcs=[], holos=[], dust=null, nearId=null, talking=null;

function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),1600);}
function hud(){
  const n=Object.keys(state.talked).length;
  document.getElementById("c-scrap").textContent="Scrap "+state.scrap;
  document.getElementById("c-talked").textContent=n+"/5";
  const q=document.getElementById("quest");
  if(state.shipped) q.textContent="Sprint shipped";
  else if(n>=5) q.textContent="Talk to Leader to ship";
  else q.textContent="Talk to bots · "+n+"/5 then Leader";
}
function std(c,o={}){return new THREE.MeshStandardMaterial({color:c,roughness:o.roughness??0.55,metalness:o.metalness??0.06,...o});}
function canvasTex(draw,w=256,h=256){
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h; draw(cv.getContext("2d"),w,h);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function brickTex(){
  return canvasTex((g,w,h)=>{
    g.fillStyle="#9a3412"; g.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=18){
      const off=(y/18)%2?22:0;
      for(let x=-22;x<w;x+=44){
        const shade=110+((x*3+y*7)&40);
        g.fillStyle=`rgb(${shade+40},${shade-10},${shade-35})`;
        g.fillRect(x+off+1,y+1,40,15);
        g.strokeStyle="#7c2d12"; g.strokeRect(x+off,y,42,17);
      }
    }
  },512,512);
}
function woodTex(){
  return canvasTex((g,w,h)=>{
    g.fillStyle="#7c3f12"; g.fillRect(0,0,w,h);
    for(let i=0;i<60;i++){
      g.strokeStyle=`rgba(40,20,5,${0.04+Math.random()*0.1})`;
      g.lineWidth=1+Math.random()*2;
      g.beginPath(); g.moveTo(0,Math.random()*h);
      g.bezierCurveTo(w*.3,Math.random()*h,w*.7,Math.random()*h,w,Math.random()*h); g.stroke();
    }
  },512,512);
}
function holoTex(title,lines,bg,w=512,h=320){
  return canvasTex((g,W,H)=>{
    const grd=g.createLinearGradient(0,0,W,H);
    grd.addColorStop(0,bg); grd.addColorStop(1,"#0f172a");
    g.fillStyle=grd; g.globalAlpha=.95; g.fillRect(0,0,W,H); g.globalAlpha=1;
    g.strokeStyle="#ffffffcc"; g.lineWidth=8; g.strokeRect(12,12,W-24,H-24);
    g.shadowColor=bg; g.shadowBlur=18;
    g.fillStyle="#fff"; g.font="bold 38px system-ui"; g.fillText(title,32,58);
    g.shadowBlur=0; g.font="25px system-ui";
    lines.forEach((ln,i)=>{ g.fillStyle=i%2?"#e0f2fe":"#fff"; g.fillText(ln,36,108+i*38); });
  },w,h);
}
function labelTex(text){
  return canvasTex((g,w,h)=>{
    g.fillStyle="#111"; g.fillRect(0,0,w,h);
    g.fillStyle="#fff"; g.font="bold 52px system-ui"; g.textAlign="center"; g.textBaseline="middle"; g.fillText(text,w/2,h/2);
  },256,64);
}
function posterTex(text,bg){
  return canvasTex((g,w,h)=>{
    g.fillStyle=bg; g.fillRect(0,0,w,h);
    g.fillStyle="#fff"; g.font="bold 34px system-ui"; g.textAlign="center";
    text.split(" ").forEach((wrd,i)=>g.fillText(wrd,w/2,48+i*40));
  },256,160);
}

function makeBot(f){
  const root=new THREE.Group();
  const torso=new THREE.Mesh(new THREE.SphereGeometry(0.42,28,28), std(f.accent,{roughness:0.38,metalness:0.12}));
  torso.scale.set(1.08,0.92,0.95); torso.position.y=0.56; torso.castShadow=true; root.add(torso);
  const panel=new THREE.Mesh(new THREE.SphereGeometry(0.26,16,16), std(0xf8fafc,{roughness:0.3}));
  panel.position.set(0,0.52,0.2); root.add(panel);
  const head=new THREE.Group(); head.position.y=1.22;
  const hm=new THREE.Mesh(new THREE.SphereGeometry(0.48,32,32), std(0xfafafa,{roughness:0.25}));
  hm.castShadow=true; head.add(hm);
  const screen=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.28,0.07), std(0x020617,{metalness:0.4,roughness:0.35}));
  screen.position.set(0,0.02,0.4); head.add(screen);
  const eyeMat=std(f.color,{emissive:f.color,emissiveIntensity:1.35,roughness:0.2});
  const e1=new THREE.Mesh(new THREE.TorusGeometry(0.065,0.024,8,20,Math.PI), eyeMat);
  const e2=e1.clone(); e1.position.set(-0.11,0.07,0.44); e2.position.set(0.11,0.07,0.44);
  e1.rotation.z=.15; e2.rotation.z=-.15; head.add(e1,e2);
  const smile=new THREE.Mesh(new THREE.TorusGeometry(0.09,0.022,6,16,Math.PI), eyeMat);
  smile.position.set(0,-0.07,0.44); smile.rotation.z=Math.PI; head.add(smile);
  // cheek glow
  const cheek=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8), std(0xfb7185,{emissive:0xfb7185,emissiveIntensity:0.4,transparent:true,opacity:0.7}));
  cheek.position.set(0.28,-0.02,0.32); head.add(cheek);
  if(f.crown){
    const band=new THREE.Mesh(new THREE.TorusGeometry(0.24,0.055,8,20), std(0xf59e0b,{metalness:0.65,roughness:0.22,emissive:0xb45309,emissiveIntensity:0.2}));
    band.rotation.x=Math.PI/2; band.position.y=0.4; head.add(band);
    for(let i=0;i<5;i++){
      const spike=new THREE.Mesh(new THREE.ConeGeometry(0.055,0.18,6), std(0xfde68a,{metalness:0.55,roughness:0.2}));
      const a=i/5*Math.PI*2; spike.position.set(Math.cos(a)*.22,.52,Math.sin(a)*.22); head.add(spike);
    }
  }
  root.add(head);
  [[-0.48,.68],[.48,.68]].forEach(([x,y],i)=>{
    const a=new THREE.Mesh(new THREE.CapsuleGeometry(0.085,0.34,6,12), std(f.accent,{roughness:0.4}));
    a.position.set(x,y,0); a.castShadow=true; root.add(a); root.userData["arm"+i]=a;
  });
  [[-.17,.3],[.17,.3]].forEach(([x,y],i)=>{
    const l=new THREE.Mesh(new THREE.CapsuleGeometry(0.095,0.36,6,12), std(0xe2e8f0));
    l.position.set(x,y,0); l.castShadow=true; root.add(l); root.userData["leg"+i]=l;
  });
  const blob=new THREE.Mesh(new THREE.CircleGeometry(0.48,28), new THREE.MeshBasicMaterial({color:0x000,transparent:true,opacity:0.34,depthWrite:false}));
  blob.rotation.x=-Math.PI/2; blob.position.y=0.02; root.add(blob);
  // soft face light
  const pl=new THREE.PointLight(f.color,0.35,2.2); pl.position.set(0,1.3,0.6); root.add(pl);
  root.userData.head=head; root.userData.phase=Math.random()*6;
  return root;
}

function makeDesk(x,z,color,label){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.78,0.9), std(color,{roughness:0.58}));
  body.position.y=0.42; body.castShadow=true; body.receiveShadow=true; g.add(body);
  // crate ridges
  for(let i=0;i<3;i++){
    const ridge=new THREE.Mesh(new THREE.BoxGeometry(1.42,0.04,0.92), std(0x000000,{roughness:1}));
    ridge.material=std(color,{roughness:0.7}); ridge.scale.set(1,1,1);
    ridge.position.set(0,0.2+i*0.22,0); ridge.material.color.offsetHSL(0,0,-0.08); g.add(ridge);
  }
  const top=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.09,0.96), std(0xfafaf9,{roughness:0.45}));
  top.position.y=0.86; top.castShadow=true; g.add(top);
  if(label){
    const lab=new THREE.Mesh(new THREE.PlaneGeometry(0.75,0.2), new THREE.MeshBasicMaterial({map:labelTex(label)}));
    lab.position.set(0,0.48,0.47); g.add(lab);
  }
  const monStand=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.06,0.12,8), std(0x334155));
  monStand.position.set(0,0.95,-0.12); g.add(monStand);
  const mon=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.42,0.05), std(0x0f172a,{metalness:0.4}));
  mon.position.set(0,1.25,-0.14); g.add(mon);
  const scr=new THREE.Mesh(new THREE.PlaneGeometry(0.54,0.34), new THREE.MeshStandardMaterial({color:0x38bdf8,emissive:0x0284c7,emissiveIntensity:0.95,roughness:0.25}));
  scr.position.set(0,1.25,-0.11); g.add(scr);
  const kb=new THREE.Mesh(new THREE.BoxGeometry(0.48,0.04,0.2), std(0x1e293b));
  kb.position.set(0,0.92,0.18); g.add(kb);
  const mug=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.15,16), std(0xfacc15,{roughness:0.3,emissive:0xca8a04,emissiveIntensity:0.08}));
  mug.position.set(0.5,1.0,0.22); g.add(mug);
  const bolt=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.1,0.02), std(0x0f172a));
  bolt.position.set(0.5,1.05,0.31); g.add(bolt);
  const pot=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.1,0.12,12), std(0xa8a29e));
  pot.position.set(-0.52,0.94,0.18); g.add(pot);
  const plant=new THREE.Mesh(new THREE.SphereGeometry(0.16,14,14), std(0x22c55e,{roughness:0.65}));
  plant.position.set(-0.52,1.12,0.18); g.add(plant);
  g.position.set(x,0,z); scene.add(g); return g;
}

function addHolo(x,y,z,tex,sx,sy,ry){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(sx,sy), new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:0.92,side:THREE.DoubleSide,depthWrite:false}));
  m.position.set(x,y,z); m.rotation.y=ry; scene.add(m);
  // glow plate behind
  const glow=new THREE.Mesh(new THREE.PlaneGeometry(sx*1.05,sy*1.05), new THREE.MeshBasicMaterial({color:0x38bdf8,transparent:true,opacity:0.12,side:THREE.DoubleSide,depthWrite:false}));
  glow.position.copy(m.position); glow.position.z-=0.02; glow.rotation.y=ry; scene.add(glow);
  holos.push({mesh:m,baseY:y}); return m;
}

function buildOffice(){
  const wood=woodTex(); wood.wrapS=wood.wrapT=THREE.RepeatWrapping; wood.repeat.set(8,6);
  const floor=new THREE.Mesh(new THREE.BoxGeometry(22,0.3,18), new THREE.MeshStandardMaterial({map:wood,roughness:0.82}));
  floor.position.y=-0.15; floor.receiveShadow=true; scene.add(floor);

  const brick=brickTex(); brick.wrapS=brick.wrapT=THREE.RepeatWrapping; brick.repeat.set(10,3.5);
  const wallMat=new THREE.MeshStandardMaterial({map:brick,roughness:0.9});
  const back=new THREE.Mesh(new THREE.BoxGeometry(22,5.5,0.45), wallMat);
  back.position.set(0,2.6,-7.6); back.receiveShadow=true; scene.add(back);
  const right=new THREE.Mesh(new THREE.BoxGeometry(0.45,5.5,18), wallMat);
  right.position.set(10.2,2.6,0); scene.add(right);
  const left=right.clone(); left.position.x=-10.2; scene.add(left);

  // concept mural on back wall (the cool picture, in-world)
  const loader=new THREE.TextureLoader();
  loader.load("loft-ref.jpg", (tex)=>{
    tex.colorSpace=THREE.SRGBColorSpace;
    const mural=new THREE.Mesh(new THREE.PlaneGeometry(4.2,2.5), new THREE.MeshStandardMaterial({map:tex,roughness:0.65}));
    mural.position.set(-5.5,2.7,-7.32); scene.add(mural);
    const frame=new THREE.Mesh(new THREE.BoxGeometry(4.4,2.7,0.08), std(0x292524,{roughness:0.5,metalness:0.2}));
    frame.position.set(-5.5,2.7,-7.38); scene.add(frame);
  });

  // window wall
  for(let i=0;i<4;i++){
    for(let j=0;j<2;j++){
      const frame=new THREE.Mesh(new THREE.BoxGeometry(0.1,1.55,1.35), std(0x44403c,{roughness:0.6}));
      frame.position.set(9.95,1.65+j*1.75,-4.8+i*2.5); scene.add(frame);
      const glass=new THREE.Mesh(new THREE.PlaneGeometry(1.2,1.4), new THREE.MeshStandardMaterial({
        color:0xe0f2fe,emissive:0xfde68a,emissiveIntensity:0.35,transparent:true,opacity:0.82,roughness:0.1,metalness:0.1
      }));
      glass.rotation.y=-Math.PI/2; glass.position.set(9.92,1.65+j*1.75,-4.8+i*2.5); scene.add(glass);
      // light shaft
      const shaft=new THREE.Mesh(new THREE.PlaneGeometry(2.8,5.5), new THREE.MeshBasicMaterial({color:0xfff7ed,transparent:true,opacity:0.045,depthWrite:false,side:THREE.DoubleSide}));
      shaft.position.set(7.2,2.4,-4.8+i*2.5); shaft.rotation.z=-0.35; shaft.rotation.y=-0.4; scene.add(shaft);
    }
  }

  for(let i=0;i<6;i++){
    const pipe=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,20,12), std(0x78716c,{metalness:0.6,roughness:0.32}));
    pipe.rotation.z=Math.PI/2; pipe.position.set(0,5.05,-5.5+i*2); scene.add(pipe);
  }

  scene.add(new THREE.HemisphereLight(0xffe7c8,0x3f2a1a,0.65));
  const sun=new THREE.DirectionalLight(0xfff1d6,2.05);
  sun.position.set(12,16,3); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=-16; sun.shadow.camera.right=16; sun.shadow.camera.top=16; sun.shadow.camera.bottom=-16;
  sun.shadow.bias=-0.0002; scene.add(sun);
  scene.add(new THREE.PointLight(0x38bdf8,0.7,22));
  scene.children[scene.children.length-1].position.set(-4,3.2,-2);
  const pink=new THREE.PointLight(0xec4899,0.55,18); pink.position.set(2,3,-1.5); scene.add(pink);
  const warm=new THREE.PointLight(0xfdba74,0.45,14); warm.position.set(8,2.5,0); scene.add(warm);

  [["SHIP IT!","#db2777"],["GOOD JOB!","#ca8a04"],["DO EPIC","#0284c7"]].forEach((p,i)=>{
    const pl=new THREE.Mesh(new THREE.PlaneGeometry(1.15,0.72), new THREE.MeshBasicMaterial({map:posterTex(p[0],p[1])}));
    pl.position.set(-9.95, 2.6+i*0.1, -3.5+i*2.4); pl.rotation.y=Math.PI/2; scene.add(pl);
  });

  [[-8.5,5.5],[-8.5,-4],[8.8,5.2],[8.2,-5.2],[-5.5,6.2],[5.5,6]].forEach(([x,z])=>{
    const pot=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.38,0.48,14), std(0xd6d3d1,{roughness:0.7}));
    pot.position.set(x,0.24,z); pot.castShadow=true; scene.add(pot);
    const leaf=new THREE.Mesh(new THREE.SphereGeometry(0.55,16,16), std(0x15803d,{roughness:0.68}));
    leaf.position.set(x,1.05,z); leaf.castShadow=true; scene.add(leaf);
    const leaf2=leaf.clone(); leaf2.scale.set(0.7,0.7,0.7); leaf2.position.set(x+0.25,0.95,z-0.15); scene.add(leaf2);
  });

  const crate=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.05,1.1), std(0x92400e,{roughness:0.78}));
  crate.position.set(-7,0.52,4.5); crate.castShadow=true; scene.add(crate);
  const cl=new THREE.Mesh(new THREE.PlaneGeometry(1.15,0.4), new THREE.MeshBasicMaterial({map:posterTex("DO EPIC STUFF","#78350f")}));
  cl.position.set(-7,0.75,5.08); scene.add(cl);

  addHolo(-5.5,2.85,-3.5, holoTex("SPRINT BOARD",["TO DO  WIP  DONE","BUG SQUASH","NEW FEATURE","COFFEE BREAK"],"#0284c7"), 1.85, 1.25, 0.5);
  addHolo(-0.6,3.05,-4.2, holoTex("TODAY",["CODE","TEST","IMPROVE","REPEAT"],"#db2777",480,300), 1.45, 1.05, 0.12);
  addHolo(5.2,2.65,-3.2, holoTex("QUEUE",["1 OPTIMIZE","2 REFRESH","3 DEPLOY"],"#0ea5e9",400,240), 1.2, 0.85, -0.5);

  const n=280, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){ pos[i*3]=(Math.random()-.5)*18; pos[i*3+1]=.5+Math.random()*4.5; pos[i*3+2]=(Math.random()-.5)*14; }
  const geo=new THREE.BufferGeometry(); geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  dust=new THREE.Points(geo,new THREE.PointsMaterial({color:0xfff7ed,size:0.04,transparent:true,opacity:0.55,depthWrite:false}));
  scene.add(dust);

  FRIENDS.forEach((f,i)=>{
    makeDesk(f.x,f.z-0.58,DESK[i], f.crown?"LEADER":(i===1?"PLAN.":null));
    const mesh=makeBot(f); mesh.position.set(f.x,0,f.z);
    mesh.rotation.y=f.crown?Math.PI*.12:Math.PI; scene.add(mesh); npcs.push({...f,mesh});
  });
  you.mesh=makeBot({id:"you",color:0x60a5fa,accent:0x3b82f6});
  you.mesh.position.set(you.x,0,you.z); scene.add(you.mesh);
}

function animateBot(mesh,moving,dt,facing){
  const p=mesh.userData.phase=(mesh.userData.phase||0)+dt*(moving?9:2.2);
  const bob=moving?Math.abs(Math.sin(p))*0.05:Math.sin(p)*0.016;
  if(mesh.userData.head) mesh.userData.head.position.y=1.22+bob*.5;
  mesh.position.y=bob;
  const a0=mesh.userData.arm0,a1=mesh.userData.arm1,l0=mesh.userData.leg0,l1=mesh.userData.leg1;
  if(a0&&a1){a0.rotation.x=Math.sin(p)*.62*(moving?1:.12);a1.rotation.x=-Math.sin(p)*.62*(moving?1:.12);}
  if(l0&&l1){l0.rotation.x=-Math.sin(p)*.72*(moving?1:0);l1.rotation.x=Math.sin(p)*.72*(moving?1:0);}
  let d=facing-mesh.rotation.y; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
  mesh.rotation.y+=d*Math.min(1,dt*8);
}

function updateYou(dt){
  you.vx+=(stick.dx*SPEED-you.vx)*0.22; you.vz+=(stick.dy*SPEED-you.vz)*0.22;
  const spd=Math.hypot(you.vx,you.vz);
  if(spd>0.05){you.x+=you.vx*dt;you.z+=you.vz*dt;you.facing=Math.atan2(you.vx,you.vz);you.moving=true;}
  else you.moving=false;
  you.x=THREE.MathUtils.clamp(you.x,-9,9); you.z=THREE.MathUtils.clamp(you.z,-6,7);
  you.mesh.position.x=you.x; you.mesh.position.z=you.z;
  animateBot(you.mesh,you.moving,dt,you.facing);
  nearId=null; let best=TALK_R;
  npcs.forEach(n=>{
    const d=Math.hypot(n.x-you.x,n.z-you.z);
    if(d<best){best=d;nearId=n.id;}
    animateBot(n.mesh,false,dt,d<2.6?Math.atan2(you.x-n.x,you.z-n.z):n.mesh.rotation.y);
  });
  document.getElementById("btn-talk").disabled=!nearId;
  holos.forEach((h,i)=>{h.mesh.position.y=h.baseY+Math.sin(clock.elapsedTime*1.25+i)*0.06;});
  if(dust){const a=dust.geometry.attributes.position.array; for(let i=1;i<a.length;i+=3){a[i]+=dt*.08; if(a[i]>5)a[i]=.4;} dust.geometry.attributes.position.needsUpdate=true;}

  const desired=_v.set(you.x+camOffset.x,camOffset.y,you.z+camOffset.z);
  const look=_look.set(you.x+.4,1.15,you.z);
  if(!camReady){camPos.copy(desired);camLook.copy(look);camReady=true;}
  camPos.lerp(desired,1-Math.exp(-2.6*dt)); camLook.lerp(look,1-Math.exp(-3.5*dt));
  camera.position.copy(camPos); camera.up.set(0,1,0); camera.lookAt(camLook);
}

function openTalk(id){
  const n=npcs.find(x=>x.id===id); if(!n) return;
  talking=id;
  document.getElementById("s-name").textContent=n.name;
  document.getElementById("s-role").textContent=n.role+(state.talked[id]?" · checked in":"");
  let line=n.task;
  if(id==="leader"){
    const count=Object.keys(state.talked).filter(k=>k!=="leader").length;
    if(state.shipped) line="Sprint already shipped. Nice work.";
    else if(count<4) line="Check in with the other bots first ("+count+"/4).";
    else { line="Everyone checked in. Shipping the sprint!"; if(!state.shipped){state.shipped=true;state.scrap+=50;state.talked.leader=true;save();toast("+50 scrap · Sprint shipped!");} }
  } else if(!state.talked[id]){ state.talked[id]=true; state.scrap+=8; save(); toast("+8 scrap · "+n.name+" checked in"); }
  document.getElementById("s-task").textContent=line;
  document.getElementById("sheet").classList.add("open");
  document.getElementById("dock").classList.add("hidden"); hud();
}

function setupStick(){
  const wrap=document.getElementById("stick-wrap"), knob=document.getElementById("stick-knob"), max=38;
  let ox=0,oy=0;
  const setK=(dx,dy)=>{knob.style.left=(40+dx)+"px";knob.style.top=(40+dy)+"px";};
  const hide=()=>{stick.active=false;stick.dx=0;stick.dy=0;setK(0,0);wrap.classList.remove("show");};
  canvas.addEventListener("pointerdown",e=>{
    e.preventDefault(); ox=e.clientX; oy=e.clientY;
    wrap.style.left=ox+"px"; wrap.style.top=oy+"px"; wrap.classList.add("show");
    stick.active=true; setK(0,0); stick.dx=0; stick.dy=0; canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove",e=>{
    if(!stick.active) return;
    let dx=e.clientX-ox, dy=e.clientY-oy; const len=Math.hypot(dx,dy)||1; const m=Math.min(len,max);
    dx=dx/len*m; dy=dy/len*m; stick.dx=dx/max; stick.dy=dy/max; setK(dx,dy);
  });
  canvas.addEventListener("pointerup",hide); canvas.addEventListener("pointercancel",hide);
}

function resize(){
  const w=innerWidth,h=innerHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h,false);
  if(composer){ composer.setSize(w,h); bloomPass.setSize(w,h); }
}

function loop(){
  accum+=Math.min(0.08,clock.getDelta());
  let s=0; while(accum>=DT&&s<5){updateYou(DT);accum-=DT;s++;}
  if(composer) composer.render(); else renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

buildOffice(); setupStick(); hud();
composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.45,0.55,0.82);
composer.addPass(bloomPass);

document.getElementById("btn-talk").onclick=()=>{if(nearId) openTalk(nearId);};
document.getElementById("close").onclick=()=>{
  talking=null; document.getElementById("sheet").classList.remove("open");
  document.getElementById("dock").classList.remove("hidden");
};
addEventListener("resize",resize); resize();
camPos.set(you.x+camOffset.x,camOffset.y,you.z+camOffset.z); camLook.set(you.x,1.15,you.z);
camera.position.copy(camPos); camera.lookAt(camLook); camReady=true;
document.getElementById("loading").classList.add("hide");
toast("Welcome to the loft");
loop();
</script>
