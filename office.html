<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
<title>Bot Office — Overseer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#140e0a;color:#fff7ed;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:0;left:0;right:0;z-index:20;pointer-events:none;
  padding:calc(.4rem + env(safe-area-inset-top)) .7rem .5rem;
  background:linear-gradient(180deg,#140e0af5,#140e0a00)}
#hud-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem}
#hud h1{margin:0;font-size:.92rem;font-weight:800}
#hud .sub{margin:.1rem 0 0;font-size:.65rem;color:#fdba74}
#bars{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}
.chip{background:#0009;border:1px solid #fff3;border-radius:999px;padding:.16rem .48rem;font-size:.66rem;font-weight:800}
#quest{margin-top:.35rem;display:inline-block;background:#f59e0b;border-radius:10px;padding:.3rem .6rem;font-size:.68rem;font-weight:800;color:#1c1917}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;
  padding:.5rem .6rem calc(.5rem + env(safe-area-inset-bottom));pointer-events:none}
#dock button{pointer-events:auto;border:0;border-radius:999px;padding:.55rem .85rem;font-weight:800;font-size:.75rem;
  color:#fff;background:#292524;border:1px solid #fff2}
#dock button.primary{background:linear-gradient(180deg,#fb923c,#ea580c);border:0}
#dock button.on{outline:2px solid #7dd3fc}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#1c1410f5;border-top:1px solid #ffffff1a;
  border-radius:1.1rem 1.1rem 0 0;padding:1rem 1.05rem calc(1rem + env(safe-area-inset-bottom));
  transform:translateY(110%);transition:transform .25s ease;max-height:40dvh;overflow:auto;pointer-events:none;backdrop-filter:blur(12px)}
#sheet.open{transform:translateY(0);pointer-events:auto}
#sheet .close{position:absolute;right:.75rem;top:.65rem;background:#44403c;border:0;color:#fff;width:2rem;height:2rem;border-radius:999px}
#sheet h2{margin:.1rem 2rem .25rem 0;font-size:1.05rem}
#sheet .meta{color:#fdba74;font-size:.7rem}
#sheet .task{margin:.45rem 0 0;font-size:.88rem;line-height:1.35;color:#ffedd5}
#sheet .acts{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.7rem}
#sheet .acts button{border:0;border-radius:999px;padding:.45rem .75rem;font-weight:800;font-size:.72rem;background:#3b82f6;color:#fff}
#toast{position:fixed;left:50%;bottom:calc(4.8rem + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:70;background:#000d;border:1px solid #fff3;border-radius:999px;padding:.35rem .75rem;font-size:.72rem;font-weight:800;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1}
#hint{position:fixed;left:50%;top:calc(4.6rem + env(safe-area-inset-top));transform:translateX(-50%);z-index:25;
  font-size:.68rem;font-weight:700;color:#ffedd5cc;background:#0007;border-radius:999px;padding:.25rem .6rem;pointer-events:none}
#loading{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:#140e0a;font-weight:800}
#loading.hide{display:none}
</style>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="loading">Loading Blender loft…</div>
<div id="hud">
  <div id="hud-top">
    <div>
      <h1>Bot Office</h1>
      <p class="sub">God mode · guide, don’t micromanage</p>
    </div>
    <div id="bars">
      <div class="chip" id="c-scrap">Scrap 12</div>
      <div class="chip" id="c-morale">Morale 50%</div>
      <div class="chip" id="c-ship">Shipped 0</div>
    </div>
  </div>
  <div id="quest">Set a Sprint Goal, then let bots cook</div>
</div>
<div id="hint">Drag to look · tap a bot to inspect · use tools below</div>
<div id="toast"></div>
<canvas id="c"></canvas>
<div id="dock">
  <button type="button" id="btn-goal" class="primary">Sprint Goal</button>
  <button type="button" id="btn-coffee">Place Coffee (+)</button>
  <button type="button" id="btn-boost">Focus Aura</button>
  <button type="button" id="btn-reset">Reset</button>
</div>
<div id="sheet">
  <button class="close" id="close" type="button">×</button>
  <h2 id="s-name"></h2>
  <p class="meta" id="s-meta"></p>
  <p class="task" id="s-task"></p>
  <div class="acts">
    <button type="button" id="a-praise">Praise (+morale)</button>
    <button type="button" id="a-nudge">Gentle nudge</button>
  </div>
</div>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const SAVE="botoffice-god-v2";
const canvas=document.getElementById("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xb8956e);
scene.fog=new THREE.FogExp2(0xb8956e,0.02);
const camera=new THREE.PerspectiveCamera(38,1,0.1,100);
// fixed overseer angle (god view)
const camPivot=new THREE.Object3D(); scene.add(camPivot);
camera.position.set(0,16,11); camPivot.add(camera);
camera.lookAt(0,0,0);

const clock=new THREE.Clock();
let composer, bloomPass;
let accum=0; const DT=1/60;

const BOTS=[
  {id:"findme",name:"Find Me",role:"Lookup",color:0x22d3ee,accent:0x0284c7,desk:[-4.2,1.0]},
  {id:"story",name:"Story",role:"Shipper",color:0xf472b6,accent:0xdb2777,desk:[-1.5,1.7]},
  {id:"builder",name:"Builder",role:"Maker",color:0x4ade80,accent:0x16a34a,desk:[1.5,1.5]},
  {id:"critic",name:"Critic",role:"Review",color:0xc084fc,accent:0x7c3aed,desk:[4.2,1.1]},
  {id:"leader",name:"Leader",role:"Chief",color:0xfbbf24,accent:0xf59e0b,desk:[2.5,-3.2],crown:true},
];
const DESK_COLORS=[0x0ea5e9,0xf97316,0xef4444,0xa855f7,0xd97706];
const TASKS=["Ship UI polish","Squash login bug","Write daily note","Tune lighting","Draft sprint retro"];

let state={scrap:12,morale:50,shipped:0,goal:null,coffee:0,focus:0,placed:[]};
try{Object.assign(state,JSON.parse(localStorage.getItem(SAVE)||"{}"));}catch(e){}
function save(){localStorage.setItem(SAVE,JSON.stringify({scrap:state.scrap,morale:state.morale,shipped:state.shipped,goal:state.goal,coffee:state.coffee,focus:state.focus,placed:state.placed}));}

let actors=[], holos=[], dust=null, selectRing=null, selected=null;
let tool=null; // 'coffee' | 'focus' | null
let drag={on:false,lx:0,ly:0,yaw:0.25,pitch:-0.35}; // orbit-ish
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);

function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),1700);}
function hud(){
  document.getElementById("c-scrap").textContent="Scrap "+Math.floor(state.scrap);
  document.getElementById("c-morale").textContent="Morale "+Math.floor(state.morale)+"%";
  document.getElementById("c-ship").textContent="Shipped "+state.shipped;
  const q=document.getElementById("quest");
  if(!state.goal) q.textContent="Set a Sprint Goal, then let bots cook";
  else q.textContent="Goal: "+state.goal+" · bots working…";
}
function std(c,o={}){return new THREE.MeshStandardMaterial({color:c,roughness:o.roughness??0.55,metalness:o.metalness??0.06,...o});}

function makeBot(f){
  const root=new THREE.Group();
  const torso=new THREE.Mesh(new THREE.SphereGeometry(0.4,24,24), std(f.accent,{roughness:0.4}));
  torso.scale.set(1.05,0.92,0.95); torso.position.y=0.55; torso.castShadow=true; root.add(torso);
  const head=new THREE.Group(); head.position.y=1.18;
  const hm=new THREE.Mesh(new THREE.SphereGeometry(0.45,28,28), std(0xfafafa,{roughness:0.28}));
  hm.castShadow=true; head.add(hm);
  const face=new THREE.Mesh(new THREE.PlaneGeometry(0.34,0.2), new THREE.MeshStandardMaterial({color:f.color,emissive:f.color,emissiveIntensity:1.2,roughness:0.25,toneMapped:false}));
  face.position.set(0,0.02,0.42); head.add(face);
  if(f.crown){
    const band=new THREE.Mesh(new THREE.TorusGeometry(0.22,0.05,8,16), std(0xf59e0b,{metalness:0.6,roughness:0.25}));
    band.rotation.x=Math.PI/2; band.position.y=0.38; head.add(band);
  }
  root.add(head);
  [[-0.45,0.65],[0.45,0.65]].forEach(([x,y],i)=>{
    const a=new THREE.Mesh(new THREE.CapsuleGeometry(0.08,0.3,4,8), std(f.accent)); a.position.set(x,y,0); root.add(a); root.userData["arm"+i]=a;
  });
  const blob=new THREE.Mesh(new THREE.CircleGeometry(0.42,20), new THREE.MeshBasicMaterial({color:0x000,transparent:true,opacity:0.3,depthWrite:false}));
  blob.rotation.x=-Math.PI/2; blob.position.y=0.02; root.add(blob);
  root.userData.head=head; root.userData.phase=Math.random()*6;
  return root;
}

function makeDesk(x,z,color,label){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.35,0.72,0.85), std(color,{roughness:0.6}));
  body.position.y=0.38; body.castShadow=true; body.receiveShadow=true; g.add(body);
  const top=new THREE.Mesh(new THREE.BoxGeometry(1.45,0.08,0.92), std(0xfafaf9,{roughness:0.45}));
  top.position.y=0.8; g.add(top);
  const mon=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.38,0.05), std(0x0f172a,{metalness:0.35}));
  mon.position.set(0,1.15,-0.15); g.add(mon);
  const scr=new THREE.Mesh(new THREE.PlaneGeometry(0.48,0.3), new THREE.MeshStandardMaterial({color:0x38bdf8,emissive:0x0284c7,emissiveIntensity:0.9,toneMapped:false}));
  scr.position.set(0,1.15,-0.12); g.add(scr);
  const mug=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.12,12), std(0xfacc15));
  mug.position.set(0.45,0.92,0.2); g.add(mug);
  if(label){
    const cv=document.createElement("canvas"); cv.width=256; cv.height=64;
    const ctx=cv.getContext("2d"); ctx.fillStyle="#111"; ctx.fillRect(0,0,256,64);
    ctx.fillStyle="#fff"; ctx.font="bold 42px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(label,128,32);
    const lab=new THREE.Mesh(new THREE.PlaneGeometry(0.7,0.18), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv)}));
    lab.position.set(0,0.45,0.44); g.add(lab);
  }
  g.position.set(x,0,z); scene.add(g); return g;
}

function holoTex(title,lines,bg){
  const cv=document.createElement("canvas"); cv.width=512; cv.height=320;
  const g=cv.getContext("2d");
  g.fillStyle=bg; g.fillRect(0,0,512,320);
  g.strokeStyle="#fff"; g.lineWidth=8; g.strokeRect(12,12,488,296);
  g.fillStyle="#fff"; g.font="bold 36px system-ui"; g.fillText(title,28,56);
  g.font="24px system-ui"; lines.forEach((ln,i)=>{g.fillText(ln,32,105+i*36);});
  const tex=new THREE.CanvasTexture(cv); tex.colorSpace=THREE.SRGBColorSpace; return tex;
}

function buildWorld(){
  // Invisible ground for raycasts / prop placement (Blender room is visual)
  const floor=new THREE.Mesh(new THREE.BoxGeometry(22,0.28,18), new THREE.MeshBasicMaterial({visible:false}));
  floor.position.y=-0.14; floor.name="ground"; scene.add(floor);

  // Blender Cycles-exported loft (textured GLB)
  new GLTFLoader().load("baked/loft_room.glb", (gltf)=>{
    const root=gltf.scene;
    // Blender glTF export is already Y-up
    root.position.set(0, 0, 0);
    root.scale.setScalar(1);
    root.traverse(o=>{
      if(o.isMesh){
        o.castShadow=true; o.receiveShadow=true;
        if(o.material){
          const mats=Array.isArray(o.material)?o.material:[o.material];
          mats.forEach(m=>{
            m.side=THREE.FrontSide;
            if(m.map) m.map.colorSpace=THREE.SRGBColorSpace;
            if(m.emissiveIntensity!=null) m.emissiveIntensity=Math.min(m.emissiveIntensity,1.5);
            if(m.name&&/ceil/i.test(m.name+o.name)) m.visible=false;
            if(/Ceil|ConceptMural/.test(o.name)&&/Ceil/.test(o.name)) o.visible=false;
          });
          if(/^(Ceil|Beam|Pipe)/i.test(o.name)) o.visible=false; // HIDE_ROOF
        }
      }
    });
    scene.add(root);
    toast("Blender loft loaded");
  }, undefined, (err)=>{ console.error(err); toast("GLB load failed — using fallback lights"); });

  scene.add(new THREE.HemisphereLight(0xffe7c8,0x3f2a1a,0.75));
  const sun=new THREE.DirectionalLight(0xfff1d6,1.9); sun.position.set(10,14,2); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048); scene.add(sun);
  scene.add(new THREE.PointLight(0x38bdf8,0.55,18).translateX(-3).translateY(3));

  // holos
  [[-3.2,2.6,-1.2,"SPRINT",["GOAL TBD","WIP","DONE"],"#0284c7",0.25],[0.2,2.8,-1.6,"TODAY",["AUTONOMOUS","ROUTINES"],"#db2777",0],[3.4,2.5,-1.0,"QUEUE",["SHIP","ITERATE"],"#0ea5e9",-0.25]].forEach(([x,y,z,title,lines,bg,ry],i)=>{
    const m=new THREE.Mesh(new THREE.PlaneGeometry(2.2,1.45), new THREE.MeshBasicMaterial({map:holoTex(title,lines,bg),transparent:true,opacity:1,side:THREE.DoubleSide,toneMapped:false,depthWrite:false}));
    m.position.set(x,y,z); m.rotation.y=ry; scene.add(m); holos.push({mesh:m,baseY:y,title});
    scene.add(new THREE.PointLight(i===1?0xfb7185:0x38bdf8,0.9,5).translateX(x).translateY(y).translateZ(z));
  });

  // plants come from Blender GLB

  const n=200, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){pos[i*3]=(Math.random()-.5)*16;pos[i*3+1]=.5+Math.random()*4;pos[i*3+2]=(Math.random()-.5)*12;}
  const geo=new THREE.BufferGeometry(); geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  dust=new THREE.Points(geo,new THREE.PointsMaterial({color:0xfff7ed,size:0.04,transparent:true,opacity:0.45,depthWrite:false}));
  scene.add(dust);

  selectRing=new THREE.Mesh(new THREE.RingGeometry(0.55,0.7,32), new THREE.MeshBasicMaterial({color:0x7dd3fc,transparent:true,opacity:0.85,side:THREE.DoubleSide,toneMapped:false}));
  selectRing.rotation.x=-Math.PI/2; selectRing.visible=false; scene.add(selectRing);

  BOTS.forEach((b,i)=>{
    const [dx,dz]=b.desk;
    // desks/monitors come from Blender GLB
    const mesh=makeBot(b);
    mesh.position.set(dx,0.05,dz); mesh.rotation.y=Math.PI; mesh.userData.id=b.id;
    scene.add(mesh);
    actors.push({
      ...b, mesh, x:dx, z:dz, homeX:dx, homeZ:dz,
      state:"work", timer:1+Math.random()*2, progress:0,
      facing:Math.PI, phase:Math.random()*6, task:TASKS[i%TASKS.length]
    });
  });

  // restore placed props
  (state.placed||[]).forEach(p=>spawnProp(p.kind,p.x,p.z,false));
}

function spawnProp(kind,x,z,persist=true){
  const g=new THREE.Group();
  if(kind==="coffee"){
    const mug=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.28,0.45,14), std(0xfafafa));
    mug.position.y=0.25; g.add(mug);
    const steam=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8), new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.35}));
    steam.position.y=0.6; g.add(steam);
    state.coffee=Math.min(3,(state.coffee||0)+1);
  } else if(kind==="focus"){
    const aura=new THREE.Mesh(new THREE.RingGeometry(0.8,1.35,40), new THREE.MeshBasicMaterial({color:0xa78bfa,transparent:true,opacity:0.45,side:THREE.DoubleSide,toneMapped:false}));
    aura.rotation.x=-Math.PI/2; aura.position.y=0.05; g.add(aura);
    state.focus=Math.min(3,(state.focus||0)+1);
  }
  g.position.set(x,0,z); scene.add(g);
  if(persist){ state.placed.push({kind,x,z}); save(); }
}

function animateBot(a,dt){
  const moving=a.state==="walk";
  a.phase+=dt*(moving?9:2.4);
  const bob=moving?Math.abs(Math.sin(a.phase))*0.05:Math.sin(a.phase)*0.015;
  a.mesh.position.y=0.05+bob;
  if(a.mesh.userData.head) a.mesh.userData.head.position.y=1.18+bob*0.4;
  const a0=a.mesh.userData.arm0, a1=a.mesh.userData.arm1;
  if(a0&&a1){ a0.rotation.x=Math.sin(a.phase)*0.5*(moving||a.state==="work"?1:0.2); a1.rotation.x=-Math.sin(a.phase)*0.5*(moving||a.state==="work"?1:0.2); }
  let d=a.facing-a.mesh.rotation.y; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
  a.mesh.rotation.y+=d*Math.min(1,dt*6);
  a.mesh.position.x=a.x; a.mesh.position.z=a.z;
}

function tickBots(dt){
  const goalBoost=state.goal?1.35:0.55;
  const coffeeBoost=1+0.15*(state.coffee||0);
  const focusBoost=1+0.2*(state.focus||0);
  const moraleBoost=0.7+0.6*(state.morale/100);
  const rate=goalBoost*coffeeBoost*focusBoost*moraleBoost;

  actors.forEach(a=>{
    a.timer-=dt;
    if(a.state==="work"){
      a.facing=Math.PI;
      a.progress+=dt*rate*(0.8+Math.random()*0.2);
      if(a.progress>=10){
        a.progress=0; state.shipped++; state.scrap+=3+Math.random()*4;
        state.morale=Math.min(100,state.morale+1.5);
        toast(a.name+" shipped: "+a.task);
        a.task=TASKS[Math.floor(Math.random()*TASKS.length)];
        save(); hud();
        // wander break
        a.state="walk"; a.timer=1.2+Math.random();
        a.tx=a.homeX+(Math.random()-.5)*3; a.tz=a.homeZ+(Math.random()-.5)*2.5;
      } else if(a.timer<=0){
        // sometimes take a stroll even mid-task
        if(Math.random()<0.25){ a.state="walk"; a.timer=1+Math.random(); a.tx=a.homeX+(Math.random()-.5)*4; a.tz=a.homeZ+(Math.random()-.5)*3; }
        else a.timer=1.5+Math.random()*2;
      }
    } else if(a.state==="walk"){
      const dx=a.tx-a.x, dz=a.tz-a.z, len=Math.hypot(dx,dz)||1;
      a.facing=Math.atan2(dx,dz);
      if(len<0.15){ a.state="idle"; a.timer=0.8+Math.random(); }
      else { a.x+=dx/len*1.4*dt; a.z+=dz/len*1.4*dt; }
    } else { // idle
      if(a.timer<=0){ a.state="work"; a.timer=2; a.tx=a.homeX; a.tz=a.homeZ;
        // walk home first if far
        if(Math.hypot(a.x-a.homeX,a.z-a.homeZ)>0.3){ a.state="walk"; a.tx=a.homeX; a.tz=a.homeZ; a.timer=2; }
      }
    }
    animateBot(a,dt);
  });
  if(state.goal && Math.random()<dt*0.02) state.morale=Math.max(20,state.morale-0.15);
}

function applyCam(){
  camPivot.rotation.y=drag.yaw;
  camera.position.set(0, 16, 11);
  camera.lookAt(0,0.5,0);
}

function openBot(a){
  selected=a; selectRing.visible=true; selectRing.position.set(a.x,0.04,a.z);
  document.getElementById("s-name").textContent=a.name;
  document.getElementById("s-meta").textContent=a.role+" · "+a.state+(state.goal?" · chasing goal":" · waiting for goal");
  document.getElementById("s-task").textContent="Currently: "+a.task+" ("+Math.min(100,Math.floor(a.progress*10))+"%)";
  document.getElementById("sheet").classList.add("open");
  document.getElementById("dock").style.opacity="0.35";
}

function closeSheet(){
  selected=null; selectRing.visible=false;
  document.getElementById("sheet").classList.remove("open");
  document.getElementById("dock").style.opacity="1";
}

function worldPick(e){
  const rect=canvas.getBoundingClientRect();
  pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
  pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer, camera);
  // bots
  const meshes=actors.map(a=>a.mesh);
  const hits=raycaster.intersectObjects(meshes,true);
  if(hits.length){
    let o=hits[0].object; while(o && !o.userData.id) o=o.parent;
    const a=actors.find(x=>x.id===o?.userData?.id);
    if(a){ openBot(a); return; }
  }
  if(tool){
    const hit=new THREE.Vector3();
    if(raycaster.ray.intersectPlane(groundPlane, hit)){
      if(tool==="coffee"){
        if(state.scrap<5){toast("Need 5 scrap");return;}
        state.scrap-=5; spawnProp("coffee",hit.x,hit.z); toast("Coffee shrine placed"); hud(); save();
      } else if(tool==="focus"){
        if(state.scrap<8){toast("Need 8 scrap");return;}
        state.scrap-=8; spawnProp("focus",hit.x,hit.z); toast("Focus aura placed"); hud(); save();
      }
      tool=null; document.querySelectorAll("#dock button").forEach(b=>b.classList.remove("on"));
    }
  } else closeSheet();
}

function setupInput(){
  canvas.addEventListener("pointerdown",e=>{
    if(e.button===2||e.shiftKey){ drag.on=true; drag.lx=e.clientX; drag.ly=e.clientY; canvas.setPointerCapture(e.pointerId); return; }
    drag.on=true; drag.lx=e.clientX; drag.ly=e.clientY; drag.moved=false; canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove",e=>{
    if(!drag.on) return;
    const dx=e.clientX-drag.lx, dy=e.clientY-drag.ly;
    if(Math.hypot(dx,dy)>8) drag.moved=true;
    drag.yaw-=dx*0.005;
    drag.lx=e.clientX; drag.ly=e.clientY;
    applyCam();
  });
  canvas.addEventListener("pointerup",e=>{
    const was=drag.moved; drag.on=false;
    if(!was) worldPick(e);
  });
  canvas.addEventListener("contextmenu",e=>e.preventDefault());

  document.getElementById("btn-goal").onclick=()=>{
    const goals=["Ship Campus polish","Clear bug backlog","Delight the player","Stabilize office sim"];
    state.goal=goals[Math.floor(Math.random()*goals.length)];
    state.morale=Math.min(100,state.morale+8);
    // update holo label via toast; bots get inspired
    actors.forEach(a=>{a.progress=Math.min(a.progress+1.5,9);});
    toast("Sprint goal set: "+state.goal);
    save(); hud();
  };
  document.getElementById("btn-coffee").onclick=()=>{
    tool=tool==="coffee"?null:"coffee";
    document.querySelectorAll("#dock button").forEach(b=>b.classList.remove("on"));
    if(tool) document.getElementById("btn-coffee").classList.add("on");
    toast(tool?"Tap the floor to place coffee":"Tool off");
  };
  document.getElementById("btn-boost").onclick=()=>{
    tool=tool==="focus"?null:"focus";
    document.querySelectorAll("#dock button").forEach(b=>b.classList.remove("on"));
    if(tool) document.getElementById("btn-boost").classList.add("on");
    toast(tool?"Tap the floor to place focus aura":"Tool off");
  };
  document.getElementById("btn-reset").onclick=()=>{
    if(confirm("Reset overseer progress?")){ localStorage.removeItem(SAVE); location.reload(); }
  };
  document.getElementById("close").onclick=closeSheet;
  document.getElementById("a-praise").onclick=()=>{
    if(!selected) return;
    state.morale=Math.min(100,state.morale+6); selected.progress+=2;
    toast("Praised "+selected.name); save(); hud(); openBot(selected);
  };
  document.getElementById("a-nudge").onclick=()=>{
    if(!selected) return;
    selected.state="work"; selected.timer=0.2; selected.tx=selected.homeX; selected.tz=selected.homeZ;
    if(Math.hypot(selected.x-selected.homeX,selected.z-selected.homeZ)>0.2) selected.state="walk";
    toast("Nudged "+selected.name+" back to desk"); openBot(selected);
  };
}

function resize(){
  const w=innerWidth,h=innerHeight; camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h,false); if(composer){composer.setSize(w,h); bloomPass.setSize(w,h);}
}
function loop(){
  accum+=Math.min(0.08,clock.getDelta());
  let s=0; while(accum>=DT&&s<5){ tickBots(DT); accum-=DT; s++;
    holos.forEach((h,i)=>{h.mesh.position.y=h.baseY+Math.sin(clock.elapsedTime*1.2+i)*0.06;});
    if(dust){const a=dust.geometry.attributes.position.array; for(let i=1;i<a.length;i+=3){a[i]+=DT*0.08; if(a[i]>5)a[i]=0.4;} dust.geometry.attributes.position.needsUpdate=true;}
    if(selected) selectRing.position.set(selected.x,0.04,selected.z);
  }
  if(composer) composer.render(); else renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

buildWorld(); setupInput(); applyCam(); hud();
composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.35,0.5,0.7);
composer.addPass(bloomPass);
addEventListener("resize",resize); resize();
document.getElementById("loading").classList.add("hide");
toast("You oversee. Bots live their loops.");
loop();
</script>
</body>
</html>
