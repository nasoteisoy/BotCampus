<style>

#hud-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
#hud h1{margin:0;font-size:.95rem;font-weight:800;white-space:nowrap}
#bars{display:flex;gap:.35rem;flex-shrink:0}

#quest{margin-top:.4rem;max-width:100%;background:#f59e0b;border-radius:10px;padding:.35rem .65rem;
  font-size:.7rem;font-weight:800;color:#1c1917;line-height:1.25}
#stick-wrap{position:fixed;width:120px;height:120px;z-index:60;left:0;top:0;margin-left:-60px;margin-top:-60px;
  display:none;pointer-events:none;opacity:0;transition:opacity .12s}
#stick-wrap.show{display:block;opacity:1}
#stick-base{width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffffff44,#0006);border:1px solid #fff5;box-shadow:0 10px 24px #0008}
#stick-knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;

#dock{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:center;
  padding:.55rem .75rem calc(.55rem + env(safe-area-inset-bottom));pointer-events:none;
  transition:opacity .15s, transform .15s}
#dock.hidden{opacity:0;transform:translateY(12px);pointer-events:none !important}
#dock button{pointer-events:auto;border:0;border-radius:999px;min-width:8rem;padding:.7rem 1.3rem;font-weight:800;font-size:.88rem;
  color:#fff;background:linear-gradient(180deg,#fb923c,#ea580c);box-shadow:0 8px 20px #0007}
#dock.hidden button{pointer-events:none}
#dock button:disabled{opacity:.4}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#1c1410f5;border-top:1px solid #ffffff1a;
  border-radius:1.15rem 1.15rem 0 0;padding:1rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom));
  transform:translateY(110%);transition:transform .25s cubic-bezier(.2,.8,.2,1);
  max-height:42dvh;overflow:auto;pointer-events:none;backdrop-filter:blur(14px)}
#sheet.open{transform:translateY(0);pointer-events:auto}
#sheet .close{position:absolute;right:.8rem;top:.7rem;background:#44403c;border:0;color:#fff;width:2rem;height:2rem;border-radius:999px;font-size:1.1rem}
#sheet h2{margin:.1rem 2.2rem .3rem 0;font-size:1.1rem}
#sheet #s-role{margin:0;color:#fdba74;font-size:.72rem}
#sheet #s-task{margin:.5rem 0 0;font-size:.9rem;line-height:1.4;color:#ffedd5}
#toast{position:fixed;left:50%;bottom:calc(5.5rem + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:70;background:#000d;border:1px solid #ffffff33;border-radius:999px;padding:.4rem .85rem;
  font-size:.74rem;font-weight:800;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#loading{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:#1c1410;font-weight:800}
#loading.hide{display:none}
</style>

<script type="module">
import * as THREE from "three";

const SAVE="botoffice-v4";
const SPEED=4.5, TALK_R=1.75;
const canvas=document.getElementById("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xd4b896);
scene.fog=new THREE.Fog(0xd4b896,14,32);
const camera=new THREE.PerspectiveCamera(42,1,0.1,80);
// high angled like the photo
const camOffset=new THREE.Vector3(0,10.5,9.5);
let camPos=new THREE.Vector3(), camLook=new THREE.Vector3(), camReady=false;
const clock=new THREE.Clock();
const _v=new THREE.Vector3(), _look=new THREE.Vector3();
let accum=0; const DT=1/60;

// Layout closer to photo: front desks L→R, Leader back-right
const FRIENDS=[
  {id:"findme",name:"Find Me",role:"Lookup",task:"Scanning desks for missing specs.",color:0x22d3ee,accent:0x0284c7,x:-4.2,z:1.0},
  {id:"story",name:"Story",role:"Shipper",task:"Drafting the daily build note.",color:0xf472b6,accent:0xdb2777,x:-1.5,z:1.8},
  {id:"builder",name:"Builder",role:"Maker",task:"Prototyping the next pad.",color:0x4ade80,accent:0x16a34a,x:1.5,z:1.6},
  {id:"critic",name:"Critic",role:"Review",task:"Red-lining the sprint board.",color:0xc084fc,accent:0x7c3aed,x:4.3,z:1.2},
  {id:"leader",name:"Leader",role:"Chief Bot",task:"Waiting on the team check-in.",color:0xfbbf24,accent:0xf59e0b,x:2.6,z:-3.2,crown:true},
];
const DESK=[0x0ea5e9,0xf97316,0xef4444,0xa855f7,0xd97706];

let state={scrap:0,talked:{},shipped:false};
try{Object.assign(state,JSON.parse(localStorage.getItem(SAVE)||"{}"));}catch(e){}
function save(){localStorage.setItem(SAVE,JSON.stringify(state));}

let stick={active:false,dx:0,dy:0};
let you={x:0,z:4.5,vx:0,vz:0,facing:0,moving:false,mesh:null};
let npcs=[], holos=[], dust=null;
let nearId=null, talking=null;

function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),1600);}
function hud(){
  const n=Object.keys(state.talked).length;
  document.getElementById("c-scrap").textContent="Scrap "+state.scrap;
  document.getElementById("c-talked").textContent=n+"/5";
  const q=document.getElementById("quest");
  if(state.shipped) q.textContent="Sprint shipped — high fives > deadlines";
  else if(n>=5) q.textContent="Quest: Talk to Leader to ship";
  else q.textContent="Quest: Talk to every bot ("+n+"/5), then Leader";
}

function std(c,o={}){return new THREE.MeshStandardMaterial({color:c,roughness:o.roughness??0.55,metalness:o.metalness??0.06,...o});}

function canvasTex(draw,w=256,h=256){
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h; draw(cv.getContext("2d"),w,h);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t;
}
function brickTex(){
  return canvasTex((g,w,h)=>{
    g.fillStyle="#b45309"; g.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=16){
      const off=(y/16)%2?20:0;
      for(let x=-20;x<w;x+=40){
        g.fillStyle=(x+y)%80<40?"#c2410c":"#9a3412";
        g.fillRect(x+off,y,38,14);
        g.strokeStyle="#7c2d12"; g.strokeRect(x+off,y,38,14);
      }
    }
  },256,256);
}
function woodTex(){
  return canvasTex((g,w,h)=>{
    g.fillStyle="#92400e"; g.fillRect(0,0,w,h);
    for(let i=0;i<40;i++){
      g.strokeStyle=`rgba(0,0,0,${0.05+Math.random()*0.08})`;
      g.beginPath(); g.moveTo(0,Math.random()*h); g.bezierCurveTo(w*0.3,Math.random()*h,w*0.7,Math.random()*h,w,Math.random()*h); g.stroke();
    }
  },256,256);
}
function holoTex(title,lines,bg="#0284c7",w=512,h=360){
  return canvasTex((g,W,H)=>{
    g.fillStyle=bg; g.globalAlpha=0.92; g.fillRect(0,0,W,H); g.globalAlpha=1;
    g.strokeStyle="#ffffffaa"; g.lineWidth=10; g.strokeRect(14,14,W-28,H-28);
    g.fillStyle="#fff"; g.font="bold 40px system-ui,sans-serif"; g.fillText(title,36,64);
    g.font="26px system-ui,sans-serif";
    lines.forEach((t,i)=>{ g.fillStyle=i%2?"#e0f2fe":"#fff"; g.fillText(t,40,118+i*40); });
  },w,h);
}
function posterTex(text,bg,fg="#fff"){
  return canvasTex((g,w,h)=>{
    g.fillStyle=bg; g.fillRect(0,0,w,h);
    g.fillStyle=fg; g.font="bold 36px system-ui"; g.textAlign="center";
    const words=text.split(" ");
    words.forEach((wrd,i)=>g.fillText(wrd,w/2,55+i*42));
  },256,160);
}
function labelTex(text){
  return canvasTex((g,w,h)=>{
    g.fillStyle="#1c1917"; g.fillRect(0,0,w,h);
    g.fillStyle="#fff"; g.font="bold 48px system-ui"; g.textAlign="center"; g.textBaseline="middle";
    g.fillText(text,w/2,h/2);
  },256,64);
}

function makeBot(f){
  const root=new THREE.Group();
  // chubby white head + colored body like photo
  const torso=new THREE.Mesh(new THREE.SphereGeometry(0.4,24,24), std(f.accent,{roughness:0.4}));
  torso.scale.set(1.05,0.95,0.95); torso.position.y=0.55; torso.castShadow=true; root.add(torso);
  const belly=new THREE.Mesh(new THREE.SphereGeometry(0.28,16,16), std(0xf8fafc,{roughness:0.35}));
  belly.position.set(0,0.5,0.18); root.add(belly);
  const head=new THREE.Group(); head.position.y=1.2;
  const hm=new THREE.Mesh(new THREE.SphereGeometry(0.46,28,28), std(0xf8fafc,{roughness:0.28}));
  hm.castShadow=true; head.add(hm);
  const screen=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.26,0.08), std(0x0f172a,{metalness:0.25,roughness:0.45}));
  screen.position.set(0,0.02,0.38); head.add(screen);
  const eyeMat=std(f.color,{emissive:f.color,emissiveIntensity:1.1,roughness:0.25});
  // curved smile eyes as small tori / capsules
  const e1=new THREE.Mesh(new THREE.TorusGeometry(0.06,0.022,8,16,Math.PI), eyeMat);
  const e2=e1.clone(); e1.position.set(-0.1,0.06,0.42); e2.position.set(0.1,0.06,0.42); e1.rotation.z=0.2; e2.rotation.z=-0.2;
  head.add(e1,e2);
  const smile=new THREE.Mesh(new THREE.TorusGeometry(0.08,0.02,6,16,Math.PI), eyeMat);
  smile.position.set(0,-0.06,0.42); smile.rotation.z=Math.PI; head.add(smile);
  if(f.crown){
    const band=new THREE.Mesh(new THREE.TorusGeometry(0.22,0.05,8,16), std(0xf59e0b,{metalness:0.55,roughness:0.25}));
    band.rotation.x=Math.PI/2; band.position.y=0.38; head.add(band);
    for(let i=0;i<5;i++){
      const spike=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.16,5), std(0xfbbf24,{metalness:0.5,roughness:0.25}));
      const a=(i/5)*Math.PI*2; spike.position.set(Math.cos(a)*0.2,0.5,Math.sin(a)*0.2); head.add(spike);
    }
  }
  root.add(head);
  const limbC=std(f.accent,{roughness:0.45});
  [[-0.45,0.65],[0.45,0.65]].forEach(([x,y],i)=>{
    const a=new THREE.Mesh(new THREE.CapsuleGeometry(0.08,0.32,6,10), limbC);
    a.position.set(x,y,0); a.castShadow=true; root.add(a); root.userData["arm"+i]=a;
  });
  [[-0.16,0.28],[0.16,0.28]].forEach(([x,y],i)=>{
    const l=new THREE.Mesh(new THREE.CapsuleGeometry(0.09,0.34,6,10), std(0xe2e8f0));
    l.position.set(x,y,0); l.castShadow=true; root.add(l); root.userData["leg"+i]=l;
  });
  const blob=new THREE.Mesh(new THREE.CircleGeometry(0.45,24), new THREE.MeshBasicMaterial({color:0x000,transparent:true,opacity:0.3,depthWrite:false}));
  blob.rotation.x=-Math.PI/2; blob.position.y=0.02; root.add(blob);
  root.userData.head=head; root.userData.phase=Math.random()*6;
  return root;
}

function makeDesk(x,z,color,label){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.35,0.75,0.85), std(color,{roughness:0.6,map:woodTex()}));
  // tint with color via material color already
  body.material=std(color,{roughness:0.62}); body.position.y=0.4; body.castShadow=true; body.receiveShadow=true; g.add(body);
  const top=new THREE.Mesh(new THREE.BoxGeometry(1.45,0.08,0.92), std(0xf5f5f4,{roughness:0.5}));
  top.position.y=0.82; top.castShadow=true; g.add(top);
  if(label){
    const lab=new THREE.Mesh(new THREE.PlaneGeometry(0.7,0.18), new THREE.MeshBasicMaterial({map:labelTex(label)}));
    lab.position.set(0,0.45,0.44); g.add(lab);
  }
  const mon=new THREE.Mesh(new THREE.BoxGeometry(0.58,0.4,0.05), std(0x1e293b,{metalness:0.35}));
  mon.position.set(0,1.2,-0.15); g.add(mon);
  const scr=new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.32), new THREE.MeshStandardMaterial({color:0x38bdf8,emissive:0x0284c7,emissiveIntensity:0.7}));
  scr.position.set(0,1.2,-0.12); g.add(scr);
  // keyboard
  const kb=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.04,0.18), std(0x334155));
  kb.position.set(0,0.88,0.15); g.add(kb);
  // yellow bolt mug
  const mug=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,0.14,14), std(0xfacc15,{roughness:0.35}));
  mug.position.set(0.48,0.95,0.2); g.add(mug);
  const bolt=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.09,0.02), std(0x0f172a));
  bolt.position.set(0.48,1.0,0.28); g.add(bolt);
  const plant=new THREE.Mesh(new THREE.SphereGeometry(0.14,12,12), std(0x22c55e));
  plant.position.set(-0.5,1.0,0.15); g.add(plant);
  const pot=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.09,0.1,10), std(0xa8a29e));
  pot.position.set(-0.5,0.9,0.15); g.add(pot);
  g.position.set(x,0,z); scene.add(g); return g;
}

function addHolo(x,y,z,tex,sx=1.5,sy=1.05,ry=0.25){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(sx,sy), new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:0.9,side:THREE.DoubleSide,depthWrite:false}));
  m.position.set(x,y,z); m.rotation.y=ry; scene.add(m); holos.push({mesh:m,baseY:y}); return m;
}

function buildOffice(){
  const wood=woodTex(); wood.wrapS=wood.wrapT=THREE.RepeatWrapping; wood.repeat.set(6,5);
  const floor=new THREE.Mesh(new THREE.BoxGeometry(20,0.28,16), new THREE.MeshStandardMaterial({map:wood,roughness:0.85,color:0xffffff}));
  floor.position.y=-0.14; floor.receiveShadow=true; scene.add(floor);

  const brick=brickTex(); brick.wrapS=brick.wrapT=THREE.RepeatWrapping; brick.repeat.set(8,3);
  const wallMat=new THREE.MeshStandardMaterial({map:brick,roughness:0.92,color:0xffffff});
  const back=new THREE.Mesh(new THREE.BoxGeometry(20,5.2,0.4), wallMat);
  back.position.set(0,2.5,-7.2); back.receiveShadow=true; scene.add(back);
  // side wall with windows (right like photo)
  const right=new THREE.Mesh(new THREE.BoxGeometry(0.4,5.2,16), wallMat);
  right.position.set(9.5,2.5,0); scene.add(right);
  const left=right.clone(); left.position.x=-9.5; scene.add(left);

  // multi-pane windows on right
  for(let i=0;i<4;i++){
    for(let j=0;j<2;j++){
      const frame=new THREE.Mesh(new THREE.BoxGeometry(0.08,1.5,1.3), std(0x44403c));
      frame.position.set(9.28,1.6+j*1.7,-4.5+i*2.4); scene.add(frame);
      const glass=new THREE.Mesh(new THREE.PlaneGeometry(1.15,1.35), new THREE.MeshStandardMaterial({color:0xe0f2fe,emissive:0xbae6fd,emissiveIntensity:0.45,transparent:true,opacity:0.85,roughness:0.15}));
      glass.rotation.y=-Math.PI/2; glass.position.set(9.25,1.6+j*1.7,-4.5+i*2.4); scene.add(glass);
    }
  }

  // ceiling pipes
  for(let i=0;i<5;i++){
    const pipe=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,18,10), std(0x78716c,{metalness:0.55,roughness:0.35}));
    pipe.rotation.z=Math.PI/2; pipe.position.set(0,4.85,-5+i*2); scene.add(pipe);
  }

  scene.add(new THREE.HemisphereLight(0xffe8c8,0x3f2a1a,0.6));
  const sun=new THREE.DirectionalLight(0xfff3dd,1.85);
  sun.position.set(10,14,2); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=-14; sun.shadow.camera.right=14; sun.shadow.camera.top=14; sun.shadow.camera.bottom=-14;
  scene.add(sun);
  const neon=new THREE.PointLight(0x38bdf8,0.55,20); neon.position.set(-3,3,-1); scene.add(neon);
  const neon2=new THREE.PointLight(0xec4899,0.4,16); neon2.position.set(2,3,-1); scene.add(neon2);

  // posters / sticky vibe
  [["SHIP IT!","#db2777"],["GOOD JOB!","#eab308"],["DO EPIC STUFF","#0ea5e9"]].forEach((p,i)=>{
    const pl=new THREE.Mesh(new THREE.PlaneGeometry(1.1,0.7), new THREE.MeshBasicMaterial({map:posterTex(p[0],p[1])}));
    pl.position.set(-8.2+i*0.2, 2.8+i*0.15, -4+i*2.2); pl.rotation.y=Math.PI/2; scene.add(pl);
  });

  // plants around room
  [[-8,5],[-8,-3],[8,5],[7,-5],[-6,6],[5,6]].forEach(([x,z])=>{
    const pot=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.35,0.45,12), std(0xd6d3d1));
    pot.position.set(x,0.22,z); pot.castShadow=true; scene.add(pot);
    const leaf=new THREE.Mesh(new THREE.SphereGeometry(0.5,14,14), std(0x16a34a,{roughness:0.7}));
    leaf.position.set(x,0.95,z); leaf.castShadow=true; scene.add(leaf);
  });

  // epic crate
  const crate=new THREE.Mesh(new THREE.BoxGeometry(1.4,1.0,1.0), std(0xa16207,{roughness:0.8}));
  crate.position.set(-6.5,0.5,4.2); crate.castShadow=true; scene.add(crate);
  const crateLab=new THREE.Mesh(new THREE.PlaneGeometry(1.0,0.35), new THREE.MeshBasicMaterial({map:posterTex("DO EPIC STUFF","#78350f")}));
  crateLab.position.set(-6.5,0.7,4.72); scene.add(crateLab);

  // holograms like photo
  addHolo(-5.2,2.7,-3.2, holoTex("SPRINT BOARD",["TO DO   WIP   DONE","BUG SQUASH","NEW FEATURE","COFFEE BREAK"],"#0284c7"), 1.8, 1.2, 0.55);
  addHolo(-0.8,2.9,-4.0, holoTex("TODAY",["CODE  TEST","IMPROVE","REPEAT"],"#db2777",480,300), 1.4, 1.0, 0.15);
  addHolo(4.8,2.5,-3.0, holoTex("QUEUE",["1 OPTIMIZE","2 REFRESH","3 DEPLOY"],"#0ea5e9",400,240), 1.15, 0.8, -0.45);

  // dust
  const n=220, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){ pos[i*3]=(Math.random()-0.5)*16; pos[i*3+1]=0.4+Math.random()*4; pos[i*3+2]=(Math.random()-0.5)*12; }
  const geo=new THREE.BufferGeometry(); geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  dust=new THREE.Points(geo,new THREE.PointsMaterial({color:0xfff7ed,size:0.045,transparent:true,opacity:0.5,depthWrite:false}));
  scene.add(dust);

  FRIENDS.forEach((f,i)=>{
    makeDesk(f.x, f.z-0.55, DESK[i], f.crown?"LEADER":(i===1?"PLAN.":null));
    const mesh=makeBot(f);
    mesh.position.set(f.x,0,f.z);
    mesh.rotation.y = f.crown ? Math.PI*0.15 : Math.PI;
    scene.add(mesh);
    npcs.push({...f,mesh});
  });
  you.mesh=makeBot({id:"you",color:0x60a5fa,accent:0x3b82f6});
  you.mesh.position.set(you.x,0,you.z); scene.add(you.mesh);
}

function animateBot(mesh,moving,dt,facing){
  const p=mesh.userData.phase=(mesh.userData.phase||0)+dt*(moving?9:2.3);
  const bob=moving?Math.abs(Math.sin(p))*0.05:Math.sin(p)*0.018;
  if(mesh.userData.head) mesh.userData.head.position.y=1.2+bob*0.45;
  mesh.position.y=bob;
  const a0=mesh.userData.arm0,a1=mesh.userData.arm1,l0=mesh.userData.leg0,l1=mesh.userData.leg1;
  if(a0&&a1){a0.rotation.x=Math.sin(p)*0.65*(moving?1:0.12);a1.rotation.x=-Math.sin(p)*0.65*(moving?1:0.12);}
  if(l0&&l1){l0.rotation.x=-Math.sin(p)*0.75*(moving?1:0);l1.rotation.x=Math.sin(p)*0.75*(moving?1:0);}
  let d=facing-mesh.rotation.y; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
  mesh.rotation.y+=d*Math.min(1,dt*8);
}

function updateYou(dt){
  you.vx+=(stick.dx*SPEED-you.vx)*0.22; you.vz+=(stick.dy*SPEED-you.vz)*0.22;
  const spd=Math.hypot(you.vx,you.vz);
  if(spd>0.05){you.x+=you.vx*dt;you.z+=you.vz*dt;you.facing=Math.atan2(you.vx,you.vz);you.moving=true;}
  else you.moving=false;
  you.x=THREE.MathUtils.clamp(you.x,-8.5,8.5); you.z=THREE.MathUtils.clamp(you.z,-5.8,6.5);
  you.mesh.position.x=you.x; you.mesh.position.z=you.z;
  animateBot(you.mesh,you.moving,dt,you.facing);
  nearId=null; let best=TALK_R;
  npcs.forEach(n=>{
    const d=Math.hypot(n.x-you.x,n.z-you.z);
    if(d<best){best=d;nearId=n.id;}
    animateBot(n.mesh,false,dt, d<2.5?Math.atan2(you.x-n.x,you.z-n.z):n.mesh.rotation.y);
  });
  document.getElementById("btn-talk").disabled=!nearId;
  holos.forEach((h,i)=>{ h.mesh.position.y=h.baseY+Math.sin(clock.elapsedTime*1.3+i)*0.07; });
  if(dust){const a=dust.geometry.attributes.position.array; for(let i=1;i<a.length;i+=3){a[i]+=dt*0.09; if(a[i]>4.8)a[i]=0.35;} dust.geometry.attributes.position.needsUpdate=true;}

  const desired=_v.set(you.x+camOffset.x,camOffset.y,you.z+camOffset.z);
  const look=_look.set(you.x,1.1,you.z);
  if(!camReady){camPos.copy(desired);camLook.copy(look);camReady=true;}
  camPos.lerp(desired,1-Math.exp(-2.8*dt)); camLook.lerp(look,1-Math.exp(-3.8*dt));
  camera.position.copy(camPos); camera.up.set(0,1,0); camera.lookAt(camLook);
}

function openTalk(id){
  const n=npcs.find(x=>x.id===id); if(!n) return;
  talking=id;
  document.getElementById("s-name").textContent=n.name;
  document.getElementById("s-role").textContent=n.role+(state.talked[id]?" · checked in":"");
  let line=n.task;
  if(id==="leader"){
    const count=Object.keys(state.talked).filter(k=>k!=="leader").length;
    if(state.shipped) line="Sprint already shipped. Nice work.";
    else if(count<4) line="Check in with the other bots first ("+count+"/4).";
    else { line="Everyone checked in. Shipping the sprint!"; if(!state.shipped){state.shipped=true;state.scrap+=50;state.talked.leader=true;save();toast("+50 scrap · Sprint shipped!");} }
  } else if(!state.talked[id]){ state.talked[id]=true; state.scrap+=8; save(); toast("+8 scrap · "+n.name+" checked in"); }
  document.getElementById("s-task").textContent=line;
  document.getElementById("sheet").classList.add("open"); document.getElementById("dock").classList.add("hidden"); hud();
}

function setupStick(){
  const wrap=document.getElementById("stick-wrap"), knob=document.getElementById("stick-knob"), max=38;
  let ox=0,oy=0;
  const setK=(dx,dy)=>{knob.style.left=(40+dx)+"px";knob.style.top=(40+dy)+"px";};
  const hide=()=>{stick.active=false;stick.dx=0;stick.dy=0;setK(0,0);wrap.classList.remove("show");};
  canvas.addEventListener("pointerdown",e=>{
    e.preventDefault(); ox=e.clientX; oy=e.clientY;
    wrap.style.left=ox+"px"; wrap.style.top=oy+"px"; wrap.classList.add("show");
    stick.active=true; setK(0,0); stick.dx=0; stick.dy=0; canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove",e=>{
    if(!stick.active) return;
    let dx=e.clientX-ox, dy=e.clientY-oy; const len=Math.hypot(dx,dy)||1; const m=Math.min(len,max);
    dx=dx/len*m; dy=dy/len*m; stick.dx=dx/max; stick.dy=dy/max; setK(dx,dy);
  });
  canvas.addEventListener("pointerup",hide); canvas.addEventListener("pointercancel",hide);
}

function loop(){
  accum+=Math.min(0.08,clock.getDelta());
  let s=0; while(accum>=DT&&s<5){updateYou(DT);accum-=DT;s++;}
  renderer.render(scene,camera); requestAnimationFrame(loop);
}
function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);}

buildOffice(); setupStick(); hud();
document.getElementById("btn-talk").onclick=()=>{if(nearId) openTalk(nearId);};
document.getElementById("close").onclick=()=>{talking=null;document.getElementById("sheet").classList.remove("open");document.getElementById("dock").classList.remove("hidden");};
addEventListener("resize",resize); resize();
camPos.set(you.x,camOffset.y,you.z+camOffset.z); camLook.set(you.x,1.1,you.z);
camera.position.copy(camPos); camera.lookAt(camLook); camReady=true;
document.getElementById("loading").classList.add("hide");
toast("Welcome to Bot Office");
loop();
</script>
