<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Bot Campus Live</title>
<!-- CACHE_BUST v=npc3 layout+names Dev B — full names, zones, no overlap -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0c1118; --panel:#151c27; --line:#243044; --text:#e8eef6; --muted:#8b9bb0;
  --jesus:#fbbf24; --alert:#f43f5e; --ready:#22c55e; --build:#f59e0b; --fail:#ef4444;
}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:0 0 calc(.85rem + env(safe-area-inset-bottom)); overscroll-behavior:none}

header.sticky{
  position:sticky; top:0; z-index:50;
  padding:calc(.55rem + env(safe-area-inset-top)) .85rem .55rem;
  background:linear-gradient(180deg,#0c1118f5,#0c1118e8); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  display:flex; align-items:baseline; justify-content:space-between; gap:.5rem;
}
header h1{margin:0;font-size:1.05rem;font-weight:800;letter-spacing:-.02em}
#updated{font-size:.7rem;color:var(--muted);font-weight:600;text-align:right}
#updated.stale{color:var(--alert)}
header .links{display:flex;gap:.55rem;margin-top:.15rem}
header .links a{font-size:.68rem;font-weight:700;color:#7dd3fc;text-decoration:none}

main{padding:.7rem .75rem 1.4rem; max-width:560px; margin:0 auto}

.section-title{
  margin:.1rem 0 .4rem; font-size:.66rem; font-weight:800; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted);
}

#deploys{display:flex; flex-direction:column; gap:.45rem; margin-bottom:.85rem}
.deploy-card{
  display:block; background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:.65rem .75rem;
}
.deploy-top{display:flex; align-items:center; justify-content:space-between; gap:.5rem}
.deploy-repo{font-weight:800; font-size:.86rem}
.deploy-label{font-size:.68rem; color:var(--muted); margin-top:.12rem}
.deploy-note{font-size:.68rem; color:var(--muted); margin-top:.35rem}
.deploy-links{margin-top:.4rem; display:flex; gap:.7rem; flex-wrap:wrap}
.deploy-links a{font-size:.72rem; font-weight:700; color:#7dd3fc; text-decoration:none}
.pill{
  display:inline-flex; align-items:center; gap:.28rem;
  border-radius:999px; padding:.16rem .5rem; font-size:.62rem; font-weight:800;
  text-transform:uppercase; letter-spacing:.04em;
}
.pill.ready{background:#14532d55; color:var(--ready); border:1px solid #22c55e66}
.pill.building{background:#78350f55; color:var(--build); border:1px solid #f59e0b66; animation:pulse 1.2s ease-in-out infinite}
.pill.failed{background:#7f1d1d55; color:var(--fail); border:1px solid #ef444466}
.pill-dot{width:.4rem;height:.4rem;border-radius:50%;background:currentColor}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

#alert-banner{
  display:none; margin-bottom:.7rem; padding:.55rem .7rem; border-radius:12px;
  background:linear-gradient(90deg,#7f1d1dcc,#9f1239aa); border:1px solid #fb7185;
  font-size:.78rem; font-weight:800; color:#ffe4e6;
}
#alert-banner.show{display:block; animation:pulse 1.1s ease-in-out infinite}

#map-wrap{
  position:relative; background:var(--panel); border:1px solid var(--line);
  border-radius:16px; overflow:hidden; margin-bottom:.75rem;
  touch-action:none; overscroll-behavior:none; overscroll-behavior-x:none;
  height:min(78vh, 720px); min-height:420px; cursor:grab;
  user-select:none; -webkit-user-select:none;
}
#map-wrap:active{cursor:grabbing}
#map-wrap.high-alert{border-color:#fb7185; box-shadow:0 0 0 2px #f43f5e44, inset 0 0 48px #f43f5e18}
#map-world{
  position:absolute; left:0; top:0;
  width:1920px; height:1480px;
  transform-origin:0 0;
  touch-action:none;
  will-change:transform;
  background:
    radial-gradient(ellipse at 50% 8%, #fbbf2428 0%, transparent 32%),
    radial-gradient(ellipse at 50% 55%, #33415533 0%, transparent 50%),
    linear-gradient(180deg,#1a2332 0%, #0f172a 100%);
}
.floor-grid{
  position:absolute; inset:0; opacity:.12; pointer-events:none;
  background-image:
    linear-gradient(#fff 1px, transparent 1px),
    linear-gradient(90deg, #fff 1px, transparent 1px);
  background-size:40px 40px;
}
#map-hud{
  position:absolute; z-index:20; right:max(.55rem, env(safe-area-inset-right));
  bottom:max(.55rem, env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:10px; pointer-events:none;
}
#map-hud button{
  pointer-events:auto;
  width:52px; height:52px; min-width:52px; min-height:52px;
  border-radius:14px; border:2px solid #94a3b8;
  background:#0b1220f2; color:#f8fafc; font-size:1.45rem; font-weight:900;
  display:grid; place-items:center; cursor:pointer;
  box-shadow:0 2px 12px #000a; backdrop-filter:blur(8px);
  touch-action:manipulation; line-height:1; padding:0;
}
#map-hud button:active{transform:scale(.94); background:#1e293bf2}
#map-hud button.fit-btn{font-size:.62rem; letter-spacing:.04em; text-transform:uppercase; font-weight:900}
#map-mini{
  position:absolute; z-index:20; left:max(.5rem, env(safe-area-inset-left));
  bottom:max(.5rem, env(safe-area-inset-bottom));
  width:96px; height:74px; border-radius:10px;
  border:2px solid #64748bcc; background:#0b1220ee;
  box-shadow:0 2px 10px #0008; cursor:pointer; touch-action:manipulation;
  overflow:hidden; padding:0;
}
#map-mini canvas{display:block; width:100%; height:100%}
#map-hint{
  position:absolute; z-index:19; left:50%; transform:translateX(-50%);
  bottom:max(.45rem, env(safe-area-inset-bottom));
  font-size:.62rem; font-weight:700; color:#94a3b8;
  background:#0f172acc; padding:.28rem .55rem; border-radius:999px;
  pointer-events:none; white-space:nowrap; letter-spacing:.01em;
  max-width:calc(100% - 200px); overflow:hidden; text-overflow:ellipsis;
}
.desk{
  position:absolute; transform:translate(-50%,-50%);
  width:52px; height:36px; border-radius:8px;
  background:#334155cc; border:1px solid #64748b88;
  display:flex; align-items:flex-end; justify-content:center;
  padding-bottom:2px; pointer-events:none; z-index:1;
}
.desk.jesus{
  width:64px; height:44px; background:linear-gradient(180deg,#fbbf2444,#f59e0b33);
  border:2px solid var(--jesus); box-shadow:0 0 18px #fbbf2444;
}
.desk.meeting{background:#1e3a5fcc; border-color:#38bdf888}
.desk-label{
  font-size:8px !important; font-weight:800; color:#cbd5e1; white-space:nowrap;
  text-shadow:0 1px 2px #000; max-width:72px !important; overflow:hidden; text-overflow:ellipsis;
}
.desk.jesus .desk-label{color:#fef3c7; font-size:9px !important}

.sprite{
  position:absolute; transform:translate(-50%,-50%);
  z-index:5; cursor:pointer; touch-action:none;
  transition:left .45s ease, top .45s ease;
  display:flex; flex-direction:column; align-items:center; gap:1px;
  background:transparent; border:0; padding:0; color:inherit;
}
.sprite.main{z-index:6}
.sprite .body{
  position:relative;
  display:grid; place-items:center;
  background:transparent; border:0; box-shadow:none;
}
.sprite.main .body{width:96px; height:96px}
.sprite.intern .body{width:56px; height:56px}
.sprite img.cast{
  width:100%; height:100%; object-fit:contain; display:block;
  pointer-events:none; image-rendering:auto;
  filter:drop-shadow(0 2px 6px #000a);
}
.sprite .swatch-fallback{
  width:100%; height:100%; border-radius:50%;
  border:2px solid #fff8; box-shadow:0 2px 8px #0008;
  display:grid; place-items:center; font-weight:900; color:#0f172a;
  font-size:13px;
}
.sprite.intern .swatch-fallback{font-size:8px}
.sprite .ring{
  position:absolute; inset:-4px; border-radius:50%; border:2.5px solid transparent; pointer-events:none;
}
.sprite.main .ring{inset:-5px}
.sprite .tag{
  display:block; font-size:8px; font-weight:800; color:#e2e8f0;
  text-shadow:0 1px 2px #000, 0 0 4px #000c;
  white-space:nowrap; max-width:100px; overflow:hidden; text-overflow:ellipsis;
  text-align:center; line-height:1.15; margin-top:2px;
  background:#0f172acc; padding:2px 6px; border-radius:5px;
}
.sprite.main .tag{
  display:block; font-size:11px; max-width:120px; overflow:visible; text-overflow:clip;
  background:#0b1220ee; border:1px solid #94a3b866; padding:2px 7px; border-radius:6px;
  letter-spacing:.01em;
}
.sprite.intern .tag{display:block; font-size:8px; max-width:86px}
.sprite .loc-badge{
  display:none; font-size:7px; font-weight:900; letter-spacing:.04em; text-transform:uppercase;
  padding:1px 5px; border-radius:999px; margin-top:2px; line-height:1.2;
  text-shadow:none; white-space:nowrap; pointer-events:none;
}
.sprite .loc-badge.show{display:inline-block}
.sprite .loc-badge.jesus{
  background:linear-gradient(90deg,#fbbf24,#f59e0b); color:#422006;
  box-shadow:0 0 10px #fbbf2466; border:1px solid #fde68a;
}
.sprite .loc-badge.home{
  background:#334155dd; color:#cbd5e1; border:1px solid #64748b99;
}
.sprite.main .loc-badge{font-size:8px; padding:2px 7px}
.sprite.at-jesus .ring{border-color:#fbbf24 !important; box-shadow:0 0 12px #fbbf2444}
.sprite.intern.perm-alert .body{
  filter:drop-shadow(0 0 8px #f43f5ecc);
}
.sprite.intern.perm-alert .ring{
  border-color:#f43f5e; animation:pulse .9s ease-in-out infinite;
}
.status-idle .ring{border-color:#64748b}
.status-working .ring{border-color:#38bdf8}
.status-ready_for_review .ring{border-color:#22c55e}
.status-needs_permission .ring{border-color:#f43f5e}
.status-reviewing .ring{border-color:#a78bfa}
.status-collaborating .ring{border-color:#fb923c}

#bot-list{display:flex; flex-direction:column; gap:.4rem; margin-bottom:.8rem}
.bot-row{
  display:flex; align-items:center; gap:.55rem;
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:.55rem .65rem; cursor:pointer;
}
.bot-row:active{transform:scale(.985)}
.swatch{width:12px;height:12px;border-radius:4px; flex-shrink:0}
.bot-row .name{font-weight:800; font-size:.82rem; flex:1; min-width:0}
.bot-row .task{font-size:.68rem; color:var(--muted); flex:1.4; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.status-chip{
  font-size:.58rem; font-weight:800; text-transform:uppercase; letter-spacing:.03em;
  padding:.14rem .4rem; border-radius:999px; background:#334155; color:#e2e8f0; flex-shrink:0;
}
.status-chip.working{background:#0c4a6e;color:#7dd3fc}
.status-chip.ready_for_review{background:#14532d;color:#86efac}
.status-chip.needs_permission{background:#9f1239;color:#fecdd3}
.status-chip.reviewing{background:#4c1d95;color:#ddd6fe}
.status-chip.collaborating{background:#9a3412;color:#fed7aa}
.status-chip.idle{background:#334155;color:#94a3b8}

#legend{display:flex; flex-wrap:wrap; gap:.35rem .7rem; margin:.2rem 0 .9rem; padding:0; list-style:none}
#legend li{font-size:.62rem; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:.28rem}
#legend .sw{width:8px;height:8px;border-radius:50%; border:2px solid}

#sheet-backdrop{
  display:none; position:fixed; inset:0; background:#0007; z-index:80;
}
#sheet-backdrop.open{display:block}
#sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:90;
  background:#121926f5; border-top:1px solid var(--line);
  border-radius:1.1rem 1.1rem 0 0;
  padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom));
  transform:translateY(110%); transition:transform .25s ease;
  max-height:30dvh; overflow:auto; backdrop-filter:blur(14px);
}
#sheet.open{transform:translateY(0)}
#sheet .close{
  position:absolute; right:.75rem; top:.65rem; background:#334155; border:0; color:#fff;
  width:2rem; height:2rem; border-radius:999px; font-size:1.1rem; font-weight:700;
}
#sheet h2{margin:.1rem 2.2rem .2rem 0; font-size:1.1rem}
#sheet .meta{color:var(--muted); font-size:.72rem}
#sheet .task{margin:.45rem 0 0; font-size:.9rem; line-height:1.35; color:#ffedd5}
#sheet .interns{margin-top:.7rem}
#sheet .interns h3{margin:0 0 .35rem; font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
#sheet .intern-item{
  display:flex; gap:.4rem; align-items:center; font-size:.78rem;
  padding:.35rem 0; border-top:1px solid #ffffff10;
}
#err{display:none; margin-bottom:.6rem; padding:.45rem .6rem; border-radius:10px;
  background:#7f1d1d66; border:1px solid #ef444488; font-size:.72rem; font-weight:700; color:#fecaca}
#err.show{display:block}


button.desk{
  appearance:none; -webkit-appearance:none; margin:0; font:inherit; color:inherit;
  padding-bottom:2px; padding-top:0; padding-left:0; padding-right:0;
  transform:translate(-50%,-50%);
}
button.bot-row{appearance:none;-webkit-appearance:none;width:100%;text-align:left;color:inherit;font:inherit}

/* ——— Fun pass v11: readable Fit zoom, glanceable life, tap-capture fix ——— */
:root{
  --bg:#0a0e1a; --panel:#1a1040; --line:#5b21b6; --text:#fff7ed; --muted:#c4b5fd;
  --jesus:#fbbf24; --alert:#f43f5e; --ready:#22c55e; --build:#f59e0b; --fail:#ef4444;
  --fun-cyan:#22d3ee; --fun-pink:#f472b6; --fun-lime:#a3e635; --fun-orange:#fb923c;
}
html,body{background:var(--bg);color:var(--text)}
header.sticky{
  padding:calc(.35rem + env(safe-area-inset-top)) .7rem .35rem;
  background:linear-gradient(180deg,#1a1040f2,#0a0e1ae8);
  border-bottom:2px solid #7c3aed88;
}
header h1{font-size:.92rem;color:#fde68a}
header .links{gap:.45rem;margin-top:.05rem}
header .links a{font-size:.62rem;color:#67e8f9}
#updated{font-size:.62rem;color:#c4b5fd}
main{padding:.4rem .55rem 1rem; max-width:560px}
.section-title{margin:.05rem 0 .25rem; font-size:.58rem; color:#a78bfa}

/* Thin deploy / bot chrome — characters dominate */
#deploys{gap:.22rem; margin-bottom:.35rem}
#deploys.collapsed{display:none}
.deploy-card{
  background:linear-gradient(135deg,#2e1065cc,#1e1b4bcc);
  border:1.5px solid #a855f788; border-radius:8px;
  padding:.28rem .45rem;
}
.deploy-repo{font-size:.68rem;color:#fde68a}
.deploy-label,.deploy-note{font-size:.55rem;color:#c4b5fd}
.deploy-links{margin-top:.15rem; gap:.45rem}
.deploy-links a{font-size:.58rem;color:#67e8f9}
.pill{font-size:.5rem; padding:.08rem .32rem}

/* Deploy strip toggle — collapsed by default */
.section-toggle{
  display:flex; align-items:center; justify-content:space-between; gap:.5rem;
  width:100%; margin:.05rem 0 .25rem; padding:0; border:0; background:transparent;
  font:inherit; cursor:pointer; color:#a78bfa; text-align:left;
  font-size:.58rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  touch-action:manipulation;
}
.section-toggle .chev{color:#fde68a; font-size:.7rem; transition:transform .2s}
.section-toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
.deploy-strip{
  display:flex; flex-wrap:wrap; gap:.28rem; margin-bottom:.35rem;
  min-height:0;
}
.deploy-strip .mini-pill{
  display:inline-flex; align-items:center; gap:.22rem;
  border-radius:999px; padding:.12rem .42rem;
  font-size:.55rem; font-weight:800; letter-spacing:.02em;
  background:#2e1065cc; border:1px solid #a855f766; color:#fde68a;
}
.deploy-strip .mini-pill .dot{
  width:.32rem; height:.32rem; border-radius:50%; background:currentColor;
}
.deploy-strip .mini-pill.building{color:#fbbf24}
.deploy-strip .mini-pill.ready{color:#86efac}
.deploy-strip .mini-pill.failed{color:#fecdd3}
.deploy-strip.hidden{display:none}

#bot-list{gap:.14rem; margin-bottom:.3rem}
.bot-row{
  background:linear-gradient(90deg,#1e1b4bcc,#312e81aa);
  border:1px solid #6366f155; border-radius:8px;
  padding:.22rem .4rem; gap:.3rem;
}
.bot-row:active{transform:scale(.97)}
.bot-row .name{font-size:.66rem;color:#fef3c7}
.bot-row .task{font-size:.52rem;color:#c4b5fd}
.status-chip{font-size:.46rem;padding:.06rem .26rem}
.swatch{width:8px;height:8px;border-radius:3px}

#map-wrap{
  height:min(88vh, 860px); min-height:560px;
  margin-bottom:.4rem;
  border:2px solid #a855f7aa;
  box-shadow:0 0 24px #7c3aed33, inset 0 0 60px #f472b608;
  background:#12081f;
}
#map-wrap.high-alert{border-color:#fb7185; box-shadow:0 0 0 2px #f43f5e55, inset 0 0 48px #f43f5e22}
#map-world{
  background:
    radial-gradient(ellipse at 50% 6%, #fbbf2435 0%, transparent 30%),
    radial-gradient(ellipse at 18% 40%, #22d3ee22 0%, transparent 28%),
    radial-gradient(ellipse at 82% 55%, #f472b622 0%, transparent 28%),
    radial-gradient(ellipse at 50% 70%, #a3e63515 0%, transparent 35%),
    linear-gradient(180deg,#1e1040 0%, #0c0820 100%);
}
.floor-grid{opacity:.08}

/* Cast art dominates frame */
.sprite.main .body{width:104px; height:104px}
.sprite.intern .body{width:62px; height:62px}
.sprite.main .ring{inset:-6px; border-width:3px}
.sprite.intern .tag{font-size:8px; max-width:90px}
.sprite .tag{font-size:9px; max-width:100px}
.sprite.main .tag{font-size:12px; max-width:128px}

/* Desks — bold + glanceable monitor ambient */
.desk{
  width:58px; height:42px; border-radius:9px;
  background:linear-gradient(180deg,#4c1d95cc,#312e81cc);
  border:1.5px solid #c084fc88;
  pointer-events:auto; cursor:pointer; z-index:1;
  overflow:visible;
}
.desk.jesus{
  width:74px; height:50px;
  background:linear-gradient(180deg,#fbbf2455,#f59e0b44);
  border:2.5px solid var(--jesus); box-shadow:0 0 20px #fbbf2455;
}
.desk.meeting{background:linear-gradient(180deg,#0e7490cc,#1e3a5fcc); border-color:#22d3eeaa}
.desk .monitor{
  position:absolute; top:1px; left:50%; transform:translateX(-50%);
  width:52px; height:22px; border-radius:4px;
  background:#22d3ee99; border:2px solid #a5f3fc;
  animation:monitorGlow 2.2s ease-in-out infinite;
  animation-delay:var(--mon-delay, 0s);
  pointer-events:none;
  box-shadow:0 0 12px #22d3eeaa, 0 0 26px #22d3ee66;
}
.desk.jesus .monitor{
  width:64px; height:26px; background:#fde68acc; border-color:#fbbf24;
  animation-duration:1.8s;
  box-shadow:0 0 16px #fbbf24cc, 0 0 32px #f59e0b88;
}
@keyframes monitorGlow{
  0%,100%{opacity:.55; filter:brightness(.95); box-shadow:0 0 8px #22d3ee88, 0 0 18px #22d3ee44}
  50%{opacity:1; filter:brightness(1.55); box-shadow:0 0 22px #22d3ee, 0 0 40px #67e8f9dd, 0 0 10px #fff}
}

/* Idle breath — phone-readable amplitude (scale ~9%, translate ~5px, rotate wobble) */
.sprite .body{
  animation:breathBob 2.7s ease-in-out infinite;
  animation-delay:var(--breath-delay, 0s);
  will-change:transform;
  transform-origin:50% 85%;
}
.sprite.intern .body{
  animation:breathBob 2.35s ease-in-out infinite;
  animation-delay:var(--breath-delay, 0s);
}
@keyframes breathBob{
  0%,100%{transform:translateY(0) scale(1,1) rotate(0deg)}
  20%{transform:translateY(-6px) scale(1.11, .92) rotate(-3.2deg)}
  45%{transform:translateY(-3.5px) scale(1.07, .95) rotate(2.6deg)}
  70%{transform:translateY(-5.5px) scale(1.10, .93) rotate(-1.9deg)}
}
/* Occasional soft blink on cast art */
.sprite img.cast{
  animation:softBlink 5.6s ease-in-out infinite;
  animation-delay:var(--breath-delay, 0s);
}
@keyframes softBlink{
  0%, 82%, 100%{opacity:1; filter:drop-shadow(0 2px 6px #000a)}
  84%{opacity:.28; filter:drop-shadow(0 2px 6px #000a) brightness(.7)}
  86%{opacity:1; filter:drop-shadow(0 2px 6px #000a)}
  88%{opacity:.2; filter:drop-shadow(0 2px 6px #000a) brightness(.65)}
  91%{opacity:1; filter:drop-shadow(0 2px 6px #000a)}
}
/* Soft accessory lag via ring pulse phase */
.sprite .ring{
  animation:ringSoft 3.1s ease-in-out infinite;
  animation-delay:var(--breath-delay, 0s);
}
@keyframes ringSoft{
  0%,100%{opacity:.8; transform:scale(1)}
  50%{opacity:1; transform:scale(1.07)}
}

/* Status glow / scent beyond chips */
.status-working .body{filter:drop-shadow(0 0 7px #22d3eecc)}
.status-ready_for_review .body{filter:drop-shadow(0 0 9px #22c55ecc)}
.status-needs_permission .body{filter:drop-shadow(0 0 10px #f43f5eee)}
.status-reviewing .body{filter:drop-shadow(0 0 7px #a78bfacc)}

/* Status prop badge — tip sway more obvious */

}

/* Tap juice ≤200ms */
@keyframes tapPop{
  0%{transform:translate(-50%,-50%) scale(1)}
  35%{transform:translate(-50%,-50%) scale(1.18)}
  100%{transform:translate(-50%,-50%) scale(1)}
}

  0%{box-shadow:0 0 0 0 #fde68acc}
  100%{box-shadow:0 0 0 14px transparent}
}
.sprite.tap-juice{
  animation:tapPop 180ms cubic-bezier(.2,1.6,.4,1);
  z-index:25 !important;
}
.sprite.tap-juice .body{
  animation:none;
  filter:drop-shadow(0 0 14px #fde68aee) brightness(1.25) !important;
}

.desk.tap-juice{

}
@keyframes deskFlash{
  0%{filter:brightness(1.6); transform:translate(-50%,-50%) scale(1.12)}

/* Particle burst */
.juice-burst{
  position:absolute; pointer-events:none; z-index:30;

/* Working sparkle ambient — glanceable, capped */

<script>
(function () {
  // Prefer Leader-reconciled campus/ mirror; root + liveops as fallbacks.
  const STATE_URLS = ['./campus/campus-state.json', './campus-state.json', './liveops/campus-state.json'];
  const POLL_MS = 1000;
  const ASSET_V = 'npc3';
  const WORLD = { w: 1920, h: 1480, pad: 80 };

  // Alias map: Dev B spellings → Leader hyphen ids (castFiles keys).
  const ID_ALIAS = {
    leader: 'leader',
    leadersupport: 'dev-c', 'leader-support': 'dev-c', leader_support: 'dev-c',
    'dev-c': 'dev-c', devc: 'dev-c',
    campusdev: 'dev-a', 'dev-a': 'dev-a', deva: 'dev-a', dev_a: 'dev-a',
    liveops: 'dev-b', 'dev-b': 'dev-b', devb: 'dev-b', dev_b: 'dev-b',
    spriteforge: 'render-a', 'render-a': 'render-a', rendera: 'render-a',
    spriteforgesupport: 'render-c', 'render-c': 'render-c', renderc: 'render-c',
    'render-b': 'render-b', renderb: 'render-b',
    'researcher-a': 'researcher-a', researchera: 'researcher-a',
    'researcher-b': 'researcher-b', researcherb: 'researcher-b',
    'profile-a': 'profile-a', profilea: 'profile-a',
    'profile-b': 'profile-b', profileb: 'profile-b'
  };

  // Builtin cast map (used when state.castFiles missing, or to fill gaps).
  const BUILTIN_CAST = {
    leader:   { folder: 'campus-cast/leader',   prefix: 'leader' },
    'dev-a':  { folder: 'campus-cast/dev-a',    prefix: 'dev2' },
    'dev-b':  { folder: 'campus-cast/dev-b',    prefix: 'devb' },
    'dev-c':  { folder: 'campus-cast/dev-c',    prefix: 'leader_support' },
    'render-a': { folder: 'campus-cast/render-a', prefix: 'spriteforge' },
    'render-c': { folder: 'campus-cast/render-c', prefix: 'spriteforge_support' }
  };

  const STATUS_FRAME = {
    idle: 'desk_idle',
    working: 'desk_working',
    collaborating: 'desk_working',
    reviewing: 'desk_working',
    ready_for_review: 'ready_review',
    needs_permission: 'needs_permission'
  };

  const $ = (id) => document.getElementById(id);
  const mapWorld = $('map-world');
  const mapEl = mapWorld; // desks/sprites live on map-world
  const mapWrap = $('map-wrap');
  const deploysEl = $('deploys');
  const deployStripEl = $('deploy-strip');
  const deployToggle = $('deploy-toggle');
  const botListEl = $('bot-list');
  const alertEl = $('alert-banner');
  const updatedEl = $('updated');
  const errEl = $('err');
  const sheet = $('sheet');
  const backdrop = $('sheet-backdrop');

  let state = null;
  let lastGood = null;
  let deskIndex = {};
  let spriteEls = {};
  let animTargets = {};

  /* ——— Camera (transform only; no DOM re-layout per frame) ——— */
  const ZOOM_MAX = 2.5;
  const MAIN_SPRITE_CSS = 104; // .sprite.main .body
  const TARGET_MAIN_ON_SCREEN = 76; // ≥70–100 CSS-px on phone after transform
  const READABLE_ZOOM_MIN = TARGET_MAIN_ON_SCREEN / MAIN_SPRITE_CSS; // ≈0.731
  const cam = { x: 0, y: 0, scale: 1, vx: 0, vy: 0 };
  let camRaf = 0;
  let camDirty = false;
  let suppressClick = false;
  let fittedOnce = false;

  function zoomMin() {
    const rect = mapWrap.getBoundingClientRect();
    if (!rect.width || !rect.height) return 0.22;
    // Allow zooming out far enough to see the whole world with a little padding
    return Math.min(rect.width / WORLD.w, rect.height / WORLD.h) * 0.88;
  }

  function homeClusterBBox() {
    // Jesus + ops-row desks (readable default framing)
    const desks = (state && state.desks) || [];
    const ops = desks.filter(function (d) {
      return d.zone === 'ops' || d.id === 'desk-jesus' || d.id === (state && state.jesusDeskId);
    });
    const pts = ops.length ? ops : desks;
    if (!pts.length) {
      return { x: WORLD.w * 0.25, y: 40, w: WORLD.w * 0.5, h: WORLD.h * 0.35 };
    }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    pts.forEach(function (d) {
      const x = d.x != null ? d.x : WORLD.w / 2;
      const y = d.y != null ? d.y : WORLD.h / 3;
      if (x < minX) minX = x;
      if (y < minY) minY = y;
      if (x > maxX) maxX = x;
      if (y > maxY) maxY = y;
    });
    // Padding for cast sprites above desks + labels
    const padX = 160, padYTop = 180, padYBot = 140;
    minX = Math.max(0, minX - padX);
    minY = Math.max(0, minY - padYTop);
    maxX = Math.min(WORLD.w, maxX + padX);
    maxY = Math.min(WORLD.h, maxY + padYBot);
    return { x: minX, y: minY, w: Math.max(280, maxX - minX), h: Math.max(220, maxY - minY) };
  }

  function centerOnBBox(bbox, scale) {
    const rect = mapWrap.getBoundingClientRect();
    cam.scale = softClampZoom(scale);
    const cx = bbox.x + bbox.w / 2;
    const cy = bbox.y + bbox.h / 2;
    cam.x = rect.width / 2 - cx * cam.scale;
    cam.y = rect.height / 2 - cy * cam.scale;
    cam.vx = cam.vy = 0;
    clampCam();
    applyCamNow();
  }

  function applyCamNow() {
    mapWorld.style.transform = 'translate(' + cam.x + 'px,' + cam.y + 'px) scale(' + cam.scale + ')';
    updateMinimap();
  }

  function scheduleCam() {
    camDirty = true;
    if (camRaf) return;
    camRaf = requestAnimationFrame(function () {
      camRaf = 0;
      if (!camDirty) return;
      camDirty = false;
      clampCam();
      applyCamNow();
    });
  }

  function applyCam() {
    clampCam();
    applyCamNow();
  }

  function clampCam() {
    const rect = mapWrap.getBoundingClientRect();
    const vw = rect.width, vh = rect.height;
    const sw = WORLD.w * cam.scale, sh = WORLD.h * cam.scale;
    const padX = Math.min(vw * 0.12, 64);
    const padY = Math.min(vh * 0.12, 64);
    if (sw <= vw) {
      cam.x = (vw - sw) / 2;
    } else {
      const minX = vw - sw - padX;
      const maxX = padX;
      cam.x = Math.min(maxX, Math.max(minX, cam.x));
    }
    if (sh <= vh) {
      cam.y = (vh - sh) / 2;
    } else {
      const minY = vh - sh - padY;
      const maxY = padY;
      cam.y = Math.min(maxY, Math.max(minY, cam.y));
    }
  }

  function softClampZoom(s) {
    const zmin = zoomMin();
    return Math.min(ZOOM_MAX, Math.max(zmin, s));
  }

  function zoomAt(screenX, screenY, newScale) {
    const rect = mapWrap.getBoundingClientRect();
    const fx = screenX - rect.left;
    const fy = screenY - rect.top;
    const wx = (fx - cam.x) / cam.scale;
    const wy = (fy - cam.y) / cam.scale;
    cam.scale = softClampZoom(newScale);
    cam.x = fx - wx * cam.scale;
    cam.y = fy - wy * cam.scale;
    clampCam();
    applyCamNow();
  }

  function fitAllWorld() {
    const rect = mapWrap.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    // True full-campus overview (postage-stamp sprites OK — opt-in via long-press Fit)
    const s = Math.min(rect.width / WORLD.w, rect.height / WORLD.h) * 0.94;
    cam.scale = softClampZoom(s);
    cam.x = (rect.width - WORLD.w * cam.scale) / 2;
    cam.y = (rect.height - WORLD.h * cam.scale) / 2;
    cam.vx = cam.vy = 0;
    clampCam();
    applyCamNow();
  }

  function fitHomeCluster() {
    const rect = mapWrap.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const bbox = homeClusterBBox();
    // Fit cluster, then clamp so mains stay ≥ TARGET_MAIN_ON_SCREEN on screen
    let s = Math.min(rect.width / bbox.w, rect.height / bbox.h) * 0.9;
    s = Math.max(s, READABLE_ZOOM_MIN);
    s = Math.min(ZOOM_MAX, s);
    centerOnBBox(bbox, s);
  }

  // Default Fit = readable home cluster (not full-world postage stamps)
  function fitOverview() {
    fitHomeCluster();
  }

  function recenterKeepZoom() {
    const rect = mapWrap.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    cam.x = (rect.width - WORLD.w * cam.scale) / 2;
    cam.y = (rect.height - WORLD.h * cam.scale) / 2;
    cam.vx = cam.vy = 0;
    clampCam();
    applyCamNow();
  }

  let inertiaRaf = 0;
  function tickInertia() {
    inertiaRaf = 0;
    cam.x += cam.vx;
    cam.y += cam.vy;
    cam.vx *= 0.94;
    cam.vy *= 0.94;
    clampCam();
    applyCamNow();
    if (Math.hypot(cam.vx, cam.vy) > 0.18) {
      inertiaRaf = requestAnimationFrame(tickInertia);
    } else {
      cam.vx = cam.vy = 0;
    }
  }

  function stopAllMotion() {
    cam.vx = cam.vy = 0;
    if (inertiaRaf) { cancelAnimationFrame(inertiaRaf); inertiaRaf = 0; }
    if (camRaf) { cancelAnimationFrame(camRaf); camRaf = 0; }
    camDirty = false;
  }

  // Minimap
  const miniBtn = $('map-mini');
  const miniCanvas = miniBtn ? miniBtn.querySelector('canvas') : null;
  const miniCtx = miniCanvas ? miniCanvas.getContext('2d') : null;

  function updateMinimap() {
    if (!miniCtx || !miniCanvas) return;
    const mw = miniCanvas.width, mh = miniCanvas.height;
    miniCtx.clearRect(0, 0, mw, mh);
    miniCtx.fillStyle = '#152033';
    miniCtx.fillRect(0, 0, mw, mh);
    // world fill
    miniCtx.fillStyle = '#1e293b';
    miniCtx.fillRect(2, 2, mw - 4, mh - 4);
    // desks dots
    if (state && state.desks) {
      miniCtx.fillStyle = '#64748b';
      state.desks.forEach(function (d) {
        const x = 2 + (d.x / WORLD.w) * (mw - 4);
        const y = 2 + (d.y / WORLD.h) * (mh - 4);
        miniCtx.fillRect(x - 1.5, y - 1.5, 3, 3);
      });
    }
    // viewport rect
    const rect = mapWrap.getBoundingClientRect();
    if (!rect.width || !rect.height || !cam.scale) return;
    const vx0 = (-cam.x / cam.scale) / WORLD.w;
    const vy0 = (-cam.y / cam.scale) / WORLD.h;
    const vw = (rect.width / cam.scale) / WORLD.w;
    const vh = (rect.height / cam.scale) / WORLD.h;
    const rx = 2 + vx0 * (mw - 4);
    const ry = 2 + vy0 * (mh - 4);
    const rw = vw * (mw - 4);
    const rh = vh * (mh - 4);
    miniCtx.strokeStyle = '#38bdf8';
    miniCtx.lineWidth = 1.5;
    miniCtx.strokeRect(rx, ry, rw, rh);
  }

  if (miniBtn) {
    miniBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    miniBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      stopAllMotion();
      const rect = miniBtn.getBoundingClientRect();
      const mx = (e.clientX - rect.left) / rect.width;
      const my = (e.clientY - rect.top) / rect.height;
      const worldX = mx * WORLD.w;
      const worldY = my * WORLD.h;
      const wrap = mapWrap.getBoundingClientRect();
      cam.x = wrap.width / 2 - worldX * cam.scale;
      cam.y = wrap.height / 2 - worldY * cam.scale;
      clampCam();
      applyCamNow();
    });
  }

  // Pointer / gesture state — mode-lock: first gesture wins
  const pointers = new Map();
  let gestureMode = null; // 'pan' | 'pinch' | null
  let panLast = null;
  let pinchStartDist = 0;
  let pinchStartScale = 1;
  let pinchMid = null;
  let dragMoved = false;
  let lastTapT = 0, lastTapX = 0, lastTapY = 0;
  const PAN_THRESH = 5; // CSS px — lower than v7's 8, still cancels tap
  const PINCH_SENS = 1.35; // >1 = more sensitive pinch

  function isHudTarget(el) {
    return !!(el && el.closest && (el.closest('#map-hud') || el.closest('#map-mini')));
  }

  function pointerList() {
    return Array.from(pointers.values());
  }

  function dist(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function midpoint(a, b) {
    return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }

  function isSpriteOrDesk(el) {
    return !!(el && el.closest && el.closest('.sprite, .desk'));
  }

  // Deferred capture: capturing on pointerdown steals .sprite/.desk clicks (no tapPop).
  // Capture only after pan threshold, or immediately when target is empty map chrome.
  mapWrap.addEventListener('pointerdown', (e) => {
    if (isHudTarget(e.target)) return;
    if (sheet.classList.contains('open')) return;
    const interactive = isSpriteOrDesk(e.target);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, id: e.pointerId });
    stopAllMotion();
    dragMoved = false;
    // Tap juice on pointerdown (before any capture) — visible within 200ms
    if (interactive && pointers.size === 1) {
      const hit = e.target.closest('.sprite, .desk');
      if (hit) {
        tapJuice(hit, true);
        mapWrap._juicedEl = hit;
      }
    } else {
      mapWrap._juicedEl = null;
    }
    if (!interactive) {
      try { mapWrap.setPointerCapture(e.pointerId); } catch (_) {}
    }
    const pts = pointerList();
    if (pts.length === 1) {
      gestureMode = null; // wait for threshold
      panLast = { x: e.clientX, y: e.clientY };
      mapWrap._panStart = { x: e.clientX, y: e.clientY };
    } else if (pts.length >= 2) {
      // Multi-touch: always capture for pinch/pan
      try { mapWrap.setPointerCapture(e.pointerId); } catch (_) {}
      // Mode-lock: if already panning, stay pan (2-finger drag = pan)
      if (gestureMode === 'pan') {
        panLast = midpoint(pts[0], pts[1]);
        return;
      }
      gestureMode = 'pinch';
      const [a, b] = pts;
      pinchStartDist = Math.max(1, dist(a, b));
      pinchStartScale = cam.scale;
      pinchMid = midpoint(a, b);
      panLast = null;
    }
  }, { passive: false });

  mapWrap.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    e.preventDefault();
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, id: e.pointerId });
    const pts = pointerList();

    // Mode-lock: pan wins — 2 fingers still pan if locked to pan
    if (gestureMode === 'pan' && pts.length >= 1) {
      const p = pts.length >= 2 ? midpoint(pts[0], pts[1]) : pts[0];
      if (panLast) {
        const dx = p.x - panLast.x;
        const dy = p.y - panLast.y;
        cam.x += dx;
        cam.y += dy;
        cam.vx = dx * 1.25;
        cam.vy = dy * 1.25;
        scheduleCam();
        dragMoved = true;
        suppressClick = true;
        panLast = { x: p.x, y: p.y };
      }
      return;
    }

    // Mode-lock: pinch wins
    if (pts.length >= 2 && gestureMode !== 'pan') {
      if (gestureMode !== 'pinch') {
        gestureMode = 'pinch';
        const [a, b] = pts;
        pinchStartDist = Math.max(1, dist(a, b));
        pinchStartScale = cam.scale;
        pinchMid = midpoint(a, b);
      }
      const [a, b] = pts;
      const mid = midpoint(a, b);
      const d = Math.max(1, dist(a, b));
      const ratio = d / pinchStartDist;
      // Higher sensitivity: amplify zoom rate around 1.0
      const boosted = Math.pow(ratio, PINCH_SENS);
      const next = pinchStartScale * boosted;
      zoomAt(mid.x, mid.y, next);
      if (pinchMid) {
        cam.x += mid.x - pinchMid.x;
        cam.y += mid.y - pinchMid.y;
        pinchMid = mid;
        clampCam();
        applyCamNow();
      }
      dragMoved = true;
      suppressClick = true;
      return;
    }

    if (pts.length === 1 && panLast) {
      const p = pts[0];
      const dx = p.x - panLast.x;
      const dy = p.y - panLast.y;
      if (!mapWrap._panStart) mapWrap._panStart = { x: panLast.x, y: panLast.y };
      if (gestureMode !== 'pan') {
        if (Math.hypot(p.x - mapWrap._panStart.x, p.y - mapWrap._panStart.y) < PAN_THRESH) {
          panLast = { x: p.x, y: p.y };
          return;
        }
        gestureMode = 'pan';
        dragMoved = true;
        suppressClick = true;
        // Crossed pan threshold — capture so pan keeps tracking off-sprite
        try { mapWrap.setPointerCapture(e.pointerId); } catch (_) {}
      }
      cam.x += dx;
      cam.y += dy;
      cam.vx = dx * 1.25;
      cam.vy = dy * 1.25;
      scheduleCam();
      dragMoved = true;
      suppressClick = true;
      panLast = { x: p.x, y: p.y };
    }
  }, { passive: false });

  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    try { mapWrap.releasePointerCapture(e.pointerId); } catch (_) {}
    const pts = pointerList();
    if (pts.length === 0) {
      mapWrap._panStart = null;
      if (camDirty) { camDirty = false; clampCam(); applyCamNow(); }
      if (camRaf) { cancelAnimationFrame(camRaf); camRaf = 0; }
      if (gestureMode === 'pan' && (Math.abs(cam.vx) > 0.45 || Math.abs(cam.vy) > 0.45)) {
        if (!inertiaRaf) inertiaRaf = requestAnimationFrame(tickInertia);
      } else {
        cam.vx = cam.vy = 0;
      }
      // Double-tap zoom toggle
      if (!dragMoved && e.pointerType !== 'mouse') {
        const now = Date.now();
        if (now - lastTapT < 320 && Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 28) {
          const mid = (zoomMin() + ZOOM_MAX) / 2;
          if (cam.scale < mid) zoomAt(e.clientX, e.clientY, Math.min(ZOOM_MAX, cam.scale * 1.7));
          else fitOverview();
          lastTapT = 0;
        } else {
          lastTapT = now; lastTapX = e.clientX; lastTapY = e.clientY;
        }
      }
      gestureMode = null;
      panLast = null;
      pinchMid = null;
      setTimeout(() => { suppressClick = false; }, 40);
    } else if (pts.length === 1) {
      // Dropped from pinch — re-arm pan wait (mode unlock)
      gestureMode = null;
      panLast = { x: pts[0].x, y: pts[0].y };
      mapWrap._panStart = { x: pts[0].x, y: pts[0].y };
      pinchMid = null;
      stopAllMotion();
    }
  }

  function fitScale() {
    const rect = mapWrap.getBoundingClientRect();
    if (!rect.width || !rect.height) return READABLE_ZOOM_MIN;
    const bbox = homeClusterBBox();
    let s = Math.min(rect.width / bbox.w, rect.height / bbox.h) * 0.9;
    return Math.min(ZOOM_MAX, Math.max(READABLE_ZOOM_MIN, s));
  }

  mapWrap.addEventListener('pointerup', endPointer);
  mapWrap.addEventListener('pointercancel', endPointer);
  mapWrap.addEventListener('lostpointercapture', (e) => {
    if (pointers.has(e.pointerId)) endPointer(e);
  });

  mapWrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    stopAllMotion();
    const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    zoomAt(e.clientX, e.clientY, cam.scale * factor);
  }, { passive: false });

  mapWrap.addEventListener('dblclick', (e) => {
    if (isHudTarget(e.target)) return;
    e.preventDefault();
    const mid = (zoomMin() + ZOOM_MAX) / 2;
    if (cam.scale < mid) zoomAt(e.clientX, e.clientY, Math.min(ZOOM_MAX, cam.scale * 1.8));
    else fitOverview();
  });

  // Block browser back-swipe / overscroll while interacting with map
  mapWrap.addEventListener('touchstart', (e) => {
    if (isHudTarget(e.target)) return;
    stopAllMotion();
  }, { passive: true });

  $('zoom-in').addEventListener('click', (e) => {
    e.stopPropagation();
    stopAllMotion();
    const r = mapWrap.getBoundingClientRect();
    zoomAt(r.left + r.width / 2, r.top + r.height / 2, cam.scale * 1.25);
  });
  $('zoom-out').addEventListener('click', (e) => {
    e.stopPropagation();
    stopAllMotion();
    const r = mapWrap.getBoundingClientRect();
    zoomAt(r.left + r.width / 2, r.top + r.height / 2, cam.scale / 1.25);
  });
  (function bindFitButton() {
    const btn = $('zoom-fit');
    let holdTimer = 0;
    let heldAll = false;
    btn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      heldAll = false;
      holdTimer = setTimeout(function () {
        heldAll = true;
        stopAllMotion();
        fitAllWorld();
        btn.classList.add('fit-all-flash');
        setTimeout(function () { btn.classList.remove('fit-all-flash'); }, 280);
      }, 480);
    });
    function clearHold(e) {
      if (e) e.stopPropagation();
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = 0; }
    }
    btn.addEventListener('pointerup', clearHold);
    btn.addEventListener('pointerleave', clearHold);
    btn.addEventListener('pointercancel', clearHold);
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (heldAll) { heldAll = false; return; }
      stopAllMotion();
      fitHomeCluster();
    });
  })();
  $('zoom-reset').addEventListener('click', (e) => {
    e.stopPropagation();
    stopAllMotion();
    // Recenter on home cluster at readable zoom (or keep zoom if already close-up)
    if (cam.scale <= READABLE_ZOOM_MIN * 1.05) {
      fitHomeCluster();
    } else {
      const bbox = homeClusterBBox();
      centerOnBBox(bbox, cam.scale);
    }
  });

  // Prevent HUD from starting map gestures
  $('map-hud').addEventListener('pointerdown', (e) => e.stopPropagation());

  window.addEventListener('resize', () => {
    clampCam();
    applyCamNow();
  });

  function initials(name) {
    return (name || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  }

  function normalizeBotId(id) {
    if (!id) return id;
    const raw = String(id);
    if (ID_ALIAS[raw]) return ID_ALIAS[raw];
    const compact = raw.toLowerCase().replace(/[_-]/g, '');
    return ID_ALIAS[compact] || ID_ALIAS[raw.toLowerCase()] || raw;
  }

  function resolveCastEntry(bot, data) {
    // Prefer explicit bot.castId / bot.cast / castFolder folder name
    const explicit = bot.castId || bot.cast || null;
    let key = explicit ? normalizeBotId(explicit) : normalizeBotId(bot.id);

    const castFiles = (data && data.castFiles) || {};
    if (castFiles[key]) return castFiles[key];
    if (castFiles[bot.id]) return castFiles[bot.id];

    // Legacy: bot.castFolder like "campus-cast/leader" or "leader"
    if (bot.castFolder) {
      const folder = String(bot.castFolder).replace(/^\.\//, '');
      const parts = folder.split('/');
      const leaf = parts[parts.length - 1];
      const mapped = BUILTIN_CAST[normalizeBotId(leaf)] || BUILTIN_CAST[leaf];
      if (mapped) return mapped;
      // Dev B path: casts/{castFolder}/ — no prefix known → no cast
      if (folder.indexOf('campus-cast/') === 0 && BUILTIN_CAST[normalizeBotId(leaf)]) {
        return BUILTIN_CAST[normalizeBotId(leaf)];
      }
    }

    return BUILTIN_CAST[key] || null;
  }

  function castSrc(entry, frame) {
    if (!entry || !entry.folder || !entry.prefix) return null;
    const folder = String(entry.folder).replace(/\/$/, '');
    return './' + folder + '/' + entry.prefix + '_' + frame + '.png?v=' + ASSET_V;
  }

  function mainFrameForStatus(status) {
    return STATUS_FRAME[status] || 'desk_idle';
  }

  function deskPos(desk) {
    if (!desk) return { left: 50, top: 50 };
    const x = ((desk.x ?? 720) / WORLD.w) * 100;
    const y = ((desk.y ?? 400) / WORLD.h) * 100;
    return { left: Math.min(96, Math.max(4, x)), top: Math.min(96, Math.max(4, y)) };
  }

  function resolvePos(entity, desksById, fallbackDeskId) {
    if (entity.x != null && entity.y != null) {
      return {
        left: Math.min(96, Math.max(4, (entity.x / WORLD.w) * 100)),
        top: Math.min(96, Math.max(4, (entity.y / WORLD.h) * 100))
      };
    }
    const desk = desksById[entity.atDeskId] || desksById[fallbackDeskId];
    return deskPos(desk);
  }

  function offsetAround(base, slot, kind, jesus) {
    // Percent offsets — larger radius so mains + interns + desks do not stack
    const ring = [
      {dl:0, dt:-5.8},
      {dl:-6.2, dt:5.2},
      {dl:6.2, dt:5.2},
      {dl:0, dt:7.8},
      {dl:-8.5, dt:1.2},
      {dl:8.5, dt:1.2},
      {dl:-4.5, dt:7.2},
      {dl:4.5, dt:7.2}
    ];
    let o;
    if (kind === 'main') o = ring[0];
    else if (jesus) {
      const j = [
        {dl:0, dt:7.5}, {dl:-7, dt:8.5}, {dl:7, dt:8.5}, {dl:-12, dt:7.2}, {dl:12, dt:7.2}
      ];
      o = j[(slot - 1) % j.length];
    } else {
      o = ring[1 + ((slot - 1) % (ring.length - 1))];
    }
    return {
      left: Math.min(96, Math.max(4, base.left + o.dl)),
      top: Math.min(96, Math.max(4, base.top + o.dt))
    };
  }

  function separateSprites(positions, minDist) {
    const min = minDist || 9.5;
    for (let iter = 0; iter < 8; iter++) {
      for (let i = 0; i < positions.length; i++) {
        for (let j = i + 1; j < positions.length; j++) {
          const a = positions[i], b = positions[j];
          let dx = b.left - a.left, dy = b.top - a.top;
          let dist = Math.hypot(dx, dy) || 0.01;
          if (dist < min) {
            const push = (min - dist) / 2;
            dx /= dist; dy /= dist;
            a.left = Math.min(96, Math.max(4, a.left - dx * push));
            a.top = Math.min(96, Math.max(4, a.top - dy * push));
            b.left = Math.min(96, Math.max(4, b.left + dx * push));
            b.top = Math.min(96, Math.max(4, b.top + dy * push));
          }
        }
      }
    }
    return positions;
  }

  function permissionInterns(data) {
    const jd = data.jesusDeskId;
    const out = [];
    for (const bot of data.bots || []) {
      for (const intern of bot.interns || []) {
        // npc2: surface any needs_permission (pathing toward pad), not only arrived at Jesus
        if (intern.status === 'needs_permission') {
          out.push({ bot, intern, atJesus: intern.atDeskId === jd });
        }
      }
    }
    return out;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escapeAttr(s) { return escapeHtml(s).replace(/'/g,'&#39;'); }

  function renderDeploys(deploys) {
    deploysEl.innerHTML = '';
    if (deployStripEl) deployStripEl.innerHTML = '';
    const list = deploys || [];
    if (!list.length) {
      deploysEl.innerHTML = '<div class="deploy-card"><div class="deploy-repo">No deploys yet</div></div>';
      if (deployStripEl) {
        deployStripEl.innerHTML = '<span class="mini-pill">no deploys</span>';
      }
      return;
    }
    list.forEach(d => {
      const card = document.createElement('div');
      card.className = 'deploy-card';
      const st = d.status || 'building';
      const pages = d.pagesUrl || d.url || '#';
      const repo = d.repoUrl || d.checkUrl || '#';
      card.innerHTML =
        '<div class="deploy-top">' +
          '<div><div class="deploy-repo">' + escapeHtml(d.label || d.repo) + '</div>' +
          '<div class="deploy-label">' + escapeHtml(d.repo || '') + (d.branch ? ' · ' + escapeHtml(d.branch) : '') + '</div></div>' +
          '<span class="pill ' + st + '"><span class="pill-dot"></span>' + escapeHtml(st) + '</span>' +
        '</div>' +
        (d.note ? '<div class="deploy-note">' + escapeHtml(d.note) + '</div>' : '') +
        '<div class="deploy-links">' +
          '<a href="' + escapeAttr(pages) + '" target="_blank" rel="noopener">Open site</a>' +
          '<a href="' + escapeAttr(repo) + '" target="_blank" rel="noopener">GitHub</a>' +
        '</div>';
      deploysEl.appendChild(card);

      if (deployStripEl) {
        const mini = document.createElement('span');
        mini.className = 'mini-pill ' + st;
        mini.innerHTML = '<span class="dot"></span>' + escapeHtml((d.label || d.repo || 'deploy').slice(0, 18)) + ' · ' + escapeHtml(st);
        deployStripEl.appendChild(mini);
      }
    });
  }

  if (deployToggle) {
    deployToggle.addEventListener('click', () => {
      const open = deployToggle.getAttribute('aria-expanded') === 'true';
      const next = !open;
      deployToggle.setAttribute('aria-expanded', next ? 'true' : 'false');
      deploysEl.classList.toggle('collapsed', !next);
      if (next) deploysEl.removeAttribute('hidden');
      else deploysEl.setAttribute('hidden', '');
      if (deployStripEl) deployStripEl.classList.toggle('hidden', next);
    });
  }

  function renderDesks(desks, jesusDeskId) {
    mapEl.querySelectorAll('.desk').forEach(n => n.remove());
    (desks || []).forEach((d, i) => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'desk' + (d.id === jesusDeskId ? ' jesus' : '') + (d.id === 'desk-meeting' ? ' meeting' : '');
      const p = deskPos(d);
      el.style.left = p.left + '%';
      el.style.top = p.top + '%';
      el.style.setProperty('--mon-delay', (-(i * 0.47) % 2.6).toFixed(2) + 's');
      el.innerHTML = '<span class="monitor" aria-hidden="true"></span><span class="desk-label">' + escapeHtml(d.label) + '</span>';
      el.addEventListener('click', (ev) => {
        if (suppressClick || dragMoved) { ev.preventDefault(); ev.stopPropagation(); return; }
        ev.stopPropagation();
        // Juice already fired on pointerdown; only re-fire if that path missed
        if (mapWrap._juicedEl !== el) tapJuice(el, true);
        mapWrap._juicedEl = null;
        // Desk tap = juice only; sheet opens from cast/bot-list (keep map readable)
      });
      mapEl.appendChild(el);
    });
  }


  const STATUS_PROP = {
    working: '🔧',
    ready_for_review: '📋',
    needs_permission: '🚨',
    collaborating: '🤝',
    reviewing: '📋',
    idle: ''
  };

  function phaseDelay(key, span) {
    // Stable per-bot phase offset — avoid army-sync (F10)
    let h = 0;
    const s = String(key || '');
    for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
    const t = Math.abs(h) % 1000;
    return (-(t / 1000) * (span || 2.9)).toFixed(2) + 's';
  }

  function tapJuice(el, withBurst) {
    if (!el) return;
    el.classList.remove('tap-juice');
    void el.offsetWidth;
    el.classList.add('tap-juice');
    setTimeout(() => { el.classList.remove('tap-juice'); }, 200);
    if (withBurst) spawnBurst(el);
  }

  function spawnBurst(el) {
    const wrap = mapWrap.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2 - wrap.left;
    const cy = r.top + r.height / 2 - wrap.top;
    const burst = document.createElement('div');
    burst.className = 'juice-burst';
    burst.style.left = cx + 'px';
    burst.style.top = cy + 'px';
    const cols = ['#fde68a', '#f472b6', '#22d3ee', '#a3e635', '#fb923c'];
    for (let i = 0; i < 6; i++) {
      const p = document.createElement('i');
      const ang = (Math.PI * 2 * i) / 6 + Math.random() * 0.4;
      const dist = 14 + Math.random() * 16;
      p.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(1) + 'px');
      p.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(1) + 'px');
      p.style.setProperty('--pcol', cols[i % cols.length]);
      burst.appendChild(p);
    }
    mapWrap.appendChild(burst);
    setTimeout(() => burst.remove(), 220);
  }

  function setStatusProp(el, status) {
    const prop = el.querySelector('.status-prop');
    if (!prop) return;
    prop.textContent = STATUS_PROP[status] || '';
  }

  function ensureSprite(key, opts) {
    let el = spriteEls[key];
    if (!el) {
      el = document.createElement('button');
      el.type = 'button';
      el.className = 'sprite';
      el.innerHTML =
        '<div class="body">' +
          '<span class="ring"></span>' +
          '<img class="cast" alt="" draggable="false"/>' +
          '<span class="swatch-fallback" hidden></span>' +
          '<span class="status-prop" aria-hidden="true"></span>' +
        '</div>' +
        '<div class="tag"></div>' +
        '<span class="loc-badge" aria-hidden="true"></span>';
      el.addEventListener('click', (ev) => {
        if (suppressClick || dragMoved) { ev.preventDefault(); ev.stopPropagation(); return; }
        // Juice on pointerdown; click opens sheet without losing juice
        if (mapWrap._juicedEl !== el) tapJuice(el, true);
        mapWrap._juicedEl = null;
        if (opts.onTap) opts.onTap();
      });
      mapEl.appendChild(el);
      spriteEls[key] = el;
    }
    return el;
  }

  function setCastOrFallback(el, src, color, letter) {
    const img = el.querySelector('img.cast');
    const fb = el.querySelector('.swatch-fallback');
    if (!src) {
      img.hidden = true;
      img.removeAttribute('src');
      fb.hidden = false;
      fb.style.background = color || '#94a3b8';
      fb.textContent = letter || '?';
      return;
    }
    fb.hidden = true;
    img.hidden = false;
    img.onerror = function () {
      img.hidden = true;
      img.removeAttribute('src');
      fb.hidden = false;
      fb.style.background = color || '#94a3b8';
      fb.textContent = letter || '?';
    };
    if (img.getAttribute('src') !== src) img.src = src;
  }

  function placeSprite(el, pos, immediate) {
    if (immediate) {
      el.style.transition = 'none';
      el.style.left = pos.left + '%';
      el.style.top = pos.top + '%';
      void el.offsetWidth;
      el.style.transition = '';
    } else {
      el.style.left = pos.left + '%';
      el.style.top = pos.top + '%';
    }
  }

  function shortInternLabel(intern) {
    const raw = (intern.label || intern.task || intern.id || 'intern').trim();
    return raw.length > 18 ? raw.slice(0, 17) + '…' : raw;
  }

  function fullBotName(bot) {
    return String((bot && bot.name) || (bot && bot.id) || 'Bot').trim();
  }

  function setLocBadge(el, kind, homeLabel) {
    const badge = el.querySelector('.loc-badge');
    if (!badge) return;
    el.classList.remove('at-jesus');
    if (kind === 'jesus') {
      badge.textContent = '@ Jesus';
      badge.className = 'loc-badge show jesus';
      el.classList.add('at-jesus');
    } else if (kind === 'home') {
      badge.textContent = homeLabel ? ('home · ' + homeLabel) : 'home';
      badge.className = 'loc-badge show home';
    } else {
      badge.textContent = '';
      badge.className = 'loc-badge';
    }
  }

  function inJesusZone(entity, desksById, jesusId, data) {
    const jd = desksById[jesusId];
    const at = entity && entity.atDeskId;
    if (at && at === jesusId) return true;
    if (entity && entity.status === 'needs_permission') {
      // pathing / pad still counts as Jesus ownership for the badge
      return true;
    }
    if (entity && entity.x != null && entity.y != null && data && data.zones) {
      const z = (data.zones || []).find(z => z.id === 'jesus');
      if (z) {
        return entity.x >= z.x && entity.x <= z.x + z.w &&
               entity.y >= z.y && entity.y <= z.y + z.h;
      }
    }
    if (entity && entity.x != null && entity.y != null && jd) {
      return Math.hypot(entity.x - jd.x, entity.y - jd.y) < 140;
    }
    return false;
  }

  function applyWorldSize(data) {
    const w = (data && data.world && data.world.w) || WORLD.w;
    const h = (data && data.world && data.world.h) || WORLD.h;
    WORLD.w = w; WORLD.h = h;
    mapWorld.style.width = w + 'px';
    mapWorld.style.height = h + 'px';
  }

  function renderZones(data) {
    mapEl.querySelectorAll('.zone').forEach(n => n.remove());
    const zones = (data && data.zones) || [
      { id: 'jesus', label: "Jesus's room", x: 700, y: 40, w: 560, h: 260 },
      { id: 'ops', label: 'Ops bay', x: 80, y: 300, w: 1640, h: 280 },
      { id: 'workshop', label: 'Workshop', x: 80, y: 620, w: 1100, h: 280 },
      { id: 'library', label: 'Library', x: 1180, y: 620, w: 680, h: 280 },
      { id: 'courtyard', label: 'Courtyard', x: 80, y: 980, w: 1000, h: 320 },
      { id: 'common', label: 'Meeting nook', x: 1080, y: 980, w: 520, h: 320 }
    ];
    const silly = {
      jesus: "👑 Jesus's room",
      ops: '🛠️ Ops bay',
      workshop: '🎨 Workshop',
      library: '📚 Library',
      courtyard: '🌿 Courtyard',
      common: '☕ Meeting nook'
    };
    const grid = mapEl.querySelector('.floor-grid');
    const frag = document.createDocumentFragment();
    zones.forEach(z => {
      const el = document.createElement('div');
      el.className = 'zone zone-' + (z.id || 'ops');
      el.style.left = ((z.x / WORLD.w) * 100) + '%';
      el.style.top = ((z.y / WORLD.h) * 100) + '%';
      el.style.width = ((z.w / WORLD.w) * 100) + '%';
      el.style.height = ((z.h / WORLD.h) * 100) + '%';
      el.innerHTML = '<span class="zone-label">' + escapeHtml(silly[z.id] || z.label || z.id) + '</span>';
      frag.appendChild(el);
    });
    if (grid && grid.nextSibling) mapEl.insertBefore(frag, grid.nextSibling);
    else if (grid) mapEl.appendChild(frag);
    else mapEl.insertBefore(frag, mapEl.firstChild);
  }

  function renderSprites(data, first) {
    const desksById = {};
    (data.desks || []).forEach(d => { desksById[d.id] = d; });
    deskIndex = desksById;
    const seen = new Set();
    const jesusId = data.jesusDeskId;

    const deskInternCursor = {};

    (data.bots || []).forEach(bot => {
      const color = bot.color || '#94a3b8';
      const castEntry = resolveCastEntry(bot, data);
      const mainKey = 'main:' + bot.id;
      seen.add(mainKey);
      const main = bot.main || {};
      const mainStatus = main.status || bot.status || 'idle';
      const deskPosMain = deskPos(desksById[bot.deskId] || desksById[main.atDeskId]);
      const usePos = (main.x != null && main.y != null)
        ? resolvePos(main, desksById, bot.deskId)
        : offsetAround(deskPosMain, 0, 'main', false);

      const el = ensureSprite(mainKey, { onTap: () => openSheet(bot) });
      el.className = 'sprite main status-' + mainStatus;
      el.style.setProperty('--breath-delay', phaseDelay(mainKey, 2.9));
      setStatusProp(el, mainStatus);
      const frame = mainFrameForStatus(mainStatus);
      const src = castSrc(castEntry, frame);
      setCastOrFallback(el, src, color, initials(bot.name));
      el.querySelector('.tag').textContent = fullBotName(bot);
      {
        const homeDesk = desksById[bot.deskId];
        const homeLabel = (homeDesk && homeDesk.label) || bot.name;
        if (inJesusZone(main, desksById, jesusId, data) || main.atDeskId === jesusId) {
          setLocBadge(el, 'jesus');
        } else if (!main.atDeskId || main.atDeskId === bot.deskId || mainStatus === 'idle' || mainStatus === 'ready_for_review') {
          setLocBadge(el, 'home', homeLabel);
        } else {
          setLocBadge(el, 'home', homeLabel);
        }
      }
      // === NPC-FSM (Dev B) === initial seed only; FSM owns after first paint
      if (!(window.CampusNpc && CampusNpc.ownsPositions && animTargets[mainKey])) {
        placeSprite(el, usePos, first && !animTargets[mainKey]);
      }
      animTargets[mainKey] = usePos;

      (bot.interns || []).forEach((intern) => {
        const key = 'intern:' + bot.id + ':' + intern.id;
        seen.add(key);
        const ist = intern.status || 'idle';
        const at = intern.atDeskId || bot.deskId;
        deskInternCursor[at] = (deskInternCursor[at] || 0) + 1;
        const slot = deskInternCursor[at];
        const base = (intern.x != null && intern.y != null)
          ? resolvePos(intern, desksById, bot.deskId)
          : deskPos(desksById[at] || desksById[bot.deskId]);
        const isPerm = ist === 'needs_permission' && at === jesusId;
        const finalPos = (intern.x != null && intern.y != null)
          ? base
          : offsetAround(base, slot, 'intern', at === jesusId);
        const iel = ensureSprite(key, { onTap: () => openSheet(bot) });
        iel.className = 'sprite intern status-' + ist + (isPerm ? ' perm-alert' : '');
        iel.style.setProperty('--breath-delay', phaseDelay(key, 2.45));
        setStatusProp(iel, ist);
        // Interns always use intern_idle when cast exists (CAST_MAP).
        // Exception: needs_permission uses needs_permission frame if available.
        const internFrame = (ist === 'needs_permission') ? 'needs_permission' : 'intern_idle';
        const isrc = castSrc(castEntry, internFrame) || castSrc(castEntry, 'intern_idle');
        setCastOrFallback(iel, isrc, color, 'i');
        iel.querySelector('.tag').textContent = shortInternLabel(intern);
        {
          const homeDesk = desksById[bot.deskId];
          const homeLabel = (homeDesk && homeDesk.label) || bot.name;
          if (ist === 'needs_permission' || at === jesusId || inJesusZone(intern, desksById, jesusId, data)) {
            setLocBadge(iel, 'jesus');
          } else if (!at || at === bot.deskId) {
            setLocBadge(iel, 'home', homeLabel);
          } else {
            setLocBadge(iel, 'home', homeLabel);
          }
        }
        if (!(window.CampusNpc && CampusNpc.ownsPositions && animTargets[key])) {
          placeSprite(iel, finalPos, first && !animTargets[key]);
        }
        animTargets[key] = finalPos;
      });
    });

    const pack = Object.keys(animTargets).filter(k => seen.has(k)).map(k => ({
      key: k, left: animTargets[k].left, top: animTargets[k].top
    }));
    separateSprites(pack, 10.0);
    // === NPC-FSM (Dev B) === separation seeds targets; live positions owned by FSM after first paint
    pack.forEach(p => {
      animTargets[p.key] = { left: p.left, top: p.top };
      if (spriteEls[p.key] && !(window.CampusNpc && CampusNpc.ownsPositions && !first)) {
        placeSprite(spriteEls[p.key], animTargets[p.key], first);
      }
    });

    Object.keys(spriteEls).forEach(k => {
      if (!seen.has(k)) {
        spriteEls[k].remove();
        delete spriteEls[k];
        delete animTargets[k];
      }
    });
  }

  function renderBotList(data) {
    botListEl.innerHTML = '';
    (data.bots || []).forEach(bot => {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'bot-row';
      const st = bot.status || 'idle';
      row.innerHTML =
        '<span class="swatch" style="background:' + escapeAttr(bot.color || '#94a3b8') + '"></span>' +
        '<span class="name">' + escapeHtml(bot.name) + '</span>' +
        '<span class="task">' + escapeHtml(bot.task || '') + '</span>' +
        '<span class="status-chip ' + st + '">' + escapeHtml(st.replace(/_/g,' ')) + '</span>';
      row.addEventListener('click', () => { tapJuice(row, false); openSheet(bot); });
      botListEl.appendChild(row);
    });
  }

  function renderAlert(data) {
    const hits = permissionInterns(data);
    if (hits.length) {
      const labels = hits.map(h => h.bot.name + ': ' + (h.intern.label || h.intern.task || 'permission')).join(' · ');
      const anyThere = hits.some(h => h.atJesus);
      alertEl.textContent = (anyThere ? '⚠ PERMISSION at Jesus desk — ' : '⚠ PERMISSION needed — running to pad — ') + labels;
      alertEl.classList.add('show');
      mapWrap.classList.add('high-alert');
    } else {
      alertEl.classList.remove('show');
      mapWrap.classList.remove('high-alert');
    }
  }

  function applyState(data, first) {
    state = data;
    lastGood = data;
    applyWorldSize(data);
    renderDeploys(data.deploys);
    renderZones(data);
    renderDesks(data.desks, data.jesusDeskId);
    renderSprites(data, first);
    // === NPC-FSM (Dev B) === own sprite transforms after paint; poll retargets only
    if (window.CampusNpc) {
      CampusNpc.sync({
        state: data,
        spriteEls: spriteEls,
        mapWorld: mapEl,
        world: WORLD,
        first: !!first,
        helpers: {
          castSrc: castSrc,
          setCastOrFallback: setCastOrFallback,
          resolveCastEntry: resolveCastEntry,
          mainFrameForStatus: mainFrameForStatus,
          initials: initials,
          placeSprite: placeSprite,
          setLocBadge: setLocBadge
        }
      });
    }
    renderBotList(data);
    renderAlert(data);
    if (!fittedOnce) {
      fittedOnce = true;
      requestAnimationFrame(fitOverview);
    } else {
      updateMinimap();
    }
    const t = data.updatedAt || '';
    window.__stateUpdatedAt = t ? Date.parse(t) : Date.now();
    window.__lastFetchOk = Date.now();
    tickAge();
    errEl.classList.remove('show');
  }

  function openSheet(bot) {
    if (suppressClick || dragMoved) return;
    $('s-name').textContent = bot.name;
    const st = bot.status || 'idle';
    $('s-meta').textContent = st.replace(/_/g, ' ') + ' · desk ' + (bot.deskId || '—');
    $('s-task').textContent = bot.task || (bot.main && bot.main.task) || '—';
    const box = $('s-interns');
    const interns = bot.interns || [];
    if (!interns.length) {
      box.innerHTML = '<h3>Interns</h3><div class="intern-item" style="border:0;color:var(--muted)">None active</div>';
    } else {
      box.innerHTML = '<h3>Interns</h3>' + interns.map(i => {
        const perm = i.status === 'needs_permission' && i.atDeskId === (state && state.jesusDeskId);
        return '<div class="intern-item">' +
          '<span class="status-chip ' + (i.status||'') + '">' + escapeHtml((i.status||'').replace(/_/g,' ')) + '</span>' +
          '<span>' + escapeHtml(i.label || i.id) + (i.task ? ' — ' + escapeHtml(i.task) : '') +
          (perm ? ' <strong style="color:#fb7185">@ Jesus</strong>' : '') +
          ' <span style="color:var(--muted);font-size:.68rem">(' + escapeHtml(i.atDeskId||'') + ')</span></span></div>';
      }).join('');
    }
    sheet.classList.add('open');
    backdrop.classList.add('open');
  }

  function closeSheet() {
    sheet.classList.remove('open');
    backdrop.classList.remove('open');
  }
  $('sheet-close').addEventListener('click', closeSheet);
  backdrop.addEventListener('click', closeSheet);

  function tickAge() {
    if (!window.__lastFetchOk) { updatedEl.textContent = 'connecting…'; return; }
    const age = Math.max(0, Math.floor((Date.now() - window.__lastFetchOk) / 1000));
    updatedEl.textContent = 'updated ' + age + 's ago';
    updatedEl.classList.toggle('stale', age > 5);
  }
  setInterval(tickAge, 250);

  let firstLoad = true;
  async function poll() {
    const bust = '?t=' + Date.now();
    let lastErr = null;
    for (const base of STATE_URLS) {
      try {
        const res = await fetch(base + bust, { cache: 'no-store' });
        if (!res.ok) { lastErr = new Error('HTTP ' + res.status + ' ' + base); continue; }
        const data = await res.json();
        applyState(data, firstLoad);
        firstLoad = false;
        return;
      } catch (e) {
        lastErr = e;
      }
    }
    updatedEl.textContent = 'Offline — last good';
    updatedEl.classList.add('stale');
    errEl.textContent = 'Fetch failed: ' + (lastErr && lastErr.message ? lastErr.message : 'unknown') + (lastGood ? ' (showing last good state)' : '');
    errEl.classList.add('show');
    if (lastGood) applyState(lastGood, false);
  }


  /* Working sparkles — glanceable, capped concurrent (not casino) */
  const SPARKLE_GLYPHS = ['✦', '✧', '✦', '⋆'];
  const SPARKLE_MAX = 4;
  function spawnWorkingSparkles() {
    if (!state) return;
    const live = mapEl.querySelectorAll('.sparkle').length;
    if (live >= SPARKLE_MAX) return;
    const working = Object.keys(spriteEls).filter(k => {
      const el = spriteEls[k];
      return el && (el.classList.contains('status-working') || el.classList.contains('status-collaborating'));
    });
    if (!working.length) return;
    const room = SPARKLE_MAX - live;
    const n = Math.min(room, 2, working.length);
    for (let i = 0; i < n; i++) {
      if (Math.random() > 0.72) continue; // ~72% chance per slot → frequent but not spam
      const key = working[(Math.random() * working.length) | 0];
      const el = spriteEls[key];
      if (!el) continue;
      const sp = document.createElement('span');
      sp.className = 'sparkle';
      sp.textContent = SPARKLE_GLYPHS[(Math.random() * SPARKLE_GLYPHS.length) | 0];
      const left = parseFloat(el.style.left) || 50;
      const top = parseFloat(el.style.top) || 50;
      sp.style.left = (left + (Math.random() * 5 - 2.5)) + '%';
      sp.style.top = (top - 4 - Math.random() * 3) + '%';
      const sz = 26 + ((Math.random() * 12) | 0);
      sp.style.fontSize = sz + 'px';
      mapEl.appendChild(sp);
      setTimeout(() => sp.remove(), 1000);
    }
  }
  setInterval(spawnWorkingSparkles, 1100);

  // Initial camera before first paint of sprites
  requestAnimationFrame(fitOverview);
  poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
