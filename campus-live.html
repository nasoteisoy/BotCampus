<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Bot Campus Live</title>
<!-- CACHE_BUST v=7 pan-zoom world -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0c1118; --panel:#151c27; --line:#243044; --text:#e8eef6; --muted:#8b9bb0;
  --jesus:#fbbf24; --alert:#f43f5e; --ready:#22c55e; --build:#f59e0b; --fail:#ef4444;
}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:0 0 calc(.85rem + env(safe-area-inset-bottom)); overscroll-behavior:none}

header.sticky{
  position:sticky; top:0; z-index:50;
  padding:calc(.55rem + env(safe-area-inset-top)) .85rem .55rem;
  background:linear-gradient(180deg,#0c1118f5,#0c1118e8); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  display:flex; align-items:baseline; justify-content:space-between; gap:.5rem;
}
header h1{margin:0;font-size:1.05rem;font-weight:800;letter-spacing:-.02em}
#updated{font-size:.7rem;color:var(--muted);font-weight:600;text-align:right}
#updated.stale{color:var(--alert)}
header .links{display:flex;gap:.55rem;margin-top:.15rem}
header .links a{font-size:.68rem;font-weight:700;color:#7dd3fc;text-decoration:none}

main{padding:.7rem .75rem 1.4rem; max-width:560px; margin:0 auto}

.section-title{
  margin:.1rem 0 .4rem; font-size:.66rem; font-weight:800; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted);
}

#deploys{display:flex; flex-direction:column; gap:.45rem; margin-bottom:.85rem}
.deploy-card{
  display:block; background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:.65rem .75rem;
}
.deploy-top{display:flex; align-items:center; justify-content:space-between; gap:.5rem}
.deploy-repo{font-weight:800; font-size:.86rem}
.deploy-label{font-size:.68rem; color:var(--muted); margin-top:.12rem}
.deploy-note{font-size:.68rem; color:var(--muted); margin-top:.35rem}
.deploy-links{margin-top:.4rem; display:flex; gap:.7rem; flex-wrap:wrap}
.deploy-links a{font-size:.72rem; font-weight:700; color:#7dd3fc; text-decoration:none}
.pill{
  display:inline-flex; align-items:center; gap:.28rem;
  border-radius:999px; padding:.16rem .5rem; font-size:.62rem; font-weight:800;
  text-transform:uppercase; letter-spacing:.04em;
}
.pill.ready{background:#14532d55; color:var(--ready); border:1px solid #22c55e66}
.pill.building{background:#78350f55; color:var(--build); border:1px solid #f59e0b66; animation:pulse 1.2s ease-in-out infinite}
.pill.failed{background:#7f1d1d55; color:var(--fail); border:1px solid #ef444466}
.pill-dot{width:.4rem;height:.4rem;border-radius:50%;background:currentColor}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

#alert-banner{
  display:none; margin-bottom:.7rem; padding:.55rem .7rem; border-radius:12px;
  background:linear-gradient(90deg,#7f1d1dcc,#9f1239aa); border:1px solid #fb7185;
  font-size:.78rem; font-weight:800; color:#ffe4e6;
}
#alert-banner.show{display:block; animation:pulse 1.1s ease-in-out infinite}

#map-wrap{
  position:relative; background:var(--panel); border:1px solid var(--line);
  border-radius:16px; overflow:hidden; margin-bottom:.75rem;
  touch-action:none; user-select:none; -webkit-user-select:none;
  height:min(62vh, 540px); min-height:440px; cursor:grab;
}
#map-wrap.panning{cursor:grabbing}
#map-wrap.high-alert{border-color:#fb7185; box-shadow:0 0 0 2px #f43f5e44, inset 0 0 48px #f43f5e18}
#map{
  position:absolute; left:0; top:0;
  width:1400px; height:1100px;
  transform-origin:0 0; will-change:transform;
  background:
    radial-gradient(ellipse at 50% 8%, #fbbf2428 0%, transparent 32%),
    radial-gradient(ellipse at 50% 55%, #33415533 0%, transparent 50%),
    linear-gradient(180deg,#1a2332 0%, #0f172a 100%);
}
#map-controls{
  position:absolute; right:8px; bottom:8px; z-index:30;
  display:flex; flex-direction:column; gap:6px; pointer-events:none;
}
#map-controls button{
  pointer-events:auto; min-width:44px; min-height:44px; padding:0 .55rem;
  border-radius:12px; border:1px solid var(--line);
  background:#1e293bcc; color:var(--text); font-weight:800; font-size:.95rem;
  backdrop-filter:blur(8px); cursor:pointer;
  box-shadow:0 2px 10px #0006;
}
#map-controls button:active{transform:scale(.96)}
#map-controls .reset{font-size:.62rem; letter-spacing:.02em; text-transform:uppercase; padding:0 .65rem}
.floor-grid{
  position:absolute; inset:0; opacity:.12; pointer-events:none;
  background-image:
    linear-gradient(#fff 1px, transparent 1px),
    linear-gradient(90deg, #fff 1px, transparent 1px);
  background-size:40px 40px;
}
.desk{
  position:absolute; transform:translate(-50%,-50%);
  width:52px; height:36px; border-radius:8px;
  background:#334155cc; border:1px solid #64748b88;
  display:flex; align-items:flex-end; justify-content:center;
  padding-bottom:2px; pointer-events:none; z-index:1;
}
.desk.jesus{
  width:64px; height:44px; background:linear-gradient(180deg,#fbbf2444,#f59e0b33);
  border:2px solid var(--jesus); box-shadow:0 0 18px #fbbf2444;
}
.desk.meeting{background:#1e3a5fcc; border-color:#38bdf888}
.desk-label{
  font-size:7px !important; font-weight:800; color:#cbd5e1; white-space:nowrap;
  text-shadow:0 1px 2px #000; max-width:56px !important; overflow:hidden; text-overflow:ellipsis;
}
.desk.jesus .desk-label{color:#fef3c7; font-size:9px !important}

.sprite{
  position:absolute; transform:translate(-50%,-50%);
  z-index:5; cursor:pointer; touch-action:manipulation;
  transition:left .45s ease, top .45s ease;
  display:flex; flex-direction:column; align-items:center; gap:1px;
  background:transparent; border:0; padding:0; color:inherit;
}
.sprite.main{z-index:6}
.sprite .body{
  position:relative;
  display:grid; place-items:center;
  background:transparent; border:0; box-shadow:none;
}
.sprite.main .body{width:68px; height:68px}
.sprite.intern .body{width:40px; height:40px}
.sprite img.cast{
  width:100%; height:100%; object-fit:contain; display:block;
  pointer-events:none; image-rendering:auto;
  filter:drop-shadow(0 2px 6px #000a);
}
.sprite .swatch-fallback{
  width:100%; height:100%; border-radius:50%;
  border:2px solid #fff8; box-shadow:0 2px 8px #0008;
  display:grid; place-items:center; font-weight:900; color:#0f172a;
  font-size:13px;
}
.sprite.intern .swatch-fallback{font-size:8px}
.sprite .ring{
  position:absolute; inset:-4px; border-radius:50%; border:2.5px solid transparent; pointer-events:none;
}
.sprite.main .ring{inset:-5px}
.sprite .tag{
  display:block; font-size:8px; font-weight:800; color:#e2e8f0;
  text-shadow:0 1px 2px #000, 0 0 4px #000c;
  white-space:nowrap; max-width:72px; overflow:hidden; text-overflow:ellipsis;
  text-align:center; line-height:1.1; margin-top:1px;
  background:#0f172acc; padding:1px 4px; border-radius:4px;
}
.sprite.main .tag{display:none} /* names in bot list */
.sprite.intern .tag{display:block; font-size:7px; max-width:64px}
.sprite.intern.perm-alert .body{
  filter:drop-shadow(0 0 8px #f43f5ecc);
}
.sprite.intern.perm-alert .ring{
  border-color:#f43f5e; animation:pulse .9s ease-in-out infinite;
}
.status-idle .ring{border-color:#64748b}
.status-working .ring{border-color:#38bdf8}
.status-ready_for_review .ring{border-color:#22c55e}
.status-needs_permission .ring{border-color:#f43f5e}
.status-reviewing .ring{border-color:#a78bfa}
.status-collaborating .ring{border-color:#fb923c}

#bot-list{display:flex; flex-direction:column; gap:.4rem; margin-bottom:.8rem}
.bot-row{
  display:flex; align-items:center; gap:.55rem;
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:.55rem .65rem; cursor:pointer;
}
.bot-row:active{transform:scale(.985)}
.swatch{width:12px;height:12px;border-radius:4px; flex-shrink:0}
.bot-row .name{font-weight:800; font-size:.82rem; flex:1; min-width:0}
.bot-row .task{font-size:.68rem; color:var(--muted); flex:1.4; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.status-chip{
  font-size:.58rem; font-weight:800; text-transform:uppercase; letter-spacing:.03em;
  padding:.14rem .4rem; border-radius:999px; background:#334155; color:#e2e8f0; flex-shrink:0;
}
.status-chip.working{background:#0c4a6e;color:#7dd3fc}
.status-chip.ready_for_review{background:#14532d;color:#86efac}
.status-chip.needs_permission{background:#9f1239;color:#fecdd3}
.status-chip.reviewing{background:#4c1d95;color:#ddd6fe}
.status-chip.collaborating{background:#9a3412;color:#fed7aa}
.status-chip.idle{background:#334155;color:#94a3b8}

#legend{display:flex; flex-wrap:wrap; gap:.35rem .7rem; margin:.2rem 0 .9rem; padding:0; list-style:none}
#legend li{font-size:.62rem; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:.28rem}
#legend .sw{width:8px;height:8px;border-radius:50%; border:2px solid}

#sheet-backdrop{
  display:none; position:fixed; inset:0; background:#0007; z-index:80;
}
#sheet-backdrop.open{display:block}
#sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:90;
  background:#121926f5; border-top:1px solid var(--line);
  border-radius:1.1rem 1.1rem 0 0;
  padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom));
  transform:translateY(110%); transition:transform .25s ease;
  max-height:55dvh; overflow:auto; backdrop-filter:blur(14px);
}
#sheet.open{transform:translateY(0)}
#sheet .close{
  position:absolute; right:.75rem; top:.65rem; background:#334155; border:0; color:#fff;
  width:2rem; height:2rem; border-radius:999px; font-size:1.1rem; font-weight:700;
}
#sheet h2{margin:.1rem 2.2rem .2rem 0; font-size:1.1rem}
#sheet .meta{color:var(--muted); font-size:.72rem}
#sheet .task{margin:.45rem 0 0; font-size:.9rem; line-height:1.35; color:#ffedd5}
#sheet .interns{margin-top:.7rem}
#sheet .interns h3{margin:0 0 .35rem; font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
#sheet .intern-item{
  display:flex; gap:.4rem; align-items:center; font-size:.78rem;
  padding:.35rem 0; border-top:1px solid #ffffff10;
}
#err{display:none; margin-bottom:.6rem; padding:.45rem .6rem; border-radius:10px;
  background:#7f1d1d66; border:1px solid #ef444488; font-size:.72rem; font-weight:700; color:#fecaca}
#err.show{display:block}
</style>
</head>
<body>
<header class="sticky">
  <div>
    <h1>Bot Campus Live</h1>
    <div class="links">
      <a href="research-board.html?v=1">Research</a>
      <a href="campus-cast-review.html?v=1">Cast review</a>
      <a href="office.html">3D Office</a>
      <a href="liveops/CAMPUS_STATE.md">Protocol</a>
    </div>
  </div>
  <div id="updated">Connecting…</div>
</header>

<main>
  <div id="err"></div>
  <div id="alert-banner" role="alert"></div>

  <div class="section-title">Deploy board</div>
  <div id="deploys"></div>

  <div class="section-title">Campus map</div>
  <div id="map-wrap">
    <div id="map">
      <div class="floor-grid"></div>
    </div>
    <div id="map-controls" aria-label="Map zoom">
      <button type="button" id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
      <button type="button" id="zoom-reset" class="reset" title="Reset view" aria-label="Reset view">Reset</button>
    </div>
  </div>

  <ul id="legend">
    <li><span class="sw" style="border-color:#64748b"></span> idle</li>
    <li><span class="sw" style="border-color:#38bdf8"></span> working</li>
    <li><span class="sw" style="border-color:#22c55e"></span> ready</li>
    <li><span class="sw" style="border-color:#f43f5e"></span> permission</li>
    <li><span class="sw" style="border-color:#a78bfa"></span> reviewing</li>
    <li><span class="sw" style="border-color:#fb923c"></span> collab</li>
  </ul>

  <div class="section-title">Bots</div>
  <div id="bot-list"></div>
</main>

<div id="sheet-backdrop"></div>
<div id="sheet" aria-live="polite">
  <button class="close" id="sheet-close" type="button" aria-label="Close">×</button>
  <h2 id="s-name"></h2>
  <p class="meta" id="s-meta"></p>
  <p class="task" id="s-task"></p>
  <div class="interns" id="s-interns"></div>
</div>

<script>
(function () {
  // Prefer Leader-reconciled campus/ mirror; root + liveops as fallbacks.
  const STATE_URLS = ['./campus/campus-state.json', './campus-state.json', './liveops/campus-state.json'];
  const POLL_MS = 1500;
  const ASSET_V = '7';
  const WORLD = { w: 1400, h: 1100, pad: 72 };

  // Alias map: Dev B spellings → Leader hyphen ids (castFiles keys).
  const ID_ALIAS = {
    leader: 'leader',
    leadersupport: 'dev-c', 'leader-support': 'dev-c', leader_support: 'dev-c',
    'dev-c': 'dev-c', devc: 'dev-c',
    campusdev: 'dev-a', 'dev-a': 'dev-a', deva: 'dev-a', dev_a: 'dev-a',
    liveops: 'dev-b', 'dev-b': 'dev-b', devb: 'dev-b', dev_b: 'dev-b',
    spriteforge: 'render-a', 'render-a': 'render-a', rendera: 'render-a',
    spriteforgesupport: 'render-c', 'render-c': 'render-c', renderc: 'render-c',
    'render-b': 'render-b', renderb: 'render-b',
    'researcher-a': 'researcher-a', researchera: 'researcher-a',
    'researcher-b': 'researcher-b', researcherb: 'researcher-b',
    'profile-a': 'profile-a', profilea: 'profile-a',
    'profile-b': 'profile-b', profileb: 'profile-b'
  };

  // Builtin cast map (used when state.castFiles missing, or to fill gaps).
  const BUILTIN_CAST = {
    leader:   { folder: 'campus-cast/leader',   prefix: 'leader' },
    'dev-a':  { folder: 'campus-cast/dev-a',    prefix: 'dev2' },
    'dev-b':  { folder: 'campus-cast/dev-b',    prefix: 'devb' },
    'dev-c':  { folder: 'campus-cast/dev-c',    prefix: 'leader_support' },
    'render-a': { folder: 'campus-cast/render-a', prefix: 'spriteforge' },
    'render-c': { folder: 'campus-cast/render-c', prefix: 'spriteforge_support' }
  };

  const STATUS_FRAME = {
    idle: 'desk_idle',
    working: 'desk_working',
    collaborating: 'desk_working',
    reviewing: 'desk_working',
    ready_for_review: 'ready_review',
    needs_permission: 'needs_permission'
  };

  const $ = (id) => document.getElementById(id);
  const mapEl = $('map');
  const mapWrap = $('map-wrap');
  const deploysEl = $('deploys');
  const botListEl = $('bot-list');
  const alertEl = $('alert-banner');
  const updatedEl = $('updated');
  const errEl = $('err');
  const sheet = $('sheet');
  const backdrop = $('sheet-backdrop');

  let state = null;
  let lastGood = null;
  let deskIndex = {};
  let spriteEls = {};
  let animTargets = {};

  function initials(name) {
    return (name || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  }

  function normalizeBotId(id) {
    if (!id) return id;
    const raw = String(id);
    if (ID_ALIAS[raw]) return ID_ALIAS[raw];
    const compact = raw.toLowerCase().replace(/[_-]/g, '');
    return ID_ALIAS[compact] || ID_ALIAS[raw.toLowerCase()] || raw;
  }

  function resolveCastEntry(bot, data) {
    // Prefer explicit bot.castId / bot.cast / castFolder folder name
    const explicit = bot.castId || bot.cast || null;
    let key = explicit ? normalizeBotId(explicit) : normalizeBotId(bot.id);

    const castFiles = (data && data.castFiles) || {};
    if (castFiles[key]) return castFiles[key];
    if (castFiles[bot.id]) return castFiles[bot.id];

    // Legacy: bot.castFolder like "campus-cast/leader" or "leader"
    if (bot.castFolder) {
      const folder = String(bot.castFolder).replace(/^\.\//, '');
      const parts = folder.split('/');
      const leaf = parts[parts.length - 1];
      const mapped = BUILTIN_CAST[normalizeBotId(leaf)] || BUILTIN_CAST[leaf];
      if (mapped) return mapped;
      // Dev B path: casts/{castFolder}/ — no prefix known → no cast
      if (folder.indexOf('campus-cast/') === 0 && BUILTIN_CAST[normalizeBotId(leaf)]) {
        return BUILTIN_CAST[normalizeBotId(leaf)];
      }
    }

    return BUILTIN_CAST[key] || null;
  }

  function castSrc(entry, frame) {
    if (!entry || !entry.folder || !entry.prefix) return null;
    const folder = String(entry.folder).replace(/\/$/, '');
    return './' + folder + '/' + entry.prefix + '_' + frame + '.png?v=' + ASSET_V;
  }

  function mainFrameForStatus(status) {
    return STATUS_FRAME[status] || 'desk_idle';
  }

  function deskPos(desk) {
    if (!desk) return { left: 50, top: 50 };
    const x = ((desk.x ?? 450) / WORLD.w) * 100;
    const y = ((desk.y ?? 280) / WORLD.h) * 100;
    return { left: Math.min(96, Math.max(4, x)), top: Math.min(96, Math.max(4, y)) };
  }

  function resolvePos(entity, desksById, fallbackDeskId) {
    if (entity.x != null && entity.y != null) {
      return {
        left: Math.min(96, Math.max(4, (entity.x / WORLD.w) * 100)),
        top: Math.min(96, Math.max(4, (entity.y / WORLD.h) * 100))
      };
    }
    const desk = desksById[entity.atDeskId] || desksById[fallbackDeskId];
    return deskPos(desk);
  }

  function offsetAround(base, slot, kind, jesus) {
    const ring = [
      {dl:0, dt:-7.5},
      {dl:-8.0, dt:6.5},
      {dl:8.0, dt:6.5},
      {dl:0, dt:10.0},
      {dl:-11.0, dt:1.5},
      {dl:11.0, dt:1.5}
    ];
    let o;
    if (kind === 'main') o = ring[0];
    else if (jesus) {
      const j = [
        {dl:0, dt:10}, {dl:-9, dt:11.5}, {dl:9, dt:11.5}, {dl:-15, dt:10}, {dl:15, dt:10}
      ];
      o = j[(slot - 1) % j.length];
    } else {
      o = ring[1 + ((slot - 1) % (ring.length - 1))];
    }
    return {
      left: Math.min(96, Math.max(4, base.left + o.dl)),
      top: Math.min(96, Math.max(4, base.top + o.dt))
    };
  }

  function separateSprites(positions, minDist) {
    const min = minDist || 7.5;
    for (let iter = 0; iter < 8; iter++) {
      for (let i = 0; i < positions.length; i++) {
        for (let j = i + 1; j < positions.length; j++) {
          const a = positions[i], b = positions[j];
          let dx = b.left - a.left, dy = b.top - a.top;
          let dist = Math.hypot(dx, dy) || 0.01;
          if (dist < min) {
            const push = (min - dist) / 2;
            dx /= dist; dy /= dist;
            a.left = Math.min(96, Math.max(4, a.left - dx * push));
            a.top = Math.min(96, Math.max(4, a.top - dy * push));
            b.left = Math.min(96, Math.max(4, b.left + dx * push));
            b.top = Math.min(96, Math.max(4, b.top + dy * push));
          }
        }
      }
    }
    return positions;
  }

  function permissionInterns(data) {
    const jd = data.jesusDeskId;
    const out = [];
    for (const bot of data.bots || []) {
      for (const intern of bot.interns || []) {
        if (intern.status === 'needs_permission' && intern.atDeskId === jd) {
          out.push({ bot, intern });
        }
      }
    }
    return out;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escapeAttr(s) { return escapeHtml(s).replace(/'/g,'&#39;'); }

  function renderDeploys(deploys) {
    deploysEl.innerHTML = '';
    const list = deploys || [];
    if (!list.length) {
      deploysEl.innerHTML = '<div class="deploy-card"><div class="deploy-repo">No deploys yet</div></div>';
      return;
    }
    list.forEach(d => {
      const card = document.createElement('div');
      card.className = 'deploy-card';
      const st = d.status || 'building';
      const pages = d.pagesUrl || d.url || '#';
      const repo = d.repoUrl || d.checkUrl || '#';
      card.innerHTML =
        '<div class="deploy-top">' +
          '<div><div class="deploy-repo">' + escapeHtml(d.label || d.repo) + '</div>' +
          '<div class="deploy-label">' + escapeHtml(d.repo || '') + (d.branch ? ' · ' + escapeHtml(d.branch) : '') + '</div></div>' +
          '<span class="pill ' + st + '"><span class="pill-dot"></span>' + escapeHtml(st) + '</span>' +
        '</div>' +
        (d.note ? '<div class="deploy-note">' + escapeHtml(d.note) + '</div>' : '') +
        '<div class="deploy-links">' +
          '<a href="' + escapeAttr(pages) + '" target="_blank" rel="noopener">Open site</a>' +
          '<a href="' + escapeAttr(repo) + '" target="_blank" rel="noopener">GitHub</a>' +
        '</div>';
      deploysEl.appendChild(card);
    });
  }

  function renderDesks(desks, jesusDeskId) {
    mapEl.querySelectorAll('.desk').forEach(n => n.remove());
    (desks || []).forEach(d => {
      const el = document.createElement('div');
      el.className = 'desk' + (d.id === jesusDeskId ? ' jesus' : '') + (d.id === 'desk-meeting' ? ' meeting' : '');
      const p = deskPos(d);
      el.style.left = p.left + '%';
      el.style.top = p.top + '%';
      el.innerHTML = '<span class="desk-label">' + escapeHtml(d.label) + '</span>';
      mapEl.appendChild(el);
    });
  }

  function ensureSprite(key, opts) {
    let el = spriteEls[key];
    if (!el) {
      el = document.createElement('button');
      el.type = 'button';
      el.className = 'sprite';
      el.innerHTML =
        '<div class="body">' +
          '<span class="ring"></span>' +
          '<img class="cast" alt="" draggable="false"/>' +
          '<span class="swatch-fallback" hidden></span>' +
        '</div>' +
        '<div class="tag"></div>';
      el.addEventListener('click', () => { if (opts.onTap) opts.onTap(); });
      mapEl.appendChild(el);
      spriteEls[key] = el;
    }
    return el;
  }

  function setCastOrFallback(el, src, color, letter) {
    const img = el.querySelector('img.cast');
    const fb = el.querySelector('.swatch-fallback');
    if (!src) {
      img.hidden = true;
      img.removeAttribute('src');
      fb.hidden = false;
      fb.style.background = color || '#94a3b8';
      fb.textContent = letter || '?';
      return;
    }
    fb.hidden = true;
    img.hidden = false;
    img.onerror = function () {
      img.hidden = true;
      img.removeAttribute('src');
      fb.hidden = false;
      fb.style.background = color || '#94a3b8';
      fb.textContent = letter || '?';
    };
    if (img.getAttribute('src') !== src) img.src = src;
  }

  function placeSprite(el, pos, immediate) {
    if (immediate) {
      el.style.transition = 'none';
      el.style.left = pos.left + '%';
      el.style.top = pos.top + '%';
      void el.offsetWidth;
      el.style.transition = '';
    } else {
      el.style.left = pos.left + '%';
      el.style.top = pos.top + '%';
    }
  }

  function shortInternLabel(intern) {
    const raw = (intern.label || intern.task || intern.id || 'intern').trim();
    return raw.length > 14 ? raw.slice(0, 13) + '…' : raw;
  }

  function renderSprites(data, first) {
    const desksById = {};
    (data.desks || []).forEach(d => { desksById[d.id] = d; });
    deskIndex = desksById;
    const seen = new Set();
    const jesusId = data.jesusDeskId;

    const deskInternCursor = {};

    (data.bots || []).forEach(bot => {
      const color = bot.color || '#94a3b8';
      const castEntry = resolveCastEntry(bot, data);
      const mainKey = 'main:' + bot.id;
      seen.add(mainKey);
      const main = bot.main || {};
      const mainStatus = main.status || bot.status || 'idle';
      const deskPosMain = deskPos(desksById[bot.deskId] || desksById[main.atDeskId]);
      const usePos = (main.x != null && main.y != null)
        ? resolvePos(main, desksById, bot.deskId)
        : offsetAround(deskPosMain, 0, 'main', false);

      const el = ensureSprite(mainKey, { onTap: () => openSheet(bot) });
      el.className = 'sprite main status-' + mainStatus;
      const frame = mainFrameForStatus(mainStatus);
      const src = castSrc(castEntry, frame);
      setCastOrFallback(el, src, color, initials(bot.name));
      el.querySelector('.tag').textContent = bot.name;
      placeSprite(el, usePos, first && !animTargets[mainKey]);
      animTargets[mainKey] = usePos;

      (bot.interns || []).forEach((intern) => {
        const key = 'intern:' + bot.id + ':' + intern.id;
        seen.add(key);
        const ist = intern.status || 'idle';
        const at = intern.atDeskId || bot.deskId;
        deskInternCursor[at] = (deskInternCursor[at] || 0) + 1;
        const slot = deskInternCursor[at];
        const base = (intern.x != null && intern.y != null)
          ? resolvePos(intern, desksById, bot.deskId)
          : deskPos(desksById[at] || desksById[bot.deskId]);
        const isPerm = ist === 'needs_permission' && at === jesusId;
        const finalPos = (intern.x != null && intern.y != null)
          ? base
          : offsetAround(base, slot, 'intern', at === jesusId);
        const iel = ensureSprite(key, { onTap: () => openSheet(bot) });
        iel.className = 'sprite intern status-' + ist + (isPerm ? ' perm-alert' : '');
        // Interns always use intern_idle when cast exists (CAST_MAP).
        // Exception: needs_permission uses needs_permission frame if available.
        const internFrame = (ist === 'needs_permission') ? 'needs_permission' : 'intern_idle';
        const isrc = castSrc(castEntry, internFrame) || castSrc(castEntry, 'intern_idle');
        setCastOrFallback(iel, isrc, color, 'i');
        iel.querySelector('.tag').textContent = shortInternLabel(intern);
        placeSprite(iel, finalPos, first && !animTargets[key]);
        animTargets[key] = finalPos;
      });
    });

    const pack = Object.keys(animTargets).filter(k => seen.has(k)).map(k => ({
      key: k, left: animTargets[k].left, top: animTargets[k].top
    }));
    separateSprites(pack, 8.0);
    pack.forEach(p => {
      animTargets[p.key] = { left: p.left, top: p.top };
      if (spriteEls[p.key]) placeSprite(spriteEls[p.key], animTargets[p.key], first);
    });

    Object.keys(spriteEls).forEach(k => {
      if (!seen.has(k)) {
        spriteEls[k].remove();
        delete spriteEls[k];
        delete animTargets[k];
      }
    });
  }

  function renderBotList(data) {
    botListEl.innerHTML = '';
    (data.bots || []).forEach(bot => {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'bot-row';
      const st = bot.status || 'idle';
      row.innerHTML =
        '<span class="swatch" style="background:' + escapeAttr(bot.color || '#94a3b8') + '"></span>' +
        '<span class="name">' + escapeHtml(bot.name) + '</span>' +
        '<span class="task">' + escapeHtml(bot.task || '') + '</span>' +
        '<span class="status-chip ' + st + '">' + escapeHtml(st.replace(/_/g,' ')) + '</span>';
      row.addEventListener('click', () => openSheet(bot));
      botListEl.appendChild(row);
    });
  }

  function renderAlert(data) {
    const hits = permissionInterns(data);
    if (hits.length) {
      const labels = hits.map(h => h.bot.name + ': ' + (h.intern.label || h.intern.task || 'permission')).join(' · ');
      alertEl.textContent = '⚠ PERMISSION at Jesus desk — ' + labels;
      alertEl.classList.add('show');
      mapWrap.classList.add('high-alert');
    } else {
      alertEl.classList.remove('show');
      mapWrap.classList.remove('high-alert');
    }
  }

  function applyState(data, first) {
    state = data;
    lastGood = data;
    if (data.world && data.world.w && data.world.h) {
      WORLD.w = data.world.w;
      WORLD.h = data.world.h;
      mapEl.style.width = WORLD.w + 'px';
      mapEl.style.height = WORLD.h + 'px';
    }
    renderDeploys(data.deploys);
    renderDesks(data.desks, data.jesusDeskId);
    renderSprites(data, first);
    renderBotList(data);
    renderAlert(data);
    const t = data.updatedAt || '';
    window.__stateUpdatedAt = t ? Date.parse(t) : Date.now();
    window.__lastFetchOk = Date.now();
    tickAge();
    errEl.classList.remove('show');
  }

  function openSheet(bot) {
    $('s-name').textContent = bot.name;
    const st = bot.status || 'idle';
    $('s-meta').textContent = st.replace(/_/g, ' ') + ' · desk ' + (bot.deskId || '—');
    $('s-task').textContent = bot.task || (bot.main && bot.main.task) || '—';
    const box = $('s-interns');
    const interns = bot.interns || [];
    if (!interns.length) {
      box.innerHTML = '<h3>Interns</h3><div class="intern-item" style="border:0;color:var(--muted)">None active</div>';
    } else {
      box.innerHTML = '<h3>Interns</h3>' + interns.map(i => {
        const perm = i.status === 'needs_permission' && i.atDeskId === (state && state.jesusDeskId);
        return '<div class="intern-item">' +
          '<span class="status-chip ' + (i.status||'') + '">' + escapeHtml((i.status||'').replace(/_/g,' ')) + '</span>' +
          '<span>' + escapeHtml(i.label || i.id) + (i.task ? ' — ' + escapeHtml(i.task) : '') +
          (perm ? ' <strong style="color:#fb7185">@ Jesus</strong>' : '') +
          ' <span style="color:var(--muted);font-size:.68rem">(' + escapeHtml(i.atDeskId||'') + ')</span></span></div>';
      }).join('');
    }
    sheet.classList.add('open');
    backdrop.classList.add('open');
  }

  function closeSheet() {
    sheet.classList.remove('open');
    backdrop.classList.remove('open');
  }
  $('sheet-close').addEventListener('click', closeSheet);
  backdrop.addEventListener('click', closeSheet);

  /* —— Map pan / zoom (industry-bar: 1-finger pan, pinch mid, wheel, clamp) —— */
  const MIN_ZOOM = 0.55;
  const MAX_ZOOM = 2.5;
  const view = { x: 0, y: 0, z: 1 };
  let inertiaRaf = null;
  let vel = { x: 0, y: 0 };
  let dragging = false;
  let lastPtr = null;
  let moved = false;
  const pointers = new Map(); // id -> {x,y}
  let pinch = null; // {dist, midX, midY, viewX, viewY, viewZ}

  function applyView(withTransition) {
    if (withTransition) {
      mapEl.style.transition = 'transform .2s ease-out';
    } else {
      mapEl.style.transition = 'none';
    }
    mapEl.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.z + ')';
  }

  function clampView() {
    const vw = mapWrap.clientWidth;
    const vh = mapWrap.clientHeight;
    const mw = WORLD.w * view.z;
    const mh = WORLD.h * view.z;
    // Keep map covering viewport; if smaller on an axis, center it.
    if (mw <= vw) {
      view.x = (vw - mw) / 2;
    } else {
      view.x = Math.min(0, Math.max(vw - mw, view.x));
    }
    if (mh <= vh) {
      view.y = (vh - mh) / 2;
    } else {
      view.y = Math.min(0, Math.max(vh - mh, view.y));
    }
  }

  function setZoomAt(nx, ny, newZ) {
    // Keep world point under (nx,ny) viewport coords fixed
    const wz = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, newZ));
    const wx = (nx - view.x) / view.z;
    const wy = (ny - view.y) / view.z;
    view.z = wz;
    view.x = nx - wx * view.z;
    view.y = ny - wy * view.z;
    clampView();
    applyView(false);
  }

  function fitReset() {
    const vw = mapWrap.clientWidth || 1;
    const vh = mapWrap.clientHeight || 1;
    // Fit whole map with a little padding, then clamp to zoom limits
    const zFit = Math.min(vw / WORLD.w, vh / WORLD.h) * 0.96;
    view.z = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zFit));
    view.x = (vw - WORLD.w * view.z) / 2;
    view.y = (vh - WORLD.h * view.z) / 2;
    clampView();
    applyView(true);
  }

  function stopInertia() {
    if (inertiaRaf) { cancelAnimationFrame(inertiaRaf); inertiaRaf = null; }
    vel.x = 0; vel.y = 0;
  }

  function startInertia() {
    stopInertia();
    const friction = 0.92;
    const minV = 0.35;
    function step() {
      if (Math.hypot(vel.x, vel.y) < minV) { inertiaRaf = null; return; }
      view.x += vel.x;
      view.y += vel.y;
      clampView();
      applyView(false);
      vel.x *= friction;
      vel.y *= friction;
      inertiaRaf = requestAnimationFrame(step);
    }
    inertiaRaf = requestAnimationFrame(step);
  }

  function ptrPos(e) {
    const r = mapWrap.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function updatePinch(e) {
    const pts = [...pointers.values()];
    if (pts.length < 2) return;
    const dx = pts[1].x - pts[0].x;
    const dy = pts[1].y - pts[0].y;
    const dist = Math.hypot(dx, dy) || 1;
    const midX = (pts[0].x + pts[1].x) / 2;
    const midY = (pts[0].y + pts[1].y) / 2;
    if (!pinch) {
      pinch = { dist, midX, midY, viewX: view.x, viewY: view.y, viewZ: view.z };
      return;
    }
    const scale = dist / pinch.dist;
    setZoomAt(midX, midY, pinch.viewZ * scale);
    // also allow midpoint drift as pan
    const dmx = midX - pinch.midX;
    const dmy = midY - pinch.midY;
    view.x += dmx;
    view.y += dmy;
    pinch.midX = midX;
    pinch.midY = midY;
    // rebase so subsequent scales compound from current
    pinch.dist = dist;
    pinch.viewZ = view.z;
    pinch.viewX = view.x;
    pinch.viewY = view.y;
    clampView();
    applyView(false);
  }

  mapWrap.addEventListener('pointerdown', (e) => {
    if (e.target.closest && e.target.closest('#map-controls')) return;
    const p = ptrPos(e);
    pointers.set(e.pointerId, p);
    stopInertia();
    if (pointers.size === 1) {
      dragging = true;
      moved = false;
      lastPtr = { ...p, t: performance.now() };
      vel = { x: 0, y: 0 };
    } else if (pointers.size === 2) {
      dragging = false;
      pinch = null;
      // Capture both fingers for pinch
      pointers.forEach((_, id) => { try { mapWrap.setPointerCapture(id); } catch (_) {} });
      updatePinch(e);
    }
  });

  mapWrap.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    const p = ptrPos(e);
    pointers.set(e.pointerId, p);
    if (pointers.size >= 2) {
      updatePinch(e);
      moved = true;
      return;
    }
    if (!dragging || !lastPtr) return;
    const dx = p.x - lastPtr.x;
    const dy = p.y - lastPtr.y;
    if (!moved && Math.hypot(dx, dy) > 4) {
      moved = true;
      mapWrap.classList.add('panning');
      try { mapWrap.setPointerCapture(e.pointerId); } catch (_) {}
    }
    if (!moved) return; // preserve sprite taps
    const now = performance.now();
    const dt = Math.max(1, now - lastPtr.t);
    vel.x = dx * (16 / dt);
    vel.y = dy * (16 / dt);
    view.x += dx;
    view.y += dy;
    lastPtr = { ...p, t: now };
    clampView();
    applyView(false);
  });

  function endPtr(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) {
      dragging = false;
      mapWrap.classList.remove('panning');
      lastPtr = null;
      if (moved && (Math.hypot(vel.x, vel.y) > 0.8)) startInertia();
    } else if (pointers.size === 1) {
      // resume single-finger pan from remaining point
      const rem = [...pointers.values()][0];
      dragging = true;
      lastPtr = { ...rem, t: performance.now() };
      vel = { x: 0, y: 0 };
    }
  }
  mapWrap.addEventListener('pointerup', endPtr);
  mapWrap.addEventListener('pointercancel', endPtr);
  mapWrap.addEventListener('lostpointercapture', endPtr);

  // Suppress sprite click if we panned
  mapWrap.addEventListener('click', (e) => {
    if (moved) {
      e.stopPropagation();
      e.preventDefault();
      moved = false;
    }
  }, true);

  mapWrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    stopInertia();
    const p = ptrPos(e);
    const factor = e.deltaY < 0 ? 1.1 : (1 / 1.1);
    setZoomAt(p.x, p.y, view.z * factor);
  }, { passive: false });

  $('zoom-in').addEventListener('click', () => {
    stopInertia();
    setZoomAt(mapWrap.clientWidth / 2, mapWrap.clientHeight / 2, view.z * 1.2);
  });
  $('zoom-out').addEventListener('click', () => {
    stopInertia();
    setZoomAt(mapWrap.clientWidth / 2, mapWrap.clientHeight / 2, view.z / 1.2);
  });
  $('zoom-reset').addEventListener('click', () => { stopInertia(); fitReset(); });

  // Size map element to WORLD
  mapEl.style.width = WORLD.w + 'px';
  mapEl.style.height = WORLD.h + 'px';

  window.addEventListener('resize', () => { clampView(); applyView(false); });
  // Initial fit after layout
  requestAnimationFrame(() => fitReset());


  function tickAge() {
    if (!window.__lastFetchOk) { updatedEl.textContent = 'connecting…'; return; }
    const age = Math.max(0, Math.floor((Date.now() - window.__lastFetchOk) / 1000));
    updatedEl.textContent = 'updated ' + age + 's ago';
    updatedEl.classList.toggle('stale', age > 5);
  }
  setInterval(tickAge, 250);

  let firstLoad = true;
  async function poll() {
    const bust = '?t=' + Date.now();
    let lastErr = null;
    for (const base of STATE_URLS) {
      try {
        const res = await fetch(base + bust, { cache: 'no-store' });
        if (!res.ok) { lastErr = new Error('HTTP ' + res.status + ' ' + base); continue; }
        const data = await res.json();
        applyState(data, firstLoad);
        firstLoad = false;
        return;
      } catch (e) {
        lastErr = e;
      }
    }
    updatedEl.textContent = 'Offline — last good';
    updatedEl.classList.add('stale');
    errEl.textContent = 'Fetch failed: ' + (lastErr && lastErr.message ? lastErr.message : 'unknown') + (lastGood ? ' (showing last good state)' : '');
    errEl.classList.add('show');
    if (lastGood) applyState(lastGood, false);
  }

  poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
