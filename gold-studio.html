<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Gold Studio — Knights</title>
<style>
:root{color-scheme:dark;--bg:#0c0c0e;--fg:#f3f0ea;--muted:#9a958c;--card:#16161a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:14px 16px;position:sticky;top:0;background:rgba(12,12,14,.92);backdrop-filter:blur(8px);z-index:2}
h1{margin:0;font-size:1.1rem}p{margin:6px 0 0;color:var(--muted);font-size:.85rem}
h2{margin:18px 12px 8px;font-size:.95rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
main{max-width:900px;margin:0 auto;padding:0 12px 40px;display:flex;flex-direction:column;gap:16px}
figure{margin:0;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid #2a2a32}
img{width:100%;height:auto;display:block}
figcaption{padding:10px 12px;color:var(--muted);font-size:.88rem}
</style>
</head>
<body>
<header>
  <h1>Knights — painted + plate Blender</h1>
  <p>Tap an image for fullscreen</p>
</header>
<h2>Painted (from your refs)</h2>
<main id="paint">
<figure><a href="gold-studio/paint_lava_knight.png?v=1"><img src="gold-studio/paint_lava_knight.png?v=1" alt="Painted lava knight"/></a><figcaption>Lava knight — painted</figcaption></figure>
<figure><a href="gold-studio/paint_redgold_knight.png?v=1"><img src="gold-studio/paint_redgold_knight.png?v=1" alt="Painted red-gold knight"/></a><figcaption>Red/gold knight — painted</figcaption></figure>
<figure><a href="gold-studio/paint_hero_knight.png?v=1"><img src="gold-studio/paint_hero_knight.png?v=1" alt="Painted hero knight"/></a><figcaption>Hero knight — painted</figcaption></figure>
<figure><a href="gold-studio/paint_gold_plate_knight.png?v=1"><img src="gold-studio/paint_gold_plate_knight.png?v=1" alt="Painted gold plate knight"/></a><figcaption>Gold plate knight — painted</figcaption></figure>
</main>
<h2>Plate-only Blender (no spheres)</h2>
<main id="plate">
<figure><img src="gold-studio/plate_lava_knight.png?v=1" alt="Plate lava"/><figcaption>Lava — plate Blender (when ready)</figcaption></figure>
<figure><img src="gold-studio/plate_redgold_knight.png?v=1" alt="Plate redgold"/><figcaption>Red/gold — plate Blender (when ready)</figcaption></figure>
<figure><img src="gold-studio/plate_hero_knight.png?v=1" alt="Plate hero"/><figcaption>Hero — plate Blender (when ready)</figcaption></figure>
<figure><img src="gold-studio/plate_gold_knight.png?v=1" alt="Plate gold"/><figcaption>Gold plate — plate Blender (when ready)</figcaption></figure>
</main>
</body>
</html>
