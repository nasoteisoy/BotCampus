<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>C · Shadow Takedown — Iso Stealth</title>
<style>
  html,body{margin:0;height:100%;background:#070b0a;color:#e8f0ec;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{display:flex;flex-direction:column;height:100%;height:100dvh}
  header{padding:8px 12px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-shrink:0}
  h1{margin:0;font-size:.95rem;font-weight:750}
  .hint{color:#6f8a7c;font-size:.72rem}
  #stage{position:relative;flex:1;min-height:0;touch-action:none}
  canvas{display:block;width:100%;height:100%;touch-action:none;background:#0c1410}
  #hud{position:absolute;top:8px;left:8px;right:8px;pointer-events:none;display:flex;justify-content:space-between;gap:8px;font-size:.8rem;font-weight:700;text-shadow:0 1px 3px #000}
  #hud span{background:rgba(0,0,0,.45);padding:4px 8px;border-radius:8px}
  #pads{position:absolute;left:0;right:0;bottom:0;height:40%;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;padding:12px 14px calc(12px + env(safe-area-inset-bottom));gap:12px}
  .stick-zone{pointer-events:auto;width:40%;max-width:150px;aspect-ratio:1;position:relative;touch-action:none}
  .stick-base{position:absolute;inset:8%;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(134,239,172,.25)}
  .stick-knob{position:absolute;width:44%;height:44%;left:28%;top:28%;border-radius:50%;background:rgba(134,239,172,.28);border:2px solid rgba(134,239,172,.5);transform:translate(0,0)}
  .actions{pointer-events:auto;display:flex;flex-direction:column;gap:10px;align-items:flex-end;margin-bottom:4px}
  .actions button{appearance:none;min-width:72px;min-height:56px;width:72px;border-radius:16px;border:2px solid #4ade80;background:rgba(20,83,45,.88);color:#fff;font:inherit;font-weight:800;font-size:.78rem;touch-action:none}
  .actions button:active,.actions button.held{background:#166534;transform:scale(.94)}
  #dashBtn{border-color:#a3e635;background:rgba(63,98,18,.88)}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,10,8,.75);pointer-events:none;opacity:0;transition:opacity .15s}
  #overlay.show{opacity:1;pointer-events:auto}
  #overlay .card{background:#102018;border:1px solid #2f5d45;border-radius:16px;padding:20px 24px;text-align:center;max-width:290px}
  #overlay button{margin-top:12px;min-height:48px;min-width:120px;appearance:none;border:1px solid #4ade80;background:#14532d;color:#fff;border-radius:14px;font:inherit;font-weight:700;font-size:1rem;padding:12px 20px}

/* STYLE_LOCK Render A */
html,body{background:#080c18;color:#e2e8f0}
canvas{background:#0b1020}
.stick-base{background:rgba(148,163,184,.18);border-color:rgba(148,163,184,.4)}
.stick-knob{background:rgba(226,232,240,.35);border-color:rgba(248,113,113,.5)}
#overlay .card{background:#0f172a;border-color:#334155}
#overlay button{border-color:#fbbf24;background:#7f1d1d}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>C · Shadow Takedown</h1>
    <div class="hint">Stick move · Dash · Takedown from behind</div>
  </header>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud">
      <span id="hudScore">Marks 0/6</span>
      <span id="hudAlert">Alert Calm</span>
      <span id="hudDash">Dash Ready</span>
    </div>
    <div id="pads">
      <div class="stick-zone" id="moveStick" aria-label="Move">
        <div class="stick-base"><div class="stick-knob" id="moveKnob"></div></div>
      </div>
      <div class="actions">
        <button type="button" id="dashBtn">DASH</button>
        <button type="button" id="atkBtn">TAKE</button>
      </div>
    </div>
    <div id="overlay">
      <div class="card">
        <div id="ovTitle" style="font-size:1.2rem;font-weight:800">Shadow Takedown</div>
        <div id="ovBody" style="margin-top:8px;color:#8faf9c;font-size:.9rem">Iso stealth. Stay out of cones. Strike unseen.</div>
        <button type="button" id="ovBtn">Play</button>
      </div>
    </div>
  </div>
</div>
<script src="game.js?v=opt2"></script>
</body>
</html>
