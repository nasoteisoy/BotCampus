<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Phone combat — style worlds</title>
<style>
body{margin:0;background:#0c1118;color:#e2e8f0;font:400 1rem/1.45 system-ui,sans-serif}
main{max-width:52rem;margin:0 auto;padding:1rem}
h1{font-size:1.2rem}
.card{background:#151c27;border:1px solid #334155;border-radius:14px;padding:.85rem;margin:1rem 0}
img{width:100%;height:auto;border-radius:10px;display:block;margin:.5rem 0}
.row{display:grid;gap:.6rem;grid-template-columns:1fr 1fr}
@media(max-width:520px){.row{grid-template-columns:1fr}}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 1rem;
  border-radius:10px;background:#38bdf8;color:#0c4a6e;font-weight:800;text-decoration:none;margin:.25rem .35rem .25rem 0}
</style>
</head>
<body>
<main>
<h1>Style worlds (Render A) — pick a feel</h1>
<p>Three different art directions for the phone combat options. Play the matching prototype after you like a look.</p>

<section class="card">
  <h2>A — Neon cyber · twin-stick</h2>
  <div class="row">
    <img src="a/art/style_world.png" alt="A style world neon cyber top-down"/>
    <img src="a/art/hero_silhouette.png" alt="A hero silhouette"/>
  </div>
  <a class="btn" href="a/?v=opt3">Play A</a>
</section>

<section class="card">
  <h2>B — Whimsy stubby · side slash</h2>
  <div class="row">
    <img src="b/art/style_world.png" alt="B style world whimsy side view"/>
    <img src="b/art/hero_silhouette.png" alt="B hero silhouette"/>
  </div>
  <a class="btn" href="b/?v=opt3">Play B</a>
</section>

<section class="card">
  <h2>C — Painterly iso noir · stealth</h2>
  <div class="row">
    <img src="c/art/style_world.png" alt="C style world painterly iso noir"/>
    <img src="c/art/hero_silhouette.png" alt="C hero silhouette"/>
  </div>
  <a class="btn" href="c/?v=opt3">Play C</a>
</section>
</main>
</body>
</html>
