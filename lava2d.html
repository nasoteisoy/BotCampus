<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Lava Knight 2D</title>
<style>
  html,body{margin:0;height:100%;background:#07080c;color:#f4f0e8;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{display:flex;flex-direction:column;height:100%;height:100dvh}
  header{padding:10px 14px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
  h1{margin:0;font-size:1.05rem;font-weight:750}
  .hint{color:#8b93a7;font-size:.78rem}
  canvas{display:block;width:100%;flex:1;min-height:180px;touch-action:none;background:#0c1018}
  #pad{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:10px;padding:10px 14px calc(14px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;width:100%}
  button{appearance:none;border:1px solid #3a455c;background:#171e2b;color:#fff;border-radius:16px;padding:18px 8px;font:inherit;font-weight:700;font-size:1rem}
  button:active{background:#2a3548;transform:scale(.98)}
  #atk{grid-column:1/-1;background:#7c2d12;border-color:#fb923c;padding:20px}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>Lava Knight</h1>
    <div class="hint">← → · Jump · Attack</div>
  </header>
  <canvas id="c"></canvas>
  <div id="pad">
    <button type="button" id="left">◀</button>
    <button type="button" id="jump">Jump</button>
    <button type="button" id="right">▶</button>
    <button type="button" id="atk">Attack 🔥</button>
  </div>
</div>
<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
const v="?v=3";
const imgs={
  idle:load("lava2d/idle.png"+v),
  run1:load("lava2d/run1.png"+v),
  run2:load("lava2d/run2.png"+v),
  jump:load("lava2d/jump.png"+v),
  attack:load("lava2d/attack.png"+v),
};
function load(src){const i=new Image(); i.src=src; return i;}

const keys={};
const P={
  x:140,y:0,vx:0,vy:0,facing:1,
  onGround:false,coyote:0,jumpBuf:0,
  attackT:0,anim:0,w:0,h:0,groundY:0,spawned:false
};

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  const r=canvas.getBoundingClientRect();
  canvas.width=Math.floor(r.width*dpr);
  canvas.height=Math.floor(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  P.w=r.width; P.h=r.height;
  P.groundY=r.height-78;
  if(!P.spawned){ P.y=P.groundY-155; P.spawned=true; }
}
addEventListener("resize",resize); resize();

function hold(el,code){
  const down=e=>{e.preventDefault(); keys[code]=true;};
  const up=e=>{e.preventDefault(); keys[code]=false;};
  el.addEventListener("pointerdown",down);
  ["pointerup","pointerleave","pointercancel"].forEach(t=>el.addEventListener(t,up));
}
hold(document.getElementById("left"),"Left");
hold(document.getElementById("right"),"Right");
document.getElementById("jump").addEventListener("pointerdown",e=>{e.preventDefault(); P.jumpBuf=0.14;});
document.getElementById("atk").addEventListener("pointerdown",e=>{e.preventDefault(); keys.Atk=true;});

addEventListener("keydown",e=>{
  if(["ArrowLeft","KeyA"].includes(e.code)){ keys.Left=true; e.preventDefault(); }
  if(["ArrowRight","KeyD"].includes(e.code)){ keys.Right=true; e.preventDefault(); }
  if(["ArrowUp","Space","KeyW"].includes(e.code)){ P.jumpBuf=0.14; e.preventDefault(); }
  if(e.code==="KeyZ"||e.code==="KeyJ"){ keys.Atk=true; e.preventDefault(); }
});
addEventListener("keyup",e=>{
  if(["ArrowLeft","KeyA"].includes(e.code)) keys.Left=false;
  if(["ArrowRight","KeyD"].includes(e.code)) keys.Right=false;
});

let last=performance.now();
function tick(now){
  const dt=Math.min(0.033,(now-last)/1000); last=now;
  const speed=310, accel=2200, fric=1800, grav=2100, jumpV=-560;

  if(P.attackT<=0){
    if(keys.Left){ P.vx=Math.max(P.vx-accel*dt,-speed); P.facing=-1; }
    else if(keys.Right){ P.vx=Math.min(P.vx+accel*dt,speed); P.facing=1; }
    else {
      if(P.vx>0) P.vx=Math.max(0,P.vx-fric*dt);
      if(P.vx<0) P.vx=Math.min(0,P.vx+fric*dt);
    }
  } else P.vx*=0.85;

  if(P.onGround) P.coyote=0.1; else P.coyote=Math.max(0,P.coyote-dt);
  P.jumpBuf=Math.max(0,P.jumpBuf-dt);
  if(P.jumpBuf>0 && P.coyote>0 && P.attackT<=0){
    P.vy=jumpV; P.onGround=false; P.coyote=0; P.jumpBuf=0;
  }

  if(keys.Atk){ keys.Atk=false; if(P.attackT<=0) P.attackT=0.38; }
  if(P.attackT>0) P.attackT-=dt;

  P.vy+=grav*dt;
  P.x+=P.vx*dt; P.y+=P.vy*dt;

  const spriteH=155;
  const floor=P.groundY-8;
  if(P.y+spriteH>=floor){ P.y=floor-spriteH; P.vy=0; P.onGround=true; }
  else P.onGround=false;
  P.x=Math.max(50,Math.min(P.w-50,P.x));
  P.anim+=dt*(1+Math.abs(P.vx)/speed);

  // sky
  const g=ctx.createLinearGradient(0,0,0,P.h);
  g.addColorStop(0,"#152033"); g.addColorStop(1,"#0a0c12");
  ctx.fillStyle=g; ctx.fillRect(0,0,P.w,P.h);
  // distant hills
  ctx.fillStyle="#121820";
  ctx.beginPath(); ctx.moveTo(0,P.groundY-40);
  for(let x=0;x<=P.w;x+=60) ctx.quadraticCurveTo(x+30,P.groundY-55-Math.sin(x*0.02)*12,x+60,P.groundY-40);
  ctx.lineTo(P.w,P.h); ctx.lineTo(0,P.h); ctx.fill();
  // ground
  ctx.fillStyle="#2a1c12"; ctx.fillRect(0,P.groundY,P.w,P.h-P.groundY);
  ctx.fillStyle="#3b2818";
  for(let x=0;x<P.w;x+=36) ctx.fillRect(x,P.groundY,18,7);
  ctx.fillStyle="rgba(251,146,60,0.12)"; ctx.fillRect(0,P.groundY-5,P.w,5);

  // pick sprite
  let img=imgs.idle;
  if(P.attackT>0) img=imgs.attack;
  else if(!P.onGround) img=imgs.jump;
  else if(Math.abs(P.vx)>25) img=(Math.floor(P.anim*10)%2===0)?imgs.run1:imgs.run2;

  const drawW=140, drawH=155;
  const bob=(P.onGround&&Math.abs(P.vx)>25)?Math.sin(P.anim*16)*2.5:0;
  ctx.save();
  ctx.translate(P.x, P.y+bob);
  // flip: run1 may face left in art — normalize so facing 1 = right
  let flip=P.facing;
  // if using run1 which faces left in some gens, invert when that frame
  if(img===imgs.run1) flip*=-1;
  ctx.scale(flip,1);
  if(img.complete&&img.naturalWidth) ctx.drawImage(img,-drawW/2,0,drawW,drawH);
  else { ctx.fillStyle="#555"; ctx.fillRect(-40,30,80,100); }
  if(P.attackT>0.18){
    ctx.globalAlpha=0.45;
    ctx.fillStyle="#fb923c";
    ctx.beginPath(); ctx.ellipse(58,72,34,22,0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
