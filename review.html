<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta name="theme-color" content="#0c1118"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Review — Bot Campus</title>
<!-- CACHE_BUST v=2 live-poll -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0c1118; --panel:#151c27; --line:#243044; --text:#e8eef6; --muted:#8b9bb0;
  --jesus:#fbbf24; --alert:#f43f5e; --ready:#22c55e; --build:#f59e0b; --accent:#7dd3fc;
}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:0 0 calc(1rem + env(safe-area-inset-bottom)); overscroll-behavior:none}

header.sticky{
  position:sticky; top:0; z-index:50;
  padding:calc(.55rem + env(safe-area-inset-top)) .85rem .55rem;
  background:linear-gradient(180deg,#0c1118f5,#0c1118e8); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  display:flex; align-items:flex-start; justify-content:space-between; gap:.5rem;
}
header h1{margin:0;font-size:1.15rem;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:.45rem}
.live-badge{
  display:none; align-items:center; gap:.28rem;
  font-size:.58rem; font-weight:900; letter-spacing:.06em; text-transform:uppercase;
  color:#052e16; background:var(--ready); border-radius:999px; padding:.18rem .45rem;
}
.live-badge.on{display:inline-flex}
.live-pulse{
  width:.45rem; height:.45rem; border-radius:50%; background:#052e16;
  box-shadow:0 0 0 0 #22c55e88; animation:pulse 1.2s ease-out infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 #22c55eaa}
  70%{box-shadow:0 0 0 6px #22c55e00}
  100%{box-shadow:0 0 0 0 #22c55e00}
}
#updated{font-size:.7rem;color:var(--muted);font-weight:600;text-align:right;line-height:1.25}
#updated.stale{color:var(--alert)}
header .links{display:flex;gap:.55rem;margin-top:.15rem;flex-wrap:wrap}
header .links a{font-size:.68rem;font-weight:700;color:var(--accent);text-decoration:none}

main{padding:.75rem .75rem 1.6rem; max-width:560px; margin:0 auto}

.note{
  font-size:.68rem; color:var(--muted); font-weight:600; line-height:1.35;
  margin:0 0 .75rem; padding:.5rem .65rem; border-radius:10px;
  background:#0f172a88; border:1px solid var(--line);
}

.section-title{
  margin:.85rem 0 .45rem; font-size:.66rem; font-weight:800; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted);
}
.section-title:first-of-type{margin-top:.15rem}

#open-list,#waiting-list,#dismissed-list{display:flex; flex-direction:column; gap:.55rem}

.card{
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  padding:.85rem .85rem .75rem;
  transition:opacity .28s ease, transform .28s ease, max-height .28s ease, margin .28s ease, padding .28s ease;
  max-height:480px; overflow:hidden;
}
.card.leaving{opacity:0; transform:translateY(-10px) scale(.97); max-height:0; margin:0; padding:0; border-width:0}
.card.waiting{opacity:.72; border-style:dashed}
.card.dismissed-hist{opacity:.55}
.card.auto{border-color:#38bdf866}

.card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:.5rem}
.card-title{margin:0; font-size:.95rem; font-weight:800; letter-spacing:-.015em; line-height:1.25}
.card-summary{margin:.4rem 0 0; font-size:.78rem; color:#c5d0de; line-height:1.4; font-weight:500}
.card-meta{margin-top:.45rem; display:flex; flex-wrap:wrap; gap:.35rem; align-items:center}
.owner{font-size:.68rem; color:var(--muted); font-weight:700}

.pill{
  display:inline-flex; align-items:center; gap:.28rem;
  border-radius:999px; padding:.16rem .5rem; font-size:.62rem; font-weight:800;
  text-transform:uppercase; letter-spacing:.04em;
}
.pill.open{background:#14532d55; color:var(--ready); border:1px solid #22c55e66}
.pill.waiting{background:#78350f55; color:var(--build); border:1px solid #f59e0b66}
.pill.done{background:#1e293b88; color:var(--muted); border:1px solid #47556966}
.pill.kind{background:#1e3a5f55; color:#93c5fd; border:1px solid #38bdf866}

.actions{margin-top:.7rem; display:flex; flex-direction:column; gap:.45rem}
.btn{
  display:flex; align-items:center; justify-content:center; gap:.4rem;
  width:100%; min-height:48px; border-radius:14px; border:2px solid transparent;
  font-size:.92rem; font-weight:800; cursor:pointer; text-decoration:none;
  touch-action:manipulation; -webkit-user-select:none; user-select:none;
}
.btn:active{transform:scale(.97)}
.btn.open{
  background:linear-gradient(180deg,#38bdf8,#0ea5e9); color:#0c1118; border-color:#7dd3fc;
  box-shadow:0 2px 12px #0ea5e955;
}
.btn.done{
  background:#0b1220; color:#f8fafc; border-color:#64748b;
}
.btn.done:disabled,.btn:disabled{
  opacity:.4; cursor:not-allowed; transform:none;
}
.btn.copy{
  background:transparent; color:var(--muted); border:1px dashed var(--line);
  min-height:40px; font-size:.72rem; font-weight:700;
}
.btn.copy.ok{color:var(--ready); border-color:#22c55e66}

.empty{
  text-align:center; padding:2.2rem 1rem; border-radius:16px;
  background:var(--panel); border:1px dashed var(--line);
}
.empty h2{margin:0 0 .35rem; font-size:1.05rem; font-weight:800}
.empty p{margin:0; font-size:.78rem; color:var(--muted); font-weight:600}

details.dismissed-wrap{margin-top:1.1rem}
details.dismissed-wrap summary{
  cursor:pointer; font-size:.66rem; font-weight:800; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); list-style:none;
  padding:.35rem 0;
}
details.dismissed-wrap summary::-webkit-details-marker{display:none}
details.dismissed-wrap summary::before{content:"▸ "; opacity:.7}
details.dismissed-wrap[open] summary::before{content:"▾ "}

#err{display:none; margin-bottom:.7rem; padding:.75rem .85rem; border-radius:14px;
  background:#7f1d1dee; border:2px solid #fb7185; font-size:.95rem; font-weight:800; color:#ffe4e6;
  text-align:center; line-height:1.35}
#err.show{display:block}
</style>
</head>
<body>
<header class="sticky">
  <div>
    <h1>Review <span id="live-badge" class="live-badge" aria-live="polite"><span class="live-pulse" aria-hidden="true"></span>LIVE</span></h1>
    <div class="links">
      <a href="campus-live.html?v=11">Campus Live</a>
      <a href="sprite-lab.html?v=flow1">Sprite Lab</a>
    </div>
  </div>
  <div id="updated">Connecting…</div>
</header>

<main>
  <div id="err" role="alert"></div>
  <p class="note">Clears on this phone. Tell Leader if you want it cleared for everyone.</p>

  <div id="open-section">
    <div class="section-title">Needs you</div>
    <div id="open-list"></div>
    <div id="empty" class="empty" hidden>
      <h2>Nothing to review — nice.</h2>
      <p>New items will pop up here when crew marks ready_for_review.</p>
    </div>
  </div>

  <div id="waiting-section" hidden>
    <div class="section-title">Coming soon</div>
    <div id="waiting-list"></div>
  </div>

  <details class="dismissed-wrap" id="dismissed-section" hidden>
    <summary>Dismissed on this phone</summary>
    <div id="dismissed-list" style="margin-top:.45rem"></div>
  </details>
</main>

<script>
(function () {
  var LS_KEY = 'botcampus-review-dismissed';
  var POLL_MS = 1000;
  var LIVE_MS = 5000;
  var DATA_URL = 'campus/review-queue.json';
  var STATE_URL = 'campus/campus-state.json';
  var CAMPUS_LIVE_URL = 'https://nasoteisoy.github.io/BotCampus/campus-live.html?v=11';

  var updatedEl = document.getElementById('updated');
  var liveBadge = document.getElementById('live-badge');
  var errEl = document.getElementById('err');
  var openList = document.getElementById('open-list');
  var waitingList = document.getElementById('waiting-list');
  var waitingSection = document.getElementById('waiting-section');
  var dismissedList = document.getElementById('dismissed-list');
  var dismissedSection = document.getElementById('dismissed-section');
  var emptyEl = document.getElementById('empty');

  var lastJson = null;
  var lastFetchOkAt = 0;
  var queueUpdatedAt = null;
  var leaving = {};
  var tickTimer = null;

  function loadDismissed() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.filter(function (x) { return typeof x === 'string'; }) : [];
    } catch (e) { return []; }
  }

  function saveDismissed(ids) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(ids)); } catch (e) {}
  }

  function isDismissedLocal(id, dismissed) {
    return dismissed.indexOf(id) !== -1;
  }

  if (/(?:^|[?&])reset=1(?:&|$)/.test(location.search)) {
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    history.replaceState(null, '', location.pathname + '?v=2');
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function escapeAttr(s) {
    return escapeHtml(s).replace(/'/g, '&#39;');
  }

  function kindLabel(k) {
    if (k === 'campus') return 'Campus';
    if (k === 'sprites') return 'Sprites';
    if (k === 'auto') return 'Live crew';
    return 'Other';
  }

  function ageSeconds(iso) {
    if (!iso) return null;
    var t = Date.parse(iso);
    if (isNaN(t)) return null;
    return Math.max(0, Math.floor((Date.now() - t) / 1000));
  }

  function formatAgo(sec) {
    if (sec == null) return '';
    if (sec < 60) return sec + 's ago';
    if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
    if (sec < 86400) return Math.floor(sec / 3600) + 'h ago';
    return Math.floor(sec / 86400) + 'd ago';
  }

  function refreshHeaderClock() {
    var fetchAge = lastFetchOkAt ? Math.floor((Date.now() - lastFetchOkAt) / 1000) : null;
    var live = lastFetchOkAt && (Date.now() - lastFetchOkAt) < LIVE_MS;
    if (live) liveBadge.classList.add('on');
    else liveBadge.classList.remove('on');

    if (!lastFetchOkAt) {
      updatedEl.textContent = 'Connecting…';
      updatedEl.classList.add('stale');
      return;
    }
    if (!live) {
      updatedEl.textContent = 'Stale · last fetch ' + formatAgo(fetchAge);
      updatedEl.classList.add('stale');
      return;
    }
    var qAge = ageSeconds(queueUpdatedAt);
    updatedEl.textContent = qAge != null ? ('Updated ' + formatAgo(qAge)) : 'Live';
    updatedEl.classList.remove('stale');
  }

  function dismissNote(item) {
    return 'Dismiss review: ' + item.id + ' — ' + item.title +
      '\n(Leader: set status to done + dismissedAt in campus/review-queue.json)';
  }

  function renderCard(item, mode) {
    var pillClass = mode === 'waiting' ? 'waiting' : (mode === 'dismissed' ? 'done' : 'open');
    var pillText = mode === 'waiting' ? 'Waiting' : (mode === 'dismissed' ? 'Done' : 'Open');
    var cardClass = 'card' + (mode === 'waiting' ? ' waiting' : '') + (mode === 'dismissed' ? ' dismissed-hist' : '') + (item._auto ? ' auto' : '');
    var actions = '';
    actions += '<a class="btn open" href="' + escapeAttr(item.url) + '" target="_blank" rel="noopener">Open</a>';
    if (mode === 'open') {
      actions += '<button type="button" class="btn done" data-dismiss="' + escapeAttr(item.id) + '">Done / Dismiss</button>';
      actions += '<button type="button" class="btn copy" data-copy="' + escapeAttr(item.id) + '">Copy dismiss note</button>';
    } else if (mode === 'waiting') {
      actions += '<button type="button" class="btn done" disabled title="Not ready yet — peek only">Done (not ready)</button>';
    }

    return (
      '<article class="' + cardClass + '" data-id="' + escapeAttr(item.id) + '">' +
        '<div class="card-top">' +
          '<h2 class="card-title">' + escapeHtml(item.title) + '</h2>' +
          '<span class="pill ' + pillClass + '">' + pillText + '</span>' +
        '</div>' +
        '<p class="card-summary">' + escapeHtml(item.summary) + '</p>' +
        '<div class="card-meta">' +
          '<span class="pill kind">' + escapeHtml(kindLabel(item.kind)) + '</span>' +
          '<span class="owner">' + escapeHtml(item.owner || '') + '</span>' +
        '</div>' +
        '<div class="actions">' + actions + '</div>' +
      '</article>'
    );
  }

  function normKey(s) {
    return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
  }

  function mergeAutoItems(queueItems, state) {
    var items = (queueItems || []).slice();
    var seenTitle = {};
    var seenUrl = {};
    items.forEach(function (it) {
      if (it && it.title) seenTitle[normKey(it.title)] = true;
      if (it && it.url) seenUrl[normKey(it.url)] = true;
    });
    var bots = (state && state.bots) ? state.bots : [];
    bots.forEach(function (bot) {
      if (!bot || bot.status !== 'ready_for_review') return;
      var botId = bot.id || 'bot';
      var title = (bot.name || botId) + ' — ready for review';
      var summary = bot.task || 'Crew marked ready_for_review on Campus Live.';
      var url = CAMPUS_LIVE_URL;
      // De-dupe against queue by title or same campus-live url already covering same owner title
      if (seenTitle[normKey(title)]) return;
      // Also skip if an open/waiting item already mentions this bot's task heavily
      var taskKey = normKey(bot.task || '');
      var dup = items.some(function (it) {
        if (!it) return false;
        if (normKey(it.url) === normKey(url) && normKey(it.owner) === normKey(bot.name || '')) return true;
        if (taskKey && normKey(it.summary).indexOf(taskKey.slice(0, 24)) !== -1) return true;
        if (taskKey && normKey(it.title).indexOf(taskKey.slice(0, 18)) !== -1) return true;
        return false;
      });
      if (dup) return;
      var auto = {
        id: 'auto-' + botId,
        title: title,
        summary: summary,
        url: url,
        owner: bot.name || botId,
        kind: 'auto',
        priority: 5,
        status: 'open',
        createdAt: bot.updatedAt || (state && state.updatedAt) || null,
        dismissedAt: null,
        _auto: true
      };
      seenTitle[normKey(auto.title)] = true;
      items.push(auto);
    });
    return items;
  }

  function render(data) {
    var dismissed = loadDismissed();
    var items = mergeAutoItems((data && data.items) ? data.items : [], data && data._state);
    items.sort(function (a, b) {
      return (a.priority || 0) - (b.priority || 0) || String(a.createdAt || '').localeCompare(String(b.createdAt || ''));
    });

    var openHtml = [];
    var waitingHtml = [];
    var dismissedHtml = [];

    items.forEach(function (item) {
      if (!item || !item.id) return;
      var status = item.status || 'open';
      var localDone = isDismissedLocal(item.id, dismissed) || status === 'done';

      if (status === 'waiting' && !localDone) {
        waitingHtml.push(renderCard(item, 'waiting'));
        return;
      }
      if (localDone || status === 'done') {
        dismissedHtml.push(renderCard(item, 'dismissed'));
        return;
      }
      if (status === 'open' && !leaving[item.id]) {
        openHtml.push(renderCard(item, 'open'));
      }
    });

    openList.innerHTML = openHtml.join('');
    waitingList.innerHTML = waitingHtml.join('');
    dismissedList.innerHTML = dismissedHtml.join('');

    emptyEl.hidden = openHtml.length > 0;
    waitingSection.hidden = waitingHtml.length === 0;
    dismissedSection.hidden = dismissedHtml.length === 0;

    openList.querySelectorAll('[data-dismiss]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-dismiss');
        var card = btn.closest('.card');
        var ids = loadDismissed();
        if (ids.indexOf(id) === -1) {
          ids.push(id);
          saveDismissed(ids);
        }
        leaving[id] = true;
        if (card) {
          card.classList.add('leaving');
          setTimeout(function () {
            delete leaving[id];
            if (lastJson) render(lastJson);
          }, 300);
        } else if (lastJson) {
          render(lastJson);
        }
      });
    });

    openList.querySelectorAll('[data-copy]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-copy');
        var item = items.find(function (x) { return x.id === id; });
        if (!item) return;
        var text = dismissNote(item);
        function ok() {
          btn.textContent = 'Copied — tell Leader';
          btn.classList.add('ok');
          setTimeout(function () {
            btn.textContent = 'Copy dismiss note';
            btn.classList.remove('ok');
          }, 2000);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(ok).catch(function () {
            window.prompt('Copy this dismiss note:', text);
          });
        } else {
          window.prompt('Copy this dismiss note:', text);
          ok();
        }
      });
    });

    queueUpdatedAt = data && data.updatedAt ? data.updatedAt : queueUpdatedAt;
    refreshHeaderClock();
  }

  function fetchQueue() {
    var bust = '?t=' + Date.now();
    var queueP = fetch(DATA_URL + bust, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
    var stateP = fetch(STATE_URL + bust, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });

    return Promise.all([queueP, stateP])
      .then(function (pair) {
        var data = pair[0];
        var state = pair[1];
        errEl.classList.remove('show');
        errEl.textContent = '';
        lastFetchOkAt = Date.now();
        data._state = state;
        // Prefer fresher of queue vs state for "Updated Xs ago" feel when state moved
        if (state && state.updatedAt && data.updatedAt) {
          if (Date.parse(state.updatedAt) > Date.parse(data.updatedAt)) {
            // keep queue updatedAt as source of queue file; clock still uses queue
          }
        }
        lastJson = data;
        render(data);
      })
      .catch(function () {
        liveBadge.classList.remove('on');
        updatedEl.textContent = 'Offline';
        updatedEl.classList.add('stale');
        errEl.textContent = 'Queue offline — retrying';
        errEl.classList.add('show');
      });
  }

  fetchQueue();
  setInterval(fetchQueue, POLL_MS);
  tickTimer = setInterval(refreshHeaderClock, 250);
})();
</script>
</body>
</html>
