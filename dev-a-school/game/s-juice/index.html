<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Dev A · Game STANDARDS · Juice / feedback</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:#020617;color:#e2e8f0;font-family:system-ui,sans-serif;overflow:hidden}
    #hud{position:fixed;z-index:2;left:0;right:0;top:0;padding:.5rem .65rem;background:#0f172ae8;
      border-bottom:1px solid #334155;font-size:.75rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
    #stage{position:fixed;inset:0;touch-action:none;cursor:crosshair}
    canvas{display:block;width:100%;height:100%}
    #hint{position:fixed;z-index:2;bottom:.6rem;left:50%;transform:translateX(-50%);font-size:.7rem;color:#94a3b8;pointer-events:none;text-align:center}
  </style>
</head>
<body>
  <div id="hud"><strong>STANDARDS · Juice</strong><span>hits <b id="hits">0</b></span><span>misses <b id="miss">0</b></span><span id="evt">—</span><span>mute-safe flash/scale</span></div>
  <div id="stage"><canvas id="c"></canvas></div>
  <p id="hint">Tap targets — juice only on confirmed hit (sim event). Miss = soft X flash, no fake particles.</p>
  <script src="./juice.js?v=sj1"></script>
</body>
</html>
