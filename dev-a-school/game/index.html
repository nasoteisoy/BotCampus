<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#0b1220"/>
  <title>Dev A · Game Dev G0–G1 · Loop sandbox</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:#0b1220;color:#e2e8f0;font-family:system-ui,sans-serif}
    /* Game surface — not a marketing layout */
    #hud{
      position:fixed; left:0; right:0; top:0; z-index:2;
      display:flex; flex-wrap:wrap; gap:.5rem; align-items:center;
      padding:.5rem .65rem; background:#0f172ae6; border-bottom:1px solid #334155;
      font-size:.78rem;
    }
    #hud strong{color:#f8fafc}
    #hud .pill{
      display:inline-block; padding:.15rem .45rem; border-radius:999px;
      background:#1e293b; border:1px solid #475569; font-weight:700; font-size:.7rem;
    }
    #hud .pill.walk{border-color:#38bdf8;color:#7dd3fc}
    #hud .pill.idle{border-color:#64748b;color:#cbd5e1}
    #stage-wrap{
      position:fixed; inset:0; touch-action:none; overscroll-behavior:none;
      cursor:crosshair;
    }
    canvas{display:block; width:100%; height:100%; background:
      radial-gradient(ellipse at 50% 20%, #1e3a5f55, transparent 50%),
      linear-gradient(180deg,#0f172a,#020617)}
    #hint{
      position:fixed; bottom:.7rem; left:50%; transform:translateX(-50%);
      z-index:2; font-size:.72rem; color:#94a3b8; text-align:center;
      pointer-events:none; text-shadow:0 1px 2px #000;
    }
  </style>
</head>
<body>
  <div id="hud" aria-live="polite">
    <strong>G0–G1 Loop</strong>
    <span class="pill" id="fsm">idle</span>
    <span>verb: <strong id="verb">—</strong></span>
    <span>fps≈<strong id="fps">—</strong></span>
    <span>steps/f <strong id="steps">0</strong></span>
  </div>
  <div id="stage-wrap"><canvas id="c" width="720" height="1280"></canvas></div>
  <p id="hint">Tap / click: move intent → walk verb · hold space (Windows): pause sim</p>
  <script src="./game.js?v=g01"></script>
</body>
</html>
