<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Dev A · Game STANDARDS · Camera / UI feel</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:#020617;color:#e2e8f0;font-family:system-ui,sans-serif;overflow:hidden}
    #hud{
      position:fixed;z-index:3;left:0;right:0;top:0;
      display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;
      padding:.45rem .55rem;background:#0f172ae8;border-bottom:1px solid #334155;
      font-size:.72rem;
    }
    #hud strong{color:#f8fafc}
    #zoom-bar{
      position:fixed;z-index:3;right:.55rem;bottom:4.2rem;
      display:flex;flex-direction:column;gap:.35rem;
    }
    #zoom-bar button{
      width:48px;height:48px;border-radius:12px;border:1px solid #64748b;
      background:#1e293bf2;color:#f8fafc;font-size:1.25rem;font-weight:800;
      touch-action:manipulation;
    }
    #stage{position:fixed;inset:0;touch-action:none;overscroll-behavior:none;cursor:grab}
    #stage.dragging{cursor:grabbing}
    canvas{display:block;width:100%;height:100%}
    #hint{position:fixed;z-index:3;left:50%;bottom:.55rem;transform:translateX(-50%);
      font-size:.7rem;color:#94a3b8;text-align:center;pointer-events:none;max-width:92vw}
  </style>
</head>
<body>
  <div id="hud" aria-live="polite">
    <strong>STANDARDS · Camera</strong>
    <span>zoom <strong id="z">1.00</strong></span>
    <span>world≠screen</span>
    <span id="mode">idle</span>
  </div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="zoom-bar">
    <button type="button" id="zin" aria-label="Zoom in">+</button>
    <button type="button" id="zout" aria-label="Zoom out">−</button>
    <button type="button" id="zfit" aria-label="Fit world">Fit</button>
  </div>
  <p id="hint">Drag pan · pinch midpoint zoom · wheel · ± Fit · markers stay world-locked</p>
  <script src="./camera.js?v=sc1"></script>
</body>
</html>
